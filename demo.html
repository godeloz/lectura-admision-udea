  LE.compDe = (cat) => (LE.CATS_LOGICA.includes(cat) ? "logica" : "lectura");
  const CAT_BASE = {
    deductivo: { nombre: "Deducción", color: "violeta", descripcion: "Condicionales, negaciones, quién dice la verdad, cuadros de descarte y ordenamientos." },
    proporcional: { nombre: "Proporciones", color: "amarillo", descripcion: "Fracciones, porcentajes, razones, promedios, conteo y probabilidad." },
    abstracto: { nombre: "Patrones", color: "rosa", descripcion: "Series, operadores inventados, ciclos y claves." },
    geometrico: { nombre: "Geometría", color: "menta", descripcion: "Áreas, perímetros, volúmenes, escalas y vistas." }
  };
  LE.cat = (c) => (LE.estado.config.categorias || {})[c] || CAT_BASE[c] || { nombre: c, color: "cian", descripcion: "" };
  // Lógica aparece en la app solo cuando el tutor cargó su paquete base (logica-base).
  LE.logicaActiva = () => !!LE.estado.config.retos_logica;
  // Clave de configuración según el componente: «retos» o «retos_logica».
  LE.cfgDe = (clave, comp) => LE.estado.config[comp === "logica" ? clave + "_logica" : clave];
  // Componente en el que la estudiante estuvo por última vez (para volver ahí).
  LE.compActual = (nuevo) => {
    try {
      if (nuevo) localStorage.setItem("le-componente", nuevo);
      const c = nuevo || localStorage.getItem("le-componente");
      return c === "logica" && LE.logicaActiva() ? "logica" : "lectura";
    } catch (e) { return nuevo === "logica" && LE.logicaActiva() ? "logica" : "lectura"; }
  };

  // Tipos de error: cada opción incorrecta de una pregunta de lógica nace de uno.
  const ERR_BASE = {
    enunciado: { nombre: "Leíste otra pregunta", consejo: "Antes de calcular, di con tus palabras qué te piden y en qué unidades. Al terminar, vuelve a leer la pregunta." },
    planteamiento: { nombre: "Planteamiento", consejo: "Traduce el enunciado frase por frase antes de operar: qué es el todo, qué es la parte, qué se compara con qué." },
    regla: { nombre: "Regla equivocada", consejo: "Antes de aplicar una regla, comprueba que el problema cumple sus condiciones. Abre la ficha de la técnica y mira su trampa típica." },
    incompleto: { nombre: "A mitad de camino", consejo: "Tu cuenta iba bien, pero paraste un paso antes. Cuando tengas un número, pregúntate si eso es lo que pedían." },
    calculo: { nombre: "Cuenta", consejo: "El camino era el correcto y falló una operación. Estima el resultado antes de calcular y compara al final." },
    inferencia: { nombre: "Salto lógico", consejo: "Concluiste más de lo que las premisas permiten. Busca un caso que cumpla todo lo dicho y haga falsa tu opción." }
  };
  LE.tipoError = (t) => (LE.estado.config.tipos_error || {})[t] || ERR_BASE[t] || { nombre: t || "Error", consejo: "" };
  LE.TIPOS_ERROR = () => Object.keys({ ...ERR_BASE, ...(LE.estado.config.tipos_error || {}) });
  LE.tecnica = (codigo) => (LE.estado.tecnicas || []).find((t) => t.codigo === codigo) || null;
  // Una técnica se da por dominada con 3 aciertos o más y al menos 75 % de aciertos.
  LE.estadoTecnica = (x) => (!x || !x.intentos ? "nueva" : x.aciertos >= 3 && x.aciertos >= 0.75 * x.intentos ? "dominada" : "proceso");

  LE.TIPOS = { ensayo: "Ensayo", divulgacion: "Divulgación científica", literario: "Texto literario", discontinuo: "Texto discontinuo", intertextual: "Dos textos en diálogo", argumentativo: "Texto argumentativo", periodistico: "Texto periodístico", otro: "Lectura", situacion: "Situación" };
  LE.LETRAS = ["A", "B", "C", "D"];

  LE.minutos = (m) => {
    m = Math.round(m || 0);
    if (m < 60) return m + " min";
    const h = Math.floor(m / 60), r = m % 60;
    return h + " h" + (r ? " " + r + " min" : "");
  };
  LE.hace = (fecha) => {
    if (!fecha) return "sin actividad";
    const d = (Date.now() - new Date(fecha).getTime()) / 1000;
    if (d < 90) return "hace un momento";
    if (d < 3600) return "hace " + Math.round(d / 60) + " min";
    if (d < 86400) return "hace " + Math.round(d / 3600) + " h";
    const dias = Math.round(d / 86400);
    return dias === 1 ? "ayer" : "hace " + dias + " días";
  };
  LE.fecha = (f) => new Date(f).toLocaleDateString("es-CO", { day: "numeric", month: "short" });

  LE.rango = (xp) => {
    const rs = LE.estado.config.rangos || [{ nombre: "Demo", xp: 0 }];
    let i = 0;
    rs.forEach((r, k) => { if (xp >= r.xp) i = k; });
    const act = rs[i], sig = rs[i + 1];
    const prog = sig ? (xp - act.xp) / (sig.xp - act.xp) : 1;
    return { actual: act, siguiente: sig, progreso: Math.max(0, Math.min(1, prog)), indice: i };
  };

  // ---------- Montaje y rutas ----------
  // Si la pantalla cambió mientras se cargaban datos (por ejemplo, se cerró la sesión), no pinta nada.
  LE.montar = (html) => { const v = $("#vista"); if (!v) return document.createElement("div"); v.innerHTML = html; window.scrollTo(0, 0); return v; };
  LE.ondas = (n = 7) => Array.from({ length: n }, (_, i) => `<span class="cr-${["cian", "rosa", "amarillo", "menta"][i % 4]}" style="--i:${i};height:${40 + ((i * 37) % 60)}%"></span>`).join("");
  LE.cargando = (txt = "Cargando…") => LE.montar(`<div class="cargando"><div class="ondas">${LE.ondas()}</div><p>${LE.esc(txt)}</p></div>`);

  LE.ruta = (patron, fn, opciones = {}) => LE.rutas.push({ re: new RegExp("^" + patron.replace(/:(\w+)/g, "(?<$1>[^/]+)") + "$"), fn, ...opciones });
  LE.ir = (hash) => { if (location.hash === hash) LE.navegar(); else location.hash = hash; };
  LE.inicioPorRol = () => (LE.comoTutor() ? "#/tutor" : LE.COMP[LE.compActual()].ruta);
  LE.navegar = async () => {
    const h = location.hash.replace(/^#/, "") || LE.inicioPorRol().slice(1);
    for (const r of LE.rutas) {
      const m = h.match(r.re);
      if (!m) continue;
      if (r.tutor && !LE.esTutor()) return LE.ir("#/inicio");
      if (r.estudiante && LE.comoTutor()) return LE.ir("#/tutor");
      document.body.classList.toggle("en-sesion", !!r.sesion);
      LE.marcarNav(h);
      try { await r.fn(m.groups || {}); }
      catch (e) {
        console.error(e);
        LE.montar(`<div class="vacio"><h2>No se pudo cargar esta pantalla</h2><p>${LE.esc(e.message || e)}</p><button class="btn sec" data-accion="irInicio">Volver al inicio</button></div>`);
      }
      return;
    }
    LE.ir(LE.inicioPorRol());
  };
  LE.marcarNav = (h) => {
    const links = $$(".nav a");
    const mejor = links.map((a) => a.getAttribute("href").slice(1)).filter((r) => h.startsWith(r)).sort((a, b) => b.length - a.length)[0];
    links.forEach((a) => (a.getAttribute("href").slice(1) === mejor ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  };
  // esTutor: la cuenta tiene permisos de tutor. comoTutor: además está viendo
  // las pantallas de tutor (no está en modo práctica usando la app como estudiante).
  LE.esTutor = () => LE.estado.perfil?.rol === "tutor";
  LE.enPractica = () => {
    if (!LE.esTutor()) return false;
    try { return sessionStorage.getItem("le-practica") === "1"; } catch (e) { return !!LE.estado.practica; }
  };
  LE.fijarPractica = (si) => {
    LE.estado.practica = !!si;
    try { si ? sessionStorage.setItem("le-practica", "1") : sessionStorage.removeItem("le-practica"); } catch (e) { }
  };
  LE.comoTutor = () => LE.esTutor() && !LE.enPractica();

  // ---------- Instalar la app en el celular ----------
  // Android/Chrome ofrece su propio instalador; hay que guardar el evento apenas llega.
  LE.instalador = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); LE.instalador = e; document.dispatchEvent(new Event("le-instalador")); });
  addEventListener("appinstalled", () => { LE.instalador = null; LE.api?.marcarInstalada?.().catch(() => {}); });
  // ¿Está abierta desde el ícono instalado (y no desde el navegador)?
  LE.instalada = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
  LE.dispositivo = () => {
    const ua = navigator.userAgent || "";
    const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (ios) return { so: "ios", safari: !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua), celular: true };
    if (/Android/i.test(ua)) return { so: "android", samsung: /SamsungBrowser/i.test(ua), celular: true };
    return { so: "otro", celular: false };
  };

  // ---------- Acciones delegadas ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-accion]");
    if (!b) return;
    const fn = LE.acciones[b.dataset.accion];
    if (fn) { e.preventDefault(); fn(b, e); }
  });
  LE.acciones.irInicio = () => LE.ir(LE.inicioPorRol());

  // ---------- Avisos y diálogos ----------
  LE.aviso = (msg, tipo = "") => {
    let c = $(".avisos");
    if (!c) { c = document.createElement("div"); c.className = "avisos"; c.setAttribute("role", "status"); document.body.append(c); }
    const a = document.createElement("div");
    a.className = "aviso " + tipo; a.textContent = msg; c.append(a);
    setTimeout(() => a.remove(), tipo === "error" ? 6000 : 3500);
  };
  LE.error = (e) => { console.error(e); LE.aviso(e?.message || String(e), "error"); };

  // Abre un diálogo. Cualquier botón con data-valor lo cierra y devuelve ese valor.
  LE.dialogo = (html, { cerrable = true, alAbrir } = {}) => new Promise((resolver) => {
    const d = document.createElement("dialog");
    d.innerHTML = html;
    document.body.append(d);
    d.addEventListener("click", (e) => {
      const b = e.target.closest("[data-valor]");
      if (b && !(b.form && b.type === "submit")) d.close(b.dataset.valor);
      else if (cerrable && e.target === d) d.close("");
    });
    d.addEventListener("cancel", (e) => { if (!cerrable) e.preventDefault(); });
    d.addEventListener("close", () => { resolver(d.returnValue); d.remove(); });
    d.showModal();
    if (alAbrir) alAbrir(d);
  });
  LE.confirmar = (titulo, texto, si = "Continuar", no = "Cancelar") =>
    LE.dialogo(`<div class="pila"><h2>${LE.esc(titulo)}</h2><p class="sub">${texto}</p><div class="acciones"><button class="btn sec" data-valor="no">${LE.esc(no)}</button><button class="btn" data-valor="si">${LE.esc(si)}</button></div></div>`).then((v) => v === "si");

  LE.premios = async (lista = []) => {
    for (const i of lista) {
      await LE.dialogo(`<div class="premio cr-${LE.esc(i.color)}"><div class="ico">${LE.esc(i.icono)}</div><p class="sub">Insignia nueva</p><h2>${LE.esc(i.nombre)}</h2><p class="sub">${LE.esc(i.descripcion)}</p><button class="btn" data-valor="ok">Guardar en mi perfil</button></div>`);
    }
  };

  // ---------- Componentes compartidos ----------
  LE.ecualizador = (dominio, { vivo = false, detalle = true, cats = LE.CATS } = {}) => {
    const mapa = Object.fromEntries((dominio || []).map((d) => [d.categoria, d]));
    return `<div class="eq ${vivo ? "vivo" : ""}" role="list">` + cats.map((c) => {
      const d = mapa[c] || { dominio: 0, respondidas: 0 };
      const on = Math.round((d.dominio || 0) / 5);
      const segs = Array.from({ length: 20 }, (_, i) => `<i class="eq-seg ${i < on ? "on" : ""} ${i === on - 1 ? "pico" : ""}" style="--i:${i}"></i>`).join("");
      return `<div class="eq-col cr-${c}" role="listitem" aria-label="${LE.esc(LE.cat(c).nombre)}: ${d.dominio} de 100">
        <span class="eq-valor">${d.dominio ?? 0}</span>
        <div class="eq-barra">${segs}</div>
        <span class="eq-nombre">${LE.esc(LE.cat(c).nombre)}</span>
        ${detalle ? `<span class="eq-det">${d.respondidas ?? 0} resp.</span>` : ""}
      </div>`;
    }).join("") + `</div>`;
  };

  LE.pistaXP = (xp) => {
    const r = LE.rango(xp);
    const n = (x) => Number(x).toLocaleString("es-CO");
    return `<div class="pista">
      <div class="pista-etiquetas"><span><b>${LE.esc(r.actual.nombre)}</b></span><span>${r.siguiente ? `${n(xp)} / ${n(r.siguiente.xp)} XP para ${LE.esc(r.siguiente.nombre)}` : `${n(xp)} XP · rango máximo`}</span></div>
      <div class="pista-barra" role="progressbar" aria-label="Progreso al siguiente rango" aria-valuenow="${Math.round(r.progreso * 100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${r.progreso * 100}%"></span></div>
    </div>`;
  };

  LE.calor = (dias = []) => {
    const n = (m) => (m <= 0 ? 0 : m < 15 ? 1 : m < 40 ? 2 : 3);
    return `<div class="calor">` + dias.map((d, i) => `<i data-n="${n(d.minutos || (d.respuestas ? 5 : 0))}" class="${i === dias.length - 1 ? "hoy" : ""}" title="${LE.fecha(d.fecha + "T12:00")}: ${d.minutos} min, ${d.respuestas} respuestas"></i>`).join("") + `</div>`;
  };

  LE.lecturaHTML = (t, plegable = true) => t ? `
    <article class="lectura ${plegable ? "plegada" : ""} ${t.tipologia === "situacion" ? "situacion" : ""}" id="lectura">
      <span class="tipo">${LE.esc(LE.TIPOS[t.tipologia] || "Lectura")}</span>
      <h2>${LE.esc(t.titulo)}</h2>
      ${LE.md(t.contenido)}
      ${LE.figura(t.figura, "Figura de la situación")}
      ${t.fuente ? `<p class="fuente">${LE.esc(t.fuente)}</p>` : ""}
    </article>
    ${plegable ? `<button class="btn suave chico plegar-lectura" data-accion="plegar">Mostrar lectura completa</button>` : ""}` : "";

  // ---------- Lógica: solución, diagnóstico del error y fichas ----------
  // Lo que se muestra después de responder una pregunta de lógica (en un reto,
  // en la revisión de un simulacro o en el cuaderno de errores).
  LE.diagnosticoError = (error) => {
    if (!error || !error.tipo) return "";
    const t = LE.tipoError(error.tipo);
    return `<div class="diag-error">
      <span class="etq-error">Qué pasó · ${LE.esc(t.nombre)}</span>
      ${error.nota ? `<p>${LE.esc(error.nota)}</p>` : ""}
      ${t.consejo ? `<p class="consejo">${LE.esc(t.consejo)}</p>` : ""}
    </div>`;
  };
  LE.pasosHTML = (pasos, { abierto = true, titulo = "Solución paso a paso" } = {}) => {
    if (!Array.isArray(pasos) || !pasos.length) return "";
    return `<details class="solucion" ${abierto ? "open" : ""}><summary>${LE.esc(titulo)}</summary><ol class="pasos">${pasos.map((p) => `<li>${LE.md(p)}</li>`).join("")}</ol></details>`;
  };
  LE.enlaceTecnica = (codigo) => {
    const t = LE.tecnica(codigo);
    return t ? `<button class="enlace pequeno tecnica-enlace" data-accion="verTecnica" data-cod="${LE.esc(t.codigo)}">Técnica: ${LE.esc(t.nombre)} · ver ficha</button>` : "";
  };
  LE.fichaHTML = (t) => `
    <article class="ficha cr-${LE.esc(t.categoria)}">
      <span class="etq">${LE.esc(LE.cat(t.categoria).nombre)}</span>
      <h2>${LE.esc(t.nombre)}</h2>
      ${t.cuando ? `<p class="sub"><b>Cuándo se usa.</b> ${LE.esc(t.cuando)}</p>` : ""}
      ${Array.isArray(t.pasos) && t.pasos.length ? `<div><h3>El procedimiento</h3><ol class="pasos">${t.pasos.map((p) => `<li>${LE.md(p)}</li>`).join("")}</ol></div>` : ""}
      ${t.ejemplo ? `<div class="ejemplo"><h3>Ejemplo resuelto</h3>${LE.md(t.ejemplo)}</div>` : ""}
      ${t.trampa ? `<div class="trampa"><h3>La trampa típica</h3><p>${LE.esc(t.trampa)}</p></div>` : ""}
    </article>`;
  LE.acciones.verTecnica = (b) => {
    const t = LE.tecnica(b.dataset.cod);
    if (t) LE.dialogo(`${LE.fichaHTML(t)}<div class="acciones" style="margin-top:1rem"><button class="btn" data-valor="ok">Cerrar</button></div>`);
  };
  // Barras con el reparto de errores por tipo. perfil = {tipo: cantidad}
  LE.perfilErrores = (perfil = {}) => {
    const filas = Object.entries(perfil).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
    const total = filas.reduce((a, [, n]) => a + n, 0);
    if (!total) return "";
    return `<div class="perfil-errores">${filas.map(([t, n]) => `
      <div class="pe-fila"><span class="pe-nombre">${LE.esc(LE.tipoError(t).nombre)}</span>
        <span class="pe-barra"><span style="width:${Math.round((100 * n) / total)}%"></span></span>
        <span class="pe-n">${n}</span></div>`).join("")}</div>`;
  };

  LE.acciones.plegar = (b) => {
    const l = $("#lectura");
    const pl = l.classList.toggle("plegada");
    b.textContent = pl ? "Mostrar lectura completa" : "Ocultar lectura";
  };

  // ---------- Cronómetro de estudio ----------
  // Suma tiempo solo si la pestaña está visible y hubo interacción en los últimos 2 minutos.
  LE.cronometro = {
    ultimo: Date.now(), acumulado: 0, timer: null, listo: false,
    iniciar() {
      if (this.timer) return;
      if (!this.listo) {
        ["pointerdown", "keydown", "scroll", "touchstart"].forEach((ev) => addEventListener(ev, () => (this.ultimo = Date.now()), { passive: true }));
        addEventListener("pagehide", () => this.vaciar());
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") this.vaciar(); });
        this.listo = true;
      }
      this.ultimo = Date.now();
      this.timer = setInterval(() => {
        if (document.visibilityState === "visible" && Date.now() - this.ultimo < 120000) this.acumulado += 15;
        if (this.acumulado >= 60) this.vaciar();
      }, 15000);
    },
    vaciar() { if (this.acumulado > 0 && LE.api) { const s = this.acumulado; this.acumulado = 0; LE.api.registrarTiempo(s).catch(() => {}); } },
    detener() { this.vaciar(); clearInterval(this.timer); this.timer = null; }
  };
})(window.LE);

/* =====================================================================
   ENTRELÍNEAS · API DEMO
   Replica en el navegador la lógica de las funciones SQL para poder
   probar la app sin Supabase. Usuarios: sofia / demo  ·  tutor / demo
   (y mateo / demo, valentina / demo: compañeros de Sofía en un grupo)
   ===================================================================== */
window.LE_ApiDemo = function () {
  const CLAVE = "entrelineas-demo-v3";
  const LECTURA = ["literal", "inferencial", "critico", "cohesion"];
  const LOGICA = ["deductivo", "proporcional", "abstracto", "geometrico"];
  const compDe = (cat) => (LOGICA.includes(cat) ? "logica" : "lectura");
  let db = null;
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36));
  const ahora = () => new Date().toISOString();
  const dia = (ts) => new Date(ts).toLocaleDateString("en-CA", { timeZone: "America/Bogota" });
  const hoy = () => dia(Date.now());
  const restarDias = (f, n) => { const d = new Date(f + "T12:00:00"); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(db)); } catch (e) { /* sin almacenamiento: el demo vive en memoria */ } };
  const espera = (x) => new Promise((r) => setTimeout(() => r(x === undefined ? x : JSON.parse(JSON.stringify(x))), 120));
  const yo = () => db.usuarios.find((u) => u.id === db.actual);
  const cfg = (k) => db.config[k];
  const barajar = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
  const pregunta = (id) => db.preguntas.find((p) => p.id === id);
  const texto = (id) => db.textos.find((t) => t.id === id);
  const sinClave = (u) => { const { clave, ...resto } = u; return resto; };
  const xpc = (k, d) => cfg("xp")?.[k] ?? d;
  const errorDe = (p, opcion) => (opcion == null ? null : (p.errores || [])[opcion] || null);

  async function cargarDatos() {
    if (window.LE_DATOS_DEMO) return window.LE_DATOS_DEMO;
    const leer = (f) => fetch(f).then((r) => { if (!r.ok) throw new Error("No se encontró " + f); return r.json(); });
    const opcional = (f) => leer(f).catch(() => null);
    const paquetes = [await leer("content/paquete-001.json")];
    for (const f of ["content/logica-base.json", "content/logica-001.json", "content/logica-002.json"]) { const p = await opcional(f); if (p) paquetes.push(p); }
    return { base: await leer("content/base.json"), paquetes };
  }

  function aplicarPregunta(q, textoId, paquete) {
    let pr = db.preguntas.find((x) => x.codigo === q.codigo);
    if (!pr) { pr = { id: uuid(), codigo: q.codigo }; db.preguntas.push(pr); }
    Object.assign(pr, {
      texto_id: textoId, categoria: q.categoria, componente: compDe(q.categoria), dificultad: q.dificultad || 2,
      enunciado: q.enunciado, opciones: q.opciones, correcta: q.correcta, explicacion: q.explicacion || "",
      paquete, activo: q.activo !== false,
      tema: q.tema || null, pista: q.pista || null, pasos: q.pasos || null, errores: q.errores || null, figura: q.figura || null
    });
  }

  function aplicar(p) {
    let nt = 0, nq = 0, ni = 0, nc = 0, nk = 0;
    for (const t of p.textos || []) {
      let tx = db.textos.find((x) => x.codigo === t.codigo);
      if (!tx) { tx = { id: uuid(), codigo: t.codigo }; db.textos.push(tx); }
      Object.assign(tx, { titulo: t.titulo, tipologia: t.tipologia || "otro", contenido: t.contenido, fuente: t.fuente, paquete: p.paquete, activo: t.activo !== false, figura: t.figura || null, componente: t.tipologia === "situacion" ? "logica" : "lectura" });
      nt++;
      for (const q of t.preguntas || []) { aplicarPregunta(q, tx.id, p.paquete); nq++; }
    }
    for (const q of p.preguntas || []) { aplicarPregunta(q, null, p.paquete); nq++; }
    for (const k of p.tecnicas || []) {
      const j = db.tecnicas.findIndex((x) => x.codigo === k.codigo);
      const fila = { componente: "logica", cuando: "", pasos: [], ejemplo: "", trampa: "", orden: 100, activo: true, ...k };
      if (j >= 0) db.tecnicas[j] = fila; else db.tecnicas.push(fila);
      nk++;
    }
    for (const i of p.insignias || []) {
      const k = db.insignias.findIndex((x) => x.codigo === i.codigo);
      const fila = { icono: "⭐", color: "rosa", orden: 100, activo: true, ...i };
      if (k >= 0) db.insignias[k] = fila; else db.insignias.push(fila);
      ni++;
    }
    for (const [k, v] of Object.entries(p.config || {})) { db.config[k] = v; nc++; }
    if (p.novedad) db.novedades.push({ id: db.novedades.length + 1, creado: ahora(), ...p.novedad });
    db.insignias.sort((a, b) => a.orden - b.orden);
    db.tecnicas.sort((a, b) => a.orden - b.orden);
    return { paquete: p.paquete, textos: nt, preguntas: nq, tecnicas: nk, insignias: ni, config: nc, novedad: !!p.novedad };
  }

  // ---------- lógica espejo de 02_funciones.sql ----------
  // Devuelve las ocho categorías (cuatro de lectura y cuatro de lógica).
  function dominio(uid) {
    return [...LECTURA, ...LOGICA].map((c) => {
      const rs = db.respuestas.filter((r) => r.user_id === uid && pregunta(r.pregunta_id)?.categoria === c)
        .sort((a, b) => b.creado.localeCompare(a.creado)).slice(0, 30);
      let ok = 0, tot = 0;
      rs.forEach((r) => { const d = pregunta(r.pregunta_id).dificultad; tot += d; if (r.correcta) ok += d; });
      return { categoria: c, dominio: Math.round((100 * (ok + 0.7)) / (tot + 2)), respondidas: rs.length };
    });
  }

  function rachas(uid) {
    const dias = [...new Set(db.respuestas.filter((r) => r.user_id === uid).map((r) => dia(r.creado)))].sort();
    let mejor = 0, run = 0, prev = null;
    const islas = [];
    for (const d of dias) {
      run = prev && restarDias(d, 1) === prev ? run + 1 : 1;
      if (run === 1) islas.push({ fin: d, largo: 1 }); else { islas[islas.length - 1].fin = d; islas[islas.length - 1].largo = run; }
      mejor = Math.max(mejor, run); prev = d;
    }
    const ult = islas[islas.length - 1];
    const actual = ult && ult.fin >= restarDias(hoy(), 1) ? ult.largo : 0;
    return { actual, mejor };
  }

  function ultimas(uid) {
    const m = {};
    db.respuestas.filter((r) => r.user_id === uid).forEach((r) => { if (!m[r.pregunta_id] || m[r.pregunta_id].creado < r.creado) m[r.pregunta_id] = r; });
    return m;
  }

  const agrupar = (ids) => ids.map(pregunta).sort((a, b) => ((a.texto_id || a.id) + a.codigo).localeCompare((b.texto_id || b.id) + b.codigo)).map((p) => p.id);

  function seleccionar(uid, n, cat, comp = "lectura", tema = null) {
    const dist = comp === "logica"
      ? cfg("distribucion_logica") || { deductivo: 0.25, proporcional: 0.3, abstracto: 0.2, geometrico: 0.25 }
      : cfg("distribucion") || { literal: 0.2, inferencial: 0.35, critico: 0.3, cohesion: 0.15 };
    const u = ultimas(uid);
    // Reto de repaso: solo lo pendiente en el cuaderno de errores, de lo más antiguo a lo más reciente.
    if (tema === "@errores") {
      return agrupar(db.preguntas.filter((p) => p.activo && p.componente === comp && u[p.id] && !u[p.id].correcta)
        .sort((a, b) => u[a.id].creado.localeCompare(u[b.id].creado)).slice(0, n).map((p) => p.id));
    }
    const activas = db.preguntas.filter((p) => p.activo && p.componente === comp && (!cat || p.categoria === cat) && (!tema || p.tema === tema));
    const hace = (h) => new Date(Date.now() - h * 3600e3).toISOString();
    const repN = Math.round(n * (cfg("retos")?.repaso ?? 0.2));
    const rep = activas.filter((p) => u[p.id] && !u[p.id].correcta && u[p.id].creado < hace(20))
      .sort((a, b) => u[a.id].creado.localeCompare(u[b.id].creado)).slice(0, repN).map((p) => p.id);
    const dom = Object.fromEntries(dominio(uid).map((d) => [d.categoria, d.dominio]));
    const objetivo = (c) => ((dom[c] ?? 35) < 45 ? 1 : dom[c] < 75 ? 2 : 3);
    const cand = activas.filter((p) => !rep.includes(p.id) && (!u[p.id] || u[p.id].creado < hace(24 * 30)))
      .map((p) => ({ p, s: Math.abs(p.dificultad - objetivo(p.categoria)) + (u[p.id] ? 1.5 : 0) + Math.random() }));
    const sel = [];
    const filtrado = !!(cat || tema);
    for (const c of filtrado ? [...new Set(activas.map((p) => p.categoria))] : Object.keys(dist)) {
      const cupo = filtrado ? n : Math.max(1, Math.round((n - rep.length) * (dist[c] || 0.25)));
      cand.filter((x) => x.p.categoria === c).sort((a, b) => a.s - b.s).slice(0, cupo).forEach((x) => sel.push(x.p.id));
    }
    let ids = [...rep, ...sel];
    if (ids.length < n) ids = ids.concat(barajar(activas.filter((p) => !ids.includes(p.id))).slice(0, n - ids.length).map((p) => p.id));
    return agrupar(ids.slice(0, n));
  }

  const textoPublico = (t) => ({ titulo: t.titulo, tipologia: t.tipologia, contenido: t.contenido, fuente: t.fuente, figura: t.figura || null, componente: t.componente || "lectura" });

  // Preguntas sin la clave de respuesta ni los pasos de la solución.
  function empaquetar(ids) {
    const ps = ids.map(pregunta);
    return {
      preguntas: ps.map((p) => ({ id: p.id, texto_id: p.texto_id, categoria: p.categoria, componente: p.componente || "lectura", dificultad: p.dificultad, enunciado: p.enunciado, opciones: p.opciones, figura: p.figura || null, pista: p.pista || null })),
      textos: Object.fromEntries([...new Set(ps.map((p) => p.texto_id).filter(Boolean))].map((id) => [id, textoPublico(texto(id))]))
    };
  }

  const recuperadas = (uid, comp) => {
    const porP = {};
    db.respuestas.filter((r) => r.user_id === uid && (!comp || pregunta(r.pregunta_id)?.componente === comp))
      .sort((a, b) => a.creado.localeCompare(b.creado))
      .forEach((r) => { const x = (porP[r.pregunta_id] ||= { fallo: false, rec: false }); if (!r.correcta) x.fallo = true; else if (x.fallo) x.rec = true; });
    return Object.values(porP).filter((x) => x.rec).length;
  };
  const temasDe = (uid, comp) => {
    const m = {};
    db.respuestas.filter((r) => r.user_id === uid).forEach((r) => {
      const p = pregunta(r.pregunta_id);
      if (!p || !p.tema || (comp && p.componente !== comp)) return;
      const x = (m[p.tema] ||= { tema: p.tema, intentos: 0, aciertos: 0, ultima: r.creado });
      x.intentos++; if (r.correcta) x.aciertos++; if (r.creado > x.ultima) x.ultima = r.creado;
    });
    return Object.values(m);
  };

  function evaluarInsignias(uid) {
    const tengo = new Set(db.iu.filter((x) => x.user_id === uid).map((x) => x.codigo));
    const todas = db.respuestas.filter((r) => r.user_id === uid);
    const sesTodas = db.sesiones.filter((s) => s.user_id === uid && s.fin);
    const dom = dominio(uid);
    const r = rachas(uid).actual;
    const minutos = Object.values(db.actividad[uid] || {}).reduce((a, b) => a + b, 0) / 60;
    const nuevas = [];
    for (const i of db.insignias.filter((x) => x.activo && !tengo.has(x.codigo))) {
      const g = i.regla, v = g.valor || 0, c = g.componente || null;
      const mias = c ? todas.filter((x) => pregunta(x.pregunta_id)?.componente === c) : todas;
      const retos = sesTodas.filter((s) => s.tipo !== "simulacro" && (!c || (s.componente || "lectura") === c)).sort((a, b) => a.fin.localeCompare(b.fin));
      let ok = false;
      switch (g.tipo) {
        case "racha": ok = r >= v; break;
        case "respuestas": ok = mias.length >= v; break;
        case "aciertos": ok = mias.filter((x) => x.correcta).length >= v; break;
        case "retos": ok = retos.length >= v; break;
        case "reto_perfecto": ok = retos.some((s) => s.total >= v && s.correctas === s.total); break;
        case "dominio": ok = dom.some((d) => d.categoria === g.categoria && d.dominio >= v && d.respondidas >= 15); break;
        case "simulacro": ok = sesTodas.some((s) => s.tipo === "simulacro" && s.nivel === g.nivel && (s.componente || "lectura") === (c || "lectura") && (s.resultado?.puntaje ?? -1) >= v); break;
        case "minutos": ok = minutos >= v; break;
        case "misiones": ok = db.mensajes.filter((m) => m.estudiante_id === uid && m.tipo === "mision" && m.completado).length >= v; break;
        case "remontada": ok = retos.filter((s) => s.total >= 5).some((s, k, a) => k > 0 && a[k - 1].correctas / a[k - 1].total < 0.5 && s.correctas / s.total >= 0.8); break;
        case "recuperadas": ok = recuperadas(uid, c) >= v; break;
        case "tecnicas": ok = temasDe(uid, null).filter((t) => t.aciertos >= (g.minimo || 3) && t.aciertos >= 0.75 * t.intentos).length >= v; break;
      }
      if (ok) { db.iu.push({ user_id: uid, codigo: i.codigo, obtenida: ahora() }); nuevas.push({ codigo: i.codigo, nombre: i.nombre, descripcion: i.descripcion, icono: i.icono, color: i.color }); }
    }
    return nuevas;
  }

  function resumen(uid) {
    const u = db.usuarios.find((x) => x.id === uid);
    const mias = db.respuestas.filter((r) => r.user_id === uid);
    const act = db.actividad[uid] || {};
    const r = rachas(uid);
    const dias = Array.from({ length: 28 }, (_, i) => { const f = restarDias(hoy(), 27 - i); return { fecha: f, minutos: Math.floor((act[f] || 0) / 60), respuestas: mias.filter((x) => dia(x.creado) === f).length }; });
    const tiempos = mias.filter((x) => x.tiempo_ms != null);
    const hace8 = new Date(Date.now() - 56 * 86400e3).toISOString();
    const tend = {};
    mias.filter((x) => x.creado > hace8).forEach((x) => {
      const d = new Date(dia(x.creado) + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const k = d.toISOString().slice(0, 10) + "|" + pregunta(x.pregunta_id).categoria;
      const t = (tend[k] ||= { ok: 0, n: 0 }); t.n++; if (x.correcta) t.ok++;
    });
    const dom = dominio(uid);
    const porComp = {};
    mias.forEach((x) => {
      const c = pregunta(x.pregunta_id)?.componente || "lectura";
      const k = (porComp[c] ||= { respuestas: 0, aciertos: 0, ms: 0, nms: 0, ultima: x.creado });
      k.respuestas++; if (x.correcta) k.aciertos++; if (x.tiempo_ms != null) { k.ms += x.tiempo_ms; k.nms++; } if (x.creado > k.ultima) k.ultima = x.creado;
    });
    Object.values(porComp).forEach((k) => { k.segundos_promedio = k.nms ? Math.round(k.ms / k.nms / 1000) : null; delete k.ms; delete k.nms; });
    return {
      perfil: sinClave(u), racha: r.actual, mejor_racha: r.mejor,
      minutos_hoy: Math.floor((act[hoy()] || 0) / 60),
      minutos_total: Math.floor(Object.values(act).reduce((a, b) => a + b, 0) / 60),
      dias,
      dominio: dom.filter((d) => LECTURA.includes(d.categoria)),
      dominio_logica: dom.filter((d) => LOGICA.includes(d.categoria)),
      tendencia: Object.entries(tend).sort().map(([k, v]) => { const [semana, categoria] = k.split("|"); return { semana, categoria, precision: Math.round((100 * v.ok) / v.n), n: v.n }; }),
      totales: { respuestas: mias.length, aciertos: mias.filter((x) => x.correcta).length, segundos_promedio: tiempos.length ? Math.round(tiempos.reduce((a, b) => a + b.tiempo_ms, 0) / tiempos.length / 1000) : null },
      por_componente: porComp,
      retos: db.sesiones.filter((s) => s.user_id === uid && s.tipo !== "simulacro" && s.fin).length,
      insignias: db.iu.filter((x) => x.user_id === uid).map(({ codigo, obtenida }) => ({ codigo, obtenida })),
      simulacros: db.sesiones.filter((s) => s.user_id === uid && s.tipo === "simulacro" && s.fin && !s.resultado?.abandonado)
        .sort((a, b) => b.fin.localeCompare(a.fin))
        .map((s) => ({ id: s.id, nivel: s.nivel, componente: s.componente || "lectura", fecha: s.fin, correctas: s.correctas, total: s.total, puntaje: s.resultado.puntaje, por_categoria: s.resultado.por_categoria })),
      ultima_actividad: mias.map((x) => x.creado).sort().pop() || null
    };
  }

  // Cuaderno de errores de un componente (espejo de cuaderno_errores en SQL).
  function cuaderno(uid, comp) {
    const mias = db.respuestas.filter((r) => r.user_id === uid && pregunta(r.pregunta_id)?.componente === comp);
    const perfil = {};
    mias.filter((r) => !r.correcta && r.opcion != null).sort((a, b) => b.creado.localeCompare(a.creado)).slice(0, 60)
      .forEach((r) => { const t = errorDe(pregunta(r.pregunta_id), r.opcion)?.tipo; if (t) perfil[t] = (perfil[t] || 0) + 1; });
    const u = ultimas(uid);
    const pendientes = Object.values(u).filter((r) => !r.correcta).map((r) => ({ r, p: pregunta(r.pregunta_id) }))
      .filter(({ p }) => p && p.activo && p.componente === comp)
      .sort((a, b) => b.r.creado.localeCompare(a.r.creado)).slice(0, 40)
      .map(({ r, p }) => {
        const mis = mias.filter((x) => x.pregunta_id === p.id);
        const t = p.texto_id ? texto(p.texto_id) : null;
        return { id: p.id, codigo: p.codigo, categoria: p.categoria, dificultad: p.dificultad, tema: p.tema, enunciado: p.enunciado, opciones: p.opciones, figura: p.figura || null,
          correcta: p.correcta, pasos: p.pasos || null, explicacion: p.explicacion, elegida: r.opcion, fecha: r.creado, error: errorDe(p, r.opcion),
          fallos: mis.filter((x) => !x.correcta).length, intentos: mis.length, texto: t ? textoPublico(t) : null };
      });
    return { perfil, errores_total: mias.filter((r) => !r.correcta).length, respuestas_total: mias.length, temas: temasDe(uid, comp), pendientes, recuperadas: recuperadas(uid, comp) };
  }

  function sumarXP(uid, n) { db.usuarios.find((u) => u.id === uid).xp += n; }

  // ---------- cuentas y grupos (espejo de la sección «Personas» de 02_funciones.sql) ----------
  const PALABRAS = ["agua", "alba", "arco", "barco", "bosque", "brisa", "cielo", "cometa", "coral", "faro", "isla", "lago", "libro", "luna", "mango", "mar", "miel", "nube", "ola", "pino", "puente", "rio", "roble", "sol", "trigo", "valle", "vela", "verso", "viento", "volcan"];
  const azar = (n) => Math.floor(Math.random() * n);
  const claveTemporal = () => `${PALABRAS[azar(PALABRAS.length)]}-${PALABRAS[azar(PALABRAS.length)]}-${100 + azar(900)}`;
  const lunes = () => { const d = new Date(hoy() + "T12:00:00"); return restarDias(hoy(), (d.getDay() + 6) % 7); };
  const usuarioLibre = (correo) => {
    const base = correo.split("@")[0].toLowerCase().replace(/[^a-z0-9._-]/g, "") || "usuario";
    let u = base, n = 1;
    while (db.usuarios.some((x) => x.usuario === u)) u = base + ++n;
    return u;
  };
  function grupoSemana(gid) {
    const g = db.grupos.find((x) => x.id === gid);
    const l = lunes(), ver = g.ver_simulacros;
    const hace7 = new Date(Date.now() - 7 * 86400e3).toISOString();
    const ids = db.miembros.filter((m) => m.grupo_id === gid).map((m) => m.user_id);
    const gente = db.usuarios.filter((u) => ids.includes(u.id) && u.activo && u.rol === "estudiante");
    const sims = (uid) => db.sesiones.filter((s) => s.user_id === uid && s.tipo === "simulacro" && s.fin && !s.resultado?.abandonado && dia(s.fin) >= l);
    const miembros = gente.map((u) => {
      const rs = db.respuestas.filter((r) => r.user_id === u.id && dia(r.creado) >= l);
      return {
        id: u.id, nombre: u.nombre, avatar: u.avatar, yo: u.id === db.actual,
        xp_semana: db.sesiones.filter((s) => s.user_id === u.id && dia(s.fin || s.inicio) >= l).reduce((a, s) => a + (s.xp || 0), 0),
        dias_semana: new Set(rs.map((r) => dia(r.creado))).size, respuestas_semana: rs.length,
        minutos_semana: Math.floor(Object.entries(db.actividad[u.id] || {}).filter(([f]) => f >= l).reduce((a, [, x]) => a + x, 0) / 60),
        racha: rachas(u.id).actual,
        retos_semana: db.sesiones.filter((s) => s.user_id === u.id && s.tipo !== "simulacro" && s.fin && dia(s.fin) >= l).length,
        simulacros_semana: sims(u.id).length,
        simulacros: ver ? sims(u.id).sort((a, b) => b.fin.localeCompare(a.fin)).map((s) => ({ componente: s.componente || "lectura", nivel: s.nivel, puntaje: s.resultado.puntaje, fecha: s.fin })) : null
      };
    }).sort((a, b) => b.xp_semana - a.xp_semana || b.dias_semana - a.dias_semana || a.nombre.localeCompare(b.nombre));
    const quien = (uid) => gente.find((u) => u.id === uid);
    const actividad = [
      ...db.sesiones.filter((s) => quien(s.user_id) && s.fin && s.fin > hace7 && (s.tipo === "simulacro" ? !s.resultado?.abandonado : db.respuestas.some((r) => r.sesion_id === s.id)))
        .map((s) => ({ tipo: s.tipo === "simulacro" ? "simulacro" : "reto", fecha: s.fin, user_id: s.user_id, nombre: quien(s.user_id).nombre, avatar: quien(s.user_id).avatar, componente: s.componente || "lectura", total: s.total, nivel: s.tipo === "simulacro" ? s.nivel : null, puntaje: s.tipo === "simulacro" && ver ? s.resultado.puntaje : null, insignia: null, icono: null })),
      ...db.iu.filter((x) => quien(x.user_id) && x.obtenida > hace7).map((x) => { const i = db.insignias.find((k) => k.codigo === x.codigo) || {}; return { tipo: "insignia", fecha: x.obtenida, user_id: x.user_id, nombre: quien(x.user_id).nombre, avatar: quien(x.user_id).avatar, componente: null, total: null, nivel: null, puntaje: null, insignia: i.nombre, icono: i.icono }; })
    ].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 30);
    return { grupo: { id: g.id, nombre: g.nombre, descripcion: g.descripcion, emoji: g.emoji, ver_simulacros: g.ver_simulacros }, semana: l, miembros, actividad };
  }

  // ---------- historial de muestra para que el demo no arranque vacío ----------
  function sembrar() {
    const est = db.usuarios.find((u) => u.usuario === "sofia");
    const tut = db.usuarios.find((u) => u.usuario === "tutor");
    const dias = [18, 17, 16, 14, 13, 12, 11, 9, 8, 6, 5, 4];
    const prob = { literal: 0.8, inferencial: 0.72, critico: 0.5, cohesion: 0.62 };
    const lectura = db.preguntas.filter((p) => p.componente === "lectura");
    for (const d of dias) {
      const n = d % 3 === 0 ? 15 : 10;
      const f = restarDias(hoy(), d);
      const s = { id: uuid(), user_id: est.id, tipo: "reto", componente: "lectura", nivel: String(n), total: n, preguntas: [], inicio: f + "T21:00:00.000Z", fin: f + "T21:20:00.000Z", xp: 0, correctas: 0 };
      barajar(lectura).slice(0, n).forEach((p, k) => {
        // en la última semana, el nivel inferencial cae (para que el tutor vea una alerta)
        const base = p.categoria === "inferencial" && d <= 6 ? 0.25 : prob[p.categoria] + (18 - d) * 0.008;
        const ok = Math.random() < base;
        const xp = ok ? 10 * p.dificultad + 5 : 2;
        db.respuestas.push({ id: db.respuestas.length + 1, user_id: est.id, pregunta_id: p.id, sesion_id: s.id, opcion: ok ? p.correcta : (p.correcta + 1) % 4, correcta: ok, tiempo_ms: 40000 + Math.random() * 60000, contexto: "reto", pista: false, creado: `${f}T21:${String(k * 2).padStart(2, "0")}:00.000Z` });
        s.xp += xp; s.correctas += ok ? 1 : 0; s.preguntas.push(p.id);
      });
      s.xp += 20; s.resultado = { correctas: s.correctas, total: n, respondidas: n, xp: s.xp };
      db.sesiones.push(s); est.xp += s.xp;
      (db.actividad[est.id] ||= {})[f] = (12 + Math.round(Math.random() * 25)) * 60;

    const sim = { id: uuid(), user_id: est.id, tipo: "simulacro", componente: "lectura", nivel: "inicial", total: 30, correctas: 17, xp: 264, preguntas: lectura.slice(0, 30).map((p) => p.id), inicio: restarDias(hoy(), 9) + "T14:00:00.000Z", fin: restarDias(hoy(), 9) + "T15:02:00.000Z" };
    sim.resultado = { correctas: 17, total: 30, puntaje: 56.7, minutos: 62, respondidas: 29, xp: 264, componente: "lectura", por_categoria: { literal: { correctas: 6, total: 7 }, inferencial: { correctas: 6, total: 10 }, critico: { correctas: 2, total: 8 }, cohesion: { correctas: 3, total: 5 } }, detalle: [] };
    db.sesiones.push(sim); est.xp += 264;

    // Lógica: cuatro días de retos, flojos en proporciones, para que el cuaderno
    // de errores, el perfil de errores y la caja de herramientas tengan qué mostrar.
    const logica = db.preguntas.filter((p) => p.componente === "logica");

          // al fallar, marca una opción incorrecta cualquiera (cada una lleva su diagnóstico)

        });

        db.sesiones.push(s); est.xp += s.xp;
        (db.actividad[est.id] ||= {})[f] = ((db.actividad[est.id][f] || 0) / 60 + 22) * 60;
      });
    }

    // Dos compañeros de grupo con práctica esta semana (para ver la pestaña Grupo).

          s.xp += ok ? 10 * p.dificultad + 5 : 2; s.correctas += ok ? 1 : 0; s.preguntas.push(p.id);

      }

    const g = { id: uuid(), nombre: "Artes UdeA", descripcion: "Nos preparamos juntos para Artes plásticas.", emoji: "🎨", ver_simulacros: false, activo: true, creado: ahora() };
    db.grupos.push(g);

    db.mensajes.push({ id: uuid(), estudiante_id: est.id, autor_id: tut.id, tipo: "mensaje", titulo: "¡Buena semana!", cuerpo: "Doce días de práctica en tres semanas. Así se construye. Sigue con los EP diarios.", leido: true, completado: false, creado: new Date(Date.now() - 4 * 86400e3).toISOString() });

    async responder(sesionId, preguntaId, opcion, ms, pista = false) {
      const s = db.sesiones.find((x) => x.id === sesionId && x.user_id === db.actual);
      if (!s || s.tipo === "simulacro" || s.fin) throw new Error("Sesión no válida");
      if (db.respuestas.some((r) => r.sesion_id === sesionId && r.pregunta_id === preguntaId)) throw new Error("Esta pregunta ya fue respondida");
      const p = pregunta(preguntaId);
      const ok = opcion === p.correcta;
      const seg = p.componente === "logica" ? xpc("segundos_bono_logica", 180) : xpc("segundos_bono", 120);
      const xp = ok ? xpc("por_acierto", 10) * p.dificultad + (!pista && ms >= 5000 && ms <= seg * 1000 ? xpc("bono_ritmo", 5) : 0) : xpc("por_intento", 2);
      db.respuestas.push({ id: db.respuestas.length + 1, user_id: db.actual, pregunta_id: preguntaId, sesion_id: sesionId, opcion, correcta: ok, tiempo_ms: Math.round(ms), contexto: s.tipo, pista: !!pista, creado: ahora() });
      s.xp += xp; sumarXP(db.actual, xp); guardar();
      return espera({ correcta: ok, opcion_correcta: p.correcta, explicacion: p.explicacion, xp, pasos: p.pasos || null, tema: p.tema || null, error: ok ? null : errorDe(p, opcion) });
    },
    async finalizarReto(sesionId) {
      const s = db.sesiones.find((x) => x.id === sesionId && x.user_id === db.actual);
      if (s.fin) return espera(s.resultado);
      const rs = db.respuestas.filter((r) => r.sesion_id === sesionId);
      const ok = rs.filter((r) => r.correcta).length;
      let bono = 0;
      if (rs.length === s.total) {
        bono = xpc("reto_completo", 20) + (ok === s.total ? xpc("reto_perfecto", 30) : 0) + (s.tipo === "mision" ? xpc("mision", 40) : 0);
        if (s.mensaje_id) { const m = db.mensajes.find((x) => x.id === s.mensaje_id); if (m) { m.completado = true; m.sesion_id = s.id; } }
      }
      sumarXP(db.actual, bono);
      s.fin = ahora(); s.correctas = ok; s.xp += bono;
      s.resultado = { correctas: ok, respondidas: rs.length, total: s.total, xp: s.xp, bono, componente: s.componente || "lectura" };
      const nuevas = evaluarInsignias(db.actual);
      guardar();
      return espera({ ...s.resultado, nuevas_insignias: nuevas, xp_total: yo().xp });
    },
    async iniciarSimulacro(nivel, componente = "lectura") {
      const comp = componente || "lectura";
      const abierto = db.sesiones.find((s) => s.user_id === db.actual && s.tipo === "simulacro" && !s.fin && s.limite > ahora());
      if (abierto) return espera({ sesion_id: abierto.id, nivel: abierto.nivel, componente: abierto.componente || "lectura", limite: abierto.limite, ahora: ahora(), retomado: true, ...empaquetar(abierto.preguntas) });
      const c = (cfg(comp === "logica" ? "simulacros_logica" : "simulacros") || {})[nivel];
      if (!c) throw new Error("Nivel de simulacro no válido");
      db.sesiones.filter((s) => s.user_id === db.actual && s.tipo === "simulacro" && !s.fin).forEach((s) => { s.fin = ahora(); s.correctas = 0; s.resultado = { abandonado: true }; });
      let ids = [];
      if (comp === "lectura") {
        // Como en el examen real: lecturas completas con todas sus preguntas.
        const porTexto = {};
        db.preguntas.filter((p) => p.activo && p.componente === "lectura").forEach((p) => (porTexto[p.texto_id] ||= []).push(p));
        const orden = Object.values(porTexto).map((ps) => ({ ps, s: Math.abs(ps.reduce((a, p) => a + p.dificultad, 0) / ps.length - (c.dificultad || 2)) + Math.random() * 1.2 })).sort((a, b) => a.s - b.s);
        for (const o of orden) { if (ids.length >= c.preguntas) break; ids = ids.concat(o.ps.sort((a, b) => a.codigo.localeCompare(b.codigo)).map((p) => p.id)); }
        ids = ids.slice(0, c.preguntas);
      } else {
        // Lógica: cupo por nivel, cerca de la dificultad objetivo, y primero lo no visto en tres semanas.
        const dist = cfg("distribucion_logica") || { deductivo: 0.25, proporcional: 0.3, abstracto: 0.2, geometrico: 0.25 };
        const hace21 = new Date(Date.now() - 21 * 86400e3).toISOString();
        const recientes = new Set(db.respuestas.filter((r) => r.user_id === db.actual && r.creado > hace21).map((r) => r.pregunta_id));
        const activas = db.preguntas.filter((p) => p.activo && p.componente === "logica");
        for (const cat of Object.keys(dist)) {
          const cupo = Math.max(1, Math.round(c.preguntas * (dist[cat] || 0.25)));
          activas.filter((p) => p.categoria === cat)
            .map((p) => ({ p, s: Math.abs(p.dificultad - (c.dificultad || 2)) + Math.random() * 1.2 + (recientes.has(p.id) ? 0.8 : 0) }))
            .sort((a, b) => a.s - b.s).slice(0, cupo).forEach((x) => ids.push(x.p.id));
        }
        if (ids.length < c.preguntas) ids = ids.concat(barajar(activas.filter((p) => !ids.includes(p.id))).slice(0, c.preguntas - ids.length).map((p) => p.id));
        ids = ids.slice(0, c.preguntas);
        // Las preguntas de una misma situación quedan juntas; el resto, mezcladas.
        const sal = {};
        const llave = (p) => (sal[p.texto_id || p.id] ||= Math.random());
        ids = ids.map(pregunta).sort((a, b) => llave(a) - llave(b) || a.codigo.localeCompare(b.codigo)).map((p) => p.id);
      }
      if (!ids.length) throw new Error("Todavía no hay preguntas cargadas");
      const limite = new Date(Date.now() + Math.round((c.minutos * ids.length) / c.preguntas) * 60000).toISOString();
      const s = { id: uuid(), user_id: db.actual, tipo: "simulacro", componente: comp, nivel, total: ids.length, preguntas: ids, inicio: ahora(), limite, fin: null, xp: 0 };
      db.sesiones.push(s); guardar();
      return espera({ sesion_id: s.id, nivel, componente: comp, limite, ahora: ahora(), retomado: false, ...empaquetar(ids) });
    },
    async entregarSimulacro(sesionId, resp) {
      const s = db.sesiones.find((x) => x.id === sesionId && x.user_id === db.actual);
      if (s.fin) return espera(s.resultado);
      const porCat = {}, porError = {}, porTema = {};
      const detalle = s.preguntas.map((id) => {
        const p = pregunta(id), r = resp[id] || {};
        const elegida = r.opcion ?? null, ok = elegida === p.correcta;
        db.respuestas.push({ id: db.respuestas.length + 1, user_id: db.actual, pregunta_id: id, sesion_id: s.id, opcion: elegida, correcta: ok, tiempo_ms: r.tiempo_ms ?? null, contexto: "simulacro", pista: false, creado: ahora() });
        const c = (porCat[p.categoria] ||= { correctas: 0, total: 0 }); c.total++; if (ok) c.correctas++;
        const error = ok ? null : errorDe(p, elegida);
        if (error?.tipo) porError[error.tipo] = (porError[error.tipo] || 0) + 1;
        if (p.tema) { const t = (porTema[p.tema] ||= { correctas: 0, total: 0 }); t.total++; if (ok) t.correctas++; }
        return { pregunta_id: id, texto_id: p.texto_id, categoria: p.categoria, enunciado: p.enunciado, opciones: p.opciones, elegida, correcta: p.correcta, acierto: ok, explicacion: p.explicacion,
          figura: p.figura || null, tema: p.tema || null, pasos: p.pasos || null, tiempo_ms: r.tiempo_ms ?? null, error };
      });
      const ok = detalle.filter((d) => d.acierto).length;
      const xp = ok * xpc("simulacro_acierto", 12) + xpc("simulacro_completo", 60);
      s.fin = ahora(); s.correctas = ok; s.xp = xp;
      s.resultado = { correctas: ok, total: s.total, puntaje: Math.round((1000 * ok) / s.total) / 10, xp, tarde: false, componente: s.componente || "lectura", respondidas: detalle.filter((d) => d.elegida != null).length, minutos: Math.round((Math.min(Date.now(), new Date(s.limite)) - new Date(s.inicio)) / 6000) / 10, por_categoria: porCat, por_error: porError, por_tema: porTema, detalle };
      sumarXP(db.actual, xp);
      const nuevas = evaluarInsignias(db.actual);
      guardar();
      return espera({ ...s.resultado, nuevas_insignias: nuevas, xp_total: yo().xp });
    },

      const nombres = { literal: "el nivel literal", inferencial: "el nivel inferencial", critico: "el nivel crítico", cohesion: "el nivel de cohesión", deductivo: "la deducción lógica", proporcional: "el trabajo con proporciones y conteo", abstracto: "la búsqueda de patrones", geometrico: "la geometría" };
      let n = 0;

        const dias = Math.round((new Date(hoy()) - new Date(dia(ult))) / 86400e3);
        if (dias >= um.dias_inactividad && !yaAvisada("inactividad", null, ult)) {
          db.alertas.push({ id: uuid(), estudiante_id: e.id, tipo: "inactividad", detalle: { dias }, sugerencia: `Hola ${nom}, hace ${dias} días no te veo por aquí. Te dejé un reto corto de 5 preguntas para retomar el ritmo sin presión.`, estado: "abierta", creado: ahora() }); n++;
        }
        const t7 = new Date(Date.now() - 7 * 86400e3).toISOString(), t28 = new Date(Date.now() - 28 * 86400e3).toISOString();
        for (const c of [...LECTURA, ...LOGICA]) {
          const rc = rs.filter((r) => pregunta(r.pregunta_id)?.categoria === c && r.creado > t28);
          const a = rc.filter((r) => r.creado > t7), b = rc.filter((r) => r.creado <= t7);
          if (a.length < um.minimo_respuestas || b.length < um.minimo_respuestas) continue;
          const ahoraP = Math.round((100 * a.filter((r) => r.correcta).length) / a.length), antes = Math.round((100 * b.filter((r) => r.correcta).length) / b.length);
          if (antes - ahoraP >= um.caida_puntos && !yaAvisada("caida", c, hace7)) {
            db.alertas.push({ id: uuid(), estudiante_id: e.id, tipo: "caida", detalle: { categoria: c, antes, ahora: ahoraP, componente: compDe(c) }, sugerencia: `${nom}, esta semana ${nombres[c]} se puso más difícil. Te armé una misión de 10 preguntas para trabajarlo juntos; después me cuentas cuál te costó más.`, estado: "abierta", creado: ahora() }); n++;
          }
        }
      }
      guardar();
      return n;
    },
    async alertas() {
      soloTutor();
      return espera(db.alertas.filter((a) => a.estado === "abierta").map((a) => { const u = db.usuarios.find((x) => x.id === a.estudiante_id); return { ...a, perfiles: { nombre: u.nombre, avatar: u.avatar } }; }));
    },
    async cerrarAlerta(id, estado) { soloTutor(); db.alertas.find((a) => a.id === id).estado = estado; guardar(); },
    async enviarMensaje(m) { soloTutor(); const f = { id: uuid(), autor_id: db.actual, leido: false, completado: false, creado: ahora(), cuerpo: "", ...m }; db.mensajes.push(f); guardar(); return espera(f); },
    async borrarMensaje(id) { soloTutor(); db.mensajes = db.mensajes.filter((m) => m.id !== id); guardar(); },
    async preguntasFalladas(uid) {
      soloTutor();
      const m = {};
      db.respuestas.filter((r) => r.user_id === uid).sort((a, b) => a.creado.localeCompare(b.creado)).forEach((r) => {
        const x = (m[r.pregunta_id] ||= { fallos: 0, intentos: 0 }); x.intentos++; if (!r.correcta) x.fallos++; x.ultima_opcion = r.opcion; x.ult = r.creado;
      });
      return espera(Object.entries(m).filter(([, x]) => x.fallos > 0).sort((a, b) => b[1].fallos - a[1].fallos || b[1].ult.localeCompare(a[1].ult)).slice(0, 15)
        .map(([id, x]) => { const p = pregunta(id); return { id, codigo: p.codigo, categoria: p.categoria, componente: p.componente || "lectura", tema: p.tema || null, dificultad: p.dificultad, enunciado: p.enunciado, opciones: p.opciones, correcta: p.correcta, explicacion: p.explicacion, texto: p.texto_id ? texto(p.texto_id).titulo : "Problema suelto", fallos: x.fallos, intentos: x.intentos, ultima_opcion: x.ultima_opcion, error: errorDe(p, x.ultima_opcion) }; }));
    },
    async resumenContenido() {
      soloTutor();
      const act = db.preguntas.filter((p) => p.activo);
      const matriz = {}, temas = {};
      act.forEach((p) => { (matriz[p.categoria] ||= {})[p.dificultad] = (matriz[p.categoria][p.dificultad] || 0) + 1; if (p.tema) temas[p.tema] = (temas[p.tema] || 0) + 1; });
      const paq = {};
      db.preguntas.forEach((p) => (paq[p.paquete] = (paq[p.paquete] || 0) + 1));
      return espera({
        textos: db.textos.filter((t) => t.activo && t.componente !== "logica").length,
        situaciones: db.textos.filter((t) => t.activo && t.componente === "logica").length,
        preguntas: act.filter((p) => p.componente !== "logica").length,
        preguntas_logica: act.filter((p) => p.componente === "logica").length,
        tecnicas: db.tecnicas.filter((t) => t.activo).length, temas,
        matriz, paquetes: Object.entries(paq).sort().map(([paquete, preguntas]) => ({ paquete, preguntas }))
      });
    },
    async importarPaquete(p) { soloTutor(); const r = aplicar(p); guardar(); return espera(r); },
    async banco() {
      soloTutor();
      const orden = (a, b) => a.codigo.localeCompare(b.codigo);
      return espera({ textos: [...db.textos].sort(orden), preguntas: [...db.preguntas].sort(orden) });
    },

    // Cuentas y contraseñas
    async cambiarMiClave(nueva) {
      if (!nueva || nueva.length < 8) throw new Error("La contraseña debe tener al menos 8 caracteres");
      const u = yo(); u.clave = nueva; u.debe_cambiar_clave = false; guardar();
    },
    async marcarInstalada() { const u = yo(); if (u && !u.instalada) { u.instalada = ahora(); guardar(); } },
    async personas() {
      soloTutor();
      const ult = (id) => db.respuestas.filter((r) => r.user_id === id).map((r) => r.creado).sort().pop() || null;
      const orden = (a, b) => (b.rol.localeCompare(a.rol)) || (b.activo - a.activo) || a.nombre.localeCompare(b.nombre);
      return espera([...db.usuarios].sort(orden).map((u) => ({ id: u.id, nombre: u.nombre, usuario: u.usuario, correo: u.correo, rol: u.rol, avatar: u.avatar, activo: u.activo,
        debe_cambiar_clave: !!u.debe_cambiar_clave, instalada: u.instalada || null, creado: u.creado, xp: u.xp, yo: u.id === db.actual, ultima_actividad: ult(u.id),
        grupos: db.miembros.filter((m) => m.user_id === u.id).map((m) => db.grupos.find((g) => g.id === m.grupo_id)).filter(Boolean).map((g) => ({ id: g.id, nombre: g.nombre, emoji: g.emoji })) })));
    },
    async crearUsuario(nombre, correo, grupo = null) {
      soloTutor();
      const c = (correo || "").trim().toLowerCase(), n = (nombre || "").trim();
      if (!n) throw new Error("Escribe el nombre de la persona");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) throw new Error(`El correo «${c}» no es válido`);
      if (db.usuarios.some((u) => u.correo === c)) throw new Error("Ya existe una cuenta con el correo " + c);
      const u = { id: uuid(), usuario: usuarioLibre(c), correo: c, clave: claveTemporal(), rol: "estudiante", nombre: n, avatar: "🎧", xp: 0, meta_programa: null, ultima_novedad: db.novedades.length, activo: true, debe_cambiar_clave: true, instalada: null, creado: ahora() };
      db.usuarios.push(u);
      if (grupo) db.miembros.push({ grupo_id: grupo, user_id: u.id, desde: ahora() });
      guardar();
      return espera({ id: u.id, nombre: u.nombre, correo: u.correo, usuario: u.usuario, clave: u.clave });
    },
    async restablecerClave(id) {
      soloTutor();
      const u = db.usuarios.find((x) => x.id === id);
      if (!u) throw new Error("Persona no encontrada");
      if (u.rol !== "estudiante") throw new Error("Solo se puede restablecer la contraseña de una cuenta de estudiante");
      u.clave = claveTemporal(); u.debe_cambiar_clave = true; guardar();
      return espera({ id: u.id, nombre: u.nombre, correo: u.correo, usuario: u.usuario, clave: u.clave });
    },
    async cambiarEstadoUsuario(id, activo) {
      soloTutor();
      if (id === db.actual) throw new Error("No puedes desactivar tu propia cuenta");
      db.usuarios.find((x) => x.id === id).activo = !!activo; guardar();
    },
    async borrarMiPractica() {
      soloTutor();
      const n = db.respuestas.filter((r) => r.user_id === db.actual).length;
      db.respuestas = db.respuestas.filter((r) => r.user_id !== db.actual);
      db.sesiones = db.sesiones.filter((s) => s.user_id !== db.actual);
      db.iu = db.iu.filter((x) => x.user_id !== db.actual);
      delete db.actividad[db.actual];
      yo().xp = 0; guardar();
      return espera({ respuestas: n });
    },

    // Grupos
    async misGrupos() {
      const tutor = yo()?.rol === "tutor";
      return espera(db.grupos.filter((g) => tutor || db.miembros.some((m) => m.grupo_id === g.id && m.user_id === db.actual))
        .sort((a, b) => a.nombre.localeCompare(b.nombre))
        .map((g) => ({ id: g.id, nombre: g.nombre, descripcion: g.descripcion, emoji: g.emoji, ver_simulacros: g.ver_simulacros,
          n: db.miembros.filter((m) => m.grupo_id === g.id && db.usuarios.find((u) => u.id === m.user_id)?.activo).length,
          miembros: tutor ? db.miembros.filter((m) => m.grupo_id === g.id).map((m) => m.user_id) : null })));
    },
    async grupoSemana(id) {
      if (!db.grupos.some((g) => g.id === id)) throw new Error("Grupo no encontrado");
      if (yo().rol !== "tutor" && !db.miembros.some((m) => m.grupo_id === id && m.user_id === db.actual)) throw new Error("Sin permiso");
      return espera(grupoSemana(id));
    },
    async guardarGrupo(g) {
      soloTutor();
      if (!(g.nombre || "").trim()) throw new Error("Escribe el nombre del grupo");
      let x = g.id && db.grupos.find((k) => k.id === g.id);
      if (!x) { x = { id: uuid(), activo: true, creado: ahora() }; db.grupos.push(x); }
      Object.assign(x, { nombre: g.nombre.trim(), descripcion: (g.descripcion || "").trim(), emoji: g.emoji || "👥", ver_simulacros: !!g.ver_simulacros });
      guardar();
      return espera(x.id);
    },
    async eliminarGrupo(id) { soloTutor(); db.grupos = db.grupos.filter((g) => g.id !== id); db.miembros = db.miembros.filter((m) => m.grupo_id !== id); guardar(); },
    async fijarMiembros(id, ids) {
      soloTutor();
      const validos = ids.filter((u) => db.usuarios.find((x) => x.id === u)?.rol === "estudiante");
      db.miembros = db.miembros.filter((m) => m.grupo_id !== id).concat(validos.map((u) => ({ grupo_id: id, user_id: u, desde: ahora() })));
      guardar();
      return espera(validos.length);
    }
  };
};

/* =====================================================================
   ENTRELÍNEAS · VISTAS DE LA ESTUDIANTE
   Las pantallas que comparten los dos componentes (Lectura y Lógica):
   portada, mensajes, reto, simulacro, diagnóstico y perfil.
   Lo propio de Lógica (caja de herramientas y cuaderno de errores)
   está en vistas-logica.js.
   ===================================================================== */
(function (LE) {
  const { esc, $, $$ } = LE;
  const A = LE.acciones;
  const rutaDe = (comp) => LE.COMP[comp === "logica" ? "logica" : "lectura"].ruta;

  // =================================================================
  //  PORTADA DE UN COMPONENTE (#/inicio es Lectura; #/logica es Lógica)
  // =================================================================
  LE.portada = async (comp) => {
    LE.cargando();
    LE.compActual(comp);
    const logica = comp === "logica";
    const [r, msgs, cua] = await Promise.all([LE.api.resumen(), LE.api.mensajes(), logica ? LE.api.cuaderno("logica") : null]);
    LE.estado.perfil = r.perfil;
    LE.actualizarPunto(msgs);
    const c = LE.estado.config;
    const pendientes = msgs.filter((m) => !m.leido || (m.tipo === "mision" && !m.completado));
    const nombre = esc((r.perfil.nombre || "").split(" ")[0]);
    const retos = LE.cfgDe("retos", comp)?.opciones || [];
    const dominio = (logica ? r.dominio_logica : r.dominio) || [];
    const hechas = r.por_componente?.[comp]?.respuestas ?? (logica ? 0 : r.totales.respuestas);
    const debil = [...dominio].sort((a, b) => a.dominio - b.dominio)[0];
    const sims = (r.simulacros || []).filter((x) => (x.componente || "lectura") === comp);
    const niveles = LE.cfgDe("simulacros", comp) || {};

    LE.montar(`
      <div class="rejilla inicio comp-${comp}">
        <div class="pila" style="--pila:1.25rem">
          <section class="panel saludo">
            <div class="fila">
              <div class="avatar-grande" aria-hidden="true">${esc(r.perfil.avatar)}</div>
              <div class="pila" style="--pila:.2rem">
                <h1>Hola, ${nombre}</h1>
                <p class="sub">${saludoDia(r)}</p>
              </div>
            </div>
            ${LE.pistaXP(r.perfil.xp)}
            <div class="chips">
              <span class="chip" title="Días seguidos con al menos una pregunta respondida">🔥 <b>${r.racha}</b> ${r.racha === 1 ? "día" : "días"} de racha</span>
              <span class="chip">⏱️ <b>${LE.minutos(r.minutos_hoy)}</b> hoy</span>
              <span class="chip">🏅 <b>${r.insignias.length}</b> insignias</span>
            </div>
          </section>

          ${pendientes.length ? `
          <section class="pila" style="--pila:.7rem" aria-label="Mensajes de tu tutor">
            <div class="titulo-seccion"><h2>De tu tutor</h2><a href="#/mensajes" class="pequeno">Ver todos</a></div>
            ${pendientes.slice(0, 2).map(tarjetaMensaje).join("")}
          </section>` : ""}

          <section class="panel">
            <div class="titulo-seccion"><h2>${logica ? "Reto de lógica" : LE.logicaActiva() ? "Reto de lectura" : "Reto de hoy"}</h2><span class="sub pequeno">Elige cuánto tiempo tienes</span></div>
            <div class="tracklist">
              ${retos.map((o) => `
                <button class="track" data-accion="reto" data-n="${o.n}" data-comp="${comp}">
                  <span class="n">${o.n}<small>preguntas</small></span>
                  <span><strong>${esc(o.nombre)}</strong><span class="sub pequeno">${esc(o.descripcion)} Unos ${o.minutos} min.</span></span>
                  <span class="play" aria-hidden="true">▶</span>

            </div>
            ${logica ? `<p class="tenue pequeno" style="margin-top:.8rem">Ten a mano papel y lápiz: en el examen no hay calculadora. Si te trabas, pide la pista.</p>` : ""}

          <section class="panel">
            <div class="titulo-seccion"><h2>${logica ? "Tu ecualizador lógico" : "Tu ecualizador"}</h2><span class="sub pequeno">Dominio de 0 a 100</span></div>

              <p class="sub pequeno" style="margin-top:1rem">Tu nivel más bajo ahora es <b style="color:var(--texto)">${esc(LE.cat(debil.categoria).nombre)}</b>: ${esc(LE.cat(debil.categoria).descripcion.toLowerCase())}</p>

          </section>
          <section class="panel">
            <div class="titulo-seccion"><h2>${logica ? "Simulacro de lógica" : "Simulacro"}</h2></div>

  LE.ruta("/inicio", () => LE.portada("lectura"), { estudiante: true });

  function saludoDia(r) {

    if (r.racha >= 3) return `Llevas ${r.racha} días seguidos. Un reto hoy y la racha sigue.`;

  function tarjetaMensaje(m) {

    return `<article class="mensaje ${m.tipo}">
      <span class="de">${tipo} · ${esc(LE.hace(m.creado))}${!m.leido ? '<span class="nuevo">nuevo</span>' : ""}</span>

      ${m.cuerpo ? `<p>${esc(m.cuerpo)}</p>` : ""}
      ${m.tipo === "comentario" && m.mision?.cita ? `<div class="cita">«${esc(m.mision.cita)}»${m.mision.correcta ? `<br><span class="pequeno">Respuesta correcta: ${esc(m.mision.correcta)}</span>` : ""}</div>` : ""}
      ${m.tipo === "mision" ? (m.completado

        : !m.leido ? `<button class="enlace pequeno" style="margin-top:.6rem;display:block" data-accion="leido" data-id="${m.id}">Marcar como leído</button>` : ""}
    </article>`;
  }

  A.leido = async (b) => {

    b.closest(".mensaje").querySelector(".nuevo")?.remove();
    b.remove();
    LE.actualizarPunto();
  };

  // =================================================================
  //  MENSAJES
  // =================================================================
  LE.ruta("/mensajes", async () => {
    LE.cargando();
    const msgs = await LE.api.mensajes();
    LE.montar(`<div class="pila" style="max-width:44rem">
      <h1>Mensajes</h1>
      <p class="sub">Todo lo que tu tutor te ha escrito: mensajes, misiones y comentarios sobre tus respuestas.</p>
      ${msgs.length ? msgs.map(tarjetaMensaje).join("") : `<div class="vacio"><p>Aún no hay mensajes. Cuando tu tutor te escriba, aparecerá aquí.</p></div>`}
    </div>`);
    const porLeer = msgs.filter((m) => !m.leido && m.tipo !== "mision");
    await Promise.all(porLeer.map((m) => LE.api.marcarLeido(m.id)));

  // =================================================================
  //  RETO (y misión). Un reto es de un solo componente.
  // =================================================================
  A.reto = (b) => LE.empezarReto({ n: +b.dataset.n, cat: b.dataset.cat || null, comp: b.dataset.comp || null, tema: b.dataset.tema || null, boton: b });
  A.mision = (b) => { LE.api.marcarLeido(b.dataset.id).then(() => LE.actualizarPunto()); LE.empezarReto({ n: +b.dataset.n, cat: b.dataset.cat || null, comp: b.dataset.comp || null, mensajeId: b.dataset.id, boton: b }); };

  LE.empezarReto = async ({ n, cat = null, comp = null, tema = null, mensajeId = null, boton = null }) => {

      LE.estado.sesion = { datos, i: 0, marcas: [], reg: [], xp: 0, sel: null, respondida: null, pista: false, t0: performance.now(), mision: !!mensajeId, cat, comp: c, tema, n };

  LE.ruta("/reto", () => {
    const s = LE.estado.sesion;

  }, { sesion: true, estudiante: true });

  // Enunciado y figura. En lógica el enunciado admite listas, cuadros y negritas.
  const enunciadoHTML = (p) => (p.componente === "logica"

  const retroHTML = (p, r) => `<div class="retro ${r.correcta ? "bien" : "malo"}" role="status">

      ${p.componente === "logica" ? `
        ${LE.diagnosticoError(r.error)}

        ${r.explicacion ? `<p class="idea">${esc(r.explicacion)}</p>` : ""}
        ${LE.enlaceTecnica(r.tema)}` : `<p>${esc(r.explicacion)}</p>`}
    </div>`;

  function pintarPregunta() {
    const s = LE.estado.sesion;
