 más barata."}, {"tipo": "inferencia", "nota": "Con 7 también es más costosa, pero no es «a partir de»: con 6 ya lo es."}, null], "explicacion": "«A partir de» no es el punto de empate: es el siguiente."}, {"codigo": "L-PRO-1", "categoria": "proporcional", "tema": "promedio", "dificultad": 1, "enunciado": "Las notas de Daniela en cuatro pruebas cortas fueron 3,0; 4,0; 4,5 y 3,5. ¿Cuál es su promedio?", "opciones": ["4,0", "3,75", "3,5", "3,25"], "correcta": 1, "pista": "Suma las cuatro notas y divide entre 4.", "pasos": ["Suma: 3,0 + 4,0 + 4,5 + 3,5 = 15.", "Promedio: 15 ÷ 4 = 3,75."], "errores": [{"tipo": "calculo", "nota": "Las cuatro notas suman 15, no 16."}, null, {"tipo": "inferencia", "nota": "Tomaste una de las notas. El promedio se calcula con la suma de todas."}, {"tipo": "calculo", "nota": "Las cuatro notas suman 15, no 13."}], "explicacion": "Promedio = suma ÷ cantidad."}, {"codigo": "L-PRO-3", "categoria": "proporcional", "tema": "promedio", "dificultad": 3, "enunciado": "En un grupo de teatro, la razón entre mujeres y hombres es 3 a 2. La edad promedio de las mujeres es 20 años y la de los hombres es 25. La edad promedio del grupo es:", "opciones": ["22,5 años", "23 años", "22 años", "21 años"], "correcta": 2, "pista": "Imagina un grupo con 3 mujeres y 2 hombres. ¿Cuánto suman sus edades?", "pasos": ["Toma un grupo de 3 mujeres y 2 hombres: cumple la razón.", "Suma de edades: 3 × 20 + 2 × 25 = 60 + 50 = 110.", "Promedio: 110 ÷ 5 = 22 años."], "errores": [{"tipo": "regla", "nota": "Promediaste 20 y 25 como si hubiera igual número de mujeres y de hombres. Hay más mujeres, y eso jala el promedio hacia 20."}, {"tipo": "planteamiento", "nota": "Cruzaste los pesos: usaste 3 para los hombres y 2 para las mujeres."}, null, {"tipo": "calculo", "nota": "La suma es 3 × 20 + 2 × 25 = 110, y 110 ÷ 5 = 22."}], "explicacion": "Al juntar grupos, cada promedio pesa según el tamaño de su grupo."}, {"codigo": "L-CNT-1", "categoria": "proporcional", "tema": "conteo", "dificultad": 1, "enunciado": "Un menú ofrece 3 sopas, 4 platos fuertes y 2 postres. ¿Cuántos almuerzos distintos se pueden armar con una sopa, un plato fuerte y un postre?", "opciones": ["9", "12", "24", "14"], "correcta": 2, "pista": "Son tres decisiones seguidas. Cada sopa se puede combinar con cada plato y con cada postre.", "pasos": ["Sopa: 3 opciones. Plato fuerte: 4. Postre: 2.", "Las decisiones se encadenan con «y»: se multiplican.", "3 × 4 × 2 = 24 almuerzos."], "errores": [{"tipo": "regla", "nota": "Sumaste las opciones. Como se elige una sopa y un plato y un postre, se multiplican."}, {"tipo": "incompleto", "nota": "Combinaste sopas y platos fuertes. Falta el postre."}, null, {"tipo": "regla", "nota": "Multiplicaste sopas por platos y luego sumaste los postres. Las tres decisiones se multiplican."}], "explicacion": "Decisiones encadenadas: se multiplica."}, {"codigo": "L-CNT-3", "categoria": "proporcional", "tema": "conteo", "dificultad": 2, "enunciado": "¿Cuántos números de tres cifras distintas se pueden formar con los dígitos 1, 2, 3, 4 y 5?", "opciones": ["125", "60", "15", "10"], "correcta": 1, "pista": "Elige la primera cifra, luego la segunda y luego la tercera. ¿Cuántas opciones quedan cada vez?", "pasos": ["Primera cifra: 5 opciones.", "Segunda cifra: quedan 4, porque no se repite.", "Tercera cifra: quedan 3.", "5 × 4 × 3 = 60 números."], "errores": [{"tipo": "enunciado", "nota": "Ese es el conteo cuando las cifras se pueden repetir. El enunciado pide cifras distintas."}, null, {"tipo": "regla", "nota": "Multiplicaste 5 × 3 o sumaste 5 + 5 + 5. Cada cifra es una decisión y se multiplican las opciones de cada una."}, {"tipo": "regla", "nota": "Contaste grupos de tres dígitos sin importar el orden. En un número el orden sí importa: 123 no es 321."}], "explicacion": "Sin repetición, cada decisión tiene una opción menos."}, {"codigo": "L-PRB-1", "categoria": "proporcional", "tema": "probabilidad", "dificultad": 1, "enunciado": "En una bolsa hay 4 fichas rojas, 5 azules y 3 verdes. Si se saca una ficha al azar, la probabilidad de que no sea azul es:", "opciones": ["5/12", "7/5", "1/3", "7/12"], "correcta": 3, "pista": "Cuenta cuántas fichas hay en total y cuántas no son azules.", "pasos": ["Total de fichas: 4 + 5 + 3 = 12.", "No azules: 4 rojas + 3 verdes = 7.", "Probabilidad: 7/12."], "errores": [{"tipo": "enunciado", "nota": "Esa es la probabilidad de que sí sea azul."}, {"tipo": "planteamiento", "nota": "Comparaste las que no son azules con las azules. La probabilidad se divide entre el total, y nunca pasa de 1."}, {"tipo": "incompleto", "nota": "Contaste solo las rojas. Las verdes tampoco son azules."}, null], "explicacion": "Favorables sobre posibles."}, {"codigo": "L-PRB-3", "categoria": "proporcional", "tema": "probabilidad", "dificultad": 2, "enunciado": "Se lanzan dos dados. La probabilidad de que la suma de los puntos sea 9 es:", "opciones": ["1/9", "1/18", "1/12", "1/11"], "correcta": 0, "pista": "Hay 36 resultados posibles. Escribe todas las parejas que suman 9, teniendo en cuenta cuál dado es cuál.", "pasos": ["Resultados posibles con dos dados: 6 × 6 = 36.", "Parejas que suman 9: (3, 6), (4, 5), (5, 4) y (6, 3). Son 4.", "Probabilidad: 4/36 = 1/9."], "errores": [null, {"tipo": "regla", "nota": "Contaste 3 + 6 y 4 + 5 una sola vez cada una. Con dos dados, (3, 6) y (6, 3) son resultados distintos."}, {"tipo": "calculo", "nota": "Son cuatro resultados favorables, no tres: (3, 6), (6, 3), (4, 5) y (5, 4)."}, {"tipo": "planteamiento", "nota": "Contaste las 11 sumas posibles como si fueran igual de probables. No lo son: los casos igual de probables son las 36 parejas."}], "explicacion": "Con dos dados, el orden cuenta."}, {"codigo": "L-SER-1", "categoria": "abstracto", "tema": "series", "dificultad": 1, "enunciado": "¿Qué número sigue en la serie 3, 7, 11, 15, 19, …?", "opciones": ["22", "23", "21", "24"], "correcta": 1, "pista": "Resta cada término del siguiente. ¿Qué salto se repite?", "pasos": ["Diferencias: 7 − 3 = 4, 11 − 7 = 4, 15 − 11 = 4, 19 − 15 = 4.", "El salto es siempre 4.", "19 + 4 = 23."], "errores": [{"tipo": "calculo", "nota": "La serie avanza de 4 en 4, no de 3 en 3."}, null, {"tipo": "calculo", "nota": "La serie avanza de 4 en 4: 19 + 4 = 23."}, {"tipo": "calculo", "nota": "La serie avanza de 4 en 4, no de 5 en 5."}], "explicacion": "Primero las diferencias."}, {"codigo": "L-SER-3", "categoria": "abstracto", "tema": "series", "dificultad": 2, "enunciado": "¿Qué número sigue en la serie 5, 20, 8, 17, 11, 14, 14, …?", "opciones": ["11", "17", "14", "12"], "correcta": 0, "pista": "Separa los términos en dos listas: los de posición impar y los de posición par.", "pasos": ["Posiciones impares: 5, 8, 11, 14. Suben de 3 en 3.", "Posiciones pares: 20, 17, 14. Bajan de 3 en 3.", "El término que falta está en posición par: 14 − 3 = 11."], "errores": [null, {"tipo": "planteamiento", "nota": "Seguiste la serie que sube (5, 8, 11, 14). El turno era de la otra, la que baja."}, {"tipo": "inferencia", "nota": "Que se repita el 14 es una coincidencia de las dos series que se cruzan, no una regla."}, {"tipo": "calculo", "nota": "La serie que baja lo hace de 3 en 3: 20, 17, 14, 11."}], "explicacion": "Si la serie sube y baja, probablemente son dos series intercaladas."}, {"codigo": "L-OPE-1", "categoria": "abstracto", "tema": "operadores", "dificultad": 1, "enunciado": "Se define la operación a ⊕ b = 2a + b. El valor de 3 ⊕ 4 es:", "opciones": ["11", "14", "7", "10"], "correcta": 3, "pista": "Reemplaza a por 3 y b por 4, en ese orden.", "pasos": ["La definición es a ⊕ b = 2a + b.", "Aquí a = 3 y b = 4.", "3 ⊕ 4 = 2 × 3 + 4 = 10."], "errores": [{"tipo": "regla", "nota": "Cambiaste el orden: calculaste 2 × 4 + 3. El que se duplica es el primero."}, {"tipo": "regla", "nota": "Duplicaste la suma completa. La definición solo duplica el primer número."}, {"tipo": "regla", "nota": "Trataste ⊕ como una suma corriente."}, null], "explicacion": "El primer número va donde está la primera letra."}, {"codigo": "L-OPE-3", "categoria": "abstracto", "tema": "operadores", "dificultad": 2, "enunciado": "Se define p ◊ q = 3p − 2q. Si x ◊ 5 = 8, entonces x es igual a:", "opciones": ["18", "3,5", "6", "−2/3"], "correcta": 2, "pista": "Reemplaza p por x y q por 5. Queda una ecuación corriente.", "pasos": ["x ◊ 5 = 3x − 2 × 5 = 3x − 10.", "La condición es 3x − 10 = 8.", "3x = 18, así que x = 6."], "errores": [{"tipo": "incompleto", "nota": "Llegaste a 3x = 18 y te faltó dividir entre 3."}, {"tipo": "regla", "nota": "Resolviste 5 ◊ x = 8. La x va en el primer lugar."}, null, {"tipo": "calculo", "nota": "Al pasar el 10 al otro lado se suma: 3x = 8 + 10."}], "explicacion": "Un operador con incógnita se vuelve una ecuación."}, {"codigo": "L-CIC-1", "categoria": "abstracto", "tema": "ciclos", "dificultad": 1, "enunciado": "Hoy es miércoles. ¿Qué día de la semana será dentro de 30 días?", "opciones": ["Jueves", "Viernes", "Sábado", "Miércoles"], "correcta": 1, "pista": "Cada 7 días vuelve a ser miércoles. ¿Cuántos días sobran después de quitar las semanas completas?", "pasos": ["El ciclo es de 7 días.", "30 ÷ 7 = 4 y sobran 2.", "Después de 28 días vuelve a ser miércoles; 2 días más: viernes."], "errores": [{"tipo": "calculo", "nota": "30 dividido entre 7 da 4 y sobran 2, no 1."}, null, {"tipo": "calculo", "nota": "Sobran 2 días, no 3: 4 semanas son 28 días."}, {"tipo": "regla", "nota": "30 días no son un número entero de semanas: 4 semanas son 28 días y sobran 2."}], "explicacion": "Solo importa el residuo."}, {"codigo": "L-CIC-3", "categoria": "abstracto", "tema": "ciclos", "dificultad": 2, "enunciado": "Una valla luminosa muestra tres anuncios en orden: el anuncio A dura 20 segundos, el B dura 15 segundos y el C dura 10 segundos; después vuelve a empezar con A. Si a las 8:00 en punto comienza el anuncio A, ¿qué anuncio se está mostrando a las 8:05 en punto?", "opciones": ["El anuncio A", "El anuncio C", "Justo en ese instante cambia de B a C", "El anuncio B"], "correcta": 3, "pista": "¿Cuánto dura un ciclo completo? Pasa los 5 minutos a segundos y busca el residuo.", "pasos": ["Un ciclo dura 20 + 15 + 10 = 45 segundos.", "De 8:00 a 8:05 pasan 300 segundos.", "300 ÷ 45 = 6 y sobran 30: van 30 segundos de un ciclo nuevo.", "Dentro del ciclo: A va del segundo 0 al 20 y B del 20 al 35. En el segundo 30 se muestra B."], "errores": [{"tipo": "regla", "nota": "Supusiste que en 5 minutos cabe un número entero de ciclos. 300 segundos no es múltiplo de 45: sobran 30."}, {"tipo": "calculo", "nota": "Sobran 30 segundos, y C empieza en el segundo 35 de cada ciclo."}, {"tipo": "calculo", "nota": "El cambio de B a C ocurre en el segundo 35 del ciclo. A las 8:05 van 30."}, null], "explicacion": "Si los tramos del ciclo duran distinto, ubica el residuo dentro del ciclo."}, {"codigo": "L-CLA-1", "categoria": "abstracto", "tema": "claves", "dificultad": 1, "enunciado": "En una clave, cada letra de la palabra CLAVE vale su posición en ella: C = 1, L = 2, A = 3, V = 4, E = 5. ¿Qué palabra corresponde al número 4 5 2 3?", "opciones": ["VALE", "LEVA", "VELA", "LAVE"], "correcta": 2, "pista": "Traduce cifra por cifra, en orden.", "pasos": ["4 es V.", "5 es E.", "2 es L.", "3 es A.", "La palabra es VELA."], "errores": [{"tipo": "calculo", "nota": "VALE sería 4 3 2 5: cambiaste de lugar la E y la A."}, {"tipo": "calculo", "nota": "LEVA sería 2 5 4 3. El código empieza por 4, que es la V."}, null, {"tipo": "calculo", "nota": "LAVE sería 2 3 4 5."}], "explicacion": "Se descifra letra por letra, sin cambiar el orden."}, {"codigo": "L-CLA-3", "categoria": "abstracto", "tema": "claves", "dificultad": 2, "enunciado": "En un código, una palabra se cifra en dos pasos: primero se escriben sus letras en orden inverso, y después cada vocal se cambia por la vocal siguiente (A por E, E por I, I por O, O por U, U por A). ¿Cómo queda cifrada la palabra RITMO?", "opciones": ["UMTOR", "ROTMU", "OMTIR", "IMTER"], "correcta": 0, "pista": "Haz los dos pasos por separado y escribe el resultado del primero antes de empezar el segundo.", "pasos": ["Paso 1, invertir: RITMO queda OMTIR.", "Paso 2, cambiar vocales: la O pasa a U y la I pasa a O.", "OMTIR queda UMTOR."], "errores": [null, {"tipo": "incompleto", "nota": "Cambiaste las vocales, pero te faltó el primer paso: invertir el orden de las letras."}, {"tipo": "incompleto", "nota": "Invertiste la palabra, pero te faltó el segundo paso: cambiar cada vocal por la siguiente."}, {"tipo": "regla", "nota": "Cambiaste cada vocal por la anterior. La regla dice «la vocal siguiente»."}], "explicacion": "Con reglas de varios pasos, escribe el resultado de cada paso."}, {"codigo": "L-FIG-1", "categoria": "abstracto", "tema": "figuras", "dificultad": 1, "enunciado": "Con palillos se forma una fila de triángulos pegados, como muestra la figura. La figura 1 usa 3 palillos, la figura 2 usa 5 y la figura 3 usa 7. ¿Cuántos palillos usa la figura 10?", "opciones": ["21", "30", "19", "23"], "correcta": 0, "pista": "¿Cuántos palillos se agregan al pasar de una figura a la siguiente?", "pasos": ["De 3 a 5 y de 5 a 7: cada triángulo nuevo agrega 2 palillos.", "La figura 1 tiene 3. De la figura 1 a la 10 se agregan 9 triángulos.", "3 + 9 × 2 = 21 palillos."], "errores": [null, {"tipo": "regla", "nota": "Multiplicaste 3 palillos por 10 triángulos. Los triángulos vecinos comparten un palillo."}, {"tipo": "calculo", "nota": "La fórmula es 2n + 1, no 2n − 1: con n = 1 debe dar 3."}, {"tipo": "planteamiento", "nota": "Ese es el valor de la figura 11. Te corriste una posición."}], "explicacion": "Primer valor más el aumento por los pasos que faltan.", "figura": "<svg viewBox=\"0 0 270 96\" width=\"270\" height=\"96\"><line x1=\"14.0\" y1=\"62\" x2=\"31.0\" y2=\"33\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"14.0\" y1=\"62\" x2=\"48.0\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"48.0\" y1=\"62\" x2=\"31.0\" y2=\"33\" stro
