<style>
/* =====================================================================
   ENTRELÍNEAS · TEMA
   Cambiar la estética de la app = cambiar este archivo.
   ===================================================================== */
:root {
  /* Fondo: noche violeta, no negro. */
  --noche:      #1A1238;
  --noche-2:    #221847;
  --superficie: #2C2160;
  --superficie-2: #372A74;
  --borde:      #45388C;

  --texto:   #F4EFFF;
  --texto-2: #C3B8EC;
  --tenue:   #948AC6;

  /* Acentos: uno por categoría + uno para XP. */
  --rosa:     #FF4FA3;   /* inferencial · acción principal */
  --cian:     #3FD8F2;   /* literal */
  --amarillo: #FFCB3D;   /* crítico · XP y rangos */
  --menta:    #6BF0A6;   /* cohesión · aciertos */
  --violeta:  #AE93FF;   /* simulacros */
  --coral:    #FF6E6E;   /* errores y tiempo agotándose */

  /* La lectura vive en papel: modo serio dentro del modo juego. */
  --papel:  #FBF8FF;
  --tinta:  #251D44;
  --tinta-2:#5A5180;

  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-ui:      "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-lectura: "Literata", Georgia, "Times New Roman", serif;

  --r-s: 8px;
  --r-m: 14px;
  --r-l: 24px;
  --r-pill: 999px;

  --sombra: 0 10px 30px -12px rgba(8, 4, 30, .7);
  --ancho: 1120px;
}

/* =====================================================================
   ENTRELÍNEAS · COMPONENTES
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--noche);
  background-image: radial-gradient(1200px 500px at 85% -120px, rgba(255, 79, 163, .16), transparent 70%);
  background-attachment: fixed;
  color: var(--texto);
  font: 400 16px/1.5 var(--f-ui);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--cian); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cian); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.tenue { color: var(--tenue); }
.sub { color: var(--texto-2); }
.pequeno { font-size: .85rem; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.pila > * + * { margin-top: var(--pila, 1rem); }
.fila { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.entre { justify-content: space-between; }
.cr-literal { --c: var(--cian); } .cr-inferencial { --c: var(--rosa); }
.cr-critico { --c: var(--amarillo); } .cr-cohesion { --c: var(--menta); }
.cr-violeta { --c: var(--violeta); } .cr-rosa { --c: var(--rosa); } .cr-cian { --c: var(--cian); }
.cr-amarillo { --c: var(--amarillo); } .cr-menta { --c: var(--menta); }
/* Los cuatro niveles de Lógica */
.cr-deductivo { --c: var(--violeta); } .cr-proporcional { --c: var(--amarillo); }
.cr-abstracto { --c: var(--rosa); } .cr-geometrico { --c: var(--menta); }
/* Cada componente tiene su acento: rosa para Lectura, cian para Lógica */
.comp-lectura { --acento: var(--rosa); --acento-tinta: #2A0620; }
.comp-logica { --acento: var(--cian); --acento-tinta: #06232A; }

/* ---------- Estructura ---------- */
.barra {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 1px solid var(--borde);
}
/* El fondo borroso va en un pseudoelemento: si el filtro estuviera en .barra,
   la navegación del celular (position: fixed) quedaría atada a la barra de
   arriba en vez de bajar al borde inferior de la pantalla. */
.barra::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(26, 18, 56, .88);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.barra-in { max-width: var(--ancho); margin: 0 auto; padding: .7rem 1.1rem; display: flex; align-items: center; gap: 1rem; }
.marca { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; display: flex; align-items: baseline; text-decoration: none; color: var(--texto); }
.marca i { font-style: normal; color: var(--rosa); }
.nav { display: flex; gap: .25rem; margin-left: auto; }
.nav a {
  color: var(--texto-2); text-decoration: none; font-weight: 600; font-size: .95rem;
  padding: .45rem .8rem; border-radius: var(--r-pill); display: flex; align-items: center; gap: .4rem; position: relative;
}
.nav a:hover { color: var(--texto); background: var(--noche-2); }
.nav a[aria-current="page"] { color: var(--noche); background: var(--texto); }
.nav .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--rosa); }
main { max-width: var(--ancho); margin: 0 auto; padding: 1.5rem 1.1rem 6rem; }

@media (max-width: 720px) {
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0;
    justify-content: space-around; padding: .45rem .5rem calc(.45rem + env(safe-area-inset-bottom, 0px));
    background: rgba(26, 18, 56, .96); border-top: 1px solid var(--borde);
  }
  .nav a { flex-direction: column; gap: .1rem; font-size: .72rem; padding: .35rem .45rem; border-radius: var(--r-m); min-width: 3.4rem; }
  .nav a .ico { font-size: 1.2rem; }
  .nav .punto { position: absolute; top: 4px; right: 10px; }
}
@media (min-width: 721px) { .nav .ico { display: none; } }
.en-sesion .nav { display: none; }

/* ---------- Botones ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .75rem 1.25rem; border-radius: var(--r-pill);
  font-weight: 700; font-size: 1rem; text-decoration: none;
  background: var(--rosa); color: #2A0620;
  transition: transform .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.sec { background: transparent; color: var(--texto); box-shadow: inset 0 0 0 2px var(--borde); }
.btn.sec:hover { box-shadow: inset 0 0 0 2px var(--texto-2); }
.btn.suave { background: var(--superficie-2); color: var(--texto); }
.btn.chico { padding: .45rem .9rem; font-size: .88rem; }
.btn.ancho { width: 100%; }
.btn.color { background: var(--c); color: var(--noche); }
.enlace { background: none; border: 0; padding: 0; color: var(--cian); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Paneles ---------- */
.panel { background: var(--noche-2); border: 1px solid var(--borde); border-radius: var(--r-l); padding: 1.25rem; }
.panel.plano { background: transparent; border: 0; }
.rejilla { display: grid; gap: 1.25rem; }
.rejilla > * { min-width: 0; }
@media (min-width: 900px) {
  .rejilla.inicio { grid-template-columns: 1.35fr 1fr; align-items: start; }
  .rejilla.dos { grid-template-columns: 1fr 1fr; }
}
.titulo-seccion { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .9rem; flex-wrap: wrap; }

/* ---------- Encabezado de inicio ---------- */
.saludo { display: grid; gap: 1.1rem; }
.saludo .avatar-grande { font-size: 2.6rem; width: 4.2rem; height: 4.2rem; display: grid; place-items: center; background: var(--superficie); border-radius: var(--r-l); border: 2px solid var(--borde); }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .75rem; border-radius: var(--r-pill); background: var(--superficie); font-weight: 600; font-size: .9rem; }
.chip b { font-family: var(--f-display); font-weight: 700; }

/* Pista de XP: barra de reproducción de una canción */
.pista { display: grid; gap: .45rem; }
.pista-barra { position: relative; height: 10px; border-radius: var(--r-pill); background: var(--superficie); }
.pista-barra span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--amarillo); }
.pista-barra span::after {
  content: ""; position: absolute; right: -9px; top: 50%; width: 18px; height: 18px; margin-top: -9px;
  border-radius: 50%; background: var(--texto); box-shadow: 0 0 0 4px rgba(255, 203, 61, .35);
}
.pista-etiquetas { display: flex; justify-content: space-between; gap: 1rem; font-size: .85rem; color: var(--texto-2); flex-wrap: wrap; }
.pista-etiquetas b { color: var(--amarillo); font-family: var(--f-display); font-weight: 700; font-size: .95rem; }

/* ---------- Ecualizador de dominio (el elemento firma) ---------- */
.eq { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; align-items: end; }
.eq-col { display: grid; gap: .5rem; justify-items: center; text-align: center; min-width: 0; }
.eq-valor { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--c); line-height: 1; }
.eq-barra { display: flex; flex-direction: column-reverse; gap: 3px; width: 100%; max-width: 64px; }
.eq-seg { height: 7px; border-radius: 2px; background: var(--superficie); }
.eq-seg.on { background: var(--c); opacity: .55; }
.eq-seg.on.pico { opacity: 1; box-shadow: 0 0 12px var(--c); }
.eq-nombre { font-weight: 700; font-size: .9rem; white-space: nowrap; }
@media (max-width: 440px) { .eq { gap: .5rem; } .eq-nombre { font-size: .8rem; } }
.eq-det { font-size: .75rem; color: var(--tenue); }
@media (prefers-reduced-motion: no-preference) {
  .eq.vivo .eq-seg.on { animation: encender .5s both; animation-delay: calc(var(--i) * 28ms); }
  @keyframes encender { from { opacity: 0; } }
}

/* ---------- Retos del día: lista tipo tracklist ---------- */
.tracklist { display: grid; gap: .6rem; }
.track {
  display: grid; grid-template-columns: 3.4rem 1fr auto; align-items: center; gap: 1rem;
  padding: .85rem 1rem .85rem .85rem; border-radius: var(--r-m);
  background: var(--superficie); border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%;
}
.track:hover { border-color: var(--acento, var(--rosa)); }
.track .n { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; color: var(--acento, var(--rosa)); text-align: center; line-height: 1; }
.track .n small { display: block; font-family: var(--f-ui); font-size: .7rem; font-weight: 600; color: var(--tenue); margin-top: .2rem; }
.track strong { font-size: 1.05rem; display: block; }
.track .play { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; background: var(--acento, var(--rosa)); color: var(--acento-tinta, #2A0620); font-size: .95rem; }

/* ---------- Mensajes del tutor ---------- */
.mensaje { border-left: 4px solid var(--c, var(--cian)); background: var(--superficie); border-radius: var(--r-s) var(--r-m) var(--r-m) var(--r-s); padding: .9rem 1rem; }
.mensaje.mision { --c: var(--amarillo); }
.mensaje.comentario { --c: var(--violeta); }
.mensaje .de { font-size: .8rem; color: var(--texto-2); font-weight: 600; }
.mensaje h3 { margin: .15rem 0 .35rem; font-family: var(--f-ui); font-size: 1.02rem; font-weight: 700; }
.mensaje p { white-space: pre-line; color: var(--texto-2); }
.mensaje .hecho { color: var(--menta); font-weight: 700; font-size: .9rem; }
.mensaje .cita { margin-top: .6rem; padding: .6rem .8rem; border-radius: var(--r-s); background: var(--noche-2); font-size: .92rem; color: var(--texto-2); }
.nuevo { display: inline-block; font-size: .72rem; font-weight: 800; color: var(--noche); background: var(--rosa); padding: .05rem .45rem; border-radius: var(--r-pill); margin-left: .35rem; }

/* ---------- Sesión de preguntas ---------- */
.sesion-cab { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
.progreso { flex: 1 1 200px; display: flex; gap: 4px; }
.progreso i { flex: 1; height: 8px; border-radius: 3px; background: var(--superficie); }
.progreso i.ok { background: var(--menta); }
.progreso i.mal { background: var(--coral); }
.progreso i.act { background: var(--texto); }
.xp-vivo { font-family: var(--f-display); color: var(--amarillo); font-weight: 700; }

.juego { display: grid; gap: 1.25rem; }
@media (min-width: 960px) {
  .juego { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .juego .lectura { position: sticky; top: 5.2rem; max-height: calc(100vh - 6.5rem); overflow: auto; }
}
.lectura {
  background: var(--papel); color: var(--tinta); border-radius: var(--r-m);
  padding: 1.6rem 1.7rem; box-shadow: var(--sombra);
  font-family: var(--f-lectura); font-size: 1.06rem; line-height: 1.75;
}
.lectura .tipo { font-family: var(--f-ui); font-size: .8rem; font-weight: 700; color: var(--tinta-2); }
.lectura h2 { font-family: var(--f-lectura); font-weight: 600; font-size: 1.35rem; color: var(--tinta); margin: .2rem 0 1rem; letter-spacing: 0; }
.lectura h3 { font-family: var(--f-lectura); font-weight: 600; font-size: 1.08rem; margin: 1.2rem 0 .4rem; letter-spacing: 0; }
.lectura p { margin: 0 0 1em; max-width: 68ch; hyphens: auto; }
.lectura ul { margin: 0 0 1em; padding-left: 1.2em; }
.lectura .fuente { font-family: var(--f-ui); font-size: .78rem; color: var(--tinta-2); margin: 0; }
.lectura::-webkit-scrollbar { width: 8px; } .lectura::-webkit-scrollbar-thumb { background: #d9d0f0; border-radius: 8px; }
.plegar-lectura { display: none; }
@media (max-width: 959px) {
  .lectura.plegada { max-height: 11rem; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .plegar-lectura { display: inline-flex; margin-top: -.4rem; }
}
dialog .lectura { box-shadow: none; padding: 1.2rem; }

.pregunta { display: grid; gap: 1rem; align-content: start; }
.pregunta .meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .85rem; font-weight: 700; }
.etq { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .6rem; border-radius: var(--r-pill); background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); font-weight: 700; font-size: .8rem; }
.dif { color: var(--tenue); font-weight: 600; letter-spacing: .1em; }
.enunciado { font-size: 1.15rem; font-weight: 600; line-height: 1.45; }
.opciones { display: grid; gap: .6rem; }
.opcion {
  display: grid; grid-template-columns: 2.1rem 1fr; gap: .8rem; align-items: start; text-align: left;
  padding: .85rem 1rem; border-radius: var(--r-m); cursor: pointer;
  background: var(--superficie); border: 2px solid transparent; line-height: 1.45;
}
.opcion:hover:not(:disabled) { border-color: var(--borde); }
.opcion .letra { width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .85rem; background: var(--noche-2); }
.opcion.sel { border-color: var(--cian); }
.opcion.sel .letra { background: var(--cian); color: var(--noche); }
.opcion.bien { border-color: var(--menta); background: color-mix(in srgb, var(--menta) 14%, var(--superficie)); }
.opcion.bien .letra { background: var(--menta); color: var(--noche); }
.opcion.malo { border-color: var(--coral); }
.opcion.malo .letra { background: var(--coral); color: var(--noche); }
.opcion:disabled { cursor: default; }
.retro { border-radius: var(--r-m); padding: 1rem 1.1rem; background: var(--noche-2); border: 1px solid var(--borde); }
.retro.bien { border-color: var(--menta); }
.retro.malo { border-color: var(--coral); }
.retro strong { display: block; font-family: var(--f-display); font-size: 1rem; margin-bottom: .35rem; }
.retro.bien strong { color: var(--menta); } .retro.malo strong { color: var(--coral); }
.retro p { color: var(--texto-2); }
.acciones { display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Lógica: problema, figura, pista, solución y diagnóstico del error ---------- */
.juego.solo { grid-template-columns: minmax(0, 1fr); max-width: 46rem; margin: 0 auto; }
.enunciado.md { display: grid; gap: .7rem; }
.enunciado.md p { margin: 0; }
.enunciado.md ul { margin: 0; padding-left: 1.2em; font-weight: 500; display: grid; gap: .25rem; }
.enunciado.md strong { color: var(--amarillo); }
.figura { margin: 0; background: var(--papel); color: var(--tinta); border-radius: var(--r-m); padding: .9rem; display: grid; place-items: center; overflow-x: auto; }
.figura svg { max-width: 100%; height: auto; display: block; }
.lectura .figura { background: none; padding: 0; margin: .4rem 0 1rem; }
.cuadro { border-collapse: collapse; font-family: var(--f-ui); font-size: .92rem; font-weight: 500; min-width: 60%; }
.cuadro th, .cuadro td { border: 1px solid var(--borde); padding: .35rem .7rem; text-align: center; }
.cuadro thead th, .cuadro tbody th { background: var(--superficie); font-weight: 700; }
.lectura .cuadro th, .lectura .cuadro td { border-color: #cfc5ea; }
.lectura .cuadro thead th, .lectura .cuadro tbody th { background: #ece6fb; }
.lectura.situacion { font-family: var(--f-ui); font-size: 1rem; line-height: 1.6; }
.lectura.situacion h2 { font-family: var(--f-ui); font-weight: 700; font-size: 1.15rem; }
.lectura.situacion .scroll-x { margin: 0 0 1em; }
.pista-caja { border-radius: var(--r-m); padding: .8rem 1rem; background: color-mix(in srgb, var(--amarillo) 12%, var(--noche-2)); border: 1px dashed var(--amarillo); }
.pista-caja b { display: block; font-family: var(--f-display); font-size: .85rem; color: var(--amarillo); margin-bottom: .2rem; }
.retro > * + * { margin-top: .8rem; }
.retro strong { margin-bottom: 0; }
.diag-error { border-left: 4px solid var(--coral); background: color-mix(in srgb, var(--coral) 10%, transparent); border-radius: var(--r-s); padding: .7rem .9rem; display: grid; gap: .35rem; }
.diag-error p { color: var(--texto); }
.diag-error .consejo { color: var(--texto-2); font-size: .9rem; }
.etq-error { display: inline-block; font-size: .78rem; font-weight: 800; color: var(--coral); letter-spacing: .01em; }
.solucion summary { cursor: pointer; font-weight: 700; color: var(--texto); }
.pasos { margin: .6rem 0 0; padding-left: 0; list-style: none; counter-reset: paso; display: grid; gap: .55rem; }
.pasos li { counter-increment: paso; display: grid; grid-template-columns: 1.7rem 1fr; gap: .6rem; align-items: start; color: var(--texto-2); }
.pasos li::before { content: counter(paso); width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: .72rem; font-weight: 700; background: var(--superficie-2); color: var(--texto); }
.pasos li p { margin: 0; }
.pasos li p + p { margin-top: .3rem; }
.pasos strong { color: var(--texto); }
.idea { color: var(--texto-2); font-style: italic; }
.tecnica-enlace { display: inline-block; text-align: left; }
.ficha { display: grid; gap: .9rem; }
.ficha h3 { font-family: var(--f-ui); font-size: .95rem; font-weight: 800; margin-bottom: .4rem; }

, "icono": "🎶", "color": "cian", "orden": 30, "regla": {"tipo": "retos", "valor": 10}}, {"codigo": "retos-50", "nombre": "Cincuenta retos", "descripcion": "Terminaste 50 retos diarios.", "icono": "📀", "color": "cian", "orden": 31, "regla": {"tipo": "retos", "valor": 50}}, {"codigo": "ep-perfecto", "nombre": "EP perfecto", "descripcion": "Un reto de 10 preguntas sin un solo error.", "icono": "✨", "color": "menta", "orden": 40, "regla": {"tipo": "reto_perfecto", "valor": 10}}, {"codigo": "album-perfecto", "nombre": "Álbum perfecto", "descripcion": "Un reto de 15 preguntas sin un solo error.", "icono": "💎", "color": "menta", "orden": 41, "regla": {"tipo": "reto_perfecto", "valor": 15}}, {"codigo": "remontada", "nombre": "Remontada", "descripcion": "Un reto con 80 % o más justo después de uno por debajo de 50 %.", "icono": "🚀", "color": "violeta", "orden": 45, "regla": {"tipo": "remontada"}}, {"codigo": "dominio-literal", "nombre": "Ojo de lince", "descripcion": "Dominio de 80 en el nivel literal.", "icono": "👁️", "color": "cian", "orden": 50, "regla": {"tipo": "dominio", "categoria": "literal", "valor": 80}}, {"codigo": "dominio-inferencial", "nombre": "Entre líneas", "descripcion": "Dominio de 80 en el nivel inferencial.", "icono": "🔮", "color": "rosa", "orden": 51, "regla": {"tipo": "dominio", "categoria": "inferencial", "valor": 80}}, {"codigo": "dominio-critico", "nombre": "Voz crítica", "descripcion": "Dominio de 80 en el nivel crítico.", "icono": "⚖️", "color": "amarillo", "orden": 52, "regla": {"tipo": "dominio", "categoria": "critico", "valor": 80}}, {"codigo": "dominio-cohesion", "nombre": "Conectora", "descripcion": "Dominio de 80 en cohesión y conectores.", "icono": "🔗", "color": "menta", "orden": 53, "regla": {"tipo": "dominio", "categoria": "cohesion", "valor": 80}}, {"codigo": "sim-inicial", "nombre": "Primer simulacro", "descripcion": "Terminaste un simulacro inicial.", "icono": "🎟️", "color": "violeta", "orden": 60, "regla": {"tipo": "simulacro", "nivel": "inicial", "valor": 0}}, {"codigo": "sim-avanzado-70", "nombre": "Avanzado al 70", "descripcion": "70 % o más en un simulacro avanzado.", "icono": "🎚️", "color": "violeta", "orden": 61, "regla": {"tipo": "simulacro", "nivel": "avanzado", "valor": 70}}, {"codigo": "sim-experto-85", "nombre": "Nivel Medicina", "descripcion": "85 % o más en un simulacro experto.", "icono": "🩺", "color": "violeta", "orden": 62, "regla": {"tipo": "simulacro", "nivel": "experto", "valor": 85}}, {"codigo": "horas-10", "nombre": "Diez horas", "descripcion": "Diez horas de estudio acumuladas.", "icono": "⏱️", "color": "cian", "orden": 70, "regla": {"tipo": "minutos", "valor": 600}}, {"codigo": "horas-50", "nombre": "Cincuenta horas", "descripcion": "Cincuenta horas de estudio acumuladas.", "icono": "⌛", "color": "cian", "orden": 71, "regla": {"tipo": "minutos", "valor": 3000}}, {"codigo": "mision-1", "nombre": "Misión cumplida", "descripcion": "Completaste una misión de tu tutor.", "icono": "📨", "color": "rosa", "orden": 80, "regla": {"tipo": "misiones", "valor": 1}}, {"codigo": "mision-5", "nombre": "Equipo", "descripcion": "Completaste cinco misiones de tu tutor.", "icono": "🤝", "color": "rosa", "orden": 81, "regla": {"tipo": "misiones", "valor": 5}}], "novedad": {"version": "1.0", "titulo": "Bienvenida", "cuerpo": "Esta es tu sala de práctica para la prueba de Competencia Lectora de la UdeA. Cada día puedes elegir un reto de 5, 10 o 15 preguntas; cuando quieras medirte en serio, entra a Simulacro. Tu tutor ve tu avance y te dejará mensajes y misiones por aquí."}}, "paquetes": [{"paquete": "paquete-001", "textos": [{"codigo": "P001-T01", "titulo": "La atención como territorio", "tipologia": "ensayo", "fuente": "Texto original para práctica.", "contenido": "Durante siglos, la escasez que ordenó la vida intelectual fue la de la información: los libros eran caros, las bibliotecas quedaban lejos y el saber circulaba con lentitud. Hoy la situación se ha invertido. La información sobra; lo que escasea es la atención capaz de detenerse en ella. Por eso no resulta exagerado afirmar que la atención se ha convertido en un territorio en disputa, y que numerosas empresas diseñan sus productos con el propósito explícito de ocuparlo el mayor tiempo posible.\n\nSin embargo, sería ingenuo culpar solamente a las pantallas. La dispersión no es una invención digital: Séneca ya se quejaba de quienes saltaban de un libro a otro sin detenerse en ninguno, y comparaba esa costumbre con la del viajero que, por conocer muchas posadas, no tiene ningún amigo. Lo nuevo no es la tentación de distraerse, sino su escala y su método: nunca antes la interrupción había sido calculada con tanta precisión.\n\nDe ahí que la lectura sostenida adquiera un valor casi político. Quien lee un texto largo de principio a fin no solo obtiene datos; ejercita la capacidad de seguir un argumento, de tolerar la ambigüedad y de posponer el juicio hasta haber escuchado todas las razones. Esa capacidad, que no se hereda sino que se entrena, es precisamente la que una conversación pública apresurada más necesita y la que menos cultiva.\n\nConviene, pues, pensar la lectura no como un refugio nostálgico frente al presente, sino como una forma de resistencia activa. No se trata de abandonar las pantallas, lo cual sería tan improbable como inútil, sino de recuperar el derecho a decidir dónde ponemos los ojos.", "preguntas": [{"codigo": "P001-T01-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según el texto, lo que escasea en la actualidad es:", "opciones": ["El acceso a las bibliotecas y a los libros.", "La información disponible sobre casi cualquier tema.", "La tecnología para organizar el saber.", "La atención capaz de detenerse en la información."], "correcta": 3, "explicacion": "El primer párrafo lo dice de forma explícita: «La información sobra; lo que escasea es la atención». La opción sobre la información invierte lo que dice el texto."}, {"codigo": "P001-T01-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "La comparación de Séneca con el viajero que conoce muchas posadas pero no tiene ningún amigo sugiere que:", "opciones": ["Viajar mucho impide dedicarse a la lectura.", "Leer de manera dispersa permite tocar muchos textos sin establecer una relación profunda con ninguno.", "En la Antigüedad la gente leía más que hoy.", "Los libros son más valiosos que las amistades."], "correcta": 1, "explicacion": "Las posadas son los libros y el amigo es el vínculo profundo: saltar de uno a otro da cantidad sin profundidad. Las demás opciones toman la imagen al pie de la letra o sacan conclusiones que el texto no plantea."}, {"codigo": "P001-T01-03", "categoria": "cohesion", "dificultad": 2, "enunciado": "En la frase «Sin embargo, sería ingenuo culpar solamente a las pantallas», el conector introduce:", "opciones": ["Una matización que limita el alcance de lo dicho en el párrafo anterior.", "Un ejemplo que confirma la tesis inicial.", "La conclusión general del texto.", "Una consecuencia de lo dicho en el primer párrafo."], "correcta": 0, "explicacion": "«Sin embargo» es adversativo: no niega lo anterior, lo corrige en parte. El autor acaba de hablar de empresas que capturan la atención y ahora aclara que la culpa no es solo de las pantallas."}, {"codigo": "P001-T01-04", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de los siguientes hallazgos debilitaría más el argumento del autor sobre lo que la distracción actual tiene de nuevo?", "opciones": ["Una encuesta según la cual muchos jóvenes leen textos largos en formato digital.", "Un informe en el que las empresas tecnológicas describen sus métodos de diseño.", "Un estudio que muestre que en el siglo XIX ya existían técnicas publicitarias diseñadas para interrumpir la lectura con una precisión comparable a la de las aplicaciones actuales.", "Un documento que confirme que Séneca escribió sobre la lectura dispersa en el siglo I."], "correcta": 2, "explicacion": "El autor afirma que lo nuevo es «la escala y el método»: una interrupción calculada con precisión inédita. Si esa precisión ya existía antes, se cae justamente lo que él presenta como novedad. La opción sobre Séneca, en cambio, refuerza el texto."}, {"codigo": "P001-T01-05", "categoria": "inferencial", "dificultad": 2, "enunciado": "Cuando el autor dice que la lectura sostenida adquiere «un valor casi político», quiere decir que:", "opciones": ["Entrena capacidades que la deliberación pública necesita, como seguir argumentos y posponer el juicio.", "La lectura sirve para formar partidos y movimientos.", "Los políticos deberían leer más textos largos.", "Leer debería ser una obligación establecida por el Estado."], "correcta": 0, "explicacion": "El mismo párrafo explica el sentido: leer de principio a fin ejercita capacidades que «una conversación pública apresurada» necesita. «Político» se usa en el sentido amplio de vida en común, no de partidos o gobiernos."}, {"codigo": "P001-T01-06", "categoria": "critico", "dificultad": 2, "enunciado": "En el último párrafo el autor aclara que «no se trata de abandonar las pantallas». Con esta aclaración busca principalmente:", "opciones": ["Invitar al lector a usar más las pantallas.", "Contradecir lo que afirmó sobre Séneca.", "Anticiparse a la objeción de que su propuesta es un rechazo nostálgico de la tecnología.", "Reconocer que su tesis central es falsa."], "correcta": 2, "explicacion": "Es una estrategia argumentativa: el autor prevé que alguien lo acuse de nostálgico o tecnófobo y lo desactiva antes. No abandona su tesis; la precisa."}]}, {"codigo": "P001-T02", "titulo": "Lo que el cerebro hace mientras dormimos", "tipologia": "divulgacion", "fuente": "Texto original de divulgación para práctica.", "contenido": "Durante mucho tiempo se pensó que el sueño era un simple estado de reposo, una especie de pausa en la que el cerebro se apagaba para recuperar energía. Las investigaciones de las últimas décadas han desmentido esa imagen. Mientras dormimos, el cerebro trabaja de otra manera: selecciona, ordena y fortalece parte de lo que aprendimos durante el día.\n\nEl proceso ocurre, sobre todo, en dos momentos. En el sueño profundo, llamado también de ondas lentas, el hipocampo —una estructura que funciona como almacén temporal de recuerdos recientes— «reproduce» la actividad registrada durante la vigilia y la transfiere a la corteza, donde los recuerdos pueden conservarse a largo plazo. Más tarde, en la fase de movimientos oculares rápidos (MOR), el cerebro parece establecer conexiones entre informaciones que antes estaban aisladas, lo cual explicaría por qué a veces despertamos con la solución de un problema que la noche anterior parecía imposible.\n\nEstos hallazgos tienen consecuencias prácticas. En un experimento, un grupo de estudiantes que durmió ocho horas después de estudiar recordó significativamente más que otro que estudió el mismo tiempo pero durmió cuatro. En otras palabras, trasnochar para repasar puede ser una estrategia contraproducente: se gana tiempo de estudio, pero se pierde el tiempo en que lo estudiado se consolida.\n\nCon todo, el sueño no hace milagros. No fija aquello que nunca se comprendió ni sustituye la práctica. Su función es la de un editor cuidadoso, no la de un autor: trabaja sobre el material que le entregamos.", "preguntas": [{"codigo": "P001-T02-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según el texto, el hipocampo:", "opciones": ["Conserva los recuerdos a largo plazo.", "Reemplaza a la corteza durante el sueño.", "Produce los movimientos oculares rápidos.", "Funciona como almacén temporal de los recuerdos recientes."], "correcta": 3, "explicacion": "El texto lo define entre rayas: «una estructura que funciona como almacén temporal de recuerdos recientes». Quien conserva a largo plazo es la corteza."}, {"codigo": "P001-T02-02", "categoria": "literal", "dificultad": 2, "enunciado": "¿En qué orden presenta el texto los procesos que ocurren durante el sueño?", "opciones": ["Primero el reposo del cerebro; después, la fase de movimientos oculares rápidos.", "Primero la transferencia de recuerdos del hipocampo a la corteza; después, la conexión entre informaciones aisladas.", "Ambos procesos ocurren al mismo tiempo durante el sueño profundo.", "Primero la conexión entre informaciones aisladas; después, la transferencia a la corteza."], "correcta": 1, "explicacion": "El segundo párrafo marca la secuencia con «En el sueño profundo…» y luego «Más tarde, en la fase MOR…». La idea del cerebro en reposo es justamente la que el texto desmiente."}, {"codigo": "P001-T02-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "A partir del texto, se puede concluir que un estudiante que trasnocha repasando antes de un examen:", "opciones": ["Recordará más, porque estudió más horas.", "Podría recordar menos, porque reduce el tiempo en que se consolida lo aprendido.", "Solo necesita la fase MOR para compensar las horas perdidas.", "No recordará nada de lo que estudió."], "correcta": 1, "explicacion": "El tercer párrafo lo sugiere: se gana tiempo de estudio pero se pierde consolidación. «No recordará nada» es una exageración que el texto no sostiene."}, {"codigo": "P001-T02-04", "categoria": "inferencial", "dificultad": 2, "enunciado": "La expresión «su función es la de un editor cuidadoso, no la de un autor» significa que el sueño:", "opciones": ["Escribe de nuevo los recuerdos que olvidamos.", "Crea conocimientos nuevos a partir de la nada.", "Organiza y fortalece lo aprendido, pero no produce el aprendizaje original.", "Corrige los errores que cometemos al escribir."], "correcta": 2, "explicacion": "Es una metáfora: el editor trabaja sobre un texto que ya existe; el autor lo crea. El sueño mejora lo que estudiamos, pero no reemplaza el estudio. La frase siguiente lo confirma: «trabaja sobre el material que le entregamos»."}, {"codigo": "P001-T02-05", "categoria": "cohesion", "dificultad": 2, "enunciado": "En «Con todo, el sueño no hace milagros», la expresión «con todo» podría reemplazarse, sin cambiar el sentido, por:", "opciones": ["Por lo tanto,", "Además,", "Es decir,", "No obstante,"], "correcta": 3, "explicacion": "«Con todo» tiene valor adversativo-concesivo: después de enumerar beneficios, pone un límite. «Por lo tanto» sería consecutivo, «además» aditivo y «es decir» explicativo."}, {"codigo": "P001-T02-06", "categoria": "critico", "dificultad": 3, "enunciado": "¿Qué información adicional haría más sólida la conclusión que el texto extrae del experimento con los dos grupos de estudiantes?", "opciones": ["Que los dos grupos tenían edades y conocimientos previos semejantes.", "Que el experimento se hizo en una universidad reconocida.", "Que los investigadores también estudian el sueño en animales.", "Que los estudiantes preferían dormir ocho horas."], "correcta": 0, "explicacion": "Para atribuir la diferencia al sueño hay que descartar otras explicaciones: si un grupo ya sabía más, el resultado no probaría nada. El prestigio de la universidad no fortalece la lógica del argumento."}]}, {"codigo": "P001-T03", "titulo": "El afinador", "tipologia": "literario", "fuente": "Relato original para práctica.", "contenido": "Don Aurelio llegaba al pueblo cada seis meses, siempre en el bus de las siete, con un maletín de cuero que nadie le había visto abrir fuera de una sala. Afinaba el único piano de la escuela, el de la parroquia y, cuando la viuda Restrepo se lo permitía, el vertical que dormía en su comedor bajo una manta de encaje.\n\nA mí me dejaban mirarlo. Él golpeaba una tecla, escuchaba con los ojos cerrados y giraba una clavija apenas lo que tarda un suspiro. «El piano no se desafina de un día para otro», me explicó una vez. «Se va yendo despacito, como la gente. Por eso nadie se da cuenta hasta que suena feo».\n\nAquel año el piano de la viuda tenía tres teclas mudas. Don Aurelio las revisó una por una, sacó del fondo del instrumento un sobre amarillento y se lo entregó a ella sin leerlo. La viuda lo guardó en el delantal y, por primera vez en años, se sentó a tocar. Tocó mal, con los dedos rígidos, pero nadie en el comedor se atrevió a decírselo.\n\n—Ya quedó —dijo don Aurelio, aunque no había girado ni una sola clavija.\n\nEsa tarde entendí que su oficio no consistía en arreglar pianos, o no solamente. Y comprendí también por qué, cuando el bus de las siete dejó de traerlo, el pueblo entero empezó a sonar un poco peor.", "preguntas": [{"codigo": "P001-T03-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según el narrador, ¿qué sacó don Aurelio del fondo del piano de la viuda?", "opciones": ["Una clavija rota.", "Una manta de encaje.", "Tres teclas nuevas.", "Un sobre amarillento."], "correcta": 3, "explicacion": "Está dicho de forma explícita en el tercer párrafo. La manta de encaje cubría el piano; no estaba adentro."}, {"codigo": "P001-T03-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "La frase «se va yendo despacito, como la gente» establece una comparación que sugiere que:", "opciones": ["Las personas también se deterioran o cambian de forma gradual, sin que se note enseguida.", "Los pianos son más frágiles que las personas.", "Don Aurelio prefería los pianos a las personas.", "La gente del pueblo no sabía tocar el piano."], "correcta": 0, "explicacion": "La comparación traslada al ser humano lo que se dice del piano: el desgaste lento que nadie percibe «hasta que suena feo». Esta idea prepara el final del relato."}, {"codigo": "P001-T03-03", "categoria": "inferencial", "dificultad": 3, "enunciado": "Cuando don Aurelio dice «Ya quedó» sin haber girado ninguna clavija, se puede inferir que:", "opciones": ["Quería engañar a la viuda para cobrarle el trabajo.", "El piano no tenía ningún problema desde el principio.", "Consideraba que lo que necesitaba arreglo no era el instrumento, sino algo en la vida de la viuda.", "Se equivocó y dejó el piano desafinado."], "correcta": 2, "explicacion": "Las teclas mudas se explican por el sobre, y lo que cambia después es la viuda: vuelve a tocar «por primera vez en años». El narrador lo confirma: el oficio de don Aurelio «no consistía en arreglar pianos, o no solamente»."}, {"codigo": "P001-T03-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "La última frase, «el pueblo entero empezó a sonar un poco peor», debe entenderse en sentido:", "opciones": ["Técnico: el bus de las siete hacía más ruido al llegar.", "Doble: alude a los pianos sin afinar y, a la vez, a una pérdida de armonía en la vida del pueblo.", "Solo literal: los pianos se desafinaron por falta de mantenimiento.", "Irónico: el pueblo mejoró cuando don Aurelio dejó de ir."], "correcta": 1, "explicacion": "El relato ya advirtió que el oficio no era «solamente» arreglar pianos. Por eso la frase funciona en dos planos: el sonido de los instrumentos y el de la vida comunitaria. Quedarse solo con el sentido literal pierde la mitad."}, {"codigo": "P001-T03-05", "categoria": "cohesion", "dificultad": 2, "enunciado": "En la frase «se lo entregó a ella sin leerlo», los pronombres «lo» de «se lo entregó» y de «leerlo» se refieren, respectivamente, a:", "opciones": ["El piano y el sobre.", "La viuda y la carta.", "El maletín y el sobre.", "El sobre y el sobre."], "correcta": 3, "explicacion": "Ambos «lo» son pronombres anafóricos que retoman «un sobre amarillento». «Ella» es quien se refiere a la viuda; por eso la última opción confunde los referentes."}, {"codigo": "P001-T03-06", "categoria": "critico", "dificultad": 2, "enunciado": "¿Qué rasgo del narrador es clave para el efecto del relato?", "opciones": ["Es el propio don Aurelio contando su oficio.", "Es la viuda Restrepo recordando a su esposo.", "Es alguien que recuerda un episodio de su infancia y lo comprende tiempo después.", "Es un narrador omnisciente que conoce lo que dice el sobre."], "correcta": 2, "explicacion": "El narrador era un niño al que «dejaban mirar», y la comprensión llega después («Esa tarde entendí…»). Como no sabe qué dice el sobre, el lector tampoco lo sabe, y eso sostiene el misterio."}]}, {"codigo": "P001-T04", "titulo": "El celular en el aula: dos posturas", "tipologia": "intertextual", "fuente": "Textos originales para práctica.", "contenido": "### Texto A\n\nProhibir el celular en el aula no es un gesto autoritario, sino una medida de cuidado. Diversos estudios han mostrado que la simple presencia del teléfono sobre el pupitre, incluso apagado, reduce el rendimiento en tareas que exigen concentración. Si aceptamos que la escuela tiene la misión de proteger las condiciones del aprendizaje, debemos aceptar también que algunas herramientas, por útiles que sean fuera de ella, deben quedarse en la puerta. Nadie diría que prohibir la pelota durante la clase de química es un ataque contra el deporte.\n\n### Texto B\n\nProhibir el celular equivale a renunciar a educar sobre él. Los estudiantes pasarán la mayor parte de su vida adulta rodeados de pantallas, y la escuela es quizá el único lugar donde alguien puede enseñarles a usarlas con criterio: a contrastar fuentes, a reconocer la manipulación y a decidir cuándo apagar. Una prohibición total traslada el problema fuera del aula, donde nadie acompaña. Lo que necesitamos no es un muro, sino un pacto: reglas claras sobre cuándo el teléfono se usa como herramienta y cuándo se guarda.", "preguntas": [{"codigo": "P001-T04-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según el texto A, la presencia del teléfono sobre el pupitre:", "opciones": ["Reduce el rendimiento en tareas de concentración, incluso si está apagado.", "Mejora la concentración si se usa como herramienta.", "Solo afecta a los estudiantes cuando está encendido.", "No tiene efectos comprobados en el aprendizaje."], "correcta": 0, "explicacion": "El texto A lo dice de forma explícita, e insiste en el detalle «incluso apagado»."}, {"codigo": "P001-T04-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "La comparación con la pelota en la clase de química, en el texto A, busca mostrar que:", "opciones": ["El deporte y la química son igual de importantes.", "Restringir un objeto en un contexto no implica rechazarlo en general.", "Los estudiantes prefieren el deporte a las ciencias.", "La escuela también debería prohibir las pelotas."], "correcta": 1, "explicacion": "Es una analogía: así como nadie ve en esa prohibición un ataque al deporte, prohibir el celular en clase no sería un ataque a la tecnología."}, {"codigo": "P001-T04-03", "categoria": "critico", "dificultad": 2, "enunciado": "¿En qué coinciden los dos textos?", "opciones": ["En que el teléfono no afecta la concentración.", "En que el teléfono debe prohibirse por completo.", "En que el uso del teléfono en el aula requiere algún tipo de regulación.", "En que los estudiantes deben decidir libremente cuándo usarlo."], "correcta": 2, "explicacion": "A propone prohibirlo; B propone «reglas claras sobre cuándo se usa y cuándo se guarda». Difieren en el tipo de regulación, pero ninguno defiende el uso libre."}, {"codigo": "P001-T04-04", "categoria": "critico", "dificultad": 3, "enunciado": "Desde la perspectiva del texto B, la principal debilidad de la propuesta del texto A es que:", "opciones": ["Protege la concentración en clase, pero no prepara a los estudiantes para usar el teléfono con criterio.", "Se basa en estudios que son falsos.", "Permite el uso del teléfono en algunas clases.", "Exige demasiado trabajo a los docentes."], "correcta": 0, "explicacion": "B sostiene que prohibir «traslada el problema fuera del aula, donde nadie acompaña». No discute los estudios de A; discute que la prohibición deja sin educar el uso."}, {"codigo": "P001-T04-05", "categoria": "cohesion", "dificultad": 3, "enunciado": "En el texto A, la expresión «por útiles que sean fuera de ella» tiene un valor:", "opciones": ["Consecutivo: equivale a «de modo que son útiles fuera de ella».", "Concesivo: equivale a «aunque sean útiles fuera de ella».", "Condicional: equivale a «si son útiles fuera de ella».", "Causal: equivale a «porque son útiles fuera de ella»."], "correcta": 1, "explicacion": "La construcción «por + adjetivo + que» es concesiva: admite una objeción (son útiles) sin que cambie la conclusión (deben quedarse en la puerta). Además, «ella» remite a la escuela."}, {"codigo": "P001-T04-06", "categoria": "inferencial", "dificultad": 2, "enunciado": "En el texto B, la oposición entre «un muro» y «un pacto» representa:", "opciones": ["La tecnología del pasado frente a la del futuro.", "La postura de los estudiantes frente a la de los padres.", "Una construcción física frente a un documento legal.", "Una prohibición impuesta frente a un acuerdo con reglas compartidas."], "correcta": 3, "explicacion": "Son metáforas: el muro separa y se impone; el pacto se construye entre partes. Leerlas de forma literal es el error que proponen dos de los distractores."}]}, {"codigo": "P001-T05", "titulo": "¿Cómo leen los jóvenes?", "tipologia": "discontinuo", "fuente": "Infografía con datos ficticios, elaborada para práctica.", "contenido": "### Infografía: hábitos de lectura de jóvenes de 14 a 18 años\nEncuesta a 1.200 estudiantes de una ciudad colombiana. Datos ficticios, elaborados para práctica.\n\n**Leen por gusto al menos un libro al año:** 58 %\n**Leen por gusto al menos un libro al mes:** 17 %\n\n**Formato preferido para leer por gusto**\n- Pantalla del celular: 46 %\n- Libro impreso: 38 %\n- Tableta o computador: 11 %\n- Audiolibro: 5 %\n\n**Tiempo diario de lectura (cualquier texto, incluidas redes sociales)**\n- Menos de 30 minutos: 22 %\n- Entre 30 minutos y 2 horas: 49 %\n- Más de 2 horas: 29 %\n\n**Principal razón para no leer más libros**\n- «No tengo tiempo»: 41 %\n- «Me aburro rápido»: 27 %\n- «No sé qué leer»: 19 %\n- «Los libros son caros»: 13 %\n\n*Nota: el 71 % de quienes leen al menos un libro al mes dijo que un familiar o un docente le recomienda libros con frecuencia.*", "preguntas": [{"codigo": "P001-T05-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según la infografía, el formato preferido por más jóvenes para leer por gusto es:", "opciones": ["La tableta o el computador.", "La pantalla del celular.", "El audiolibro.", "El libro impreso."], "correcta": 1, "explicacion": "Pantalla del celular: 46 %, el porcentaje más alto de ese bloque."}, {"codigo": "P001-T05-02", "categoria": "literal", "dificultad": 2, "enunciado": "De los 1.200 estudiantes encuestados, ¿aproximadamente cuántos leen por gusto al menos un libro al mes?", "opciones": ["696", "580", "204", "170"], "correcta": 2, "explicacion": "El 17 % de 1.200 es 204. La cifra 696 corresponde al 58 % (un libro al año): confundir las dos filas es el error más común."}, {"codigo": "P001-T05-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "¿Cuál de las siguientes afirmaciones se deduce correctamente de la infografía?", "opciones": ["Más de la mitad de los encuestados prefiere leer por gusto en algún formato digital.", "La mayoría de los encuestados lee más de dos horas diarias.", "La mitad de los encuestados lee un libro al mes.", "El precio de los libros es la principal razón para no leer más."], "correcta": 0, "explicacion": "Celular (46 %) más tableta o computador (11 %) suman 57 %, más de la mitad. Las demás afirmaciones contradicen los datos."}, {"codigo": "P001-T05-04", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de las siguientes conclusiones NO puede sostenerse con los datos de la infografía?", "opciones": ["Menos de uno de cada cinco encuestados lee un libro al mes.", "La falta de tiempo es la razón más mencionada para no leer más libros.", "Parte del tiempo diario de lectura corresponde a redes sociales.", "Las recomendaciones de familiares y docentes hacen que los jóvenes lean más."], "correcta": 3, "explicacion": "La nota muestra que dos cosas aparecen juntas, no que una cause la otra: quizá quienes ya leen mucho buscan más recomendaciones. Confundir correlación con causa es un error crítico frecuente."}, {"codigo": "P001-T05-05", "categoria": "critico", "dificultad": 3, "enunciado": "Un periódico tituló una nota sobre esta encuesta: «Los jóvenes ya no leen». Según la infografía, ese titular es:", "opciones": ["Correcto, porque el 41 % dice no tener tiempo.", "Inexacto, porque la mayoría lee al menos un libro al año y casi todos leen algún texto a diario.", "Correcto, porque solo el 17 % lee un libro al mes.", "Inexacto, porque todos los encuestados leen más de dos horas diarias."], "correcta": 1, "explicacion": "El titular generaliza a partir de un solo dato. El 58 % lee al menos un libro al año y el 78 % lee más de 30 minutos diarios. La última opción también dice «inexacto», pero con una razón falsa."}, {"codigo": "P001-T05-06", "categoria": "cohesion", "dificultad": 2, "enunciado": "En la nota final, la expresión «de quienes leen al menos un libro al mes» indica que el 71 % se calcula sobre:", "opciones": ["El total de los 1.200 encuestados.", "Quienes prefieren el libro impreso.", "Quienes leen más de dos horas diarias.", "Solo el grupo que lee al menos un libro al mes."], "correcta": 3, "explicacion": "La expresión delimita el grupo de referencia: el 71 % es de ese 17 %, no del total. Leer mal a qué remite una expresión cambia por completo el dato."}]}]}, {"paquete": "paquete-002", "textos": [{"codigo": "P002-T01", "titulo": "La canción que no se va", "tipologia": "divulgacion", "fuente": "Texto original de divulgación para práctica.", "contenido": "A casi todo el mundo le ha pasado: una canción suena en una tienda, uno sigue su camino y, horas después, el estribillo continúa dando vueltas en la cabeza sin que nadie lo haya invitado. Los investigadores llaman a este fenómeno «imaginería musical involuntaria»; en la calle se le conoce como canción pegajosa o, con una expresión tomada del alemán, «gusano de oído».\n\nNo todas las canciones se pegan por igual. Las que más lo logran suelen compartir tres rasgos: un ritmo rápido, una melodía sencilla que se repite y algún giro inesperado —un salto, una pausa— que las distingue de las demás. Son sencillas, pero no tanto como para pasar inadvertidas.\n\nTambién importa el momento. Estos fragmentos aparecen sobre todo cuando la mente tiene poco que hacer: al caminar, al lavar los platos, al esperar el bus. Por eso rara vez nos asaltan en mitad de un examen o de una conversación difícil. Una mente ocupada no les deja espacio.\n\n¿Cómo librarse de ellos? Aunque parezca contradictorio, una de las recomendaciones más repetidas es escuchar la canción completa. Según esta idea, el cerebro insiste porque solo conserva un pedazo, como quien deja una tarea a medias; al oír el final, da el asunto por cerrado. Otra salida es ocuparse en algo que exija una atención moderada, como resolver un crucigrama. Si la tarea es demasiado fácil, la canción vuelve; si es demasiado difícil, la mente se cansa, se distrae, y la canción vuelve también.", "preguntas": [{"codigo": "P002-T01-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según el texto, las canciones pegajosas aparecen sobre todo cuando:", "opciones": ["Sostenemos una conversación difícil.", "Acabamos de oír la canción hasta el final.", "Estamos presentando un examen.", "La mente tiene poco que hacer."], "correcta": 3, "explicacion": "El tercer párrafo lo dice sin rodeos: aparecen «cuando la mente tiene poco que hacer», y da como ejemplos caminar o lavar los platos. El examen y la conversación difícil son justo los momentos en que, según el texto, rara vez nos asaltan."}, {"codigo": "P002-T01-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "Por lo que explica el tercer párrafo, ¿en cuál de estas situaciones es más probable que aparezca una canción pegajosa?", "opciones": ["Mientras alguien resuelve una prueba de matemáticas.", "Mientras alguien dobla la ropa recién lavada.", "Mientras alguien discute un asunto delicado con su jefe.", "Mientras alguien aprende a conducir en una avenida llena."], "correcta": 1, "explicacion": "El texto no menciona la ropa, pero da la regla: estos fragmentos llegan cuando la mente está desocupada. Doblar ropa se parece a lavar los platos; las otras tres situaciones exigen toda la atención. Llevar una idea del texto a un caso nuevo es una inferencia frecuente en el examen."}, {"codigo": "P002-T01-03", "categoria": "inferencial", "dificultad": 1, "enunciado": "La expresión «sin que nadie lo haya invitado», en el primer párrafo, da a entender que el estribillo:", "opciones": ["Regresa sin que la persona lo decida.", "Solo se escucha dentro de las tiendas.", "Pertenece a una canción que a nadie le gusta.", "Suena en reuniones a las que uno no asistió."], "correcta": 0, "explicacion": "El autor trata al estribillo como a un visitante que llega sin permiso: es una manera figurada de decir que el fenómeno es involuntario, como confirma el nombre técnico que viene enseguida. Las otras opciones leen la invitación al pie de la letra o añaden datos que el texto no da."}, {"codigo": "P002-T01-04", "categoria": "critico", "dificultad": 1, "enunciado": "Por el lenguaje que usa y la forma como explica el tema, el texto parece escrito para:", "opciones": ["Compositores que buscan escribir éxitos.", "Neurólogos que investigan la memoria musical.", "Lectores curiosos, no especialistas.", "Niños que apenas aprenden a leer."], "correcta": 2, "explicacion": "El texto parte de una experiencia común, traduce el término técnico al habla de la calle y pone ejemplos de la vida diaria: así se escribe la divulgación para un público general. Un texto para especialistas no explicaría lo básico, y uno para niños pequeños no hablaría de «imaginería musical involuntaria»."}, {"codigo": "P002-T01-05", "categoria": "cohesion", "dificultad": 1, "enunciado": "En el tercer párrafo, la expresión «Por eso» indica que la oración que sigue es:", "opciones": ["Una objeción a lo dicho antes.", "Un ejemplo sin relación con lo dicho antes.", "Una consecuencia de lo dicho antes.", "Una condición para lo dicho antes."], "correcta": 2, "explicacion": "«Por eso» es un conector de consecuencia: como estos fragmentos necesitan una mente desocupada, casi nunca aparecen durante un examen. Una objeción llevaría «pero» o «sin embargo»; una condición, «si» o «siempre que»."}, {"codigo": "P002-T01-06", "categoria": "inferencial", "dificultad": 2, "enunciado": "La comparación «como quien deja una tarea a medias», en el último párrafo, sirve para explicar que:", "opciones": ["Oír música mientras se estudia impide acabar los deberes.", "El cerebro borra de la memoria toda canción que oye completa.", "Las personas desordenadas padecen más este fenómeno.", "El cerebro vuelve al fragmento porque lo siente como algo inconcluso."], "correcta": 3, "explicacion": "La comparación explica la insistencia: el cerebro guarda solo un pedazo y vuelve sobre él como sobre un pendiente; por eso oír el final cierra el asunto. La opción sobre borrar la canción exagera: el texto dice que el cerebro deja de insistir, no que olvide."}]}, {"codigo": "P002-T02", "titulo": "Convocatoria: Salón de Arte Joven", "tipologia": "discontinuo", "fuente": "Convocatoria ficticia, elaborada para práctica.", "contenido": "### 9.º Salón de Arte Joven\nCasa de la Cultura La Estación\n\n**¿Quiénes pueden participar?**\n- Personas de 15 a 22 años cumplidos al cierre de la convocatoria.\n- Que vivan en el municipio desde hace por lo menos un año.\n- No pueden participar los ganadores de la edición anterior ni los familiares del jurado.\n\n**Categorías**\n- Dibujo y pintura\n- Fotografía\n- Escultura y objeto\n- Video (duración máxima: 5 minutos)\n\nCada participante puede inscribirse en una sola categoría, con una o dos obras. Las obras deben haberse realizado en los últimos dos años y no pueden haber sido premiadas en otro concurso.\n\n**Fechas**\n- Inscripción en línea: del 1 al 20 de marzo\n- Entrega de las obras: 3 y 4 de abril, de 9:00 a. m. a 4:00 p. m.\n- Publicación de las obras seleccionadas: 15 de abril\n- Exposición: del 2 al 30 de mayo\n- Premiación: 30 de mayo, 6:00 p. m.\n\n**Premios**\n- Un primer premio por categoría: 2.000.000 de pesos y una exposición individual el año siguiente.\n- Una mención de honor por categoría: 500.000 pesos.\n- Premio del público, uno solo para todo el Salón: 800.000 pesos. Lo eligen con su voto quienes visiten la exposición.\n\n**Importante**\n- La inscripción no tiene costo.\n- El jurado seleccionará un máximo de 40 obras para la exposición. Inscribirse no garantiza ser seleccionado.\n- Las obras no reclamadas antes del 15 de junio pasarán a ser propiedad de la Casa de la Cultura.", "preguntas": [{"codigo": "P002-T02-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según la convocatoria, ¿cuál de las siguientes afirmaciones NO es correcta?", "opciones": ["La exposición permanece abierta casi un mes.", "El premio del público se entrega en cada categoría.", "La inscripción se hace en línea y no tiene ningún costo.", "Un video no puede durar más de cinco minutos."], "correcta": 1, "explicacion": "El premio del público es «uno solo para todo el Salón»; los que se entregan por categoría son el primer premio y la mención de honor. Las otras tres afirmaciones están en el texto. En las preguntas con «NO» conviene verificar una por una y marcar la que falla."}, {"codigo": "P002-T02-02", "categoria": "literal", "dificultad": 3, "enunciado": "¿Cuál de las siguientes personas cumple todas las condiciones para participar?", "opciones": ["Una joven de 22 años que vive en el municipio hace tres y presenta dos fotografías.", "Un joven de 20 años, residente hace cinco, que ganó el premio de escultura el año pasado.", "Una joven de 19 años, nacida en el municipio, que presenta una pintura y un video.", "Un joven de 17 años que llegó al municipio hace ocho meses y presenta un dibujo."], "correcta": 0, "explicacion": "Hay que cruzar cuatro reglas: edad, tiempo de residencia, una sola categoría y no haber ganado la edición anterior. La joven de 22 las cumple todas, porque el límite incluye los 22 y se admiten dos obras de una misma categoría. A cada una de las demás personas la descarta un solo detalle: ocho meses de residencia, dos categorías, el premio del año pasado."}, {"codigo": "P002-T02-03", "categoria": "inferencial", "dificultad": 1, "enunciado": "De la advertencia «Inscribirse no garantiza ser seleccionado» se deduce que:", "opciones": ["Quien no sea seleccionado tendrá que pagar la inscripción.", "El jurado rechazará la mayor parte de las obras inscritas.", "Algunas obras inscritas pueden quedar por fuera de la exposición.", "Solo se elegirá una obra por cada participante."], "correcta": 2, "explicacion": "Si inscribirse no asegura un lugar y el cupo es de 40 obras, puede haber obras inscritas que no se exhiban. Decir que serán «la mayor parte» va más allá de lo que el texto permite: no sabemos cuántas se inscribirán."}, {"codigo": "P002-T02-04", "categoria": "inferencial", "dificultad": 1, "enunciado": "La convocatoria excluye a los familiares del jurado. La razón más probable de esa regla es:", "opciones": ["Reducir el número de obras inscritas.", "Evitar que la decisión del jurado parezca parcial.", "Castigar a quienes ganaron la edición anterior.", "Impedir que participen personas de otros municipios."], "correcta": 1, "explicacion": "El texto no explica la regla, pero su sentido se infiere: un jurado que premia a un pariente pone en duda todo el concurso. Las otras opciones mezclan esta condición con requisitos distintos, como el de residencia o el de los ganadores anteriores."}, {"codigo": "P002-T02-05", "categoria": "critico", "dificultad": 1, "enunciado": "Una vecina comenta: «Ese concurso es injusto, porque cobra por participar». A la luz de la convocatoria, su crítica:", "opciones": ["No puede valorarse, porque el texto no habla de costos.", "Es acertada, porque los premios se entregan en dinero.", "Es acertada, porque el jurado solo elige cuarenta obras.", "Parte de un dato falso: la inscripción es gratuita."], "correcta": 3, "explicacion": "Antes de discutir una conclusión hay que revisar el dato en que se apoya. La convocatoria dice que «La inscripción no tiene costo», así que el argumento de la vecina se cae desde la premisa. Los premios y el cupo no tienen que ver con lo que ella critica."}, {"codigo": "P002-T02-06", "categoria": "cohesion", "dificultad": 1, "enunciado": "En la oración «Lo eligen con su voto quienes visiten la exposición», la palabra «Lo» se refiere a:", "opciones": ["El premio del público.", "El primer premio.", "El jurado del Salón.", "El voto de los visitantes."], "correcta": 0, "explicacion": "«Lo» retoma lo que se acaba de nombrar en la misma línea: el premio del público. Es un pronombre que evita repetir. El jurado no puede ser, porque justamente este premio lo deciden los visitantes."}]}, {"codigo": "P002-T03", "titulo": "Lo que el marco decide", "tipologia": "ensayo", "fuente": "Texto original para práctica.", "contenido": "Solemos creer que el marco es un accesorio: una moldura que protege el cuadro y lo separa de la pared. Pero basta retirarlo para advertir que cumplía un oficio menos modesto. El marco no se limita a rodear la pintura; le dice al espectador dónde termina el mundo y dónde empieza aquello que debe mirarse de otra manera. Es, antes que un adorno, una orden: detente aquí.\n\nLo mismo cabe decir del pedestal, de la vitrina y, en último término, del museo entero, que no es sino un marco de proporciones arquitectónicas. Quien cruza su umbral baja la voz, aminora el paso y concede a cuanto encuentra una atención que rara vez dispensa a las cosas de su casa. De ahí el escándalo, todavía instructivo, de 1917, cuando Marcel Duchamp envió a una exposición de Nueva York un orinal de porcelana firmado con seudónimo. La pieza fue rechazada, pero la pregunta que traía consigo no ha dejado de incomodar: si un objeto cualquiera, puesto en el lugar indicado, reclama la mirada que reservamos al arte, ¿qué es entonces lo que hace artística a una obra: sus cualidades o su emplazamiento?\n\nSería apresurado concluir que todo depende del lugar, como pretenden quienes ven en el arte contemporáneo una simple impostura. El marco convoca la atención, pero no puede garantizar que algo la merezca. Hay objetos que, una vez mirados con detenimiento, se agotan en un instante, y otros que resisten y devuelven más de lo que se les pide. La institución otorga, por así decirlo, un crédito; solo la obra puede saldarlo.\n\nCon todo, sería igualmente ingenuo suponer que existe una mirada «pura», libre de marcos. Nadie contempla desde ninguna parte. Miramos siempre desde una educación, una época y unas expectativas que nos han enseñado qué buscar. Reconocerlo no rebaja la experiencia del arte: la vuelve, más bien, responsable. Porque quien sabe que su atención ha sido dirigida puede, al menos, preguntarse por quién y hacia dónde.", "preguntas": [{"codigo": "P002-T03-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el texto, el marco, el pedestal, la vitrina y el museo tienen en común que:", "opciones": ["Son accesorios cuya única tarea consiste en proteger las obras.", "Perdieron su función a raíz del escándalo ocurrido en 1917.", "Indican que lo que contienen pide otra manera de mirar.", "Aseguran que lo exhibido merece la atención que se le concede."], "correcta": 2, "explicacion": "El primer párrafo define el oficio del marco (decir «dónde empieza aquello que debe mirarse de otra manera») y el segundo lo extiende a los demás: «Lo mismo cabe decir del pedestal, de la vitrina…». La opción del accesorio repite la creencia que el autor corrige, y la de la garantía contradice el tercer párrafo: el marco «no puede garantizar que algo la merezca»."}, {"codigo": "P002-T03-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "En el tercer párrafo, la palabra «impostura» puede reemplazarse, sin alterar el sentido, por:", "opciones": ["Provocación", "Engaño", "Costumbre", "Imposición"], "correcta": 1, "explicacion": "Una impostura es un fingimiento, un engaño con apariencia de verdad: así juzgan el arte contemporáneo quienes creen que su valor es puro montaje. «Imposición» se le parece en el sonido, no en el significado; «provocación» suena razonable, pero la frase habla de fraude, no de desafío."}, {"codigo": "P002-T03-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "Con la frase «La institución otorga, por así decirlo, un crédito; solo la obra puede saldarlo», el autor da a entender que:", "opciones": ["El museo logra que miremos con atención, pero la obra debe justificarla.", "Los artistas quedan en deuda con las instituciones que los exhiben.", "El prestigio de un museo basta para volver valioso cualquier objeto.", "Las obras expuestas adquieren un valor en dinero que luego deben devolver."], "correcta": 0, "explicacion": "Crédito y saldo son aquí metáforas, y el «por así decirlo» lo advierte: el museo adelanta la atención del público, y la obra «paga» si resiste una mirada detenida. Leerlo como dinero o como deuda del artista es tomar la figura al pie de la letra; decir que el prestigio basta contradice la idea misma de un crédito que hay que saldar."}, {"codigo": "P002-T03-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "De lo que plantea el texto se puede deducir MENOS que:", "opciones": ["La manera de mirar el arte es, en buena parte, aprendida.", "Un mismo objeto puede recibir miradas distintas según el lugar en que se encuentre.", "Que una pieza esté en un museo no demuestra por sí solo que sea valiosa.", "El valor del arte contemporáneo depende solo del lugar donde se exhibe."], "correcta": 3, "explicacion": "Tres opciones se desprenden del texto: el lugar condiciona la mirada, el marco no garantiza el valor y siempre miramos desde una educación y una época. La que no se deduce es justamente la postura que el autor rechaza: «Sería apresurado concluir que todo depende del lugar». En las preguntas con «MENOS» se busca la afirmación que el texto no respalda."}, {"codigo": "P002-T03-05", "categoria": "critico", "dificultad": 2, "enunciado": "El autor recuerda el envío de Duchamp a la exposición de 1917 con el fin de:", "opciones": ["Plantear, con un caso concreto, la pregunta por lo que hace artística a una obra.", "Mostrar que los organizadores de la época carecían de criterio.", "Probar que cualquier objeto es arte desde que un museo lo acepta.", "Contar cómo nacieron los primeros museos de arte moderno."], "correcta": 0, "explicacion": "El episodio importa por «la pregunta que traía consigo»: ¿cualidades o emplazamiento? El autor lo usa para abrir el problema, no para cerrarlo. La opción según la cual cualquier objeto es arte si un museo lo acepta no puede ser: la pieza fue rechazada, y el autor no saca esa conclusión."}, {"codigo": "P002-T03-06", "categoria": "critico", "dificultad": 3, "enunciado": "¿Qué relación guardan entre sí el tercer párrafo y el cuarto?", "opciones": ["El tercero formula una pregunta y el cuarto la responde con un ejemplo histórico.", "Cada uno corrige un exceso: creer que todo depende del lugar o que nada depende de él.", "Ambos repiten una misma idea con palabras distintas para darle más énfasis.", "El cuarto desmiente lo afirmado en el tercero y deja el texto sin una posición definida."], "correcta": 1, "explicacion": "El tercero frena a quien concluye que el lugar lo es todo; el cuarto frena a quien cree en una mirada sin marcos. La palabra «igualmente» avisa que son dos errores simétricos, y la posición del autor queda entre ambos. No hay contradicción: «Con todo» matiza lo anterior, no lo desmiente."}, {"codigo": "P002-T03-07", "categoria": "cohesion", "dificultad": 3, "enunciado": "En la oración «Reconocerlo no rebaja la experiencia del arte: la vuelve, más bien, responsable», la expresión «más bien»:", "opciones": ["Atenúa la afirmación, porque el autor no está seguro de ella.", "Concede la razón a quienes sostienen la opinión contraria.", "Añade una segunda consecuencia a la que ya se mencionó.", "Rectifica lo que se acaba de negar y propone la idea que el autor defiende."], "correcta": 3, "explicacion": "Después de una negación («no rebaja»), «más bien» introduce la versión que el autor sí suscribe: no la rebaja, la vuelve responsable. Es un marcador de rectificación. En otros contextos «más bien» atenúa («es más bien tímido»), y por eso esa opción tienta; aquí, tras el «no», corrige."}]}, {"codigo": "P002-T04", "titulo": "Jueves a las tres", "tipologia": "literario", "fuente": "Relato original para práctica.", "contenido": "Todos los jueves, a las tres, Irene se paraba frente al mismo cuadro con su cuaderno de tapas negras. Era un retrato pequeño, casi escondido entre dos paisajes enormes: una mujer de perfil que pelaba una naranja junto a una ventana. Nadie se detenía a mirarlo. Los visitantes pasaban de largo hacia la sala de los maestros, donde había que hacer fila.\n\nEl vigilante, un hombre callado al que le faltaban dos años para la pensión, tardó un mes en hablarle.\n\n—Lleva cinco jueves dibujando lo mismo —dijo—. ¿No se cansa?\n\n—No es lo mismo —contestó Irene sin levantar el lápiz—. El primer día dibujé una mujer. El segundo, una naranja. Hoy estoy dibujando la luz.\n\nEl hombre miró el cuadro como si lo hubieran colgado esa mañana. Después miró el cuaderno. En la última página no había mujer ni fruta: solo un rectángulo en blanco, la ventana, y alrededor una sombra hecha con miles de rayitas que iba cediendo hasta desaparecer en una mano.\n\n—Yo llevo once años en esta sala —dijo por fin— y habría jurado que esa ventana estaba cerrada.\n\nIrene sonrió. Cuando sonó el timbre del cierre, guardó el lápiz, pero el vigilante no se movió de su sitio. Seguía de pie frente al retrato, con las manos atrás, igual que los visitantes de la otra sala.\n\nEl jueves siguiente, junto al cuadro pequeño, alguien había puesto una silla.", "preguntas": [{"codigo": "P002-T04-01", "categoria": "literal", "dificultad": 1, "enunciado": "¿Qué muestra el cuadro que Irene dibuja cada jueves?", "opciones": ["Un vigilante de pie con las manos cruzadas atrás.", "Un paisaje enorme con una ventana cerrada al fondo.", "Una mujer de perfil que pela una naranja junto a una ventana.", "Una mujer que dibuja en un cuaderno de tapas negras."], "correcta": 2, "explicacion": "El primer párrafo lo describe: «una mujer de perfil que pelaba una naranja junto a una ventana». Las otras opciones arman escenas con elementos que sí están en el relato —los paisajes, el vigilante, el cuaderno—, pero en otro lugar."}, {"codigo": "P002-T04-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "El vigilante mira el cuadro «como si lo hubieran colgado esa mañana». Esto da a entender que:", "opciones": ["Lo observa de verdad por primera vez.", "Sospecha que alguien cambió el cuadro por otro.", "El cuadro acaba de llegar a la sala.", "Le molesta que Irene lo esté copiando."], "correcta": 0, "explicacion": "El «como si» anuncia una comparación, no un hecho: el cuadro lleva años ahí, pero él lo mira como algo nuevo. Tomar la comparación por un dato real es el error de la opción sobre la llegada del cuadro."}, {"codigo": "P002-T04-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "La respuesta de Irene —«El primer día dibujé una mujer. El segundo, una naranja. Hoy estoy dibujando la luz»— sugiere que:", "opciones": ["El museo reemplaza el cuadro de esa sala cada semana por otro parecido.", "En cada visita descubre en el cuadro algo que antes no veía.", "Irene deja sin terminar cada dibujo que empieza.", "A Irene le interesan más los objetos que las personas."], "correcta": 1, "explicacion": "El cuadro es siempre el mismo; lo que cambia es lo que Irene alcanza a ver en él, de lo más evidente (la figura) a lo más sutil (la luz). Por eso contesta «No es lo mismo». Nada indica que abandone sus dibujos ni que el museo cambie el cuadro."}, {"codigo": "P002-T04-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "En la última línea aparece una silla junto al cuadro. Lo más razonable es inferir que:", "opciones": ["La dirección del museo quiere que Irene termine pronto y se marche de la sala.", "El cuadro se volvió tan visitado como los de la sala de los maestros.", "El vigilante cree ahora que ese cuadro merece una mirada detenida.", "El vigilante se cansó de trabajar de pie después de once años."], "correcta": 2, "explicacion": "El relato no dice quién puso la silla ni para quién, pero prepara la respuesta: el vigilante pasa de preguntar «¿No se cansa?» a quedarse mirando el retrato después del cierre. Una silla junto a un cuadro invita a detenerse; es el gesto de alguien que cambió de opinión sobre él. Que el cuadro sea ahora muy visitado exagera: la frase «igual que los visitantes de la otra sala» describe la postura del vigilante, no una multitud."}, {"codigo": "P002-T04-05", "categoria": "critico", "dificultad": 1, "enunciado": "¿Quién cuenta la historia?", "opciones": ["Irene, que recuerda sus visitas al museo.", "El vigilante, poco antes de pensionarse.", "Un visitante de la sala de los maestros.", "Un narrador externo, que no participa."], "correcta": 3, "explicacion": "El relato habla de Irene y del vigilante en tercera persona («se paraba», «dijo»), y nadie dice «yo» fuera de los diálogos. Es un narrador externo que muestra gestos y palabras y deja que el lector saque las conclusiones."}, {"codigo": "P002-T04-06", "categoria": "cohesion", "dificultad": 2, "enunciado": "En la frase «una sombra hecha con miles de rayitas que iba cediendo hasta desaparecer en una mano», lo que «iba cediendo» es:", "opciones": ["El rectángulo.", "La ventana.", "La sombra.", "Las rayitas."], "correcta": 2, "explicacion": "El verbo está en singular («iba»), así que su sujeto no puede ser «rayitas», aunque sea la palabra más cercana: la que cede es la sombra. Fijarse en la concordancia entre verbo y sujeto resuelve muchas preguntas sobre a qué se refiere una expresión."}]}, {"codigo": "P002-T05", "titulo": "El grafiti entra al museo: dos posturas", "tipologia": "intertextual", "fuente": "Textos originales para práctica.", "contenido": "### Texto A\n\nDurante años el grafiti fue tratado como una mancha que había que borrar. Hoy algunos museos le abren sus salas, y hay quien lo lamenta como si se tratara de una traición. No lo es. El museo ofrece al grafitero lo que la calle le niega: tiempo, materiales, un público que se detiene y, no menos importante, un pago por su trabajo. Además, pocas obras permanecen en el lugar para el que fueron hechas: los retablos salieron de las iglesias y las máscaras rituales, de las aldeas, y no por eso dejamos de admirarlos. Exigirle al grafiti que se quede en la intemperie para seguir siendo «auténtico» es condenar a sus autores a la precariedad en nombre de una pureza que solo disfrutan los espectadores.\n\n### Texto B\n\nUn grafiti no es solo una imagen: es una imagen puesta en un muro que nadie ofreció. Su fuerza nace de esa circunstancia —el riesgo, la prisa, la certeza de que mañana puede amanecer cubierto de pintura gris— y de que interpela a quien no fue a buscarlo. Trasladado a una sala, con luz medida y cartel explicativo, conserva la forma y pierde el gesto: se vuelve decoración. Nadie niega que los grafiteros tengan derecho a vivir de lo que saben hacer. Pero conviene llamar a las cosas por su nombre: lo que cuelga en el museo es pintura de un grafitero, no grafiti. El animal sigue siendo hermoso en el zoológico; lo que ya no hace es cazar.", "preguntas": [{"codigo": "P002-T05-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según el texto B, la fuerza de un grafiti proviene de:", "opciones": ["El reconocimiento que le conceden las instituciones.", "El modo en que se pinta y su encuentro con quien no lo buscaba.", "La habilidad del autor y la calidad de los materiales que emplea.", "La luz medida y el cartel explicativo que lo acompañan."], "correcta": 1, "explicacion": "El texto B lo dice en dos partes: la fuerza nace de «esa circunstancia» (el riesgo, la prisa) y de que «interpela a quien no fue a buscarlo». La luz medida y el cartel sí aparecen en el texto, pero como rasgos de la sala del museo: es el dato correcto en el lugar equivocado."}, {"codigo": "P002-T05-02", "categoria": "critico", "dificultad": 1, "enunciado": "¿Sobre qué asunto discrepan los dos textos?", "opciones": ["Si el grafiti debe borrarse de los muros de la ciudad.", "Si los grafiteros merecen recibir un pago por su trabajo.", "Si los museos deberían cobrar por la entrada.", "Si el grafiti pierde lo esencial al entrar al museo."], "correcta": 3, "explicacion": "Para A, entrar al museo no es una traición; para B, lo que cuelga allí es «pintura de un grafitero, no grafiti». Ese es el punto en disputa. Cuando se comparan dos textos, lo primero es ubicar la pregunta que cada uno responde de manera distinta."}, {"codigo": "P002-T05-03", "categoria": "critico", "dificultad": 2, "enunciado": "Al hablar de «una pureza que solo disfrutan los espectadores», el autor del texto A critica que:", "opciones": ["Quienes exigen autenticidad no pagan el costo de esa exigencia.", "Los grafiteros pintan pensando únicamente en agradar al público.", "Los espectadores no distinguen un grafiti auténtico de una imitación.", "Los museos impiden que la gente disfrute del grafiti en la calle."], "correcta": 0, "explicacion": "La frase opone dos lados: los autores, condenados «a la precariedad», y los espectadores, que disfrutan la pureza sin pagar nada por ella. El autor señala que es fácil pedir autenticidad cuando el sacrificio lo hace otro. Las comillas en «auténtico» ya avisaban que toma distancia de esa palabra."}, {"codigo": "P002-T05-04", "categoria": "critico", "dificultad": 2, "enunciado": "La frase final del texto B, «El animal sigue siendo hermoso en el zoológico; lo que ya no hace es cazar», cumple en la argumentación la función de:", "opciones": ["Resumir con una analogía que el grafiti conserva la forma y pierde la acción.", "Admitir, al final, que el autor del texto A tenía la razón.", "Respaldar la tesis con un dato tomado de las ciencias naturales.", "Abrir un tema nuevo, el del trato que reciben los animales en cautiverio."], "correcta": 0, "explicacion": "El zoológico es el museo, el animal es el grafiti, y cazar es lo que el grafiti hacía en la calle: arriesgarse, interpelar. La analogía repite en imagen lo dicho antes: «conserva la forma y pierde el gesto». No es un dato ni un tema nuevo: es un cierre retórico."}, {"codigo": "P002-T05-05", "categoria": "critico", "dificultad": 3, "enunciado": "El texto A recuerda que los retablos y las máscaras rituales salieron de su lugar de origen y los seguimos admirando. ¿Qué respuesta sería más coherente con la postura del texto B?", "opciones": ["Admirar una obra es prueba suficiente de que conserva todo su sentido.", "Los museos no deberían pagar a los artistas por obras de origen popular.", "Los retablos y las máscaras nunca fueron considerados verdaderas obras de arte.", "También esos objetos, fuera de su lugar, dejaron de cumplir su función."], "correcta": 3, "explicacion": "B distingue entre forma y gesto: algo puede seguir siendo hermoso y, sin embargo, haber perdido lo que hacía. Con esa distinción puede aceptar el ejemplo de A y volverlo a su favor: admiramos la máscara, pero ya no cumple su rito. Que admirar baste para conservar el sentido es la idea de A, no la de B."}, {"codigo": "P002-T05-06", "categoria": "cohesion", "dificultad": 1, "enunciado": "En el texto A, la palabra «Además» indica que el autor:", "opciones": ["Enuncia la conclusión de todo el texto.", "Presenta la postura de sus contradictores.", "Suma un argumento nuevo a favor de su postura.", "Cambia de opinión sobre el tema."], "correcta": 2, "explicacion": "«Además» es un conector de adición: después de enumerar lo que el museo
