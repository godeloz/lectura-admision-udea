window.LE = {
  cfg: window.LE_CONFIG,
  api: null,
  estado: { perfil: null, config: {}, insignias: [], sesion: null },
  acciones: {},
  rutas: []
};

(function (LE) {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  LE.$ = $; LE.$$ = $$;

  LE.esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Markdown mínimo para lecturas: ### títulos, - listas, **negrita**, *cursiva*
  LE.md = (texto) => {
    const inline = (s) => LE.esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
    return String(texto || "").trim().split(/\n\s*\n/).map((bloque) => {
      let html = "", parrafo = [], lista = [];
      const cerrar = () => { if (parrafo.length) html += "<p>" + parrafo.map(inline).join("<br>") + "</p>"; parrafo = []; };
      const cerrarLista = () => { if (lista.length) html += "<ul>" + lista.map((l) => "<li>" + inline(l) + "</li>").join("") + "</ul>"; lista = []; };
      for (const l of bloque.split("\n")) {
        if (/^###\s+/.test(l)) { cerrar(); cerrarLista(); html += "<h3>" + inline(l.replace(/^###\s+/, "")) + "</h3>"; }
        else if (/^\s*-\s+/.test(l)) { cerrar(); lista.push(l.replace(/^\s*-\s+/, "")); }
        else { cerrarLista(); parrafo.push(l); }
      }
      cerrar(); cerrarLista();
      return html;
    }).join("");
  };

  LE.CATS = ["literal", "inferencial", "critico", "cohesion"];
  LE.cat = (c) => (LE.estado.config.categorias || {})[c] || { nombre: c, color: "cian", descripcion: "" };
  LE.TIPOS = { ensayo: "Ensayo", divulgacion: "Divulgación científica", literario: "Texto literario", discontinuo: "Texto discontinuo", intertextual: "Dos textos en diálogo", argumentativo: "Texto argumentativo", periodistico: "Texto periodístico", otro: "Lectura" };
  LE.LETRAS = ["A", "B", "C", "D"];

  LE.minutos = (m) => {
    m = Math.round(m || 0);
    if (m < 60) return m + " min";
    const h = Math.floor(m / 60), r = m % 60;
    return h + " h" + (r ? " " + r + " min" : "");
  };
  LE.hace = (fecha) => {
    if (!fecha) return "sin actividad";
    const d = (Date.now() - new Date(fecha).getTime()) / 1000;
    if (d < 90) return "hace un momento";
    if (d < 3600) return "hace " + Math.round(d / 60) + " min";
    if (d < 86400) return "hace " + Math.round(d / 3600) + " h";
    const dias = Math.round(d / 86400);
    return dias === 1 ? "ayer" : "hace " + dias + " días";
  };
  LE.fecha = (f) => new Date(f).toLocaleDateString("es-CO", { day: "numeric", month: "short" });

  LE.rango = (xp) => {
    const rs = LE.estado.config.rangos || [{ nombre: "Demo", xp: 0 }];
    let i = 0;
    rs.forEach((r, k) => { if (xp >= r.xp) i = k; });
    const act = rs[i], sig = rs[i + 1];
    const prog = sig ? (xp - act.xp) / (sig.xp - act.xp) : 1;
    return { actual: act, siguiente: sig, progreso: Math.max(0, Math.min(1, prog)), indice: i };
  };

  // ---------- Montaje y rutas ----------
  LE.montar = (html) => { const v = $("#vista"); v.innerHTML = html; window.scrollTo(0, 0); return v; };
  LE.ondas = (n = 7) => Array.from({ length: n }, (_, i) => `<span class="cr-${["cian", "rosa", "amarillo", "menta"][i % 4]}" style="--i:${i};height:${40 + ((i * 37) % 60)}%"></span>`).join("");
  LE.cargando = (txt = "Cargando…") => LE.montar(`<div class="cargando"><div class="ondas">${LE.ondas()}</div><p>${LE.esc(txt)}</p></div>`);

  LE.ruta = (patron, fn, opciones = {}) => LE.rutas.push({ re: new RegExp("^" + patron.replace(/:(\w+)/g, "(?<$1>[^/]+)") + "$"), fn, ...opciones });
  LE.ir = (hash) => { if (location.hash === hash) LE.navegar(); else location.hash = hash; };
  LE.inicioPorRol = () => (LE.esTutor() ? "#/tutor" : "#/inicio");
  LE.navegar = async () => {
    const h = location.hash.replace(/^#/, "") || LE.inicioPorRol().slice(1);
    for (const r of LE.rutas) {
      const m = h.match(r.re);
      if (!m) continue;
      if (r.tutor && !LE.esTutor()) return LE.ir("#/inicio");
      if (r.estudiante && LE.esTutor()) return LE.ir("#/tutor");
      document.body.classList.toggle("en-sesion", !!r.sesion);
      LE.marcarNav(h);
      try { await r.fn(m.groups || {}); }
      catch (e) {
        console.error(e);
        LE.montar(`<div class="vacio"><h2>No se pudo cargar esta pantalla</h2><p>${LE.esc(e.message || e)}</p><button class="btn sec" data-accion="irInicio">Volver al inicio</button></div>`);
      }
      return;
    }
    LE.ir(LE.inicioPorRol());
  };
  LE.marcarNav = (h) => {
    const links = $$(".nav a");
    const mejor = links.map((a) => a.getAttribute("href").slice(1)).filter((r) => h.startsWith(r)).sort((a, b) => b.length - a.length)[0];
    links.forEach((a) => (a.getAttribute("href").slice(1) === mejor ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  };
  LE.esTutor = () => LE.estado.perfil?.rol === "tutor";

  // ---------- Acciones delegadas ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-accion]");
    if (!b) return;
    const fn = LE.acciones[b.dataset.accion];
    if (fn) { e.preventDefault(); fn(b, e); }
  });
  LE.acciones.irInicio = () => LE.ir(LE.inicioPorRol());

  // ---------- Avisos y diálogos ----------
  LE.aviso = (msg, tipo = "") => {
    let c = $(".avisos");
    if (!c) { c = document.createElement("div"); c.className = "avisos"; c.setAttribute("role", "status"); document.body.append(c); }
    const a = document.createElement("div");
    a.className = "aviso " + tipo; a.textContent = msg; c.append(a);
    setTimeout(() => a.remove(), tipo === "error" ? 6000 : 3500);
  };
  LE.error = (e) => { console.error(e); LE.aviso(e?.message || String(e), "error"); };

  // Abre un diálogo. Cualquier botón con data-valor lo cierra y devuelve ese valor.
  LE.dialogo = (html, { cerrable = true, alAbrir } = {}) => new Promise((resolver) => {
    const d = document.createElement("dialog");
    d.innerHTML = html;
    document.body.append(d);
    d.addEventListener("click", (e) => {
      const b = e.target.closest("[data-valor]");
      if (b && !(b.form && b.type === "submit")) d.close(b.dataset.valor);
      else if (cerrable && e.target === d) d.close("");
    });
    d.addEventListener("cancel", (e) => { if (!cerrable) e.preventDefault(); });
    d.addEventListener("close", () => { resolver(d.returnValue); d.remove(); });
    d.showModal();
    if (alAbrir) alAbrir(d);
  });
  LE.confirmar = (titulo, texto, si = "Continuar", no = "Cancelar") =>
    LE.dialogo(`<div class="pila"><h2>${LE.esc(titulo)}</h2><p class="sub">${texto}</p><div class="acciones"><button class="btn sec" data-valor="no">${LE.esc(no)}</button><button class="btn" data-valor="si">${LE.esc(si)}</button></div></div>`).then((v) => v === "si");

  LE.premios = async (lista = []) => {
    for (const i of lista) {
      await LE.dialogo(`<div class="premio cr-${LE.esc(i.color)}"><div class="ico">${LE.esc(i.icono)}</div><p class="sub">Insignia nueva</p><h2>${LE.esc(i.nombre)}</h2><p class="sub">${LE.esc(i.descripcion)}</p><button class="btn" data-valor="ok">Guardar en mi perfil</button></div>`);
    }
  };

  // ---------- Componentes compartidos ----------
  LE.ecualizador = (dominio, { vivo = false, detalle = true } = {}) => {
    const mapa = Object.fromEntries((dominio || []).map((d) => [d.categoria, d]));
    return `<div class="eq ${vivo ? "vivo" : ""}" role="list">` + LE.CATS.map((c) => {
      const d = mapa[c] || { dominio: 0, respondidas: 0 };
      const on = Math.round((d.dominio || 0) / 5);
      const segs = Array.from({ length: 20 }, (_, i) => `<i class="eq-seg ${i < on ? "on" : ""} ${i === on - 1 ? "pico" : ""}" style="--i:${i}"></i>`).join("");
      return `<div class="eq-col cr-${c}" role="listitem" aria-label="${LE.esc(LE.cat(c).nombre)}: ${d.dominio} de 100">
        <span class="eq-valor">${d.dominio ?? 0}</span>
        <div class="eq-barra">${segs}</div>
        <span class="eq-nombre">${LE.esc(LE.cat(c).nombre)}</span>
        ${detalle ? `<span class="eq-det">${d.respondidas ?? 0} resp.</span>` : ""}
      </div>`;
    }).join("") + `</div>`;
  };

  LE.pistaXP = (xp) => {
    const r = LE.rango(xp);
    const n = (x) => Number(x).toLocaleString("es-CO");
    return `<div class="pista">
      <div class="pista-etiquetas"><span><b>${LE.esc(r.actual.nombre)}</b></span><span>${r.siguiente ? `${n(xp)} / ${n(r.siguiente.xp)} XP para ${LE.esc(r.siguiente.nombre)}` : `${n(xp)} XP · rango máximo`}</span></div>
      <div class="pista-barra" role="progressbar" aria-label="Progreso al siguiente rango" aria-valuenow="${Math.round(r.progreso * 100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${r.progreso * 100}%"></span></div>
    </div>`;
  };

  LE.calor = (dias = []) => {
    const n = (m) => (m <= 0 ? 0 : m < 15 ? 1 : m < 40 ? 2 : 3);
    return `<div class="calor">` + dias.map((d, i) => `<i data-n="${n(d.minutos || (d.respuestas ? 5 : 0))}" class="${i === dias.length - 1 ? "hoy" : ""}" title="${LE.fecha(d.fecha + "T12:00")}: ${d.minutos} min, ${d.respuestas} respuestas"></i>`).join("") + `</div>`;
  };

  LE.lecturaHTML = (t, plegable = true) => t ? `
    <article class="lectura ${plegable ? "plegada" : ""}" id="lectura">
      <span class="tipo">${LE.esc(LE.TIPOS[t.tipologia] || "Lectura")}</span>
      <h2>${LE.esc(t.titulo)}</h2>
      ${LE.md(t.contenido)}
      ${t.fuente ? `<p class="fuente">${LE.esc(t.fuente)}</p>` : ""}
    </article>
    ${plegable ? `<button class="btn suave chico plegar-lectura" data-accion="plegar">Mostrar lectura completa</button>` : ""}` : "";

  LE.acciones.plegar = (b) => {
    const l = $("#lectura");
    const pl = l.classList.toggle("plegada");
    b.textContent = pl ? "Mostrar lectura completa" : "Ocultar lectura";
  };

  // ---------- Cronómetro de estudio ----------
  // Suma tiempo solo si la pestaña está visible y hubo interacción en los últimos 2 minutos.
  LE.cronometro = {
    ultimo: Date.now(), acumulado: 0, timer: null, listo: false,
    iniciar() {
      if (this.timer) return;
      if (!this.listo) {
        ["pointerdown", "keydown", "scroll", "touchstart"].forEach((ev) => addEventListener(ev, () => (this.ultimo = Date.now()), { passive: true }));
        addEventListener("pagehide", () => this.vaciar());
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") this.vaciar(); });
        this.listo = true;
      }
      this.ultimo = Date.now();
      this.timer = setInterval(() => {
        if (document.visibilityState === "visible" && Date.now() - this.ultimo < 120000) this.acumulado += 15;
        if (this.acumulado >= 60) this.vaciar();
      }, 15000);
    },
    vaciar() { if (this.acumulado > 0 && LE.api) { const s = this.acumulado; this.acumulado = 0; LE.api.registrarTiempo(s).catch(() => {}); } },
    detener() { this.vaciar(); clearInterval(this.timer); this.timer = null; }
  };
})(window.LE);

/* =====================================================================
   ENTRELÍNEAS · API DEMO
   Replica en el navegador la lógica de las funciones SQL para poder
   probar la app sin Supabase. Usuarios: sofia / demo  ·  tutor / demo
   ===================================================================== */
window.LE_ApiDemo = function () {
  const CLAVE = "entrelineas-demo-v1";
  let db = null;
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36));
  const ahora = () => new Date().toISOString();
  const dia = (ts) => new Date(ts).toLocaleDateString("en-CA", { timeZone: "America/Bogota" });
  const hoy = () => dia(Date.now());
  const restarDias = (f, n) => { const d = new Date(f + "T12:00:00"); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(db)); } catch (e) { /* sin almacenamiento: el demo vive en memoria */ } };
  const espera = (x) => new Promise((r) => setTimeout(() => r(x === undefined ? x : JSON.parse(JSON.stringify(x))), 120));
  const yo = () => db.usuarios.find((u) => u.id === db.actual);
  const cfg = (k) => db.config[k];
  const barajar = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
  const pregunta = (id) => db.preguntas.find((p) => p.id === id);
  const texto = (id) => db.textos.find((t) => t.id === id);
  const sinClave = (u) => { const { clave, ...resto } = u; return resto; };
  const xpc = (k, d) => cfg("xp")?.[k] ?? d;

  async function cargarDatos() {
    if (window.LE_DATOS_DEMO) return window.LE_DATOS_DEMO;
    const leer = (f) => fetch(f).then((r) => { if (!r.ok) throw new Error("No se encontró " + f); return r.json(); });
    return { base: await leer("content/base.json"), paquetes: [await leer("content/paquete-001.json")] };
  }

  function aplicar(p) {
    let nt = 0, nq = 0, ni = 0, nc = 0;
    for (const t of p.textos || []) {
      let tx = db.textos.find((x) => x.codigo === t.codigo);
      if (!tx) { tx = { id: uuid(), codigo: t.codigo }; db.textos.push(tx); }
      Object.assign(tx, { titulo: t.titulo, tipologia: t.tipologia || "otro", contenido: t.contenido, fuente: t.fuente, paquete: p.paquete, activo: t.activo !== false });
      nt++;
      for (const q of t.preguntas || []) {
        let pr = db.preguntas.find((x) => x.codigo === q.codigo);
        if (!pr) { pr = { id: uuid(), codigo: q.codigo }; db.preguntas.push(pr); }
        Object.assign(pr, { texto_id: tx.id, categoria: q.categoria, dificultad: q.dificultad || 2, enunciado: q.enunciado, opciones: q.opciones, correcta: q.correcta, explicacion: q.explicacion || "", paquete: p.paquete, activo: q.activo !== false });
        nq++;
      }
    }
    for (const i of p.insignias || []) {
      const k = db.insignias.findIndex((x) => x.codigo === i.codigo);
      const fila = { icono: "⭐", color: "rosa", orden: 100, activo: true, ...i };
      if (k >= 0) db.insignias[k] = fila; else db.insignias.push(fila);
      ni++;
    }
    for (const [k, v] of Object.entries(p.config || {})) { db.config[k] = v; nc++; }
    if (p.novedad) db.novedades.push({ id: db.novedades.length + 1, creado: ahora(), ...p.novedad });
    db.insignias.sort((a, b) => a.orden - b.orden);
    return { paquete: p.paquete, textos: nt, preguntas: nq, insignias: ni, config: nc, novedad: !!p.novedad };
  }

  // ---------- lógica espejo de 02_funciones.sql ----------
  function dominio(uid) {
    return ["literal", "inferencial", "critico", "cohesion"].map((c) => {
      const rs = db.respuestas.filter((r) => r.user_id === uid && pregunta(r.pregunta_id)?.categoria === c)
        .sort((a, b) => b.creado.localeCompare(a.creado)).slice(0, 30);
      let ok = 0, tot = 0;
      rs.forEach((r) => { const d = pregunta(r.pregunta_id).dificultad; tot += d; if (r.correcta) ok += d; });
      return { categoria: c, dominio: Math.round((100 * (ok + 0.7)) / (tot + 2)), respondidas: rs.length };
    });
  }

  function rachas(uid) {
    const dias = [...new Set(db.respuestas.filter((r) => r.user_id === uid).map((r) => dia(r.creado)))].sort();
    let mejor = 0, run = 0, prev = null;
    const islas = [];
    for (const d of dias) {
      run = prev && restarDias(d, 1) === prev ? run + 1 : 1;
      if (run === 1) islas.push({ fin: d, largo: 1 }); else { islas[islas.length - 1].fin = d; islas[islas.length - 1].largo = run; }
      mejor = Math.max(mejor, run); prev = d;
    }
    const ult = islas[islas.length - 1];
    const actual = ult && ult.fin >= restarDias(hoy(), 1) ? ult.largo : 0;
    return { actual, mejor };
  }

  function ultimas(uid) {
    const m = {};
    db.respuestas.filter((r) => r.user_id === uid).forEach((r) => { if (!m[r.pregunta_id] || m[r.pregunta_id].creado < r.creado) m[r.pregunta_id] = r; });
    return m;
  }

  function seleccionar(uid, n, cat) {
    const dist = cfg("distribucion") || { literal: 0.2, inferencial: 0.35, critico: 0.3, cohesion: 0.15 };
    const u = ultimas(uid);
    const activas = db.preguntas.filter((p) => p.activo && (!cat || p.categoria === cat));
    const hace = (h) => new Date(Date.now() - h * 3600e3).toISOString();
    const repN = Math.round(n * (cfg("retos")?.repaso ?? 0.2));
    const rep = activas.filter((p) => u[p.id] && !u[p.id].correcta && u[p.id].creado < hace(20))
      .sort((a, b) => u[a.id].creado.localeCompare(u[b.id].creado)).slice(0, repN).map((p) => p.id);
    const dom = Object.fromEntries(dominio(uid).map((d) => [d.categoria, d.dominio]));
    const objetivo = (c) => (dom[c] < 45 ? 1 : dom[c] < 75 ? 2 : 3);
    const cand = activas.filter((p) => !rep.includes(p.id) && (!u[p.id] || u[p.id].creado < hace(24 * 30)))
      .map((p) => ({ p, s: Math.abs(p.dificultad - objetivo(p.categoria)) + (u[p.id] ? 1.5 : 0) + Math.random() }));
    const sel = [];
    for (const c of cat ? [cat] : Object.keys(dist)) {
      const cupo = cat ? n : Math.max(1, Math.round((n - rep.length) * (dist[c] || 0.25)));
      cand.filter((x) => x.p.categoria === c).sort((a, b) => a.s - b.s).slice(0, cupo).forEach((x) => sel.push(x.p.id));
    }
    let ids = [...rep, ...sel];
    if (ids.length < n) ids = ids.concat(barajar(activas.filter((p) => !ids.includes(p.id))).slice(0, n - ids.length).map((p) => p.id));
    ids = ids.slice(0, n);
    return ids.map(pregunta).sort((a, b) => (a.texto_id + a.codigo).localeCompare(b.texto_id + b.codigo)).map((p) => p.id);
  }

  function empaquetar(ids) {
    const ps = ids.map(pregunta);
    return {
      preguntas: ps.map((p) => ({ id: p.id, texto_id: p.texto_id, categoria: p.categoria, dificultad: p.dificultad, enunciado: p.enunciado, opciones: p.opciones })),
      textos: Object.fromEntries([...new Set(ps.map((p) => p.texto_id))].map((id) => { const t = texto(id); return [id, { titulo: t.titulo, tipologia: t.tipologia, contenido: t.contenido, fuente: t.fuente }]; }))
    };
  }

  function evaluarInsignias(uid) {
    const tengo = new Set(db.iu.filter((x) => x.user_id === uid).map((x) => x.codigo));
    const mias = db.respuestas.filter((r) => r.user_id === uid);
    const ses = db.sesiones.filter((s) => s.user_id === uid && s.fin);
    const retos = ses.filter((s) => s.tipo !== "simulacro").sort((a, b) => a.fin.localeCompare(b.fin));
    const dom = dominio(uid);
    const r = rachas(uid).actual;
    const minutos = Object.values(db.actividad[uid] || {}).reduce((a, b) => a + b, 0) / 60;
    const nuevas = [];
    for (const i of db.insignias.filter((x) => x.activo && !tengo.has(x.codigo))) {
      const g = i.regla, v = g.valor || 0;
      let ok = false;
      switch (g.tipo) {
        case "racha": ok = r >= v; break;
        case "respuestas": ok = mias.length >= v; break;
        case "aciertos": ok = mias.filter((x) => x.correcta).length >= v; break;
        case "retos": ok = retos.length >= v; break;
        case "reto_perfecto": ok = retos.some((s) => s.total >= v && s.correctas === s.total); break;
        case "dominio": ok = dom.some((d) => d.categoria === g.categoria && d.dominio >= v && d.respondidas >= 15); break;
        case "simulacro": ok = ses.some((s) => s.tipo === "simulacro" && s.nivel === g.nivel && (s.resultado?.puntaje ?? -1) >= v); break;
        case "minutos": ok = minutos >= v; break;
        case "misiones": ok = db.mensajes.filter((m) => m.estudiante_id === uid && m.tipo === "mision" && m.completado).length >= v; break;
        case "remontada": ok = retos.filter((s) => s.total >= 5).some((s, k, a) => k > 0 && a[k - 1].correctas / a[k - 1].total < 0.5 && s.correctas / s.total >= 0.8); break;
      }
      if (ok) { db.iu.push({ user_id: uid, codigo: i.codigo, obtenida: ahora() }); nuevas.push({ codigo: i.codigo, nombre: i.nombre, descripcion: i.descripcion, icono: i.icono, color: i.color }); }
    }
    return nuevas;
  }

  function resumen(uid) {
    const u = db.usuarios.find((x) => x.id === uid);
    const mias = db.respuestas.filter((r) => r.user_id === uid);
    const act = db.actividad[uid] || {};
    const r = rachas(uid);
    const dias = Array.from({ length: 28 }, (_, i) => { const f = restarDias(hoy(), 27 - i); return { fecha: f, minutos: Math.floor((act[f] || 0) / 60), respuestas: mias.filter((x) => dia(x.creado) === f).length }; });
    const tiempos = mias.filter((x) => x.tiempo_ms != null);
    const hace8 = new Date(Date.now() - 56 * 86400e3).toISOString();
    const tend = {};
    mias.filter((x) => x.creado > hace8).forEach((x) => {
      const d = new Date(dia(x.creado) + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const k = d.toISOString().slice(0, 10) + "|" + pregunta(x.pregunta_id).categoria;
      const t = (tend[k] ||= { ok: 0, n: 0 }); t.n++; if (x.correcta) t.ok++;
    });
    return {
      perfil: sinClave(u), racha: r.actual, mejor_racha: r.mejor,
      minutos_hoy: Math.floor((act[hoy()] || 0) / 60),
      minutos_total: Math.floor(Object.values(act).reduce((a, b) => a + b, 0) / 60),
      dias, dominio: dominio(uid),
      tendencia: Object.entries(tend).sort().map(([k, v]) => { const [semana, categoria] = k.split("|"); return { semana, categoria, precision: Math.round((100 * v.ok) / v.n), n: v.n }; }),
      totales: { respuestas: mias.length, aciertos: mias.filter((x) => x.correcta).length, segundos_promedio: tiempos.length ? Math.round(tiempos.reduce((a, b) => a + b.tiempo_ms, 0) / tiempos.length / 1000) : null },
      retos: db.sesiones.filter((s) => s.user_id === uid && s.tipo !== "simulacro" && s.fin).length,
      insignias: db.iu.filter((x) => x.user_id === uid).map(({ codigo, obtenida }) => ({ codigo, obtenida })),
      simulacros: db.sesiones.filter((s) => s.user_id === uid && s.tipo === "simulacro" && s.fin && !s.resultado?.abandonado)
        .sort((a, b) => b.fin.localeCompare(a.fin))
        .map((s) => ({ id: s.id, nivel: s.nivel, fecha: s.fin, correctas: s.correctas, total: s.total, puntaje: s.resultado.puntaje, por_categoria: s.resultado.por_categoria })),
      ultima_actividad: mias.map((x) => x.creado).sort().pop() || null
    };
  }

  function sumarXP(uid, n) { db.usuarios.find((u) => u.id === uid).xp += n; }

  // ---------- historial de muestra para que el demo no arranque vacío ----------
  function sembrar() {
    const est = db.usuarios.find((u) => u.usuario === "sofia");
    const tut = db.usuarios.find((u) => u.usuario === "tutor");
    const dias = [18, 17, 16, 14, 13, 12, 11, 9, 8, 6, 5, 4];
    const prob = { literal: 0.8, inferencial: 0.72, critico: 0.5, cohesion: 0.62 };
    for (const d of dias) {
      const n = d % 3 === 0 ? 15 : 10;
      const f = restarDias(hoy(), d);
      const s = { id: uuid(), user_id: est.id, tipo: "reto", nivel: String(n), total: n, preguntas: [], inicio: f + "T21:00:00.000Z", fin: f + "T21:20:00.000Z", xp: 0, correctas: 0 };
      barajar(db.preguntas).slice(0, n).forEach((p, k) => {
        // en la última semana, el nivel inferencial cae (para que el tutor vea una alerta)
        const base = p.categoria === "inferencial" && d <= 6 ? 0.25 : prob[p.categoria] + (18 - d) * 0.008;
        const ok = Math.random() < base;
        const xp = ok ? 10 * p.dificultad + 5 : 2;
        db.respuestas.push({ id: db.respuestas.length + 1, user_id: est.id, pregunta_id: p.id, sesion_id: s.id, opcion: ok ? p.correcta : (p.correcta + 1) % 4, correcta: ok, tiempo_ms: 40000 + Math.random() * 60000, contexto: "reto", creado: `${f}T21:${String(k * 2).padStart(2, "0")}:00.000Z` });
        s.xp += xp; s.correctas += ok ? 1 : 0; s.preguntas.push(p.id);
      });
      s.xp += 20; s.resultado = { correctas: s.correctas, total: n, respondidas: n, xp: s.xp };
      db.sesiones.push(s); est.xp += s.xp;
      (db.actividad[est.id] ||= {})[f] = (12 + Math.round(Math.random() * 25)) * 60;
    }
    const sim = { id: uuid(), user_id: est.id, tipo: "simulacro", nivel: "inicial", total: 30, correctas: 17, xp: 264, preguntas: db.preguntas.map((p) => p.id), inicio: restarDias(hoy(), 9) + "T14:00:00.000Z", fin: restarDias(hoy(), 9) + "T15:02:00.000Z" };
    sim.resultado = { correctas: 17, total: 30, puntaje: 56.7, minutos: 62, respondidas: 29, xp: 264, por_categoria: { literal: { correctas: 6, total: 7 }, inferencial: { correctas: 6, total: 10 }, critico: { correctas: 2, total: 8 }, cohesion: { correctas: 3, total: 5 } }, detalle: [] };
    db.sesiones.push(sim); est.xp += 264;
    db.actual = est.id; evaluarInsignias(est.id); db.actual = null;
    db.mensajes.push({ id: uuid(), estudiante_id: est.id, autor_id: tut.id, tipo: "mision", titulo: "Misión: nivel crítico", cuerpo: "Vi tu simulacro: el nivel crítico es donde más puntos se te escapan. Te dejé 10 preguntas solo de ese nivel. Antes de elegir, pregúntate qué necesitaría el autor para que su argumento se cayera.", mision: { categoria: "critico", n: 10 }, leido: false, completado: false, creado: new Date(Date.now() - 86400e3).toISOString() });
    db.mensajes.push({ id: uuid(), estudiante_id: est.id, autor_id: tut.id, tipo: "mensaje", titulo: "¡Buena semana!", cuerpo: "Doce días de práctica en tres semanas. Así se construye. Sigue con los EP diarios.", leido: true, completado: false, creado: new Date(Date.now() - 4 * 86400e3).toISOString() });
  }

  async function iniciarBD(forzar = false) {
    if (db && !forzar) return;
    try { if (!forzar) db = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { db = null; }
    if (db) return;
    const datos = await cargarDatos();
    db = { usuarios: [], textos: [], preguntas: [], respuestas: [], sesiones: [], actividad: {}, insignias: [], iu: [], config: {}, novedades: [], mensajes: [], alertas: [], actual: null };
    aplicar(datos.base);
    datos.paquetes.forEach(aplicar);
    const t0 = new Date(Date.now() - 20 * 86400e3).toISOString();
    db.usuarios.push({ id: uuid(), usuario: "sofia", clave: "demo", rol: "estudiante", nombre: "Sofía", avatar: "🎧", xp: 0, meta_programa: "Medicina", ultima_novedad: 0, activo: true, creado: t0 });
    db.usuarios.push({ id: uuid(), usuario: "tutor", clave: "demo", rol: "tutor", nombre: "Tutor", avatar: "🎓", xp: 0, meta_programa: null, ultima_novedad: 99, activo: true, creado: t0 });
    sembrar();
    db.usuarios.forEach((u) => (u.ultima_novedad = db.novedades.length));
    guardar();
  }

  const soloTutor = () => { if (yo()?.rol !== "tutor") throw new Error("Solo para tutores"); };

  return {
    modo: "demo",
    async reiniciar() { try { localStorage.removeItem(CLAVE); } catch (e) { } db = null; await iniciarBD(true); },
    async sesionActual() { await iniciarBD(); return db.actual ? espera(sinClave(yo())) : null; },
    async entrar(usuario, clave) {
      await iniciarBD();
      const u = db.usuarios.find((x) => x.usuario === usuario.trim().toLowerCase() && x.clave === clave);
      if (!u) throw new Error("Usuario o contraseña incorrectos.");
      db.actual = u.id; guardar();
      return espera(sinClave(u));
    },
    async salir() { db.actual = null; guardar(); },
    async perfil() { return espera(sinClave(yo())); },
    async config() { return espera(db.config); },
    async insignias() { return espera(db.insignias.filter((i) => i.activo)); },
    async novedadesPendientes(ultima) { return espera(db.novedades.filter((n) => n.id > (ultima || 0))); },
    async marcarNovedades() { yo().ultima_novedad = db.novedades.length; guardar(); },
    async actualizarPerfil(nombre, avatar, meta) { const u = yo(); if (nombre?.trim()) u.nombre = nombre.trim(); if (avatar) u.avatar = avatar; if (meta != null) u.meta_programa = meta; guardar(); },

    async iniciarReto(n, categoria = null, mensajeId = null) {
      const ids = seleccionar(db.actual, n, categoria);
      if (!ids.length) throw new Error("Todavía no hay preguntas cargadas");
      const s = { id: uuid(), user_id: db.actual, tipo: mensajeId ? "mision" : "reto", nivel: categoria || String(n), total: ids.length, preguntas: ids, mensaje_id: mensajeId, inicio: ahora(), fin: null, xp: 0 };
      db.sesiones.push(s); guardar();
      return espera({ sesion_id: s.id, tipo: s.tipo, ...empaquetar(ids) });
    },
    async responder(sesionId, preguntaId, opcion, ms) {
      const s = db.sesiones.find((x) => x.id === sesionId && x.user_id === db.actual);
      if (!s || s.tipo === "simulacro" || s.fin) throw new Error("Sesión no válida");
      if (db.respuestas.some((r) => r.sesion_id === sesionId && r.pregunta_id === preguntaId)) throw new Error("Esta pregunta ya fue respondida");
      const p = pregunta(preguntaId);
      const ok = opcion === p.correcta;
      const xp = ok ? xpc("por_acierto", 10) * p.dificultad + (ms >= 5000 && ms <= xpc("segundos_bono", 120) * 1000 ? xpc("bono_ritmo", 5) : 0) : xpc("por_intento", 2);
      db.respuestas.push({ id: db.respuestas.length + 1, user_id: db.actual, pregunta_id: preguntaId, sesion_id: sesionId, opcion, correcta: ok, tiempo_ms: Math.round(ms), contexto: s.tipo, creado: ahora() });
      s.xp += xp; sumarXP(db.actual, xp); guardar();
      return espera({ correcta: ok, opcion_correcta: p.correcta, explicacion: p.explicacion, xp });
    },
    async finalizarReto(sesionId) {
      const s = db.sesiones.find((x) => x.id === sesionId && x.user_id === db.actual);
      if (s.fin) return espera(s.resultado);
      const rs = db.respuestas.filter((r) => r.sesion_id === sesionId);
      const ok = rs.filter((r) => r.correcta).length;
      let bono = 0;
      if (rs.length === s.total) {
        bono = xpc("reto_completo", 20) + (ok === s.total ? xpc("reto_perfecto", 30) : 0) + (s.tipo === "mision" ? xpc("mision", 40) : 0);
        if (s.mensaje_id) { const m = db.mensajes.find((x) => x.id === s.mensaje_id); if (m) { m.completado = true; m.sesion_id = s.id; } }
      }
      sumarXP(db.actual, bono);
      s.fin = ahora(); s.correctas = ok; s.xp += bono;
      s.resultado = { correctas: ok, respondidas: rs.length, total: s.total, xp: s.xp, bono };
      const nuevas = evaluarInsignias(db.actual);
      guardar();
      return espera({ ...s.resultado, nuevas_insignias: nuevas, xp_total: yo().xp });
    },
    async iniciarSimulacro(nivel) {
      const c = cfg("simulacros")[nivel];
      if (!c) throw new Error("Nivel de simulacro no válido");
      const abierto = db.sesiones.find((s) => s.user_id === db.actual && s.tipo === "simulacro" && !s.fin && s.limite > ahora());
      if (abierto) return espera({ sesion_id: abierto.id, nivel: abierto.nivel, limite: abierto.limite, ahora: ahora(), retomado: true, ...empaquetar(abierto.preguntas) });
      db.sesiones.filter((s) => s.user_id === db.actual && s.tipo === "simulacro" && !s.fin).forEach((s) => { s.fin = ahora(); s.correctas = 0; s.resultado = { abandonado: true }; });
      const porTexto = {};
      db.preguntas.filter((p) => p.activo).forEach((p) => (porTexto[p.texto_id] ||= []).push(p));
      const orden = Object.values(porTexto).map((ps) => ({ ps, s: Math.abs(ps.reduce((a, p) => a + p.dificultad, 0) / ps.length - (c.dificultad || 2)) + Math.random() * 1.2 })).sort((a, b) => a.s - b.s);
      let ids = [];
      for (const o of orden) { if (ids.length >= c.preguntas) break; ids = ids.concat(o.ps.sort((a, b) => a.codigo.localeCompare(b.codigo)).map((p) => p.id)); }
      ids = ids.slice(0, c.preguntas);
      const limite = new Date(Date.now() + Math.round((c.minutos * ids.length) / c.preguntas) * 60000).toISOString();
      const s = { id: uuid(), user_id: db.actual, tipo: "simulacro", nivel, total: ids.length, preguntas: ids, inicio: ahora(), limite, fin: null, xp: 0 };
      db.sesiones.push(s); guardar();
      return espera({ sesion_id: s.id, nivel, limite, ahora: ahora(), retomado: false, ...empaquetar(ids) });
    },
    async entregarSimulacro(sesionId, resp) {
      const s = db.sesiones.find((x) => x.id === sesionId && x.user_id === db.actual);
      if (s.fin) return espera(s.resultado);
      const porCat = {};
      const detalle = s.preguntas.map((id) => {
        const p = pregunta(id), r = resp[id] || {};
        const elegida = r.opcion ?? null, ok = elegida === p.correcta;
        db.respuestas.push({ id: db.respuestas.length + 1, user_id: db.actual, pregunta_id: id, sesion_id: s.id, opcion: elegida, correcta: ok, tiempo_ms: r.tiempo_ms ?? null, contexto: "simulacro", creado: ahora() });
        const c = (porCat[p.categoria] ||= { correctas: 0, total: 0 }); c.total++; if (ok) c.correctas++;
        return { pregunta_id: id, texto_id: p.texto_id, categoria: p.categoria, enunciado: p.enunciado, opciones: p.opciones, elegida, correcta: p.correcta, acierto: ok, explicacion: p.explicacion };
      });
      const ok = detalle.filter((d) => d.acierto).length;
      const xp = ok * xpc("simulacro_acierto", 12) + xpc("simulacro_completo", 60);
      s.fin = ahora(); s.correctas = ok; s.xp = xp;
      s.resultado = { correctas: ok, total: s.total, puntaje: Math.round((1000 * ok) / s.total) / 10, xp, tarde: false, respondidas: detalle.filter((d) => d.elegida != null).length, minutos: Math.round((Math.min(Date.now(), new Date(s.limite)) - new Date(s.inicio)) / 6000) / 10, por_categoria: porCat, detalle };
      sumarXP(db.actual, xp);
      const nuevas = evaluarInsignias(db.actual);
      guardar();
      return espera({ ...s.resultado, nuevas_insignias: nuevas, xp_total: yo().xp });
    },
    async detalleSesion(id) {
      const s = db.sesiones.find((x) => x.id === id);
      if (!s || (s.user_id !== db.actual && yo().rol !== "tutor")) throw new Error("Sesión no encontrada");
      const { preguntas, ...resto } = s;
      return espera({ sesion: resto, textos: empaquetar(preguntas).textos });
    },
    async registrarTiempo(seg) { const a = (db.actividad[db.actual] ||= {}); a[hoy()] = (a[hoy()] || 0) + Math.min(Math.max(seg, 0), 90); guardar(); },
    async resumen(id = null) {
      const uid = id || db.actual;
      if (uid !== db.actual) soloTutor();
      return espera(resumen(uid));
    },
    async mensajes(estudianteId = db.actual) { return espera(db.mensajes.filter((m) => m.estudiante_id === estudianteId).sort((a, b) => b.creado.localeCompare(a.creado))); },
    async marcarLeido(id) { const m = db.mensajes.find((x) => x.id === id && x.estudiante_id === db.actual); if (m) m.leido = true; guardar(); },

    // Tutor
    async panel() {
      soloTutor();
      const hace7 = new Date(Date.now() - 7 * 86400e3).toISOString();
      return espera(db.usuarios.filter((u) => u.rol === "estudiante" && u.activo).map((u) => {
        const rs = db.respuestas.filter((r) => r.user_id === u.id);
        const r7 = rs.filter((r) => r.creado > hace7);
        const act = db.actividad[u.id] || {};
        return { id: u.id, nombre: u.nombre, usuario: u.usuario, avatar: u.avatar, xp: u.xp, meta_programa: u.meta_programa, racha: rachas(u.id).actual,
          ultima_actividad: rs.map((r) => r.creado).sort().pop() || null,
          minutos_7d: Math.floor(Object.entries(act).filter(([f]) => f > restarDias(hoy(), 7)).reduce((a, [, s]) => a + s, 0) / 60),
          respuestas_7d: r7.length, precision_7d: r7.length ? Math.round((100 * r7.filter((r) => r.correcta).length) / r7.length) : null,
          alertas: db.alertas.filter((a) => a.estudiante_id === u.id && a.estado === "abierta").length };
      }));
    },
    async generarAlertas() {
      soloTutor();
      const um = cfg("alertas") || { dias_inactividad: 3, caida_puntos: 15, minimo_respuestas: 5 };
      const nombres = { literal: "literal", inferencial: "inferencial", critico: "crítico", cohesion: "de cohesión" };
      let n = 0;
      for (const e of db.usuarios.filter((u) => u.rol === "estudiante" && u.activo)) {
        const nom = e.nombre.split(" ")[0];
        const hace7 = new Date(Date.now() - 7 * 86400e3).toISOString();
        const yaAvisada = (tipo, cat, desde) => db.alertas.some((a) => a.estudiante_id === e.id && a.tipo === tipo && (!cat || a.detalle.categoria === cat) && (a.estado === "abierta" || a.creado > desde));
        const rs = db.respuestas.filter((r) => r.user_id === e.id);
        const ult = rs.map((r) => r.creado).sort().pop() || e.creado;
        const dias = Math.round((new Date(hoy()) - new Date(dia(ult))) / 86400e3);
        if (dias >= um.dias_inactividad && !yaAvisada("inactividad", null, ult)) {
          db.alertas.push({ id: uuid(), estudiante_id: e.id, tipo: "inactividad", detalle: { dias }, sugerencia: `Hola ${nom}, hace ${dias} días no te veo por aquí. Te dejé un reto corto de 5 preguntas para retomar el ritmo sin presión.`, estado: "abierta", creado: ahora() }); n++;
        }
        const t7 = new Date(Date.now() - 7 * 86400e3).toISOString(), t28 = new Date(Date.now() - 28 * 86400e3).toISOString();
        for (const c of ["literal", "inferencial", "critico", "cohesion"]) {
          const rc = rs.filter((r) => pregunta(r.pregunta_id)?.categoria === c && r.creado > t28);
          const a = rc.filter((r) => r.creado > t7), b = rc.filter((r) => r.creado <= t7);
          if (a.length < um.minimo_respuestas || b.length < um.minimo_respuestas) continue;
          const ahoraP = Math.round((100 * a.filter((r) => r.correcta).length) / a.length), antes = Math.round((100 * b.filter((r) => r.correcta).length) / b.length);
          if (antes - ahoraP >= um.caida_puntos && !yaAvisada("caida", c, hace7)) {
            db.alertas.push({ id: uuid(), estudiante_id: e.id, tipo: "caida", detalle: { categoria: c, antes, ahora: ahoraP }, sugerencia: `${nom}, esta semana el nivel ${nombres[c]} se puso más difícil. Te armé una misión de 10 preguntas para trabajarlo juntos; después me cuentas cuál te costó más.`, estado: "abierta", creado: ahora() }); n++;
          }
        }
      }
      guardar();
      return n;
    },
    async alertas() {
      soloTutor();
      return espera(db.alertas.filter((a) => a.estado === "abierta").map((a) => { const u = db.usuarios.find((x) => x.id === a.estudiante_id); return { ...a, perfiles: { nombre: u.nombre, avatar: u.avatar } }; }));
    },
    async cerrarAlerta(id, estado) { soloTutor(); db.alertas.find((a) => a.id === id).estado = estado; guardar(); },
    async enviarMensaje(m) { soloTutor(); const f = { id: uuid(), autor_id: db.actual, leido: false, completado: false, creado: ahora(), cuerpo: "", ...m }; db.mensajes.push(f); guardar(); return espera(f); },
    async borrarMensaje(id) { soloTutor(); db.mensajes = db.mensajes.filter((m) => m.id !== id); guardar(); },
    async preguntasFalladas(uid) {
      soloTutor();
      const m = {};
      db.respuestas.filter((r) => r.user_id === uid).sort((a, b) => a.creado.localeCompare(b.creado)).forEach((r) => {
        const x = (m[r.pregunta_id] ||= { fallos: 0, intentos: 0 }); x.intentos++; if (!r.correcta) x.fallos++; x.ultima_opcion = r.opcion; x.ult = r.creado;
      });
      return espera(Object.entries(m).filter(([, x]) => x.fallos > 0).sort((a, b) => b[1].fallos - a[1].fallos || b[1].ult.localeCompare(a[1].ult)).slice(0, 15)
        .map(([id, x]) => { const p = pregunta(id); return { id, codigo: p.codigo, categoria: p.categoria, dificultad: p.dificultad, enunciado: p.enunciado, opciones: p.opciones, correcta: p.correcta, explicacion: p.explicacion, texto: texto(p.texto_id).titulo, fallos: x.fallos, intentos: x.intentos, ultima_opcion: x.ultima_opcion }; }));
    },
    async resumenContenido() {
      soloTutor();
      const act = db.preguntas.filter((p) => p.activo);
      const matriz = {};
      act.forEach((p) => { (matriz[p.categoria] ||= {})[p.dificultad] = (matriz[p.categoria][p.dificultad] || 0) + 1; });
      const paq = {};
      db.preguntas.forEach((p) => (paq[p.paquete] = (paq[p.paquete] || 0) + 1));
      return espera({ textos: db.textos.filter((t) => t.activo).length, preguntas: act.length, matriz, paquetes: Object.entries(paq).map(([paquete, preguntas]) => ({ paquete, preguntas })) });
    },
    async importarPaquete(p) { soloTutor(); const r = aplicar(p); guardar(); return espera(r); }
  };
};

    const nombre = esc((r.perfil.nombre || "").split(" ")[0]);
    const retos = c.retos?.opciones || [];
    const debil = [...(r.dominio || [])].sort((a, b) => a.dominio - b.dominio)[0];

    LE.montar(`
      <div class="rejilla inicio">
        <div class="pila" style="--pila:1.25rem">
          <section class="panel saludo">
            <div class="fila">
              <div class="avatar-grande" aria-hidden="true">${esc(r.perfil.avatar)}</div>

                <h1>Hola, ${nombre}</h1>
                <p class="sub">${saludoDia(r)}</p>
              </div>
            </div>
            ${LE.pistaXP(r.perfil.xp)}
            <div class="chips">
              <span class="chip" title="Días seguidos con al menos una pregunta respondida">🔥 <b>${r.racha}</b> ${r.racha === 1 ? "día" : "días"} de racha</span>
              <span class="chip">⏱️ <b>${LE.minutos(r.minutos_hoy)}</b> hoy</span>
              <span class="chip">🏅 <b>${r.insignias.length}</b> insignias</span>
            </div>
          </section>

          ${pendientes.length ? `
          <section class="pila" style="--pila:.7rem" aria-label="Mensajes de tu tutor">
            <div class="titulo-seccion"><h2>De tu tutor</h2><a href="#/mensajes" class="pequeno">Ver todos</a></div>
            ${pendientes.slice(0, 2).map(tarjetaMensaje).join("")}
          </section>` : ""}

          <section class="panel">
            <div class="titulo-seccion"><h2>Reto de hoy</h2><span class="sub pequeno">Elige cuánto tiempo tienes</span></div>
            <div class="tracklist">
              ${retos.map((o) => `
                <button class="track" data-accion="reto" data-n="${o.n}">
                  <span class="n">${o.n}<small>preguntas</small></span>
                  <span><strong>${esc(o.nombre)}</strong><span class="sub pequeno">${esc(o.descripcion)} Unos ${o.minutos} min.</span></span>
                  <span class="play" aria-hidden="true">▶</span>
                </button>`).join("")}
            </div>
          </section>
        </div>

        <div class="pila" style="--pila:1.25rem">
          <section class="panel">
            <div class="titulo-seccion"><h2>Tu ecualizador</h2><span class="sub pequeno">Dominio de 0 a 100</span></div>
            ${LE.ecualizador(r.dominio, { vivo: true })}
            ${debil && r.totales.respuestas >= 8 ? `
              <p class="sub pequeno" style="margin-top:1rem">Tu nivel más bajo ahora es <b style="color:var(--texto)">${esc(LE.cat(debil.categoria).nombre)}</b>: ${esc(LE.cat(debil.categoria).descripcion.toLowerCase())}</p>
              <button class="btn sec chico" style="margin-top:.8rem" data-accion="reto" data-n="5" data-cat="${debil.categoria}">Practicar 5 de ${esc(LE.cat(debil.categoria).nombre.toLowerCase())}</button>` : ""}
          </section>
          <section class="panel">
            <div class="titulo-seccion"><h2>Simulacro</h2></div>
            <p class="sub">${r.simulacros.length ? `Último: <b style="color:var(--texto)">${r.simulacros[0].puntaje}%</b> en nivel ${esc(c.simulacros?.[r.simulacros[0].nivel]?.nombre || r.simulacros[0].nivel)}, ${esc(LE.hace(r.simulacros[0].fecha))}.` : "Todavía no has hecho ninguno. El inicial te da tu punto de partida."}</p>
            <a class="btn sec" href="#/simulacro" style="margin-top:1rem">Ver niveles de simulacro</a>
          </section>

  function saludoDia(r) {
    if (r.minutos_hoy >= 20) return "Ya cumpliste tu práctica de hoy. Todo lo que sumes es extra.";
    if (r.racha >= 3) return `Llevas ${r.racha} días seguidos. Un reto hoy y la racha sigue.`;
    if (r.racha === 0 && r.mejor_racha > 0) return "Hoy es buen día para empezar una racha nueva.";
    return "Elige un reto y empieza a sumar.";
  }

  function tarjetaMensaje(m) {
    const cat = m.mision?.categoria;
    const tipo = m.tipo === "mision" ? "Misión" : m.tipo === "comentario" ? "Sobre una pregunta" : "Mensaje";
    return `<article class="mensaje ${m.tipo}">
      <span class="de">${tipo} · ${esc(LE.hace(m.creado))}${!m.leido ? '<span class="nuevo">nuevo</span>' : ""}</span>
      <h3>${esc(m.titulo)}</h3>
      ${m.cuerpo ? `<p>${esc(m.cuerpo)}</p>` : ""}
      ${m.tipo === "comentario" && m.mision?.cita ? `<div class="cita">«${esc(m.mision.cita)}»${m.mision.correcta ? `<br><span class="pequeno">Respuesta correcta: ${esc(m.mision.correcta)}</span>` : ""}</div>` : ""}
      ${m.tipo === "mision" ? (m.completado
        ? `<p class="hecho" style="margin-top:.6rem">✓ Misión cumplida</p>`
        : `<button class="btn chico" style="margin-top:.8rem" data-accion="mision" data-id="${m.id}" data-n="${m.mision?.n || 10}" data-cat="${cat || ""}">Empezar misión: ${m.mision?.n || 10} preguntas${cat ? " de " + esc(LE.cat(cat).nombre.toLowerCase()) : ""}</button>`)
        : !m.leido ? `<button class="enlace pequeno" style="margin-top:.6rem;display:block" data-accion="leido" data-id="${m.id}">Marcar como leído</button>` : ""}
    </article>`;
  }

    b.remove();

  LE.ruta("/mensajes", async () => {

    const msgs = await LE.api.mensajes();
    LE.montar(`<div class="pila" style="max-width:44rem">
      <h1>Mensajes</h1>
      <p class="sub">Todo lo que tu tutor te ha escrito: mensajes, misiones y comentarios sobre tus respuestas.</p>
      ${msgs.length ? msgs.map(tarjetaMensaje).join("") : `<div class="vacio"><p>Aún no hay mensajes. Cuando tu tutor te escriba, aparecerá aquí.</p></div>`}
    </div>`);
    const porLeer = msgs.filter((m) => !m.leido && m.tipo !== "mision");

    LE.actualizarPunto();

  // =================================================================
  //  RETO (y misión)
  // =================================================================
  A.reto = (b) => empezarReto(+b.dataset.n, b.dataset.cat || null, null, b);
  A.mision = (b) => { LE.api.marcarLeido(b.dataset.id).then(() => LE.actualizarPunto()); empezarReto(+b.dataset.n, b.dataset.cat || null, b.dataset.id, b); };

  async function empezarReto(n, cat, mensajeId, boton) {
    if (boton) boton.disabled = true;
    try {
      const datos = await LE.api.iniciarReto(n, cat, mensajeId);
      LE.estado.sesion = { datos, i: 0, marcas: [], xp: 0, sel: null, respondida: null, t0: performance.now(), mision: !!mensajeId, cat };
      LE.ir("#/reto");
    } catch (e) { LE.error(e); if (boton) boton.disabled = false; }
  }

  LE.ruta("/reto", () => {
    const s = LE.estado.sesion;
    if (!s || !s.datos?.preguntas) return LE.ir("#/inicio");
    if (s.final) return pintarFinal();
    pintarPregunta();
  }, { sesion: true, estudiante: true });

  function pintarPregunta() {
    const s = LE.estado.sesion;
    const p = s.datos.preguntas[s.i];
    const t = s.datos.textos[p.texto_id];
    const total = s.datos.preguntas.length;
    const r = s.respondida;
    const mismaLectura = s.i > 0 && s.datos.preguntas[s.i - 1].texto_id === p.texto_id;
    LE.montar(`
      <div class="sesion-cab">
        <button class="btn suave chico" data-accion="salirReto">Salir</button>
        <div class="progreso" aria-label="Pregunta ${s.i + 1} de ${total}">
          ${s.datos.preguntas.map((_, k) => `<i class="${k < s.marcas.length ? (s.marcas[k] ? "ok" : "mal") : k === s.i ? "act" : ""}"></i>`).join("")}
        </div>
        <span class="xp-vivo" aria-live="polite">+${s.xp} XP</span>
      </div>
      <div class="juego">
        <div>${LE.lecturaHTML(t, !mismaLectura)}</div>
        <section class="pregunta cr-${p.categoria}">
          <div class="meta"><span class="etq">${esc(LE.cat(p.categoria).nombre)}</span><span class="dif" title="Dificultad ${p.dificultad} de 3">${"●".repeat(p.dificultad)}${"○".repeat(3 - p.dificultad)}</span><span class="tenue">Pregunta ${s.i + 1} de ${total}</span></div>
          <p class="enunciado">${esc(p.enunciado)}</p>
          <div class="opciones" role="radiogroup">
            ${p.opciones.map((o, k) => {
              let cls = "";
              if (r) { if (k === r.opcion_correcta) cls = "bien"; else if (k === s.sel) cls = "malo"; }
              else if (k === s.sel) cls = "sel";
              return `<button class="opcion ${cls}" role="radio" aria-checked="${k === s.sel}" data-accion="elegir" data-k="${k}" ${r ? "disabled" : ""}><span class="letra">${LE.LETRAS[k]}</span><span>${esc(o)}</span></button>`;
            }).join("")}
          </div>
          ${r ? `<div class="retro ${r.correcta ? "bien" : "malo"}" role="status">
              <strong>${r.correcta ? "Correcto" : "La respuesta era la " + LE.LETRAS[r.opcion_correcta]} · +${r.xp} XP</strong>
              <p>${esc(r.explicacion)}</p>
            </div>
            <div class="acciones"><button class="btn" data-accion="siguiente" id="btn-sig">${s.i + 1 < total ? "Siguiente pregunta" : "Ver resultado"}</button></div>`
          : `<div class="acciones"><button class="btn" data-accion="confirmar" ${s.sel == null ? "disabled" : ""}>Confirmar respuesta</button></div>`}
        </section>
      </div>`);
    if (r) $("#btn-sig")?.focus();
  }

  A.elegir = (b) => {
    const s = LE.estado.sesion;
    if (s.respondida) return;
    s.sel = +b.dataset.k;
    $$(".opcion").forEach((o, k) => { o.classList.toggle("sel", k === s.sel); o.setAttribute("aria-checked", k === s.sel); });
    $('[data-accion="confirmar"]').disabled = false;
  };

  A.confirmar = async (b) => {
    const s = LE.estado.sesion;
    if (s.sel == null || s.respondida) return;
    b.disabled = true;
    try {
      const p = s.datos.preguntas[s.i];
      const r = await LE.api.responder(s.datos.sesion_id, p.id, s.sel, performance.now() - s.t0);
      s.respondida = r; s.marcas.push(r.correcta); s.xp += r.xp;
      pintarPregunta();
      window.scrollTo({ top: document.querySelector(".retro").getBoundingClientRect().top + scrollY - 120, behavior: "smooth" });
    } catch (e) { LE.error(e); b.disabled = false; }
  };

  A.siguiente = async (b) => {
    const s = LE.estado.sesion;
    if (s.i + 1 < s.datos.preguntas.length) {
      s.i++; s.sel = null; s.respondida = null; s.t0 = performance.now();
      pintarPregunta();
    } else {
      b.disabled = true;
      await terminarReto();
    }
  };

  A.salirReto = async () => {
    const s = LE.estado.sesion;
    const ok = await LE.confirmar("¿Terminar el reto ahora?", `Llevas ${s.marcas.length} de ${s.datos.preguntas.length} preguntas. Se guarda lo que respondiste, pero el bono por reto completo solo llega si terminas.`, "Terminar ahora", "Seguir");
    if (!ok) return;
    if (!s.marcas.length) { LE.estado.sesion = null; return LE.ir("#/inicio"); }
    await terminarReto();
  };

  async function terminarReto() {
    const s = LE.estado.sesion;
    try {
      s.final = await LE.api.finalizarReto(s.datos.sesion_id);
      LE.estado.perfil.xp = s.final.xp_total ?? LE.estado.perfil.xp;
      pintarFinal();
      await LE.premios(s.final.nuevas_insignias);
    } catch (e) { LE.error(e); }
  }

  function pintarFinal() {
    const s = LE.estado.sesion, f = s.final;
    const pct = f.total ? f.correctas / f.total : 0;
    const frase = pct === 1 ? "Perfecto. Ni una sola equivocación." : pct >= 0.8 ? "Muy buen ritmo." : pct >= 0.5 ? "Vas bien. Revisa las explicaciones de las que fallaste." : "Hoy costó. Las preguntas falladas volverán en unos días para que las domines.";
    const porCat = {};
    s.datos.preguntas.forEach((p, k) => { if (k < s.marcas.length) { const c = (porCat[p.categoria] ||= [0, 0]); c[1]++; if (s.marcas[k]) c[0]++; } });
    LE.montar(`
      <div class="pila" style="max-width:40rem;margin:0 auto;--pila:1.25rem">
        <div class="marcador">
          <span class="sub">${s.mision ? "Misión terminada" : "Reto terminado"}</span>
          <span class="pct" style="color:var(--rosa)">${f.correctas}/${f.total}</span>
          <p class="sub">${frase}</p>
        </div>
        <div class="progreso">${s.marcas.map((m) => `<i class="${m ? "ok" : "mal"}"></i>`).join("")}</div>
        <div class="stats">
          <div class="stat"><b style="color:var(--amarillo)">+${f.xp}</b><span>XP${f.bono ? ` (incluye ${f.bono} de bono)` : ""}</span></div>
          ${Object.entries(porCat).map(([c, [ok, t]]) => `<div class="stat cr-${c}"><b style="color:var(--c)">${ok}/${t}</b><span>${esc(LE.cat(c).nombre)}</span></div>`).join("")}
        </div>
        ${LE.pistaXP(LE.estado.perfil.xp)}
        <div class="acciones" style="justify-content:flex-start">
          <button class="btn" data-accion="otroReto" data-n="${s.datos.preguntas.length}">Otro reto igual</button>
          <button class="btn sec" data-accion="volverInicio">Volver al inicio</button>
        </div>
      </div>`);
  }

  A.otroReto = (b) => { const cat = LE.estado.sesion?.cat; LE.estado.sesion = null; empezarReto(+b.dataset.n, cat, null, b); };
  A.volverInicio = () => { LE.estado.sesion = null; LE.ir("#/inicio"); };

  // =================================================================
  //  SIMULACRO: niveles
  // =================================================================
  LE.ruta("/simulacro", async () => {
    LE.cargando();
    const r = await LE.api.resumen();
    const niveles = LE.estado.config.simulacros || {};
    LE.montar(`
      <div class="pila" style="--pila:1.5rem">
        <div class="pila" style="--pila:.4rem">
          <h1>Simulacro</h1>
          <p class="sub" style="max-width:60ch">Condiciones de examen: tiempo límite, sin explicaciones hasta el final y textos completos con todas sus preguntas. Cuando se acaba el tiempo, se entrega solo. Como en la prueba real, una respuesta vacía vale lo mismo que una incorrecta: responde todas.</p>
        </div>
        <div class="niveles">
          ${Object.entries(niveles).map(([k, n]) => `
            <article class="nivel">
              <h2>${esc(n.nombre)}</h2>
              <div class="grande">${n.preguntas}<small>preguntas</small></div>
              <p class="sub">${esc(n.descripcion || "")}</p>
              <p><b>${n.minutos} minutos</b> <span class="tenue">· ${Math.round((n.minutos * 60) / n.preguntas)} s por pregunta</span></p>
              <button class="btn color cr-violeta" data-accion="simulacro" data-nivel="${k}">Empezar ${esc(n.nombre.toLowerCase())}</button>
            </article>`).join("")}
        </div>
        <section class="panel">
          <div class="titulo-seccion"><h2>Tus simulacros</h2></div>
          ${r.simulacros.length ? `<div class="scroll-x"><table class="tabla">
            <thead><tr><th>Fecha</th><th>Nivel</th><th class="num">Aciertos</th><th class="num">Puntaje</th><th></th></tr></thead>
            <tbody>${r.simulacros.map((x) => `<tr><td>${LE.fecha(x.fecha)}</td><td>${esc(niveles[x.nivel]?.nombre || x.nivel)}</td><td class="num">${x.correctas}/${x.total}</td><td class="num"><b>${x.puntaje}%</b></td><td><a href="#/diagnostico/${x.id}">Ver diagnóstico</a></td></tr>`).join("")}</tbody>
          </table></div>` : `<p class="sub">Aquí verás tu evolución simulacro a simulacro.</p>`}
        </section>
      </div>`);
  }, { estudiante: true });

  A.simulacro = async (b) => {
    const n = LE.estado.config.simulacros[b.dataset.nivel];
    const ok = await LE.confirmar(`Simulacro ${n.nombre.toLowerCase()}`, `${n.preguntas} preguntas en ${n.minutos} minutos. El reloj arranca apenas empieces y no se detiene si cierras la app. ¿Tienes el tiempo libre ahora?`, "Empezar", "Todavía no");
    if (!ok) return;
    b.disabled = true;
    try {
      const d = await LE.api.iniciarSimulacro(b.dataset.nivel);
      if (!d.retomado && d.preguntas.length < n.preguntas) LE.aviso(`Por ahora el banco tiene ${d.preguntas.length} preguntas: este simulacro usa todas, con el tiempo ajustado.`);
      iniciarSimulacro(d);
    } catch (e) { LE.error(e); b.disabled = false; }
  };

  const leerLocal = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const escribirLocal = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

  function iniciarSimulacro(d) {
    const guardado = leerLocal("sim-" + d.sesion_id);
    LE.estado.sim = {
      datos: d, i: guardado?.i || 0, resp: guardado?.resp || {}, marcadas: new Set(guardado?.marcadas || []),
      desfase: new Date(d.ahora).getTime() - Date.now(), tEntrada: Date.now(), timer: null, entregando: false
    };
    if (d.retomado) LE.aviso("Retomaste el simulacro que tenías abierto.");
    LE.ir("#/simulacro/jugar");
  }

  const guardarSim = () => { const m = LE.estado.sim; escribirLocal("sim-" + m.datos.sesion_id, { i: m.i, resp: m.resp, marcadas: [...m.marcadas] }); };
  const restante = () => { const m = LE.estado.sim; return Math.max(0, new Date(m.datos.limite).getTime() - (Date.now() + m.desfase)); };
  const fmtReloj = (ms) => { const s = Math.ceil(ms / 1000); const h = Math.floor(s / 3600), mi = Math.floor((s % 3600) / 60), se = s % 60; return (h ? h + ":" + String(mi).padStart(2, "0") : mi) + ":" + String(se).padStart(2, "0"); };

  LE.ruta("/simulacro/jugar", () => {
    const m = LE.estado.sim;
    if (!m) return LE.ir("#/simulacro");
    clearInterval(m.timer);
    m.avisos = m.avisos || {};
    m.timer = setInterval(() => {
      if (!location.hash.startsWith("#/simulacro/jugar")) return clearInterval(m.timer);
      const ms = restante();
      const el = $("#reloj");
      if (el) { el.textContent = fmtReloj(ms); el.classList.toggle("aviso", ms < 600000 && ms >= 180000); el.classList.toggle("urgente", ms < 180000); }
      if (ms < 600000 && !m.avisos.diez) { m.avisos.diez = 1; LE.aviso("Quedan 10 minutos. Asegúrate de marcar todas."); }
      if (ms < 60000 && !m.avisos.uno) { m.avisos.uno = 1; LE.aviso("Queda 1 minuto."); }
      if (ms <= 0) { clearInterval(m.timer); entregar(true); }
    }, 1000);
    pintarSim();
  }, { sesion: true, estudiante: true });

  function pintarSim() {
    const m = LE.estado.sim;
    const ps = m.datos.preguntas;
    const p = ps[m.i];
    const t = m.datos.textos[p.texto_id];
    const elegida = m.resp[p.id]?.opcion;
    const nResp = Object.values(m.resp).filter((x) => x.opcion != null).length;
    const ms = restante();
    const mismaLectura = m.i > 0 && ps[m.i - 1].texto_id === p.texto_id;
    LE.montar(`
      <div class="sesion-cab">
        <span class="reloj ${ms < 180000 ? "urgente" : ms < 600000 ? "aviso" : ""}" id="reloj" role="timer" aria-label="Tiempo restante">${fmtReloj(ms)}</span>
        <span class="sub">${nResp} de ${ps.length} respondidas</span>
        <span style="flex:1"></span>
        <button class="btn chico color cr-violeta" data-accion="entregar">Entregar</button>
      </div>
      <div class="juego">
        <div>${LE.lecturaHTML(t, !mismaLectura)}</div>
        <section class="pregunta">
          <div class="meta"><span class="tenue">Pregunta ${m.i + 1} de ${ps.length}</span></div>
          <p class="enunciado">${esc(p.enunciado)}</p>
          <div class="opciones" role="radiogroup">
            ${p.opciones.map((o, k) => `<button class="opcion ${k === elegida ? "sel" : ""}" role="radio" aria-checked="${k === elegida}" data-accion="simElegir" data-k="${k}"><span class="letra">${LE.LETRAS[k]}</span><span>${esc(o)}</span></button>`).join("")}
          </div>
          <div class="acciones" style="justify-content:space-between">
            <button class="btn suave chico" data-accion="simMarcar">${m.marcadas.has(p.id) ? "Quitar marca" : "Marcar para revisar"}</button>
            <span class="fila">
              <button class="btn sec chico" data-accion="simIr" data-i="${m.i - 1}" ${m.i === 0 ? "disabled" : ""}>Anterior</button>
              <button class="btn chico" data-accion="simIr" data-i="${m.i + 1}" ${m.i + 1 >= ps.length ? "disabled" : ""}>Siguiente</button>
            </span>
          </div>

              ${msgs.length ? msgs.map((m) => `
                <article class="mensaje ${m.tipo}">
                  <div class="fila entre"><span class="de">${m.tipo === "mision" ? "Misión" : m.tipo === "comentario" ? "Comentario" : "Mensaje"} · ${esc(LE.hace(m.creado))}</span>
                  <span class="pequeno ${m.completado ? "hecho" : "tenue"}">${m.tipo === "mision" ? (m.completado ? "✓ cumplida" : "pendiente") : m.leido ? "leído" : "sin leer"}</span></div>

          ${falladas.length ? falladas.map((f, k) => (k === 6 ? `<details class="pila" style="--pila:.8rem"><summary class="enlace" style="list-style:none">Ver ${falladas.length - 6} más</summary>` : "") + `
            <article class="fallada cr-${f.categoria}">
              <div class="fila entre"><span class="fila"><span class="etq">${esc(LE.cat(f.categoria).nombre)}</span><span class="tenue pequeno">${esc(f.texto)}</span></span><span class="pequeno"><b>${f.fallos}</b> de ${f.intentos} intentos mal</span></div>
              <b>${esc(f.enunciado)}</b>
              <div class="ops">${f.opciones.map((o, j) => `<span class="${j === f.correcta ? "ok" : j === f.ultima_opcion ? "ult" : ""}">${LE.LETRAS[j]}. ${esc(o)}${j === f.correcta ? " ✓" : j === f.ultima_opcion ? " ← su última respuesta" : ""}</span>`).join("")}</div>
              <details><summary class="pequeno sub" style="cursor:pointer">Explicación del banco</summary><p class="sub pequeno" style="margin-top:.4rem">${esc(f.explicacion)}</p></details>
