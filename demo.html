d, y en tres días había prestado todos y tenía lista de espera. La comparación entre lo previsto y lo ocurrido no está dicha con esas palabras, pero se saca juntando la cita de Henao con el dato del párrafo anterior."}, {"codigo": "P005-T02-03", "categoria": "critico", "dificultad": 1, "enunciado": "¿Cuál de las siguientes afirmaciones de la noticia es una opinión y no un hecho comprobable?", "opciones": ["Que el programa arrancó con 34 instrumentos donados.", "Que los menores necesitan la firma de un adulto.", "Que había una lista de espera de 23 personas.", "Que el programa «durará lo que duren las cuerdas»."], "correcta": 3, "explicacion": "Un hecho se puede verificar: contar los instrumentos, revisar la lista, leer el reglamento. La frase de Hernán Ossa es un pronóstico: dice lo que él cree que pasará. Una noticia bien escrita marca esa diferencia con verbos como «cree» o «dice» y con las comillas."}, {"codigo": "P005-T02-04", "categoria": "critico", "dificultad": 2, "enunciado": "¿Cuál de los siguientes titulares sería más fiel al contenido de la noticia?", "opciones": ["Secretaría de Cultura extiende préstamo de instrumentos a todo el municipio", "Biblioteca de barrio agota en tres días sus instrumentos en préstamo", "Fracasa préstamo de instrumentos por falta de mantenimiento", "Jóvenes abandonan talleres de música por no tener instrumento"], "correcta": 1, "explicacion": "Un titular fiel dice lo que ocurrió, no lo que podría ocurrir. El programa no ha fracasado: alguien teme que fracase. La Secretaría no lo ha extendido: lo evaluará en diciembre. Y los jóvenes no abandonaron los talleres: no podían practicar en casa. Los tres titulares falsos convierten una posibilidad o un detalle en el hecho principal."}, {"codigo": "P005-T02-05", "categoria": "cohesion", "dificultad": 1, "enunciado": "En el cuarto párrafo, la oración «No todos comparten el entusiasmo» cumple la función de:", "opciones": ["Anunciar que enseguida viene una opinión contraria.", "Resumir lo que acaba de decir la coordinadora.", "Corregir un dato de los párrafos anteriores.", "Cerrar la noticia con una conclusión general."], "correcta": 0, "explicacion": "Es una oración de transición: avisa al lector que el texto cambia de voz. Hasta ahí habló la biblioteca; ahora hablará alguien que duda. Reconocer estas bisagras ayuda a seguir un texto que presenta más de una postura."}]}, {"codigo": "P005-T03", "titulo": "En defensa del aburrimiento", "tipologia": "argumentativo", "fuente": "Columna de opinión original, escrita para práctica.", "contenido": "Mi abuela decía que el aburrimiento es la antesala de las travesuras, y lo decía como advertencia. Con los años he llegado a creer que acertaba en la imagen y se equivocaba en el tono: el aburrimiento es, en efecto, una antesala, pero de ella no solo salen travesuras. Salen también los juegos inventados, las preguntas raras, los dibujos al margen del cuaderno; sale, en una palabra, casi todo lo que un niño hace por su cuenta.\n\nHoy esa antesala está clausurada. Un niño que espera en un consultorio, que viaja en bus o que se queda diez minutos sin tarea tiene en la mano una pantalla que le promete que no se aburrirá jamás. La promesa se cumple, y ese es el problema. Aburrirse es incómodo, y de la incomodidad nace la necesidad de hacer algo con ella. Quien nunca se aburre nunca llega a esa necesidad: consume lo que otros hicieron para llenarle el rato.\n\nSe me dirá que exagero, que los niños de ahora también crean, y que muchos lo hacen precisamente con sus aparatos: editan videos, componen canciones, diseñan mundos enteros. Es verdad, y me alegra. Pero basta mirar con atención para advertir que esos niños son los que usan la pantalla como herramienta y no como relleno; la diferencia entre ambos usos es justamente la que hay entre hacer y esperar a que pase el tiempo.\n\nNo hace falta, por lo demás, acudir a los estudios. Todos los grandes inventos de la humanidad nacieron de una tarde vacía: Newton estaba ocioso bajo un manzano y Arquímedes, metido en la bañera. Y yo mismo, que no he inventado nada, les debo a las siestas interminables en la finca de mis tíos la costumbre de leer.\n\nNo propongo prohibir nada. Propongo algo más modesto y más difícil: que los adultos dejemos de tratar el aburrimiento de los niños como una emergencia. La próxima vez que uno diga «estoy aburrido», quizá la mejor respuesta no sea alcanzarle un aparato, sino contestar, como mi abuela: «Pues algo se te ocurrirá».", "preguntas": [{"codigo": "P005-T03-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el segundo párrafo, ¿por qué es un problema que la pantalla cumpla su promesa?", "opciones": ["Porque las pantallas terminan aburriendo más que cualquier sala de espera.", "Porque, al evitar la incomodidad, quita la necesidad de inventar algo.", "Porque lo que muestran las pantallas fue hecho por personas poco creativas.", "Porque los niños dejan de ir al consultorio y de viajar en bus con sus padres."], "correcta": 1, "explicacion": "El párrafo encadena tres pasos: aburrirse incomoda; de la incomodidad «nace la necesidad de hacer algo»; quien nunca se aburre «nunca llega a esa necesidad». La promesa cumplida corta la cadena en el primer eslabón. El autor no dice que las pantallas aburran ni juzga a quienes hacen sus contenidos."}, {"codigo": "P005-T03-02", "categoria": "inferencial", "dificultad": 3, "enunciado": "De la distinción entre usar la pantalla «como herramienta» y «como relleno» se deduce que, para el autor, el problema de fondo es:", "opciones": ["La pasividad con que se llena el tiempo, no el aparato.", "El exceso de tareas, que no deja tiempo para jugar.", "La falta de talento de quienes no editan ni componen.", "La tecnología, que debería mantenerse lejos de los niños."], "correcta": 0, "explicacion": "Si el mismo aparato sirve para crear y para matar el tiempo, el problema no puede ser el aparato. Lo que el autor opone es «hacer» y «esperar a que pase el tiempo». Leer la columna como un ataque a la tecnología es quedarse con el segundo párrafo y pasar por alto la concesión del tercero."}, {"codigo": "P005-T03-03", "categoria": "critico", "dificultad": 2, "enunciado": "¿A quién se dirige principalmente la columna?", "opciones": ["A los investigadores que estudian la infancia.", "A los niños que se aburren con facilidad.", "A los adultos que tienen niños a su cargo.", "A los fabricantes de aparatos electrónicos."], "correcta": 2, "explicacion": "La propuesta final lo revela: «que los adultos dejemos de tratar el aburrimiento de los niños como una emergencia». El autor se incluye («dejemos») y habla de los niños en tercera persona. Saber a quién le habla un texto ayuda a entender qué quiere conseguir: aquí, cambiar una reacción de los mayores."}, {"codigo": "P005-T03-04", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de los argumentos del autor es el más débil desde el punto de vista lógico?", "opciones": ["Que muchos adultos tratan el aburrimiento como una emergencia.", "Que algunos niños usan la pantalla para crear cosas.", "Que la incomodidad de aburrirse empuja a hacer algo.", "Que todos los grandes inventos nacieron de una tarde vacía."], "correcta": 3, "explicacion": "Es una generalización absoluta («todos») sostenida en dos anécdotas legendarias y en un recuerdo personal. Bastaría un invento nacido del trabajo en equipo o de la urgencia para desmentirla. Las palabras «todos», «siempre» y «nunca» merecen sospecha: prometen más de lo que dos ejemplos pueden pagar. Además, el autor acaba de decir que no hace falta acudir a los estudios, que es justo donde habría evidencia."}, {"codigo": "P005-T03-05", "categoria": "critico", "dificultad": 3, "enunciado": "El autor escribe en el último párrafo: «No propongo prohibir nada». ¿Es coherente esa afirmación con el resto de la columna?", "opciones": ["Sí: critica un uso de la pantalla y pide a los adultos cambiar de actitud, no una prohibición.", "No: en el tercer párrafo condena a los niños que editan videos y componen canciones.", "Sí: porque a lo largo del texto defiende que los niños pasen más tiempo con sus aparatos.", "No: en el segundo párrafo exige retirar las pantallas de los consultorios y de los buses."], "correcta": 0, "explicacion": "Para evaluar la coherencia hay que volver sobre cada párrafo. El segundo describe un problema, no pide retirar nada; el tercero celebra a los niños que crean («Es verdad, y me alegra»); el último propone un cambio en los adultos. La afirmación es coherente, pero no porque el autor defienda más pantallas: la razón importa tanto como el «sí»."}, {"codigo": "P005-T03-06", "categoria": "cohesion", "dificultad": 3, "enunciado": "En el tercer párrafo, la secuencia «Se me dirá que exagero… Es verdad, y me alegra. Pero basta mirar con atención…» tiene una estructura de:", "opciones": ["Enumeración de tres razones a favor de una misma idea.", "Error reconocido y cambio de tesis.", "Objeción prevista, concesión y restricción.", "Causa, consecuencia y conclusión final."], "correcta": 2, "explicacion": "Son tres movimientos enlazados: el autor anticipa lo que le replicarán («Se me dirá»), lo admite («Es verdad») y luego limita su alcance («Pero»). El «pero» no borra la concesión; la deja en pie y le pone un borde. No hay cambio de tesis: la columna termina defendiendo lo mismo que empezó."}]}, {"codigo": "P005-T04", "titulo": "Letras de aviso", "tipologia": "literario", "fuente": "Relato original para práctica.", "contenido": "En la casa había cuatro bocas y un solo sueldo, de modo que el papel era un lujo. Yo dibujaba en el revés de las facturas de la tienda, con el lápiz de apuntar los fiados, y escondía los dibujos debajo de la registradora.\n\nEl que los encontró fue don Efraín, que venía todas las tardes por un tinto y medio pan. Había pintado, decían, la mitad de los avisos del pueblo, hasta que llegaron los letreros de plástico. Sacó los papeles uno por uno, los miró del derecho y del revés, y no dijo si eran buenos o malos.\n\n—¿Esta es tu mamá? —preguntó por fin.\n\nAsentí. La había dibujado de espaldas, alcanzando un tarro en la repisa más alta.\n\n—Le hiciste los brazos muy largos, niña.\n\n—Es que ella alcanza todo —dije.\n\nDon Efraín se rio sin ruido, con los hombros. Luego pidió prestado el lápiz y, en una esquina de la factura, trazó tres rayas: un brazo, nada más, doblado apenas en el codo. No se parecía al mío. Era más corto y, no sé cómo, llegaba más lejos.\n\n—El brazo no alcanza porque sea largo —dijo—. Alcanza porque el cuerpo entero se empina.\n\nAl día siguiente no vino, ni al otro. El sábado mi mamá encontró junto a la puerta una caja de cartón con mi nombre escrito en letras de aviso, rojas, con sombra. Adentro había un bloc sin estrenar y un lápiz tan corto que apenas se podía agarrar.\n\nTodavía lo tengo. Nunca le he sacado punta.", "preguntas": [{"codigo": "P005-T04-01", "categoria": "literal", "dificultad": 1, "enunciado": "¿Dónde dibujaba la narradora cuando era niña?", "opciones": ["En los cuadernos que le daban en la escuela.", "En un bloc que le había regalado su mamá.", "En los avisos de plástico del pueblo.", "En el revés de las facturas de la tienda."], "correcta": 3, "explicacion": "El primer párrafo lo dice: «Yo dibujaba en el revés de las facturas de la tienda». El bloc aparece solo al final, y no se lo regala la mamá."}, {"codigo": "P005-T04-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "¿Qué detalle permite saber quién dejó la caja junto a la puerta?", "opciones": ["El bloc sin estrenar que venía adentro.", "El nombre escrito en letras de aviso.", "El cartón del que estaba hecha la caja.", "El hecho de que la caja apareciera un sábado."], "correcta": 1, "explicacion": "El relato no nombra a quien dejó la caja, pero deja una firma: las letras de aviso son las del oficio de don Efraín, que había pintado «la mitad de los avisos del pueblo». En los relatos, un detalle que parece decorativo suele estar ahí para que el lector saque la conclusión."}, {"codigo": "P005-T04-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "En «había cuatro bocas y un solo sueldo», el uso de «bocas» para referirse a las personas de la casa es:", "opciones": ["Un símil", "Una hipérbole", "Una antítesis", "Una sinécdoque"], "correcta": 3, "explicacion": "La sinécdoque nombra el todo por una de sus partes: aquí, las personas por sus bocas, que es la parte que importa cuando se habla de alimentar una casa. No hay comparación con «como» (símil) ni exageración (hipérbole). La frase opone «cuatro» a «un solo», pero la pregunta es por la palabra «bocas», no por ese contraste."}, {"codigo": "P005-T04-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "El lápiz que aparece en la caja es «tan corto que apenas se podía agarrar». Lo más razonable es inferir que:", "opciones": ["Don Efraín se equivocó de lápiz en el momento de armar la caja.", "Don Efraín no tenía dinero suficiente para comprarle a la niña un lápiz nuevo.", "Era su propio lápiz de trabajo, y al darlo le entrega algo de su oficio.", "Don Efraín quería que la niña se cansara pronto y dejara de dibujar."], "correcta": 2, "explicacion": "El bloc es nuevo y el lápiz no: si don Efraín pudo comprar lo más caro, el lápiz gastado no es cuestión de dinero. Un rotulista que ya no pinta avisos le deja a una niña que dibuja la herramienta con la que trabajó. El relato no lo dice; pone juntos los dos objetos y confía en el lector."}, {"codigo": "P005-T04-05", "categoria": "critico", "dificultad": 1, "enunciado": "¿Desde qué momento cuenta la historia la narradora?", "opciones": ["Desde el punto de vista de don Efraín, ya viejo.", "Desde la adultez, recordando un episodio de su infancia.", "Desde el punto de vista de su mamá, en la tienda.", "Desde la infancia, mientras ocurren los hechos."], "correcta": 1, "explicacion": "Todo el relato está en pasado y en primera persona, y la última línea salta al presente: «Todavía lo tengo». Ese «todavía» mide la distancia entre la niña que recibió el lápiz y la adulta que lo cuenta."}]}, {"codigo": "P005-T05", "titulo": "Talleres de vacaciones: ficha comparativa", "tipologia": "discontinuo", "fuente": "Ficha ficticia, elaborada para práctica.", "contenido": "### Casa de la Cultura · Talleres de vacaciones\n\n**Grabado**\n- Edad mínima: 14 años\n- Sesiones: 8 (martes y jueves, de 2:00 a 4:00 p. m.)\n- Valor: 120.000 pesos, materiales incluidos\n- Cupo: 12 personas\n\n**Fotografía con celular**\n- Edad mínima: 12 años\n- Sesiones: 4 (sábados, de 9:00 a. m. a 12:00 m.)\n- Valor: gratuito. Cada participante lleva su celular\n- Cupo: 25 personas\n\n**Cerámica**\n- Edad mínima: 16 años\n- Sesiones: 10 (lunes, miércoles y viernes, de 5:00 a 7:00 p. m.)\n- Valor: 180.000 pesos. La arcilla se paga aparte: 40.000 pesos\n- Cupo: 10 personas\n\n**Condiciones**\n- Los estudiantes de colegios públicos tienen un descuento del 20 % en el valor del taller. El descuento no cubre los materiales que se pagan aparte.\n- Si un taller no alcanza la mitad de su cupo, se cancelará; en ese caso se devolverá el dinero completo.\n- Se entrega certificado a quien asista por lo menos al 80 % de las sesiones.", "preguntas": [{"codigo": "P005-T05-01", "categoria": "literal", "dificultad": 2, "enunciado": "¿Cuál de los talleres tiene más sesiones y cuál tiene menos, en ese orden?", "opciones": ["Cerámica y fotografía", "Cerámica y grabado", "Grabado y fotografía", "Fotografía y cerámica"], "correcta": 0, "explicacion": "Cerámica tiene 10 sesiones, grabado 8 y fotografía 4. La pregunta pide dos datos y en un orden: primero el mayor, después el menor. La opción que los trae invertidos acierta en los talleres y falla en el orden."}, {"codigo": "P005-T05-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "Una estudiante de 15 años busca un taller por el que no tenga que pagar. ¿Cuál puede tomar?", "opciones": ["Solo grabado", "Solo fotografía con celular", "Grabado o fotografía con celular", "Cualquiera de los tres talleres"], "correcta": 1, "explicacion": "Hay que cruzar dos condiciones: la edad y el valor. Por edad puede entrar a grabado y a fotografía (cerámica exige 16 años); de esos dos, solo fotografía es gratuito."}, {"codigo": "P005-T05-03", "categoria": "critico", "dificultad": 2, "enunciado": "Un estudiante de colegio público calcula que el taller de cerámica le costará en total 176.000 pesos, «el 80 % de 220.000». Su cálculo es:", "opciones": ["Incorrecto, porque el descuento no cubre la arcilla.", "Correcto, porque la arcilla ya viene incluida.", "Correcto, porque el descuento cubre taller y arcilla.", "Incorrecto, porque cerámica no tiene descuento."], "correcta": 0, "explicacion": "El estudiante sumó taller y arcilla (220.000) y aplicó el descuento a todo. Pero la ficha dice que el descuento «no cubre los materiales que se pagan aparte»: se descuenta solo sobre los 180.000 del taller, que quedan en 144.000, y la arcilla se paga completa. El total es 184.000. Un razonamiento puede tener bien las cuentas y mal la regla."}, {"codigo": "P005-T05-04", "categoria": "cohesion", "dificultad": 2, "enunciado": "En la segunda condición, la expresión «en ese caso» se refiere a:", "opciones": ["Que el estudiante falte a varias de las sesiones.", "Que el taller complete todo su cupo.", "Que el taller se cancele por pocos inscritos.", "Que el estudiante pida el descuento."], "correcta": 2, "explicacion": "«Ese caso» retoma la situación que se acaba de plantear en la misma oración: que el taller no alcance la mitad de su cupo y se cancele. Las expresiones como «en ese caso», «por eso» o «de ahí» no remiten a una palabra sino a una idea completa; hay que buscarla justo antes."}]}]}, {"paquete": "logica-base", "config": {"categorias": {"literal": {"nombre": "Literal", "color": "cian", "descripcion": "Datos explícitos, secuencias y causas que el texto dice directamente.", "componente": "lectura"}, "inferencial": {"nombre": "Inferencial", "color": "rosa", "descripcion": "Sentido global, premisas implícitas, propósito del autor, figuras y palabras en contexto.", "componente": "lectura"}, "critico": {"nombre": "Crítico", "color": "amarillo", "descripcion": "Solidez de los argumentos, sesgos y comparación entre textos.", "componente": "lectura"}, "cohesion": {"nombre": "Cohesión", "color": "menta", "descripcion": "Conectores, referencias entre palabras y valor de la puntuación.", "componente": "lectura"}, "deductivo": {"nombre": "Deducción", "color": "violeta", "componente": "logica", "descripcion": "Condicionales, negaciones, quién dice la verdad, cuadros de descarte, ordenamientos y certeza."}, "proporcional": {"nombre": "Proporciones", "color": "amarillo", "componente": "logica", "descripcion": "Fracciones, porcentajes, razones, promedios, conteo, probabilidad y lectura de cuadros."}, "abstracto": {"nombre": "Patrones", "color": "rosa", "componente": "logica", "descripcion": "Series, operadores inventados, ciclos, claves y secuencias de figuras."}, "geometrico": {"nombre": "Geometría", "color": "menta", "componente": "logica", "descripcion": "Áreas, perímetros, escalas, volúmenes, vistas y triángulos."}}, "distribucion_logica": {"deductivo": 0.25, "proporcional": 0.3, "abstracto": 0.2, "geometrico": 0.25}, "retos_logica": {"opciones": [{"n": 5, "nombre": "Riff", "minutos": 12, "descripcion": "Cinco problemas para calentar la cabeza."}, {"n": 10, "nombre": "Solo", "minutos": 25, "descripcion": "La sesión de lógica de todos los días."}, {"n": 15, "nombre": "Jam", "minutos": 38, "descripcion": "Para los días con tiempo y ganas."}]}, "simulacros_logica": {"inicial": {"nombre": "Inicial", "preguntas": 20, "minutos": 50, "dificultad": 1.6, "descripcion": "Problemas más directos. Para medir el punto de partida."}, "avanzado": {"nombre": "Avanzado", "preguntas": 40, "minutos": 90, "dificultad": 2.1, "descripcion": "Igual al bloque de lógica del examen real: 40 preguntas."}, "experto": {"nombre": "Experto", "preguntas": 40, "minutos": 75, "dificultad": 2.4, "descripcion": "Las mismas 40 preguntas con menos tiempo y problemas más duros, para llegar con holgura."}}, "referencias_logica": [{"programa": "Medicina y programas de corte muy alto", "porcentaje": 85, "detalle": "33 a 36 aciertos de 40 en Razonamiento Lógico"}, {"programa": "Derecho, Ingeniería Civil y programas intermedios", "porcentaje": 70, "detalle": "28 a 33 aciertos de 40"}, {"programa": "Programas regionales", "porcentaje": 55, "detalle": "Referencia aproximada"}], "tipos_error": {"enunciado": {"nombre": "Leíste otra pregunta", "consejo": "Antes de calcular, di con tus palabras qué te piden y en qué unidades. Al terminar, vuelve a leer la pregunta."}, "planteamiento": {"nombre": "Planteamiento", "consejo": "Traduce el enunciado frase por frase antes de operar: qué es el todo, qué es la parte, qué se compara con qué."}, "regla": {"nombre": "Regla equivocada", "consejo": "Antes de aplicar una regla, comprueba que el problema cumple sus condiciones. Abre la ficha de la técnica y mira su trampa típica."}, "incompleto": {"nombre": "A mitad de camino", "consejo": "Tu razonamiento iba bien, pero paraste antes de tiempo. Cuando tengas un resultado, pregúntate si eso es lo que pedían."}, "calculo": {"nombre": "Cuenta", "consejo": "El camino era el correcto y falló una operación. Estima el resultado antes de calcular y compara al final."}, "inferencia": {"nombre": "Salto lógico", "consejo": "Concluiste más de lo que las premisas permiten. Busca un caso que cumpla todo lo dicho y haga falsa tu opción."}}}, "tecnicas": [{"codigo": "condicional", "categoria": "deductivo", "nombre": "Condicional: lo que sí y lo que no se concluye", "cuando": "El enunciado trae una regla del tipo «si pasa P, entonces pasa Q» y pregunta qué se puede concluir.", "pasos": ["Escribe la regla como P → Q. P es **suficiente** para Q; Q es **necesaria** para P.", "Hay dos conclusiones válidas: si tienes P, concluyes Q; si tienes «no Q», concluyes «no P» (la contrarrecíproca).", "Hay dos que no valen: de Q no sale P, y de «no P» no sale «no Q».", "Para descartar una opción, busca un caso que cumpla la regla y haga falsa la opción."], "ejemplo": "Regla: «Si llueve, se cancela el concierto».\n\nEl concierto no se canceló. Entonces no llovió: es la contrarrecíproca.\n\nEl concierto se canceló. ¿Llovió? No se sabe: pudo cancelarse por otra razón.", "trampa": "Leer la regla al revés. «Si llueve, se cancela» no dice «si se cancela, llovió».", "orden": 10}, {"codigo": "negacion", "categoria": "deductivo", "nombre": "Negar «todos», «algunos» y «ninguno»", "cuando": "Piden la negación de una frase, o qué basta para que una afirmación general sea falsa.", "pasos": ["La negación de «todos son X» es «al menos uno no es X». No es «ninguno es X».", "La negación de «algunos son X» es «ninguno es X».", "La negación de «A y B» es «no A o no B»; la de «A o B» es «no A y no B».", "Pregúntate: ¿qué es lo mínimo que tendría que pasar para que la frase fuera mentira?"], "ejemplo": "«Todos los estudiantes del grupo aprobaron.»\n\nPara que sea falsa basta un estudiante que no haya aprobado. La negación es: «Al menos un estudiante del grupo no aprobó».", "trampa": "Irse al extremo contrario: negar «todos» con «ninguno».", "orden": 20}, {"codigo": "veraces", "categoria": "deductivo", "nombre": "Quién dice la verdad: suponer y comprobar", "cuando": "Varias personas afirman cosas y te dicen cuántas dicen la verdad o cuántas mienten.", "pasos": ["Haz una lista corta de los casos posibles: quién fue, o qué valor tiene lo desconocido.", "Para cada caso, marca qué afirmaciones resultan verdaderas y cuáles falsas.", "Quédate con el caso que cumple la condición del enunciado (por ejemplo, «solo uno dice la verdad»).", "Responde lo que piden, que no siempre es «quién miente»."], "ejemplo": "Ana: «Fue Beto». Beto: «Yo no fui». Caro: «Yo no fui». Solo una de las tres dice la verdad.\n\nSi fue Ana: Beto y Caro dicen la verdad. Dos verdades, no sirve.\n\nSi fue Beto: Ana y Caro dicen la verdad. Dos, no sirve.\n\nSi fue Caro: solo Beto dice la verdad. Sirve: fue Caro.", "trampa": "Decidir por intuición quién «suena» sincero. Aquí no se adivina: se prueban los casos.", "orden": 30}, {"codigo": "cuadro", "categoria": "deductivo", "nombre": "Cuadro de doble entrada: asignar descartando", "cuando": "Hay que emparejar personas con objetos, oficios, días o lugares a partir de pistas.", "pasos": ["Dibuja un cuadro: personas en las filas, opciones en las columnas.", "Pasa cada pista al cuadro: X donde no puede ser, ✓ donde sí.", "Cada ✓ tacha el resto de su fila y de su columna.", "Cuando en una fila o columna quede una sola casilla libre, esa es. Repite hasta llenar."], "ejemplo": "Luz, Mar y Sol tocan bajo, piano y batería, cada una un instrumento. Luz no toca piano. Sol toca batería.\n\nSol con batería tacha la batería para las otras dos. A Luz le queda solo el bajo. Entonces Mar toca piano.", "trampa": "Llevar las pistas en la cabeza. Sin cuadro se pierde una negación y la respuesta sale cruzada.", "orden": 40}, {"codigo": "orden", "categoria": "deductivo", "nombre": "Ordenamientos: quién va antes de quién", "cuando": "Te dan comparaciones (más alto, llegó antes, está a la derecha de) y piden una posición.", "pasos": ["Traza una línea y fija qué extremo es «más» y cuál es «menos».", "Ubica primero las pistas que atan dos elementos entre sí; deja para después las sueltas.", "Une las cadenas: si A está antes que B y B antes que C, A está antes que C.", "Si una posición no queda determinada, la respuesta puede ser justamente «no se puede asegurar»."], "ejemplo": "Daniel llegó antes que Eva. Fabio llegó después que Eva. Gina llegó antes que Daniel.\n\nCadena: Gina, Daniel, Eva, Fabio. La tercera en llegar fue Eva.", "trampa": "Invertir el sentido de una pista, o dar por ordenados dos elementos que ninguna pista compara.", "orden": 50}, {"codigo": "certeza", "categoria": "deductivo", "nombre": "El peor caso: lo mínimo para estar segura", "cuando": "Preguntan cuántos hay que sacar, como mínimo, para tener la certeza de algo.", "pasos": ["Piensa en la peor suerte posible: ¿cuántos puedes sacar sin que se cumpla lo pedido?", "Cuenta ese máximo de «fracasos».", "Súmale uno. Ese es el mínimo que da certeza."], "ejemplo": "En un cajón hay 6 medias negras y 6 blancas. ¿Cuántas hay que sacar sin mirar para asegurar un par del mismo color?\n\nPeor caso: una negra y una blanca (2 medias, ningún par). La tercera obliga a repetir color. Respuesta: 3.", "trampa": "Responder con el caso afortunado («con 2 puede salir») en lugar del caso seguro.", "orden": 60}, {"codigo": "fracciones", "categoria": "proporcional", "nombre": "Fracción de una cantidad y fracción de lo que queda", "cuando": "Se gasta, se reparte o se llena una parte, y luego otra parte «del resto».", "pasos": ["«De» significa multiplicar: 3/4 de 20 es 3/4 × 20 = 15.", "Después de cada paso escribe cuánto queda. La fracción siguiente se toma sobre eso, no sobre el total.", "Si no dan el total, usa uno cómodo (un múltiplo de los denominadores) o llámalo 1.", "«¿Cuántos caben?» es dividir: dividir entre una fracción es multiplicar por la fracción invertida."], "ejemplo": "Gastas 1/3 de tu plata y luego 1/2 de lo que quedó. ¿Qué fracción te queda?\n\nSupón que tenías 6. Gastas 2 y quedan 4. Gastas la mitad de 4 y quedan 2. Te queda 2/6, es decir, 1/3.", "trampa": "Sumar las fracciones como si las dos fueran del total: 1/3 + 1/2 = 5/6 gastado es falso, porque la segunda es del resto.", "orden": 70}, {"codigo": "porcentajes", "categoria": "proporcional", "nombre": "Porcentajes: la base manda", "cuando": "Hay aumentos, descuentos o porcentajes encadenados.", "pasos": ["Pregúntate siempre: ¿este porcentaje es de qué cantidad?", "Aumentar 20 % es multiplicar por 1,20; descontar 20 % es multiplicar por 0,80.", "Dos cambios seguidos se multiplican, no se suman: +20 % y luego −20 % da 1,2 × 0,8 = 0,96.", "Para hallar el total a partir de una parte: si 400 es el 40 %, el 100 % es 400 ÷ 0,40 = 1.000."], "ejemplo": "Un pantalón de $100.000 sube 10 % y después tiene un descuento de 10 %.\n\n100.000 × 1,10 = 110.000. Luego 110.000 × 0,90 = 99.000. No vuelve al precio inicial: el descuento se calcula sobre una base más grande.", "trampa": "Sumar o restar porcentajes que tienen bases distintas.", "orden": 80}, {"codigo": "razones", "categoria": "proporcional", "nombre": "Razones y repartos: contar partes", "cuando": "Dicen «por cada 2 de A hay 3 de B», «en razón 2 a 3», o piden repartir en proporción.", "pasos": ["Convierte la razón en partes: 2 a 3 son 2 partes y 3 partes, 5 en total.", "Halla cuánto vale una parte: total ÷ número de partes.", "Multiplica por las partes de lo que piden.", "Si hay tres cantidades encadenadas, exprésalas todas con la misma unidad de parte."], "ejemplo": "En un grupo de 40, la razón de mujeres a hombres es 3 a 5.\n\nPartes: 3 + 5 = 8. Cada parte vale 40 ÷ 8 = 5. Mujeres: 3 × 5 = 15. Hombres: 25.", "trampa": "Leer «3 a 5» como «3/5 del total». Las mujeres son 3/8 del grupo, no 3/5.", "orden": 90}, {"codigo": "regla3", "categoria": "proporcional", "nombre": "Proporcionalidad directa e inversa", "cuando": "Dos cantidades cambian juntas: más horas, más producción; más obreros, menos días.", "pasos": ["Decide si es directa (las dos suben juntas) o inversa (una sube y la otra baja).", "Directa: reduce a la unidad. ¿Cuánto por 1?", "Inversa: el producto se conserva. Calcula el «trabajo total» (obreros × días) y repártelo.", "Con tres magnitudes, cambia una a la vez."], "ejemplo": "6 obreros hacen una obra en 10 días. ¿Cuánto tardan 4 obreros?\n\nEs inversa: menos obreros, más días. Trabajo total: 6 × 10 = 60 días de obrero. Con 4 obreros: 60 ÷ 4 = 15 días.", "trampa": "Aplicar regla de tres directa a una relación inversa: daría menos días con menos gente.", "orden": 100}, {"codigo": "plantear", "categoria": "proporcional", "nombre": "Plantear: del enunciado a la ecuación", "cuando": "Hay una cantidad desconocida y varias frases que la relacionan con datos: edades, precios, tarifas.", "pasos": ["Ponle una letra a lo que piden.", "Traduce cada frase a una igualdad o una desigualdad, una por una.", "Despeja.", "Vuelve al enunciado con el número que hallaste y comprueba que cumple todas las frases."], "ejemplo": "Un taxi cobra $4.000 de arranque y $1.000 por kilómetro. ¿Cuántos kilómetros se recorren con $13.000?\n\n4.000 + 1.000k = 13.000. Entonces 1.000k = 9.000 y k = 9 kilómetros.", "trampa": "Responder el valor de la letra cuando piden otra cosa, o leer «a partir de» como «igual a».", "orden": 110}, {"codigo": "promedio", "categoria": "proporcional", "nombre": "Promedios: pensar en la suma total", "cuando": "Dan un promedio y agregan, quitan o combinan datos.", "pasos": ["Promedio × cantidad de datos = suma total. Trabaja siempre con la suma.", "Si entra o sale un dato, ajusta la suma y la cantidad, y vuelve a dividir.", "Para juntar dos grupos, suma los totales y divide por el total de personas (promedio ponderado)."], "ejemplo": "Cuatro notas promedian 3,5. ¿Qué quinta nota sube el promedio a 3,8?\n\nSuma actual: 4 × 3,5 = 14. Suma necesaria: 5 × 3,8 = 19. La quinta nota es 19 − 14 = 5,0.", "trampa": "Promediar los promedios de dos grupos de distinto tamaño como si pesaran igual.", "orden": 120}, {"codigo": "conteo", "categoria": "proporcional", "nombre": "Contar sin hacer la lista", "cuando": "Preguntan de cuántas formas se puede elegir, ordenar, combinar o saludar.", "pasos": ["Divide la tarea en decisiones sucesivas y cuenta las opciones de cada una.", "Si las decisiones se encadenan («y»), multiplica.", "¿Importa el orden? Si no importa (parejas, saludos, comités), divide por las veces que cada grupo quedó repetido.", "Parejas entre n elementos: n × (n − 1) ÷ 2."], "ejemplo": "3 camisas, 2 pantalones y 2 pares de zapatos: 3 × 2 × 2 = 12 combinaciones.\n\n6 personas se dan la mano una vez: cada una saluda a 5, pero cada apretón se contó dos veces. 6 × 5 ÷ 2 = 15.", "trampa": "Sumar donde había que multiplicar, o contar dos veces el mismo par.", "orden": 130}, {"codigo": "probabilidad", "categoria": "proporcional", "nombre": "Probabilidad: favorables sobre posibles", "cuando": "Preguntan qué tan probable es un resultado al azar.", "pasos": ["Cuenta todos los resultados posibles, igual de probables.", "Cuenta los que cumplen lo pedido.", "Divide favorables entre posibles y simplifica.", "Si hay dos condiciones a la vez, cuenta solo los casos que cumplen las dos."], "ejemplo": "Se lanza un dado. ¿Probabilidad de que salga un número par mayor que 2?\n\nPosibles: 6. Favorables: 4 y 6, que son 2. Probabilidad: 2/6 = 1/3.", "trampa": "Contar mal el total de casos posibles, o dar por igual de probables casos que no lo son.", "orden": 140}, {"codigo": "tablas", "categoria": "proporcional", "nombre": "Leer cuadros y gráficas", "cuando": "La información viene en un cuadro o en un diagrama de barras y hay que comparar o sacar porcentajes.", "pasos": ["Antes de mirar las opciones, lee títulos, ejes y unidades: ¿qué cuenta cada número?", "Si piden un porcentaje o una proporción, identifica el total que sirve de base: toda la tabla, una fila o una columna.", "Suma lo que haga falta y escribe la fracción parte/total.", "Si se trata de comparar para sacar una conclusión, fíjate qué cambia y qué se deja fijo."], "ejemplo": "Notas de un grupo: 4 estudiantes sacaron 3, 10 sacaron 4 y 6 sacaron 5.\n\nTotal: 20 estudiantes. Porcentaje con 5: 6/20 = 30 %. La nota más frecuente es 4, que no es la más alta.", "trampa": "Confundir cantidad con proporción, o el valor más frecuente con el más alto.", "orden": 150}, {"codigo": "series", "categoria": "abstracto", "nombre": "Series: mirar los saltos", "cuando": "Piden el término que sigue, o un término lejano, en una secuencia de números.", "pasos": ["Escribe debajo las diferencias entre términos vecinos.", "Si las diferencias son constantes o siguen su propio patrón, continúalo.", "Si no, prueba cocientes (se multiplica por algo) o dos series intercaladas: posiciones pares e impares.", "Comprueba la regla con todos los términos dados antes de usarla."], "ejemplo": "2, 5, 10, 17, 26, …\n\nDiferencias: 3, 5, 7, 9. Crecen de 2 en 2, así que la siguiente es 11. Término siguiente: 26 + 11 = 37.", "trampa": "Quedarse con la primera regla que funciona para dos términos sin comprobarla con los demás.", "orden": 160}, {"codigo": "operadores", "categoria": "abstracto", "nombre": "Operadores inventados: obedecer la definición", "cuando": "Definen un símbolo nuevo (a ★ b = …) y piden calcular con él.", "pasos": ["Copia la definición y marca quién es el primero y quién el segundo.", "Reemplaza con paréntesis, en el mismo orden: el orden casi nunca se puede cambiar.", "Si hay operaciones anidadas, resuelve primero la de adentro.", "Aplica la jerarquía normal: potencias, luego multiplicación, luego suma y resta."], "ejemplo": "Si a ★ b = 2a − b, calcula (3 ★ 1) ★ 4.\n\nAdentro: 3 ★ 1 = 2·3 − 1 = 5. Luego 5 ★ 4 = 2·5 − 4 = 6.", "trampa": "Tratar el símbolo como si fuera una suma: cambiar el orden o repartir sin que la definición lo permita.", "orden": 170}, {"codigo": "ciclos", "categoria": "abstracto", "nombre": "Ciclos: lo que se repite se resuelve con el residuo", "cuando": "Algo se repite en orden (días de la semana, un semáforo, un patrón de colores) y preguntan por una posición lejana.", "pasos": ["Halla la longitud del ciclo: cada cuántos pasos se repite.", "Divide la posición pedida por esa longitud y quédate con el residuo.", "El residuo dice en qué lugar del ciclo cae. Residuo 0 es el último del ciclo.", "Cuidado con el punto de partida: ¿el primero cuenta como posición 1 o como 0?"], "ejemplo": "Hoy es martes. ¿Qué día será dentro de 100 días?\n\nEl ciclo es de 7. 100 ÷ 7 = 14 y sobran 2. Dos días después del martes: jueves.", "trampa": "Contar el punto de partida como el primer paso y quedar corrida un lugar.", "orden": 180}, {"codigo": "claves", "categoria": "abstracto", "nombre": "Claves: encontrar la regla del código", "cuando": "Las palabras se cifran con números o con otras letras y piden cifrar o descifrar.", "pasos": ["Compara la palabra original con su código, letra por letra.", "Busca la regla más simple: posición en el abecedario, un corrimiento fijo, un orden invertido.", "Comprueba la regla con todas las letras del ejemplo, no solo con la primera.", "Aplícala en el sentido correcto: cifrar no es lo mismo que descifrar."], "ejemplo": "Si SOL se escribe TPM, ¿cómo se escribe MAR?\n\nS→T, O→P, L→M: cada letra avanza un lugar. MAR se escribe NBS.", "trampa": "Aplicar la regla al revés: retroceder cuando había que avanzar.", "orden": 190}, {"codigo": "figuras", "categoria": "abstracto", "nombre": "Secuencias de figuras: de la posición a la fórmula", "cuando": "Una figura crece paso a paso (puntos, palillos, baldosas) y preguntan por un paso lejano.", "pasos": ["Cuenta los elementos de las primeras figuras y ponlos en una lista junto a su número de figura.", "Mira cuánto aumenta de una a la siguiente.", "Si aumenta siempre lo mismo (d), la figura n tiene: primer valor + d × (n − 1). Si el aumento también crece, sigue sumando aumentos o busca un producto.", "Comprueba la fórmula con la figura 2 o la 3 antes de usarla."], "ejemplo": "Con palillos se arman cuadrados pegados en fila: 1 cuadrado usa 4, 2 usan 7, 3 usan 10.\n\nCada cuadrado nuevo agrega 3. Para n cuadrados: 4 + 3(n − 1) = 3n + 1. Para 20 cuadrados: 61 palillos.", "trampa": "Multiplicar el primer valor por n (4 × 20 = 80), olvidando que las piezas compartidas no se repiten.", "orden": 200}, {"codigo": "areas", "categoria": "geometrico", "nombre": "Áreas sombreadas: armar, restar o reacomodar", "cuando": "Piden el área de una región que no es una figura simple.", "pasos": ["Busca la figura grande y lo que le falta: área pedida = total − lo que sobra.", "O parte la región en rectángulos y triángulos y súmalos.", "Si hay piezas que encajan en los huecos, muévelas mentalmente: el área no cambia.", "Rectángulo: base × altura. Triángulo: base × altura ÷ 2. Círculo: π × r²."], "ejemplo": "Un cuadrado de lado 4 tiene dentro un círculo de radio 2. ¿Cuánto mide la región fuera del círculo?\n\nCuadrado: 16. Círculo: π·2² = 4π. Región: 16 − 4π.", "trampa": "Usar el diámetro donde va el radio, u olvidar dividir entre 2 en el triángulo.", "orden": 210}, {"codigo": "perimetro", "categoria": "geometrico", "nombre": "Perímetro: el borde, no el relleno", "cuando": "Preguntan por cercas, marcos, bordes o el contorno de una figura compuesta.", "pasos": ["Recorre el borde con el dedo y anota cada tramo una sola vez.", "Los lados que quedan por dentro, donde dos piezas se tocan, no cuentan.", "En figuras en escalera, los tramos horizontales suman el ancho total y los verticales el alto total.", "Circunferencia: 2 × π × r, o π × diámetro."], "ejemplo": "Dos cuadrados de lado 3 se pegan por un lado y forman un rectángulo de 6 por 3.\n\nPerímetro: 2 × (6 + 3) = 18. No es 24: los dos lados pegados quedaron adentro.", "trampa": "Sumar los perímetros de las piezas sin descontar los lados compartidos, o confundir perímetro con área.", "orden": 220}, {"codigo": "escala", "categoria": "geometrico", "nombre": "Escalas: longitud, área y volumen no crecen igual", "cuando": "Una figura se agranda o se reduce y preguntan qué pasa con su área, su volumen, su peso o su precio.", "pasos": ["Halla el factor k por el que se multiplican las longitudes.", "Las áreas se multiplican por k².", "Los volúmenes (y los pesos, si el material es el mismo) se multiplican por k³.", "Si solo cambia una dimensión, solo esa entra en la cuenta."], "ejemplo": "Se duplica el lado de un cubo. El área de cada cara se multiplica por 2² = 4 y el volumen por 2³ = 8.", "trampa": "Creer que si el lado se duplica, el área y el volumen también se duplican.", "orden": 230}, {"codigo": "volumen", "categoria": "geometrico", "nombre": "Volúmenes y cubos que no se ven", "cuando": "Hay cajas, tanques, vasos o arreglos de cubos.", "pasos": ["Caja: largo × ancho × alto. Cilindro: π × r² × altura.", "En arreglos de cubos, cuenta por columnas o por capas, no por lo que se ve.", "Para saber cuántos caben, divide cada dimensión por separado y multiplica los resultados.", "Si entra líquido, la altura que sube es el volumen dividido por el área de la base."], "ejemplo": "Una caja de 30 × 20 × 10 cm se llena con cubos de 5 cm de arista.\n\nCaben 6 a lo largo, 4 a lo ancho y 2 a lo alto: 6 × 4 × 2 = 48 cubos.", "trampa": "Contar solo los cubos visibles, o sumar las dimensiones en lugar de multiplicarlas.", "orden": 240}, {"codigo": "vistas", "categoria": "geometrico", "nombre": "Vistas, giros, reflejos y dobleces", "cuando": "Piden cómo se ve un objeto desde otro lado, o cómo queda una figura al girarla, reflejarla o doblarla.", "pasos": ["Vista desde arriba: importa dónde hay columnas, no su altura.", "Vista de frente o de lado: de cada fila se ve la columna más alta.", "Giros: súmalos con signo. Los que van en sentido contrario se restan.", "Reflejo en un espejo vertical: izquierda y derecha se intercambian; arriba y abajo no."], "ejemplo": "Tres columnas de cubos en fila, de alturas 1, 3 y 2.\n\nDesde arriba se ven 3 cuadrados en fila. Desde un extremo de la fila se ve una sola columna de altura 3: la más alta tapa a las demás.", "trampa": "Confundir un giro con un reflejo: al girar, la figura no se «voltea».", "orden": 250}, {"codigo": "triangulos", "categoria": "geometrico", "nombre": "Triángulos: Pitágoras y semejanza", "cuando": "Hay un ángulo recto y falta un lado, o dos triángulos con la misma forma y distinto tamaño (sombras, escaleras, planos).", "pasos": ["Triángulo rectángulo: cateto² + cateto² = hipotenusa². La hipotenusa es el lado opuesto al ángulo recto y siempre es el más largo.", "Ternas que conviene reconocer: 3-4-5, 6-8-10, 9-12-15, 5-12-13.", "Triángulos semejantes: los lados correspondientes guardan la misma razón.", "Arma la proporción con lados que se correspondan: altura con altura, sombra con sombra."], "ejemplo": "Un poste de 2 m da una sombra de 3 m. A la misma hora, un edificio da una sombra de 18 m.\n\n2/3 = h/18, así que h = 12 m.", "trampa": "Sumar los catetos para hallar la hipotenusa, o cruzar la proporción: altura de uno con sombra del otro.", "orden": 260}], "insignias": [{"codigo": "log-primera", "nombre": "Primera pieza", "descripcion": "Respondiste tu primera pregunta de lógica.", "icono": "🧩", "color": "cian", "orden": 200, "regla": {"tipo": "respuestas", "valor": 1, "componente": "logica"}}, {"codigo": "log-aciertos-50", "nombre": "50 en lógica", "descripcion": "Llevas 50 respuestas correctas de lógica.", "icono": "🎯", "color": "amarillo", "orden": 201, "regla": {"tipo": "aciertos", "valor": 50, "componente": "logica"}}, {"codigo": "log-aciertos-200", "nombre": "200 en lógica", "descripcion": "Llevas 200 respuestas correctas de lógica.", "icono": "🥇", "color": "amarillo", "orden": 202, "regla": {"tipo": "aciertos", "valor": 200, "componente": "logica"}}, {"codigo": "log-retos-10", "nombre": "Diez riffs", "descripcion": "Terminaste 10 retos de lógica.", "icono": "🎸", "color": "cian", "orden": 210, "regla": {"tipo": "retos", "valor": 10, "componente": "logica"}}, {"codigo": "log-solo-perfecto", "nombre": "Solo limpio", "descripcion": "Un reto de lógica de 10 preguntas sin un solo error.", "icono": "🎼", "color": "menta", "orden": 211, "regla": {"tipo": "reto_perfecto", "valor": 10, "componente": "logica"}}, {"codigo": "log-recuperadas-5", "nombre": "Error corregido", "descripcion": "Cinco preguntas de lógica que fallaste y después respondiste bien.", "icono": "🔧", "color": "menta", "orden": 220, "regla": {"tipo": "recuperadas", "valor": 5, "componente": "logica"}}, {"codigo": "log-recuperadas-25", "nombre": "Taller de reparación", "descripcion": "Veinticinco errores de lógica corregidos.", "icono": "🛠️", "color": "menta", "orden": 221, "regla": {"tipo": "recuperadas", "valor": 25, "componente": "logica"}}, {"codigo": "log-tecnicas-5", "nombre": "Caja de herramientas", "descripcion": "Cinco técnicas dominadas: tres aciertos o más en cada una.", "icono": "🧰", "color": "cian", "orden": 230, "regla": {"tipo": "tecnicas", "valor": 5, "minimo": 3}}, {"codigo": "log-tecnicas-15", "nombre": "Manos expertas", "descripcion": "Quince técnicas dominadas.", "icono": "🪛", "color": "cian", "orden": 231, "regla": {"tipo": "tecnicas", "valor": 15, "minimo": 3}}, {"codigo": "dominio-deductivo", "nombre": "Detective", "descripcion": "Dominio de 80 en deducción.", "icono": "🕵️", "color": "violeta", "orden": 240, "regla": {"tipo": "dominio", "categoria": "deductivo", "valor": 80}}, {"codigo": "dominio-proporcional", "nombre": "Justa medida", "descripcion": "Dominio de 80 en proporciones y conteo.", "icono": "📊", "color": "amarillo", "orden": 241, "regla": {"tipo": "dominio", "categoria": "proporcional", "valor": 80}}, {"codigo": "dominio-abstracto", "nombre": "Descifradora", "descripcion": "Dominio de 80 en patrones.", "icono": "🔐", "color": "rosa", "orden": 242, "regla": {"tipo": "dominio", "categoria": "abstracto", "valor": 80}}, {"codigo": "dominio-geometrico", "nombre": "Ojo de arquitecta", "descripcion": "Dominio de 80 en geometría.", "icono": "📐", "color": "menta", "orden": 243, "regla": {"tipo": "dominio", "categoria": "geometrico", "valor": 80}}, {"codigo": "log-sim-inicial", "nombre": "Primer simulacro lógico", "descripcion": "Terminaste un simulacro inicial de lógica.", "icono": "🧮", "color": "violeta", "orden": 250, "regla": {"tipo": "simulacro", "nivel": "inicial", "valor": 0, "componente": "logica"}}, {"codigo": "log-sim-avanzado-70", "nombre": "Lógica al 70", "descripcion": "70 % o más en un simulacro avanzado de lógica.", "icono": "🎛️", "color": "violeta", "orden": 251, "regla": {"tipo": "simulacro", "nivel": "avanzado", "valor": 70, "componente": "logica"}}, {"codigo": "log-sim-experto-80", "nombre": "Contrarreloj", "descripcion": "80 % o más en un simulacro experto de lógica.", "icono": "⏳", "color": "violeta", "orden": 252, "regla": {"tipo": "simulacro", "nivel": "experto", "valor": 80, "componente": "logica"}}]}, {"paquete": "logica-001", "textos": [{"codigo": "L-S01", "titulo": "La sala de grabación", "tipologia": "situacion", "fuente": "Situación original para práctica.", "contenido": "Una sala de grabación tiene tres interruptores, A, B y C, y dos señales: la luz AL AIRE y un ventilador.\n\n- La luz AL AIRE se enciende cuando los interruptores A y B están arriba, y solo en ese caso.\n- El ventilador funciona cuando el interruptor C está arriba, y solo en ese caso.\n- Por seguridad, los interruptores B y C no pueden estar arriba al mismo tiempo.", "preguntas": [{"codigo": "L-S01-1", "categoria": "deductivo", "tema": "condicional", "dificultad": 2, "enunciado": "Si la luz AL AIRE está encendida, entonces con certeza:", "opciones": ["El ventilador está funcionando.", "El ventilador está apagado.", "El interruptor C está arriba.", "No se puede saber nada del ventilador."], "correcta": 1, "pista": "La luz encendida dice algo de A y de B. ¿Qué le impone B a C?", "pasos": ["Luz encendida: A y B están arriba.", "B y C no pueden estar arriba a la vez: C está abajo.", "El ventilador solo funciona con C arriba: está apagado."], "errores": [{"tipo": "inferencia", "nota": "Para que funcione, C tendría que estar arriba junto con B, y eso no se permite."}, null, {"tipo": "regla", "nota": "Con la luz encendida, B está arriba, y B y C no pueden estar arriba al mismo tiempo."}, {"tipo": "incompleto", "nota": "Sí se puede: la luz encendida obliga a B a estar arriba, y eso obliga a C a estar abajo."}], "explicacion": "Encadena las reglas, una por una."}, {"codigo": "L-S01-2", "categoria": "deductivo", "tema": "condicional", "dificultad": 2, "enunciado": "De las siguientes situaciones, la única que no puede darse es:", "opciones": ["El interruptor A arriba y la luz AL AIRE apagada.", "La luz AL AIRE apagada y el ventilador apagado.", "El interruptor B abajo y el ventilador funcionando.", "El interruptor B arriba y el ventilador funcionando."], "correcta": 3, "pista": "Para cada opción, intenta encontrar una posición de los tres interruptores que la haga posible.", "pasos": ["El ventilador funciona solo si C está arriba.", "B arriba con el ventilador funcionando exige B y C arriba a la vez.", "Eso está prohibido por la tercera regla: es la situación imposible.", "Las demás se pueden lograr: por ejemplo, A arriba con B abajo deja la luz apagada."], "errores": [{"tipo": "regla", "nota": "Sí puede darse: basta que B esté abajo. A arriba es necesario para la luz, no suficiente."}, {"tipo": "enunciado", "nota": "Sí puede darse, por ejemplo con los tres interruptores abajo. Piden la que no puede darse."}, {"tipo": "enunciado", "nota": "Sí puede darse: con B abajo, C puede estar arriba sin problema."}, null], "explicacion": "Una situación es posible si existe al menos un caso que la cumpla."}, {"codigo": "L-S01-3", "categoria": "deductivo", "tema": "negacion", "dificultad": 3, "enunciado": "La luz AL AIRE está apagada y el ventilador también. De las siguientes afirmaciones, la única que se puede asegurar es:", "opciones": ["Los tres interruptores están abajo.", "C está abajo, y A y B también están abajo.", "C está abajo, y al menos uno entre A y B está abajo.", "C está abajo y B está abajo."], "correcta": 2, "pista": "La luz apagada significa que no se cumple «A arriba y B arriba». ¿Cómo se niega una frase con «y»?", "pasos": ["Ventilador apagado: C está abajo.", "Luz apagada: no es cierto que A y B estén arriba los dos.", "Negar «A y B» da «no A o no B»: al menos uno de los dos está abajo.", "No se puede saber cuál, ni si son ambos."], "errores": [{"tipo": "inferencia", "nota": "Es una posibilidad, no la única: A podría estar arriba con B abajo."}, {"tipo": "regla", "nota": "Que la luz esté apagada niega «A y B arriba». Para eso basta que uno de los dos esté abajo."}, null, {"tipo": "inferencia", "nota": "El que está abajo podría ser A, con B arriba."}], "explicacion": "Negar «los dos» deja «al menos uno no»."}]}, {"codigo": "L-S03", "titulo": "Un arreglo de cubos", "tipologia": "situacion", "fuente": "Situación original para práctica.", "contenido": "La figura muestra, visto desde arriba, un arreglo de cubos iguales sobre una mesa. El número de cada casilla indica cuántos cubos hay apilados en ella. La fila de abajo es la que queda al frente.", "figura": "<svg viewBox=\"0 0 230 200\" width=\"230\" height=\"200\"><text x=\"115.0\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">Atrás</text><rect x=\"46\" y=\"30\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"69.0\" y=\"59.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">2</text><rect x=\"92\" y=\"30\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"115.0\" y=\"59.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">1</text><rect x=\"138\" y=\"30\" width=\"46\" height=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"161.0\" y=\"59.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">0</text><rect x=\"46\" y=\"76\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"69.0\" y=\"105.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">3</text><rect x=\"92\" y=\"76\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"115.0\" y=\"105.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">2</text><rect x=\"138\" y=\"76\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"161.0\" y=\"105.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">1</text><rect x=\"46\" y=\"122\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"69.0\" y=\"151.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">1</text><rect x=\"92\" y=\"122\" width=\"46\" height=\"46\" fill=\"#C9BDF2\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"115.0\" y=\"151.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">1</text><rect x=\"138\" y=\"122\" width=\"46\" height=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"161.0\" y=\"151.0\" font-size=\"17\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">0</text><text x=\"115.0\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">Frente</text><text x=\"38\" y=\"103.0\" font-size=\"12\" text-anchor=\"end\" fill=\"currentColor\">Izq.</text><text x=\"192\" y=\"103.0\" font-size=\"12\" text-anchor=\"start\" fill=\"currentColor\">Der.</text></svg>", "preguntas": [{"codigo": "L-S03-1", "categoria": "geometrico", "tema": "volumen", "dificultad": 1, "enunciado": "¿Cuántos cubos tiene el arreglo?", "opciones": ["7", "11", "9", "12"], "correcta": 1, "pista": "Cada número es una columna de cubos. Suma todos los números.", "pasos": ["Fila de atrás: 2 + 1 + 0 = 3.", "Fila del medio: 3 + 2 + 1 = 6.", "Fila del frente: 1 + 1 + 0 = 2.", "Total: 3 + 6 + 2 = 11 cubos."], "errores": [{"tipo": "planteamiento", "nota": "Contaste las casillas que tienen cubos. Hay que sumar los números: en algunas casillas hay varios apilados."}, null, {"tipo": "planteamiento", "nota": "Contaste todas las casillas del cuadro, incluidas las vacías."}, {"tipo": "calculo", "nota": "La suma es 3 + 6 + 2: revisa fila por fila."}], "explicacion": "En un plano con alturas, se suman los números."}, {"codigo": "L-S03-2", "categoria": "geometrico", "tema": "vistas", "dificultad": 2, "enunciado": "Una persona mira el arreglo de frente. Ve tres columnas de cubos. De izquierda a derecha, las alturas que ve son:", "opciones": ["1, 1 y 0", "6, 4 y 1", "2, 3 y 1", "3, 2 y 1"], "correcta": 3, "pista": "Quien mira de frente ve, en cada columna del cuadro, la pila más alta.", "pasos": ["Columna izquierda del cuadro: pilas de 2, 3 y 1. La más alta es 3.", "Columna del centro: 1, 2 y 1. La más alta es 2.", "Columna derecha: 0, 1 y 0. La más alta es 1.", "De frente se ven alturas 3, 2 y 1."], "errores": [{"tipo": "incompleto", "nota": "Leíste solo la fila del frente. Las columnas de atrás son más altas y también se ven."}, {"tipo": "regla", "nota": "Sumaste los cubos de cada columna del cuadro. De frente no se ve la suma: se ve la pila más alta."}, {"tipo": "planteamiento", "nota": "Tomaste la pila más alta de cada fila. Esa es la vista desde un lado, no desde el frente."}, null], "explicacion": "De frente se ve la pila más alta de cada columna."}, {"codigo": "L-S03-3", "categoria": "geometrico", "tema": "volumen", "dificultad": 3, "enunciado": "Se quieren agregar cubos hasta completar un bloque macizo de 3 cubos de largo, 3 de ancho y 3 de alto. ¿Cuántos cubos faltan?", "opciones": ["16", "27", "18", "15"], "correcta": 0, "pista": "¿Cuántos cubos tiene el bloque completo? ¿Cuántos hay ya?", "pasos": ["Bloque completo: 3 × 3 × 3 = 27 cubos.", "El arreglo ya tiene 2 + 1 + 0 + 3 + 2 + 1 + 1 + 1 + 0 = 11 cubos.", "Faltan 27 − 11 = 16."], "errores": [null, {"tipo": "incompleto", "nota": "Ese es el bloque completo. Falta restar los cubos que ya están."}, {"tipo": "planteamiento", "nota": "Restaste las 9 casillas en vez de los cubos que hay."}, {"tipo": "calculo", "nota": "El arreglo tiene 11 cubos, no 12: 27 − 11 = 16."}], "explicacion": "Lo que falta es el total menos lo que hay."}]}], "preguntas": [{"codigo": "L-CON-1", "categoria": "deductivo", "tema": "condicional", "dificultad": 1, "enunciado": "En una sala de ensayo hay una regla: «Si alguien conecta el amplificador grande, se enciende la luz roja de la consola». Esta tarde la luz roja estuvo apagada todo el tiempo. Se puede concluir con certeza que:", "opciones": ["Alguien conectó el amplificador pequeño.", "Nadie conectó el amplificador grande.", "La consola está dañada.", "No se puede concluir nada sobre el amplificador grande."], "correcta": 1, "pista": "Escribe la regla como P → Q. El dato que tienes es «no Q». ¿Qué permite concluir?", "pasos": ["La regla es: conectar el amplificador grande (P) → se enciende la luz roja (Q).", "El dato es que la luz roja no se encendió: «no Q».", "Si P hubiera ocurrido, Q también habría ocurrido. Como Q no ocurrió, P tampoco: nadie conectó el amplificador grande."], "errores": [{"tipo": "inferencia", "nota": "La regla no menciona el amplificador pequeño: no hay ninguna premisa de la que salga esa conclusión."}, null, {"tipo": "inferencia", "nota": "Supones una causa que el enunciado no da. Con la regla basta: sin luz roja, no hubo amplificador grande."}, {"tipo": "regla", "nota": "Sí se puede: de «si P, entonces Q» y «no Q» sale «no P». Es la contrarrecíproca."}], "explicacion": "De «si P, entonces Q» y «no Q» siempre sale «no P»."}, {"codigo": "L-CON-3", "categoria": "deductivo", "tema": "condicional", "dificultad": 2, "enunciado": "En un videojuego, la puerta del castillo se abre solo si el jugador tiene la llave azul. De las siguientes situaciones, la única imposible es:", "opciones": ["La puerta se abrió y el jugador no tenía la llave azul.", "El jugador tiene la llave azul y la puerta sigue cerrada.", "El jugador no tiene la llave azul y la puerta está cerrada.", "El jugador tiene la llave azul y la puerta se abrió."], "correcta": 0, "pista": "«Se abre solo si tiene la llave» significa: si se abrió, tenía la llave. ¿Qué situación contradice eso?", "pasos": ["«La puerta se abre solo si tiene la llave azul» se escribe: puerta abierta → tiene la llave azul.", "Una regla P → Q solo se rompe de una manera: que ocurra P y no ocurra Q.", "Aquí eso es: puerta abierta y sin llave azul. Esa es la situación imposible.", "Tener la llave con la puerta cerrada no rompe la regla: la llave es necesaria, no suficiente."], "errores": [null, {"tipo": "regla", "nota": "«Solo si» hace de la llave una condición necesaria, no suficiente: puede tenerla y que falte algo más."}, {"tipo": "enunciado", "nota": "Piden la situación imposible. Esta es justo la que la regla espera."}, {"tipo": "enunciado", "nota": "Piden la situación imposible, y esta es perfectamente posible."}], "explicacion": "«Q solo si P» pone a P como condición necesaria."}, {"codigo": "L-NEG-1", "categoria": "deductivo", "tema": "negacion", "dificultad": 1, "enunciado": "Un afiche dice: «Todas las bandas del festival son de Medellín». Para demostrar que el afiche dice algo falso, basta encontrar:", "opciones": ["Que ninguna banda del festival sea de Medellín.", "Una banda de Medellín que no esté en el festival.", "Que la mayoría de las bandas del festival sean de otra ciudad.", "Una banda del festival que no sea de Medellín."], "correcta": 3, "pista": "¿Qué es lo mínimo que tendría que pasar para que «todas» fuera mentira?", "pasos": ["La frase es «todas las bandas del festival son de Medellín».", "Un «todas» se cae con un solo contraejemplo.", "El contraejemplo debe pertenecer al grupo del que habla la frase: una banda del festival.", "Basta una banda del festival que no sea de Medellín."], "errores": [{"tipo": "regla", "nota": "Eso también lo haría falso, pero es mucho más de lo necesario. Para tumbar un «todas» basta un caso."}, {"tipo": "planteamiento", "nota": "El afiche habla de las bandas del festival. Una banda que no está en el festival no lo contradice."}, {"tipo": "regla", "nota": "No hace falta la mayoría: con una sola alcanza."}, null], "explicacion": "«Todos» se niega con «al menos uno no»."}, {"codigo": "L-NEG-3", "categoria": "deductivo", "tema": "negacion", "dificultad": 2, "enunciado": "Julián afirma: «El sábado voy al concierto y llevo a mi hermano». Si lo que Julián dijo resulta falso, entonces con seguridad:", "opciones": ["No fue al concierto y tampoco llevó a su hermano.", "No fue al concierto.", "No fue al concierto o no llevó a su hermano.", "Fue al concierto, pero sin su hermano."], "correcta": 2, "pista": "Una frase con «y» es falsa apenas falla una de sus dos partes.", "pasos": ["La afirmación es «A y B»: A = va al concierto, B = lleva a su hermano.", "«A y B» es verdadera solo si se cumplen las dos.", "Es falsa si falla A, si falla B o si fallan las dos.", "Eso se dice así: «no A o no B»."], "errores": [{"tipo": "regla", "nota": "La negación de «A y B» no exige que fallen las dos partes: basta que falle una."}, {"tipo": "inferencia", "nota": "Puede que sí haya ido y que solo haya fallado la parte del hermano."}, null, {"tipo": "inferencia", "nota": "Es una de las formas de que la frase sea falsa, no la única."}], "explicacion": "La negación de «A y B» es «no A o no B»."}, {"codigo": "L-VER-1", "categoria": "deductivo", "tema": "veraces", "dificultad": 1, "enunciado": "Tres amigos hablan de quién rompió la cuerda de la guitarra.\n\n- Sara: «Fue Úrsula».\n- Tomás: «Yo no fui».\n- Úrsula: «Sara miente».\n\nSe sabe que la rompió uno de los tres y que solo uno dice la verdad. ¿Quién rompió la cuerda?", "opciones": ["Sara", "Tomás", "Úrsula", "No se puede saber"], "correcta": 1, "pista": "Hay tres casos posibles. Para cada uno, cuenta cuántos de los tres dicen la verdad.", "pasos": ["Si fue Sara: Sara miente, Tomás dice la verdad y Úrsula también, porque es cierto que Sara miente. Dos verdades: no sirve.", "Si fue Tomás: Sara miente, Tomás miente y Úrsula dice la verdad. Una verdad: sirve.", "Si fue Úrsula: Sara dice la verdad y Tomás también. Dos verdades: no sirve.", "La cuerda la rompió Tomás."], "errores": [{"tipo": "incompleto", "nota": "Prueba el caso completo: si fue Sara, Tomás dice la verdad y Úrsula también («Sara miente»). Serían dos verdades."}, null, {"tipo": "inferencia", "nota": "Es a quien acusa Sara, pero si fuera ella dirían la verdad Sara y Tomás: dos, y el enunciado solo permite una."}, {"tipo": "incompleto", "nota": "Sí se puede: al probar los tres casos, solo uno deja exactamente una verdad."}], "explicacion": "No se adivina quién miente: se prueba cada caso y se cuenta."}, {"codigo": "L-VER-3", "categoria": "deductivo", "tema": "veraces", "dificultad": 2, "enunciado": "En una mesa hay tres cajas: una roja, una verde y una azul. Solo una contiene un premio. Cada caja tiene un letrero.\n\n- Roja: «El premio está aquí».\n- Verde: «El premio no está aquí».\n- Azul: «El premio no está en la caja roja».\n\nSe sabe que solo uno de los letreros es verdadero. El premio está en:", "opciones": ["La caja roja", "La caja azul", "No se puede determinar", "La caja verde"], "correcta": 3, "pista": "Supón el premio en cada caja, una por una, y cuenta cuántos letreros quedan verdaderos.", "pasos": ["Premio en la roja: el letrero rojo es verdadero y el verde también. Dos verdaderos: no sirve.", "Premio en la verde: el rojo es falso, el verde es falso y el azul es verdadero. Uno solo: sirve.", "Premio en la azul: el verde y el azul son verdaderos. Dos: no sirve.", "El premio está en la caja verde."], "errores": [{"tipo": "inferencia", "nota": "Te quedaste con el letrero que dice tener el premio. Si estuviera ahí, serían verdaderos el letrero rojo y también el verde."}, {"tipo": "incompleto", "nota": "Si estuviera en la azul, serían verdaderos el letrero verde y el azul: dos."}, {"tipo": "incompleto", "nota": "Sí se puede: solo un caso deja exactamente un letrero verdadero."}, null], "explicacion": "Un letrero que «suena» sincero no prueba nada: hay que contar verdades en cada caso."}, {"codigo": "L-CUA-1", "categoria": "deductivo", "tema": "cuadro", "dificultad": 1, "enunciado": "Laura, Miguel y Nora tocan cada uno un instrumento distinto: guitarra, teclado y batería. Se sabe que Laura no toca guitarra ni batería, y que Miguel no toca batería. ¿Qué instrumento toca Nora?", "opciones": ["Batería", "Guitarra", "Teclado", "No se puede saber"], "correcta": 0, "pista": "Empieza por la persona que tiene más restricciones.", "pasos": ["Laura no toca guitarra ni batería: toca teclado.", "Miguel no toca batería y el teclado ya está tomado: toca guitarra.", "A Nora le queda la batería."], "errores": [null, {"tipo": "incompleto", "nota": "Miguel no toca batería y el teclado es de Laura, así que la guitarra es de Miguel."}, {"tipo": "planteamiento", "nota": "El teclado es lo único que le queda a Laura cuando se le quitan guitarra y batería."}, {"tipo": "incompleto", "nota": "Sí se puede: Laura queda con una sola opción, y eso destraba a los otros dos."}], "explicacion": "Se empieza por quien tiene menos opciones."}, {"codigo": "L-CUA-3", "categoria": "deductivo", "tema": "cuadro", "dificultad": 2, "enunciado": "Tres hermanos, Pablo, Rita y Simón, nacieron en ciudades distintas: Cali, Pasto y Tunja. Cada uno practica un deporte distinto: ajedrez, natación y patinaje. Se sabe que:\n\n- El que nació en Pasto practica natación.\n- Simón practica ajedrez.\n- Pablo practica patinaje.\n- Pablo no nació en Tunja.\n\n¿Dónde nació Simón?", "opciones": ["En Pasto", "En Cali", "En Tunja", "No se puede determinar"], "correcta": 2, "pista": "¿Quién practica natación? Esa persona nació en Pasto.", "pasos": ["Simón practica ajedrez y Pablo patinaje, así que Rita practica natación.", "El que nació en Pasto practica natación: Rita nació en Pasto.", "Pablo no nació en Tunja y Pasto ya es de Rita: Pablo nació en Cali.", "A Simón le queda Tunja."], "errores": [{"tipo": "inferencia", "nota": "En Pasto nació quien practica natación, y Simón practica ajedrez."}, {"tipo": "incompleto", "nota": "Cali es de Pablo: no nació en Tunja, y Pasto es de quien practica natación."}, null, {"tipo": "incompleto", "nota": "Sí se puede: primero se averigua quién practica natación y eso fija quién nació en Pasto."}], "explicacion": "Una pista que une dos categorías (ciudad y deporte) se usa cuando ya se conoce una de las dos."}, {"codigo": "L-ORD-1", "categoria": "deductivo", "tema": "orden", "dificultad": 1, "enunciado": "En una fila para entrar a un concierto, Camila está delante de Diego, Diego está delante de Elena y Felipe está delante de Camila. ¿Quién está de tercero en la fila?", "opciones": ["Camila", "Diego", "Elena", "Felipe"], "correcta": 1, "pista": "Arma la cadena completa antes de contar posiciones.", "pasos": ["Camila delante de Diego y Diego delante de Elena: Camila, Diego, Elena.", "Felipe está delante de Camila: Felipe, Camila, Diego, Elena.", "El tercero es Diego."], "errores": [{"tipo": "incompleto", "nota": "Empezaste a contar desde Camila, pero Felipe va delante de ella."}, null, {"tipo": "enunciado", "nota": "Elena es la última: todos los demás están delante de ella."}, {"tipo": "enunciado", "nota": "Felipe es el primero de la fila, no el tercero."}], "explicacion": "Primero la cadena completa, después las posiciones."}, {"codigo": "L-ORD-3", "categoria": "deductivo", "tema": "orden", "dificultad": 2, "enunciado": "Marta, Nico, Olga y Pedro se sientan alrededor de una mesa redonda, en cuatro sillas a igual distancia, todos mirando hacia el centro. Marta está frente a Nico. Olga está sentada a la mano derecha de Marta. ¿Quién está sentado a la mano derecha de Nico?", "opciones": ["Pedro", "Olga", "Marta", "No se puede saber"], "correcta": 0, "pista": "Dibuja la mesa. Recuerda que dos personas frente a frente tienen la derecha en lados opuestos.", "pasos": ["Ubica a Marta en una silla y a Nico en la de enfrente.", "Olga va a la mano derecha de Marta. Quedan ubicadas tres personas.", "Pedro ocupa la silla libre, que queda a la izquierda de Marta.", "Como Nico mira en sentido contrario a Marta, la izquierda de Marta es la derecha de Nico: ahí está Pedro."], "errores": [null, {"tipo": "planteamiento", "nota": "Marta y Nico están frente a frente: lo que queda a la derecha de una queda a la izquierda del otro."}, {"tipo": "enunciado", "nota": "Marta está al frente de Nico, no a su lado."}, {"tipo": "incompleto", "nota": "Sí se puede: con Marta, Nico y Olga ubicados, solo queda una silla."}], "explicacion": "En una mesa redonda, la derecha depende de hacia dónde mira cada quien."}, {"codigo": "L-CER-1", "categoria": "deductivo", "tema": "certeza", "dificultad": 1, "enunciado": "En una bolsa hay 5 púas rojas, 5 azules y 5 verdes. Sin mirar, ¿cuántas púas hay que sacar como mínimo para tener la certeza de que dos sean del mismo color?", "opciones": ["2", "3", "4", "6"], "correcta": 2, "pista": "¿Cuántas púas puedes sacar, con la peor suerte, sin que se repita ningún color?", "pasos": ["Peor caso: salen todas de colores distintos. Como hay 3 colores, eso son 3 púas.", "La siguiente tiene que repetir alguno de los tres colores.", "3 + 1 = 4."], "errores": [{"tipo": "inferencia", "nota": "Con 2 puede pasar, pero no es seguro: podrían salir de colores distintos."}, {"tipo": "incompleto", "nota": "Tres es el peor caso: una de cada color y ninguna repetida. Falta sumar una."}, null, {"tipo": "regla", "nota": "Sacar 6 asegura que haya dos colores distintos, que es otra cosa. Aquí se pide repetir color."}], "explicacion": "Certeza = el peor caso más uno."}, {"codigo": "L-CER-3", "categoria": "deductivo", "tema": "certeza", "dificultad": 2, "enunciado": "En un curso hay 30 estudiantes. ¿Cuál de las siguientes afirmaciones es necesariamente verdadera?", "opciones": ["Al menos dos cumplen años el mismo día.", "En cada mes cumple años al menos un estudiante.", "Al menos cuatro cumplen años en el mismo mes.", "Al menos tres cumplen años en el mismo mes."], "correcta": 3, "pista": "Reparte a los 30 entre los 12 meses lo más parejo posible. ¿Cuántos caben si ningún mes pasa de 2?", "pasos": ["Si ningún mes tuviera más de 2 estudiantes, cabrían como máximo 12 × 2 = 24.", "Hay 30, así que sobran 6 que deben ir a algún mes que ya tiene 2.", "Entonces algún mes tiene al menos 3.", "No se puede asegurar que haya 4: 30 es menor que 12 × 3 + 1."], "errores": [{"tipo": "inferencia", "nota": "Con 30 personas y más de 300 días posibles, todos podrían cumplir en días distintos."}, {"tipo": "inferencia", "nota": "Nada lo garantiza: los 30 podrían cumplir en un solo mes."}, {"tipo": "calculo", "nota": "Se pueden repartir sin llegar a cuatro: por ejemplo, seis meses con 3 estudiantes y seis con 2."}, null], "explicacion": "Si hay más objetos que casillas por capacidad, alguna casilla se pasa."}, {"codigo": "L-FRA-1", "categoria": "proporcional", "tema": "fracciones", "dificultad": 1, "enunciado": "Valeria tenía $60.000. Gastó la tercera parte en un libro y después la cuarta parte de lo que le quedaba en transporte. ¿Cuánto dinero le queda?", "opciones": ["$25.000", "$10.000", "$40.000", "$30.000"], "correcta": 3, "pista": "Después del libro, escribe cuánto queda. La segunda fracción se toma sobre ese número.", "pasos": ["La tercera parte de 60.000 es 20.000. Quedan 40.000.", "La cuarta parte de lo que quedaba: 40.000 ÷ 4 = 10.000.", "Le quedan 40.000 − 10.000 = 30.000."], "errores": [{"tipo": "planteamiento", "nota": "Tomaste la cuarta parte del total ($15.000). El enunciado dice «de lo que le quedaba», que eran $40.000."}, {"tipo": "enunciado", "nota": "Eso es lo que gastó en transporte, no lo que le queda."}, {"tipo": "incompleto", "nota": "Eso le quedaba después del libro. Falta restar el transporte."}, null], "explicacion": "«Del resto» cambia la base."}, {"codigo": "L-FRA-3", "categoria": "proporcional", "tema": "fracciones", "dificultad": 2, "enunciado": "Un tanque está lleno hasta 1/4 de su capacidad. Al agregarle 30 litros queda lleno hasta 2/3. ¿Cuál es la capacidad del tanque?", "opciones": ["45 litros", "72 litros", "120 litros", "90 litros"], "correcta": 1, "pista": "Los 30 litros son la diferencia entre dos fracciones del tanque. ¿Cuánto es 2/3 − 1/4?", "pasos": ["Los 30 litros hacen pasar el tanque de 1/4 a 2/3.", "2/3 − 1/4 = 8/12 − 3/12 = 5/12.", "Si 5/12 del tanque son 30 litros, 1/12 son 6 litros.", "El tanque completo: 12 × 6 = 72 litros."], "errores": [{"tipo": "planteamiento", "nota": "Trataste los 30 litros como si fueran los 2/3 del tanque. Son la diferencia entre 2/3 y 1/4."}, null, {"tipo": "planteamiento", "nota": "Trataste los 30 litros como si fueran 1/4 del tanque. Son lo que se agregó, no lo que había."}, {"tipo": "calculo", "nota": "Restaste mal: 2/3 − 1/4 no es 1/3. Con denominador 12 es 8/12 − 3/12 = 5/12."}], "explicacion": "Lo que se agrega es una diferencia de fracciones."}, {"codigo": "L-POR-1", "categoria": "proporcional", "tema": "porcentajes", "dificultad": 1, "enunciado": "Una chaqueta cuesta $80.000 y tiene un descuento del 25 %. ¿Cuánto se paga por ella?", "opciones": ["$60.000", "$20.000", "$55.000", "$64.000"], "correcta": 0, "pista": "El 25 % es la cuarta parte.", "pasos": ["25 % de 80.000 es la cuarta parte: 20.000.", "Precio con descuento: 80.000 − 20.000 = 60.000.", "Otra forma: pagar el 75 % es 0,75 × 80.000 = 60.000."], "errores": [null, {"tipo": "enunciado", "nota": "Ese es el descuento. Piden lo que se paga."}, {"tipo": "regla", "nota": "Restaste 25.000 pesos, no el 25 %. El 25 % de 80.000 es 20.000."}, {"tipo": "calculo", "nota": "Ese sería el precio con 20 % de descuento."}], "explicacion": "Descontar 25 % es pagar el 75 %."}, {"codigo": "L-POR-3", "categoria": "proporcional", "tema": "porcentajes", "dificultad": 2, "enunciado": "El precio de un bajo eléctrico subió 20 % en enero y bajó 20 % en febrero. Comparado con el precio que tenía antes de enero, el precio final:", "opciones": ["Es el mismo.", "Es 4 % mayor.", "Es 4 % menor.", "Es 20 % menor."], "correcta": 2, "pista": "Ponle un precio cómodo, por ejemplo $100, y sigue los dos cambios.", "pasos": ["Supón que costaba 100.", "Sube 20 %: 100 × 1,20 = 120.", "Baja 20 % de 120: 120 × 0,80 = 96.", "Quedó en 96, que es 4 % menos que 100."], "errores": [{"tipo": "regla", "nota": "Sumaste +20 % y −20 % como si tuvieran la misma base. La rebaja se calcula sobre el precio ya aumentado."}, {"tipo": "calculo", "nota": "El resultado es 0,96 del precio inicial: queda por debajo, no por encima."}, null, {"tipo": "enunciado", "nota": "Solo contaste la rebaja de febrero y olvidaste el aumento de enero."}], "explicacion": "Subir y bajar el mismo porcentaje no devuelve al punto de partida."}, {"codigo": "L-RAZ-1", "categoria": "proporcional", "tema": "razones", "dificultad": 1, "enunciado": "En una mezcla de pintura se usan 2 partes de azul por cada 3 de blanco. Si se usan 12 litros de blanco, ¿cuántos litros de azul se necesitan?", "opciones": ["8", "18", "10", "4,8"], "correcta": 0, "pista": "12 litros son 3 partes. ¿Cuánto vale una parte?", "pasos": ["El blanco son 3 partes y mide 12 litros.", "Una parte: 12 ÷ 3 = 4 litros.", "El azul son 2 partes: 2 × 4 = 8 litros."], "errores": [null, {"tipo": "planteamiento", "nota": "Invertiste la razón: hay menos azul que blanco, así que el azul debe ser menos de 12."}, {"tipo": "regla", "nota": "Restaste 2 porque «hay una parte menos». Una razón se multiplica, no se resta."}, {"tipo": "planteamiento", "nota": "Trataste los 12 litros como el total de la mezcla. Son solo el blanco."}], "explicacion": "Halla el valor de una parte y multiplica."}, {"codigo": "L-RAZ-3", "categoria": "proporcional", "tema": "razones", "dificultad": 3, "enunciado": "En un coro, la razón entre sopranos y contraltos es 5 a 3. Si se retiran 4 sopranos, quedan tantas sopranos como contraltos. ¿Cuántas personas tenía el coro al comienzo?", "opciones": ["8", "12", "32", "16"], "correcta": 3, "pista": "Las sopranos tienen 2 partes más que las contraltos. Esas 2 partes son las 4 que se retiran.", "pasos": ["Sopranos: 5 partes. Contraltos: 3 partes. Diferencia: 2 partes.", "Al retirar 4 sopranos quedan iguales, así que esas 2 partes son 4 personas.", "Cada parte vale 2 personas.", "Coro inicial: 8 partes × 2 = 16 personas (10 sopranos y 6 contraltos)."], "errores": [{"tipo": "incompleto", "nota": "Esas son las partes (5 + 3). Falta averiguar cuántas personas vale cada parte."}, {"tipo": "enunciado", "nota": "Ese es el coro después del retiro. Preguntan cuántas personas había al comienzo."}, {"tipo": "calculo", "nota": "Cada parte vale 2 personas, no 4: las 4 sopranos que se van son la diferencia de 2 partes."}, null], "explicacion": "La diferencia entre dos grupos también se mide en partes."}, {"codigo": "L-REG-1", "categoria": "proporcional", "tema": "regla3", "dificultad": 1, "enunciado": "Una impresora imprime 45 afiches en 15 minutos. Al mismo ritmo, ¿cuántos afiches imprime en una hora?", "opciones": ["135", "180", "60", "675"], "correcta": 1, "pista": "¿Cuántas veces caben 15 minutos en una hora?", "pasos": ["Una hora son 60 minutos: 4 veces 15 minutos.", "En cada tramo de 15 minutos imprime 45 afiches.", "4 × 45 = 180 afiches."], "errores": [{"tipo": "calculo", "nota": "Una hora tiene cuatro cuartos de hora, no tres."}, null, {"tipo": "enunciado", "nota": "Ese es el número de minutos de una hora, no de afiches."}, {"tipo": "regla", "nota": "Multiplicaste afiches por minutos. Lo que se necesita es cuántas veces caben 15 minutos en una hora."}], "explicacion": "Directa: el tiempo se multiplica por 4, la producción también."}, {"codigo": "L-REG-3", "categoria": "proporcional", "tema": "regla3", "dificultad": 2, "enunciado": "Un carro recorre 240 km con 16 litros de gasolina. Con el mismo rendimiento, ¿cuántos litros necesita para recorrer 150 km?", "opciones": ["25,6", "6", "10", "12"], "correcta": 2, "pista": "Reduce a la unidad: ¿cuántos kilómetros hace con un litro?", "pasos": ["Rendimiento: 240 ÷ 16 = 15 km por litro.", "Para 150 km: 150 ÷ 15 = 10 litros.", "Comprobación: 150 km es menos que 240 km, así que deben ser menos de 16 litros."], "errores": [{"tipo": "planteamiento", "nota": "Armaste la proporción al revés: para menos kilómetros deben salir menos litros, no más."}, {"tipo": "enunciado", "nota": "Calculaste los litros de los 90 km que no recorre. Piden los de los 150 km."}, null, {"tipo": "calculo", "nota": "El rendimiento es 240 ÷ 16 = 15 km por litro, y 150 ÷ 15 = 10."}], "explicacion": "Antes de calcular, decide si el resultado debe ser mayor o menor."}, {"codigo": "L-PLA-1", "categoria": "proporcional", "tema": "plantear", "dificultad": 1, "enunciado": "Un número aumentado en su mitad da 36. El número es:", "opciones": ["24", "18", "12", "54"], "correcta": 0, "pista": "Llama x al número. «Aumentado en su mitad» es x + x/2.", "pasos": ["Sea x el número. La frase dice: x + x/2 = 36.", "x + x/2 es una vez y media x: 1,5x = 36.", "x = 36 ÷ 1,5 = 24.", "Comprobación: 24 + 12 = 36."], "errores": [null, {"tipo": "planteamiento", "nota": "Tomaste la mitad de 36. El 36 ya es el número más su mitad, es decir, una vez y media el número."}, {"tipo": "enunciado", "nota": "Esa es la mitad del número. Preguntan por el número."}, {"tipo": "planteamiento", "nota": "Le aumentaste la mitad a 36. El 36 es el resultado, no el punto de partida."}], "explicacion": "Comprueba siempre con el enunciado."}, {"codigo": "L-PLA-3", "categoria": "proporcional", "tema": "plantear", "dificultad": 2, "enunciado": "Dos plataformas cobran por guardar archivos. La plataforma A cobra $2.000 fijos al mes más $300 por cada giga. La plataforma B cobra $500 fijos más $600 por cada giga. ¿A partir de cuántos gigas enteros la plataforma B resulta más costosa que la A?", "opciones": ["5", "4", "7", "6"], "correcta": 3, "pista": "Busca primero con cuántos gigas cuestan lo mismo.", "pasos": ["Costo de A con g gigas: 2.000 + 300g. Costo de B: 500 + 600g.", "Se igualan cuando 2.000 + 300g = 500 + 600g, es decir, 1.500 = 300g y g = 5.", "Con 5 gigas cuestan igual. Con 6, A cuesta 3.800 y B cuesta 4.100.", "B es más costosa a partir de 6 gigas."], "errores": [{"tipo": "enunciado", "nota": "Con 5 gigas las dos cuestan lo mismo: $3.500. B empieza a ser más costosa en el giga siguiente."}, {"tipo": "calculo", "nota": "Con 4 gigas A cuesta $3.200 y B cuesta $2.900: B todavía es
