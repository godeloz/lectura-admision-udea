    const logica = p.componente === "logica";
    const total = s.datos.preguntas.length;
    const r = s.respondida;
    const mismaLectura = s.i > 0 && s.datos.preguntas[s.i - 1].texto_id === p.texto_id;
    LE.montar(`
      <div class="sesion-cab">
        <button class="btn suave chico" data-accion="salirReto">Salir</button>
        <div class="progreso" aria-label="Pregunta ${s.i + 1} de ${total}">
          ${s.datos.preguntas.map((_, k) => `<i class="${k < s.marcas.length ? (s.marcas[k] ? "ok" : "mal") : k === s.i ? "act" : ""}"></i>`).join("")}
        </div>
        <span class="xp-vivo" aria-live="polite">+${s.xp} XP</span>
      </div>
      <div class="juego ${t ? "" : "solo"}">
        ${t ? `<div>${LE.lecturaHTML(t, logica ? false : !mismaLectura)}</div>` : ""}
        <section class="pregunta cr-${p.categoria}">
          <div class="meta"><span class="etq">${esc(LE.cat(p.categoria).nombre)}</span><span class="dif" title="Dificultad ${p.dificultad} de 3">${"●".repeat(p.dificultad)}${"○".repeat(3 - p.dificultad)}</span><span class="tenue">Pregunta ${s.i + 1} de ${total}</span></div>
          ${enunciadoHTML(p)}
          <div class="opciones" role="radiogroup">
            ${p.opciones.map((o, k) => {
              let cls = "";
              if (r) { if (k === r.opcion_correcta) cls = "bien"; else if (k === s.sel) cls = "malo"; }
              else if (k === s.sel) cls = "sel";
              return `<button class="opcion ${cls}" role="radio" aria-checked="${k === s.sel}" data-accion="elegir" data-k="${k}" ${r ? "disabled" : ""}><span class="letra">${LE.LETRAS[k]}</span><span>${esc(o)}</span></button>`;
            }).join("")}
          </div>
          ${r ? `${retroHTML(p, r)}
            <div class="acciones"><button class="btn" data-accion="siguiente" id="btn-sig">${s.i + 1 < total ? "Siguiente pregunta" : "Ver resultado"}</button></div>`
          : `${s.pista && p.pista ? `<div class="pista-caja" role="note"><b>Pista</b><p>${esc(p.pista)}</p></div>` : ""}
            <div class="acciones ${logica && p.pista ? "entre" : ""}">
              ${logica && p.pista ? (s.pista ? `<span class="tenue pequeno">Con pista no hay bono de ritmo; el acierto vale igual.</span>` : `<button class="btn suave chico" data-accion="pedirPista">Pedir una pista</button>`) : ""}
              <button class="btn" data-accion="confirmar" ${s.sel == null ? "disabled" : ""}>Confirmar respuesta</button>
            </div>`}
        </section>
      </div>`);
    if (r) $("#btn-sig")?.focus();
  }

  A.elegir = (b) => {
    const s = LE.estado.sesion;
    if (s.respondida) return;
    s.sel = +b.dataset.k;
    $$(".opcion").forEach((o, k) => { o.classList.toggle("sel", k === s.sel); o.setAttribute("aria-checked", k === s.sel); });
    $('[data-accion="confirmar"]').disabled = false;
  };

  A.pedirPista = () => {
    const s = LE.estado.sesion;
    if (!s || s.respondida) return;
    s.pista = true;
    pintarPregunta();
  };

  A.confirmar = async (b) => {
    const s = LE.estado.sesion;
    if (s.sel == null || s.respondida) return;
    b.disabled = true;
    try {
      const p = s.datos.preguntas[s.i];
      const r = await LE.api.responder(s.datos.sesion_id, p.id, s.sel, performance.now() - s.t0, s.pista);
      s.respondida = r; s.marcas.push(r.correcta); s.xp += r.xp;
      s.reg.push({ ok: r.correcta, tema: r.tema || null, tipo: r.error?.tipo || null });
      pintarPregunta();
      window.scrollTo({ top: document.querySelector(".retro").getBoundingClientRect().top + scrollY - 120, behavior: "smooth" });
    } catch (e) { LE.error(e); b.disabled = false; }
  };

  A.siguiente = async (b) => {
    const s = LE.estado.sesion;
    if (s.i + 1 < s.datos.preguntas.length) {
      s.i++; s.sel = null; s.respondida = null; s.pista = false; s.t0 = performance.now();
      pintarPregunta();
    } else {
      b.disabled = true;
      await terminarReto();
    }
  };

  A.salirReto = async () => {
    const s = LE.estado.sesion;
    const ok = await LE.confirmar("¿Terminar el reto ahora?", `Llevas ${s.marcas.length} de ${s.datos.preguntas.length} preguntas. Se guarda lo que respondiste, pero el bono por reto completo solo llega si terminas.`, "Terminar ahora", "Seguir");
    if (!ok) return;
    if (!s.marcas.length) { LE.estado.sesion = null; return LE.ir(rutaDe(s.comp)); }
    await terminarReto();
  };

  async function terminarReto() {
    const s = LE.estado.sesion;
    try {
      s.final = await LE.api.finalizarReto(s.datos.sesion_id);
      LE.estado.perfil.xp = s.final.xp_total ?? LE.estado.perfil.xp;
      pintarFinal();
      await LE.premios(s.final.nuevas_insignias);
    } catch (e) { LE.error(e); }
  }

  // En lógica, el cierre de un reto dice qué técnicas repasar y cómo fueron los errores.
  function repasoLogica(s) {
    const fallos = s.reg.filter((x) => !x.ok);
    if (!fallos.length) return "";
    const porTema = {}, porTipo = {};
    fallos.forEach((x) => { if (x.tema) porTema[x.tema] = (porTema[x.tema] || 0) + 1; if (x.tipo) porTipo[x.tipo] = (porTipo[x.tipo] || 0) + 1; });
    const temas = Object.entries(porTema).map(([cod, n]) => ({ t: LE.tecnica(cod), cod, n })).filter((x) => x.t).sort((a, b) => b.n - a.n);
    return `<section class="panel pila" style="--pila:.9rem">
      <div class="titulo-seccion" style="margin-bottom:0"><h2>Para repasar</h2><a href="#/logica/errores" class="pequeno" data-accion="soltarSesion">Abrir mi cuaderno de errores</a></div>
      <p class="sub pequeno">Las que fallaste quedaron en tu cuaderno de errores y volverán en los próximos retos. Antes de eso, mira la técnica.</p>
      ${temas.map((x) => `<div class="repaso-fila">
        <span><b>${esc(x.t.nombre)}</b><span class="tenue pequeno"> · ${x.n} ${x.n === 1 ? "fallo" : "fallos"}</span></span>
        <span class="fila"><button class="btn suave chico" data-accion="verTecnica" data-cod="${esc(x.cod)}">Ver ficha</button><button class="btn sec chico" data-accion="reto" data-n="5" data-tema="${esc(x.cod)}" data-comp="logica">Practicar</button></span>
      </div>`).join("")}
      ${Object.keys(porTipo).length ? `<div><p class="sub pequeno" style="margin-bottom:.5rem">Cómo fueron los errores de este reto</p>${LE.perfilErrores(porTipo)}</div>` : ""}
    </section>`;
  }

  function pintarFinal() {
    const s = LE.estado.sesion, f = s.final;
    const logica = s.comp === "logica";
    const repaso = s.tema === "@errores";
    const pct = f.total ? f.correctas / f.total : 0;
    const frase = pct === 1 ? "Perfecto. Ni una sola equivocación." : pct >= 0.8 ? "Muy buen ritmo." : pct >= 0.5 ? (logica ? "Vas bien. Repasa la solución de las que fallaste." : "Vas bien. Revisa las explicaciones de las que fallaste.") : "Hoy costó. Las preguntas falladas volverán en unos días para que las domines.";
    const porCat = {};
    s.datos.preguntas.forEach((p, k) => { if (k < s.marcas.length) { const c = (porCat[p.categoria] ||= [0, 0]); c[1]++; if (s.marcas[k]) c[0]++; } });
    LE.montar(`
      <div class="pila comp-${s.comp}" style="max-width:40rem;margin:0 auto;--pila:1.25rem">
        <div class="marcador">
          <span class="sub">${s.mision ? "Misión terminada" : repaso ? "Repaso terminado" : logica ? "Reto de lógica terminado" : "Reto terminado"}</span>
          <span class="pct" style="color:var(--acento, var(--rosa))">${f.correctas}/${f.total}</span>
          <p class="sub">${frase}</p>
        </div>
        <div class="progreso">${s.marcas.map((m) => `<i class="${m ? "ok" : "mal"}"></i>`).join("")}</div>
        <div class="stats">
          <div class="stat"><b style="color:var(--amarillo)">+${f.xp}</b><span>XP${f.bono ? ` (incluye ${f.bono} de bono)` : ""}</span></div>
          ${Object.entries(porCat).map(([c, [ok, t]]) => `<div class="stat cr-${c}"><b style="color:var(--c)">${ok}/${t}</b><span>${esc(LE.cat(c).nombre)}</span></div>`).join("")}
        </div>
        ${logica ? repasoLogica(s) : ""}
        ${LE.pistaXP(LE.estado.perfil.xp)}
        <div class="acciones" style="justify-content:flex-start">
          ${repaso ? "" : `<button class="btn" data-accion="otroReto" data-n="${s.n || s.datos.preguntas.length}">Otro reto igual</button>`}
          <button class="btn sec" data-accion="volverInicio">${logica ? "Volver a Lógica" : "Volver al inicio"}</button>
        </div>
      </div>`);
  }

  A.otroReto = (b) => { const s = LE.estado.sesion || {}; LE.estado.sesion = null; LE.empezarReto({ n: +b.dataset.n, cat: s.cat, comp: s.comp, tema: s.tema, boton: b }); };
  A.volverInicio = () => { const comp = LE.estado.sesion?.comp; LE.estado.sesion = null; LE.ir(rutaDe(comp)); };
  A.soltarSesion = (b) => { LE.estado.sesion = null; LE.ir(b.getAttribute("href")); };

  // =================================================================
  //  SIMULACRO: niveles (uno por componente)
  // =================================================================
  LE.ruta("/simulacro", async () => {
    LE.cargando();
    const comp = LE.compActual();
    const logica = comp === "logica";
    const r = await LE.api.resumen();
    const niveles = LE.cfgDe("simulacros", comp) || {};
    const sims = (r.simulacros || []).filter((x) => (x.componente || "lectura") === comp);
    LE.montar(`
      <div class="pila comp-${comp}" style="--pila:1.5rem">
        <div class="pila" style="--pila:.6rem">
          <h1>Simulacro</h1>
          ${LE.logicaActiva() ? `<div class="segmentos" role="group" aria-label="Componente">
            ${["lectura", "logica"].map((k) => `<button type="button" aria-pressed="${k === comp}" data-accion="cambiarComp" data-comp="${k}">${LE.COMP[k].icono} ${LE.COMP[k].nombre}</button>`).join("")}
          </div>` : ""}
          <p class="sub" style="max-width:62ch">${logica
            ? "Condiciones de examen: tiempo límite, sin pistas y sin soluciones hasta el final. En Lógica rinde dar dos vueltas: en la primera resuelve lo que sale directo y marca para revisar lo que pida cuentas largas; en la segunda vuelve a lo marcado. Una respuesta vacía vale lo mismo que una incorrecta: responde todas."
            : "Condiciones de examen: tiempo límite, sin explicaciones hasta el final y textos completos con todas sus preguntas. Cuando se acaba el tiempo, se entrega solo. Como en la prueba real, una respuesta vacía vale lo mismo que una incorrecta: responde todas."}</p>
        </div>
        <div class="niveles">
          ${Object.entries(niveles).map(([k, n]) => `
            <article class="nivel">
              <h2>${esc(n.nombre)}</h2>
              <div class="grande">${n.preguntas}<small>preguntas</small></div>
              <p class="sub">${esc(n.descripcion || "")}</p>
              <p><b>${n.minutos} minutos</b> <span class="tenue">· ${Math.round((n.minutos * 60) / n.preguntas)} s por pregunta</span></p>
              <button class="btn color cr-violeta" data-accion="simulacro" data-nivel="${k}" data-comp="${comp}">Empezar ${esc(n.nombre.toLowerCase())}</button>
            </article>`).join("") || `<p class="sub">Todavía no hay niveles de simulacro configurados para este componente.</p>`}
        </div>
        <section class="panel">
          <div class="titulo-seccion"><h2>${logica ? "Tus simulacros de lógica" : LE.logicaActiva() ? "Tus simulacros de lectura" : "Tus simulacros"}</h2></div>
          ${sims.length ? `<div class="scroll-x"><table class="tabla">
            <thead><tr><th>Fecha</th><th>Nivel</th><th class="num">Aciertos</th><th class="num">Puntaje</th><th></th></tr></thead>
            <tbody>${sims.map((x) => `<tr><td>${LE.fecha(x.fecha)}</td><td>${esc(niveles[x.nivel]?.nombre || x.nivel)}</td><td class="num">${x.correctas}/${x.total}</td><td class="num"><b>${x.puntaje}%</b></td><td><a href="#/diagnostico/${x.id}">Ver diagnóstico</a></td></tr>`).join("")}</tbody>
          </table></div>` : `<p class="sub">Aquí verás tu evolución simulacro a simulacro.</p>`}
        </section>
      </div>`);
  }, { estudiante: true });

  A.cambiarComp = (b) => { LE.compActual(b.dataset.comp); LE.navegar(); };

  A.simulacro = async (b) => {
    const comp = b.dataset.comp || "lectura";
    const n = (LE.cfgDe("simulacros", comp) || {})[b.dataset.nivel];
    const ok = await LE.confirmar(`Simulacro ${comp === "logica" ? "de lógica " : ""}${n.nombre.toLowerCase()}`, `${n.preguntas} preguntas en ${n.minutos} minutos. El reloj arranca apenas empieces y no se detiene si cierras la app.${comp === "logica" ? " Ten papel y lápiz a la mano." : ""} ¿Tienes el tiempo libre ahora?`, "Empezar", "Todavía no");
    if (!ok) return;
    b.disabled = true;
    try {
      const d = await LE.api.iniciarSimulacro(b.dataset.nivel, comp);
      if (!d.retomado && d.preguntas.length < n.preguntas) LE.aviso(`Por ahora el banco tiene ${d.preguntas.length} preguntas: este simulacro usa todas, con el tiempo ajustado.`);
      iniciarSimulacro(d);
    } catch (e) { LE.error(e); b.disabled = false; }
  };

  const leerLocal = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const escribirLocal = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

  function iniciarSimulacro(d) {
    const guardado = leerLocal("sim-" + d.sesion_id);
    LE.estado.sim = {
      datos: d, i: guardado?.i || 0, resp: guardado?.resp || {}, marcadas: new Set(guardado?.marcadas || []),
      desfase: new Date(d.ahora).getTime() - Date.now(), tEntrada: Date.now(), timer: null, entregando: false
    };
    if (d.retomado) LE.aviso("Retomaste el simulacro que tenías abierto.");
    LE.ir("#/simulacro/jugar");
  }

  const guardarSim = () => { const m = LE.estado.sim; escribirLocal("sim-" + m.datos.sesion_id, { i: m.i, resp: m.resp, marcadas: [...m.marcadas] }); };
  const restante = () => { const m = LE.estado.sim; return Math.max(0, new Date(m.datos.limite).getTime() - (Date.now() + m.desfase)); };
  const fmtReloj = (ms) => { const s = Math.ceil(ms / 1000); const h = Math.floor(s / 3600), mi = Math.floor((s % 3600) / 60), se = s % 60; return (h ? h + ":" + String(mi).padStart(2, "0") : mi) + ":" + String(se).padStart(2, "0"); };

  LE.ruta("/simulacro/jugar", () => {
    const m = LE.estado.sim;
    if (!m) return LE.ir("#/simulacro");
    clearInterval(m.timer);
    m.avisos = m.avisos || {};
    m.timer = setInterval(() => {
      if (!location.hash.startsWith("#/simulacro/jugar")) return clearInterval(m.timer);
      const ms = restante();
      const el = $("#reloj");
      if (el) { el.textContent = fmtReloj(ms); el.classList.toggle("aviso", ms < 600000 && ms >= 180000); el.classList.toggle("urgente", ms < 180000); }
      if (ms < 600000 && !m.avisos.diez) { m.avisos.diez = 1; LE.aviso("Quedan 10 minutos. Asegúrate de marcar todas."); }
      if (ms < 60000 && !m.avisos.uno) { m.avisos.uno = 1; LE.aviso("Queda 1 minuto."); }
      if (ms <= 0) { clearInterval(m.timer); entregar(true); }
    }, 1000);
    pintarSim();
  }, { sesion: true, estudiante: true });

  function pintarSim() {
    const m = LE.estado.sim;
    const ps = m.datos.preguntas;
    const p = ps[m.i];
    const t = p.texto_id ? m.datos.textos[p.texto_id] : null;
    const logica = p.componente === "logica";
    const elegida = m.resp[p.id]?.opcion;
    const nResp = Object.values(m.resp).filter((x) => x.opcion != null).length;
    const ms = restante();
    const mismaLectura = m.i > 0 && ps[m.i - 1].texto_id === p.texto_id;
    LE.montar(`
      <div class="sesion-cab">
        <span class="reloj ${ms < 180000 ? "urgente" : ms < 600000 ? "aviso" : ""}" id="reloj" role="timer" aria-label="Tiempo restante">${fmtReloj(ms)}</span>
        <span class="sub">${nResp} de ${ps.length} respondidas</span>
        <span style="flex:1"></span>
        <button class="btn chico color cr-violeta" data-accion="entregar">Entregar</button>
      </div>
      <div class="juego ${t ? "" : "solo"}">
        ${t ? `<div>${LE.lecturaHTML(t, logica ? false : !mismaLectura)}</div>` : ""}
        <section class="pregunta">
          <div class="meta"><span class="tenue">Pregunta ${m.i + 1} de ${ps.length}</span></div>
          ${enunciadoHTML(p)}
          <div class="opciones" role="radiogroup">
            ${p.opciones.map((o, k) => `<button class="opcion ${k === elegida ? "sel" : ""}" role="radio" aria-checked="${k === elegida}" data-accion="simElegir" data-k="${k}"><span class="letra">${LE.LETRAS[k]}</span><span>${esc(o)}</span></button>`).join("")}
          </div>
          <div class="acciones" style="justify-content:space-between">
            <button class="btn suave chico" data-accion="simMarcar">${m.marcadas.has(p.id) ? "Quitar marca" : "Marcar para revisar"}</button>
            <span class="fila">
              <button class="btn sec chico" data-accion="simIr" data-i="${m.i - 1}" ${m.i === 0 ? "disabled" : ""}>Anterior</button>
              <button class="btn chico" data-accion="simIr" data-i="${m.i + 1}" ${m.i + 1 >= ps.length ? "disabled" : ""}>Siguiente</button>
            </span>
          </div>
          <div>
            <p class="sub pequeno" style="margin-bottom:.5rem">Mapa del simulacro. El punto amarillo indica las que marcaste para revisar.</p>
            <div class="mapa">${ps.map((q, k) => `<button data-accion="simIr" data-i="${k}" class="${m.resp[q.id]?.opcion != null ? "resp" : ""} ${k === m.i ? "act" : ""} ${m.marcadas.has(q.id) ? "marca" : ""}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`).join("")}</div>
          </div>
        </section>
      </div>`);
  }

  function acumularTiempo() {
    const m = LE.estado.sim, p = m.datos.preguntas[m.i];
    const r = (m.resp[p.id] ||= { opcion: null, tiempo_ms: 0 });
    r.tiempo_ms += Date.now() - m.tEntrada;
    m.tEntrada = Date.now();
  }
  A.simElegir = (b) => {
    const m = LE.estado.sim, p = m.datos.preguntas[m.i];
    acumularTiempo();
    m.resp[p.id].opcion = +b.dataset.k;
    guardarSim(); pintarSim();
  };
  A.simIr = (b) => {
    const m = LE.estado.sim, k = +b.dataset.i;
    if (k < 0 || k >= m.datos.preguntas.length) return;
    acumularTiempo(); m.i = k; guardarSim(); pintarSim();
  };
  A.simMarcar = () => {
    const m = LE.estado.sim, id = m.datos.preguntas[m.i].id;
    m.marcadas.has(id) ? m.marcadas.delete(id) : m.marcadas.add(id);
    guardarSim(); pintarSim();
  };
  A.entregar = async () => {
    const m = LE.estado.sim;
    const faltan = m.datos.preguntas.filter((q) => m.resp[q.id]?.opcion == null).length;
    const ok = await LE.confirmar("¿Entregar el simulacro?", faltan ? `Te faltan <b>${faltan}</b> preguntas. En el examen real una respuesta vacía no suma nada: si no sabes, elige la más razonable.` : `Respondiste todas${m.marcadas.size ? ` y tienes ${m.marcadas.size} marcadas para revisar` : ""}.`, "Entregar ahora", "Seguir respondiendo");
    if (ok) entregar(false);
  };

  async function entregar(automatico) {
    const m = LE.estado.sim;
    if (!m || m.entregando) return;
    m.entregando = true;
    clearInterval(m.timer);
    acumularTiempo();
    LE.cargando(automatico ? "Se acabó el tiempo. Calificando…" : "Calificando…");
    try {
      const res = await LE.api.entregarSimulacro(m.datos.sesion_id, m.resp);
      escribirLocal("sim-" + m.datos.sesion_id, null);
      LE.estado.diag = { resultado: res, textos: m.datos.textos, nivel: m.datos.nivel, componente: m.datos.componente || "lectura", recien: true };
      LE.estado.sim = null;
      LE.ir("#/diagnostico/nuevo");
      if (automatico) LE.aviso("Se acabó el tiempo. Así te fue.");
      await LE.premios(res.nuevas_insignias);
    } catch (e) {
      m.entregando = false;
      LE.error(e);
      pintarSim();
    }
  }

  // =================================================================
  //  DIAGNÓSTICO (lo comparten estudiante y tutor)
  // =================================================================
  LE.ruta("/diagnostico/:id", async ({ id }) => {
    if (id !== "nuevo" || !LE.estado.diag) {
      LE.cargando();
      const d = await LE.api.detalleSesion(id);
      LE.estado.diag = { resultado: d.sesion.resultado, textos: d.textos, nivel: d.sesion.nivel, componente: d.sesion.componente || "lectura", fecha: d.sesion.fin };
    }
    LE.montar(LE.diagnosticoHTML(LE.estado.diag));
  });

  const fmtTiempo = (ms) => { const s = Math.round((ms || 0) / 1000); return s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : `${s} s`; };

  // Lo que el diagnóstico de un simulacro de lógica añade al de lectura:
  // cómo se equivocó, qué técnicas repasar y dónde se le fue el tiempo.
  function diagnosticoLogica(r) {
    const tutor = LE.comoTutor();
    const errores = r.por_error || {};
    const tipoTop = Object.entries(errores).sort((a, b) => b[1] - a[1])[0];
    const temas = Object.entries(r.por_tema || {}).map(([cod, x]) => ({ cod, t: LE.tecnica(cod), ...x })).filter((x) => x.t && x.correctas < x.total)
      .sort((a, b) => (b.total - b.correctas) - (a.total - a.correctas) || a.correctas / a.total - b.correctas / b.total).slice(0, 6);
    const lentas = (r.detalle || []).map((d, k) => ({ ...d, k })).filter((d) => (d.tiempo_ms || 0) > 210000).sort((a, b) => b.tiempo_ms - a.tiempo_ms).slice(0, 4);
    return `
      <div class="rejilla dos">
        <section class="panel pila" style="--pila:.8rem">
          <div class="titulo-seccion" style="margin-bottom:0"><h2>Cómo te equivocaste</h2><span class="sub pequeno">Tipo de error de cada fallo</span></div>
          ${tipoTop ? `${LE.perfilErrores(errores)}
            <p class="sub pequeno">Lo que más se repitió: <b style="color:var(--texto)">${esc(LE.tipoError(tipoTop[0]).nombre)}</b>. ${esc(LE.tipoError(tipoTop[0]).consejo)}</p>` : `<p class="sub">Sin errores con diagnóstico en este simulacro.</p>`}
        </section>
        <section class="panel pila" style="--pila:.7rem">
          <div class="titulo-seccion" style="margin-bottom:0"><h2>Técnicas para repasar</h2></div>
          ${temas.length ? temas.map((x) => `<div class="repaso-fila">
            <span><b>${esc(x.t.nombre)}</b><span class="tenue pequeno"> · ${x.correctas} de ${x.total}</span></span>
            <span class="fila"><button class="btn suave chico" data-accion="verTecnica" data-cod="${esc(x.cod)}">Ver ficha</button>${tutor ? "" : `<button class="btn sec chico" data-accion="reto" data-n="5" data-tema="${esc(x.cod)}" data-comp="logica">Practicar</button>`}</span>
          </div>`).join("") : `<p class="sub">No falló ninguna técnica.</p>`}
        </section>
      </div>
      ${lentas.length ? `<section class="panel pila" style="--pila:.6rem">
        <div class="titulo-seccion" style="margin-bottom:0"><h2>Dónde se fue el tiempo</h2><span class="sub pequeno">El examen da cerca de 2 min 15 s por pregunta</span></div>
        ${lentas.map((d) => `<p class="sub">Pregunta <b style="color:var(--texto)">${d.k + 1}</b>: ${fmtTiempo(d.tiempo_ms)} ${d.acierto ? "y la acertaste" : d.elegida == null ? "y quedó en blanco" : "y la fallaste"}.</p>`).join("")}
        <p class="tenue pequeno">Regla práctica: si a los tres minutos no sale, marca la más razonable, señálala para revisar y sigue. Vuelves al final si sobra tiempo.</p>
      </section>` : ""}`;
  }

  LE.diagnosticoHTML = ({ resultado: r, nivel, recien, fecha, componente }) => {
    const comp = r.componente || componente || "lectura";
    const logica = comp === "logica";
    const n = (LE.cfgDe("simulacros", comp) || {})[nivel] || { nombre: nivel };
    const refs = LE.cfgDe("referencias", comp) || [];
    const cats = LE.COMP[comp].cats.map((c) => { const x = r.por_categoria?.[c] || { correctas: 0, total: 0 }; return { categoria: c, dominio: x.total ? Math.round((100 * x.correctas) / x.total) : 0, respondidas: x.total, x }; });
    const conPreg = cats.filter((c) => c.x.total > 0).sort((a, b) => a.dominio - b.dominio);
    const debil = conPreg[0], fuerte = conPreg[conPreg.length - 1];
    const vacias = r.total - (r.respondidas ?? r.total);
    return `
      <div class="pila comp-${comp}" style="--pila:1.5rem">
        <div class="fila entre">
          <div class="marcador">
            <span class="sub">Simulacro ${logica ? "de lógica " : ""}${esc(String(n.nombre).toLowerCase())}${fecha ? " · " + LE.fecha(fecha) : ""}</span>
            <span class="pct">${r.puntaje}%</span>
            <p class="sub"><b style="color:var(--texto)">${r.correctas} de ${r.total}</b> correctas${r.minutos != null ? ` en ${r.minutos} min` : ""}${recien ? ` · +${r.xp} XP` : ""}</p>
          </div>
          <button class="btn sec" data-accion="volverDiag" data-comp="${comp}">${LE.comoTutor() ? "Volver" : "Volver a simulacros"}</button>
        </div>
        <div class="rejilla dos">
          <section class="panel">
            <div class="titulo-seccion"><h2>${logica ? "Por nivel de lógica" : "Por nivel de lectura"}</h2><span class="sub pequeno">% de aciertos</span></div>
            ${LE.ecualizador(cats, { vivo: true, detalle: false, cats: LE.COMP[comp].cats })}
            <div class="pila" style="--pila:.5rem;margin-top:1.1rem">
              ${debil && debil !== fuerte ? `<p class="sub">El punto fuerte fue <b style="color:var(--texto)">${esc(LE.cat(fuerte.categoria).nombre)}</b> (${fuerte.x.correctas}/${fuerte.x.total}). Donde más puntos se fueron: <b style="color:var(--texto)">${esc(LE.cat(debil.categoria).nombre)}</b> (${debil.x.correctas}/${debil.x.total}).</p>` : ""}
              ${vacias > 0 ? `<p class="sub">Quedaron <b style="color:var(--coral)">${vacias}</b> sin responder. En la prueba real no hay penalización por error: marcar siempre suma probabilidad.</p>` : ""}
            </div>
            ${!LE.comoTutor() && debil ? `<button class="btn sec chico" style="margin-top:1rem" data-accion="reto" data-n="10" data-cat="${debil.categoria}" data-comp="${comp}">Practicar 10 de ${esc(LE.cat(debil.categoria).nombre.toLowerCase())}</button>` : ""}
          </section>
          <section class="panel">
            <div class="titulo-seccion"><h2>Frente a los puntajes de corte</h2></div>
            <div class="referencias">
              ${refs.map((f) => `<div class="ref">
                <div class="fila entre pequeno"><b>${esc(f.programa)}</b><span class="${r.puntaje >= f.porcentaje ? "" : "tenue"}">${r.puntaje >= f.porcentaje ? "✓ alcanzado" : `meta ${f.porcentaje}%`}</span></div>
                <div class="ref-barra"><span class="tu" style="width:${Math.min(100, r.puntaje)}%"></span><span class="meta" style="left:${f.porcentaje}%"></span></div>
                <span class="tenue pequeno">${esc(f.detalle || "")}</span>
              </div>`).join("")}
            </div>
            <p class="tenue pequeno" style="margin-top:1rem">Referencia aproximada. En la UdeA el puntaje final se estandariza frente a todos los aspirantes de la jornada y combina Lectura con Razonamiento Lógico.</p>
          </section>
        </div>
        ${logica ? diagnosticoLogica(r) : ""}
        ${r.detalle?.length ? `<section class="pila" style="--pila:.8rem">
          <div class="titulo-seccion"><h2>Revisión pregunta por pregunta</h2><span class="sub pequeno">Toca una para ver ${logica ? "la solución" : "la explicación"}</span></div>
          <div class="revision">${r.detalle.map((d, k) => `
            <details class="${d.elegida == null ? "vacia" : d.acierto ? "ok" : ""}">
              <summary><span class="num">${k + 1}</span><span>${d.acierto ? "✓ " : d.elegida == null ? "— " : "✗ "}${esc(logica ? LE.plano(d.enunciado, 170) : d.enunciado)}</span></summary>
              <div class="cuerpo">
                ${logica && LE.plano(d.enunciado) !== String(d.enunciado).trim() ? `<div class="enunciado md">${LE.md(d.enunciado)}</div>` : ""}
                <div class="fila"><span class="etq cr-${d.categoria}">${esc(LE.cat(d.categoria).nombre)}</span>${d.texto_id ? `<button class="enlace pequeno" data-accion="verLectura" data-t="${d.texto_id}">${logica ? "Ver la situación" : "Ver la lectura"}</button>` : ""}${logica && d.tiempo_ms ? `<span class="tenue pequeno">${fmtTiempo(d.tiempo_ms)}</span>` : ""}</div>
                ${logica ? LE.figura(d.figura) : ""}
                ${d.opciones.map((o, j) => `<div class="op ${j === d.correcta ? "ok" : ""} ${j === d.elegida ? "elegida" : ""}"><b>${LE.LETRAS[j]}.</b> ${esc(o)}${j === d.correcta ? " ✓" : j === d.elegida ? " (respuesta marcada)" : ""}</div>`).join("")}
                ${d.elegida == null ? `<p class="tenue pequeno">Sin responder.</p>` : ""}
                ${logica ? `${LE.diagnosticoError(d.error)}${LE.pasosHTML(d.pasos)}${d.explicacion ? `<p class="sub idea">${esc(d.explicacion)}</p>` : ""}${LE.enlaceTecnica(d.tema)}` : `<p class="sub">${esc(d.explicacion)}</p>`}
              </div>
            </details>`).join("")}</div>
        </section>` : ""}
      </div>`;
  };

  A.volverDiag = (b) => {
    if (LE.comoTutor()) return history.back();
    LE.compActual(b.dataset.comp || "lectura");
    LE.ir("#/simulacro");
  };
  A.verLectura = (b) => {
    const t = LE.estado.diag?.textos?.[b.dataset.t];
    if (t) LE.dialogo(`${LE.lecturaHTML(t, false)}<div class="acciones" style="margin-top:1rem"><button class="btn" data-valor="ok">Cerrar</button></div>`);
  };

  // =================================================================
  //  PERFIL
  // =================================================================
  LE.ruta("/perfil", async () => {
    LE.cargando();
    const r = await LE.api.resumen();
    LE.estado.perfil = r.perfil;
    const gan = Object.fromEntries(r.insignias.map((i) => [i.codigo, i.obtenida]));
    const cat = LE.estado.insignias;
    const t = r.totales;
    const precision = t.respuestas ? Math.round((100 * t.aciertos) / t.respuestas) : 0;
    const minSemana = r.dias.slice(-7).reduce((a, d) => a + d.minutos, 0);
    const conLogica = LE.logicaActiva();
    const deLogica = (i) => i.regla?.componente === "logica" || LE.CATS_LOGICA.includes(i.regla?.categoria) || ["recuperadas", "tecnicas"].includes(i.regla?.tipo);
    const grilla = (lista) => `<div class="insignias">${lista.map((i) => `
            <div class="insignia cr-${esc(i.color)} ${gan[i.codigo] ? "" : "bloq"}" title="${gan[i.codigo] ? "Obtenida el " + LE.fecha(gan[i.codigo]) : "Por desbloquear"}">
              <span class="ico" aria-hidden="true">${esc(i.icono)}</span><b>${esc(i.nombre)}</b><span>${esc(i.descripcion)}</span>
            </div>`).join("")}</div>`;
    const generales = cat.filter((i) => !deLogica(i)), logicas = cat.filter(deLogica);
    const nLog = r.por_componente?.logica?.respuestas || 0;
    LE.montar(`
      <div class="pila" style="--pila:1.5rem">
        <section class="panel saludo">
          <div class="fila entre">
            <div class="fila">
              <div class="avatar-grande" aria-hidden="true">${esc(r.perfil.avatar)}</div>
              <div class="pila" style="--pila:.2rem">
                <h1>${esc(r.perfil.nombre)}</h1>
                <p class="sub">${esc(LE.rango(r.perfil.xp).actual.nombre)}${r.perfil.meta_programa ? " · rumbo a " + esc(r.perfil.meta_programa) : ""}</p>
              </div>
            </div>
            <button class="btn sec chico" data-accion="editarPerfil">Editar perfil</button>
          </div>
          ${LE.pistaXP(r.perfil.xp)}
        </section>

        <div class="stats">
          <div class="stat"><b>${r.racha}</b><span>días de racha (mejor: ${r.mejor_racha})</span></div>
          <div class="stat"><b>${LE.minutos(r.minutos_hoy)}</b><span>de estudio hoy</span></div>
          <div class="stat"><b>${LE.minutos(minSemana)}</b><span>en los últimos 7 días</span></div>
          <div class="stat"><b>${LE.minutos(r.minutos_total)}</b><span>en total</span></div>
          <div class="stat"><b>${t.respuestas}</b><span>preguntas respondidas${conLogica ? ` (${nLog} de lógica)` : ""}</span></div>
          <div class="stat"><b>${precision}%</b><span>de aciertos</span></div>
          <div class="stat"><b>${t.segundos_promedio ?? "—"}${t.segundos_promedio != null ? " s" : ""}</b><span>por pregunta (el examen da ~2 min)</span></div>
          <div class="stat"><b>${r.retos}</b><span>retos terminados</span></div>
        </div>

        ${conLogica ? `
        <section class="panel">
          <div class="titulo-seccion"><h2>Últimas 4 semanas</h2><span class="sub pequeno">Más intenso, más minutos</span></div>
          ${LE.calor(r.dias)}
        </section>
        <div class="rejilla dos">
          <section class="panel">
            <div class="titulo-seccion"><h2>Dominio · Lectura</h2></div>
            ${LE.ecualizador(r.dominio)}
          </section>
          <section class="panel">
            <div class="titulo-seccion"><h2>Dominio · Lógica</h2></div>
            ${LE.ecualizador(r.dominio_logica, { cats: LE.CATS_LOGICA })}
          </section>
        </div>` : `
        <div class="rejilla dos">
          <section class="panel">
            <div class="titulo-seccion"><h2>Últimas 4 semanas</h2><span class="sub pequeno">Más intenso, más minutos</span></div>
            ${LE.calor(r.dias)}
          </section>
          <section class="panel">
            <div class="titulo-seccion"><h2>Dominio</h2></div>
            ${LE.ecualizador(r.dominio)}
          </section>
        </div>`}

        <section class="pila" style="--pila:.8rem">
          <div class="titulo-seccion"><h2>Insignias</h2><span class="sub">${generales.filter((i) => gan[i.codigo]).length} de ${generales.length}</span></div>
          ${grilla(generales)}
        </section>
        ${logicas.length ? `<section class="pila" style="--pila:.8rem">
          <div class="titulo-seccion"><h2>Insignias de Lógica</h2><span class="sub">${logicas.filter((i) => gan[i.codigo]).length} de ${logicas.length}</span></div>
          ${grilla(logicas)}
        </section>` : ""}

        <div class="rejilla dos">
          <section class="panel pila" style="--pila:.7rem">
            <h2>La app en tu celular</h2>
            ${LE.instalada()
              ? `<p class="sub">✓ Ya la estás usando instalada.</p>`
              : `<p class="sub">Instálala y la abres con un toque desde tu pantalla de inicio, como cualquier otra app.</p>
                <div><a class="btn chico" href="#/instalar">Ver cómo instalarla</a></div>`}
          </section>
          <section class="panel pila" style="--pila:.7rem">
            <h2>Tu cuenta</h2>
            <p class="sub">Entras con <b style="color:var(--texto)">${esc(r.perfil.correo || r.perfil.usuario || "")}</b>.</p>
            <div><button class="btn sec chico" data-accion="cambiarClave">Cambiar mi contraseña</button></div>
          </section>
        </div>
        ${LE.enPractica() ? `<section class="panel pila" style="--pila:.7rem">
          <h2>Tu práctica de tutor</h2>
          <p class="sub">Lo que haces en modo práctica se guarda en tu cuenta y no aparece en el panel, en las alertas ni en los grupos. Puedes borrarlo y empezar de cero cuando quieras.</p>
          <div class="fila"><button class="btn sec chico" data-accion="borrarPractica">Borrar mi práctica</button><button class="btn suave chico" data-accion="salirPractica">Volver al panel</button></div>
        </section>` : ""}

        <div class="fila">
          <button class="btn sec" data-accion="salir">Cerrar sesión</button>
          ${LE.api.modo === "demo" ? `<button class="btn suave" data-accion="reiniciarDemo">Reiniciar datos del demo</button>` : ""}
        </div>
      </div>`);
  }, { estudiante: true });

  A.editarPerfil = async () => {
    const p = LE.estado.perfil;
    const avatares = LE.estado.config.avatares || ["🎧"];
    let elegido = p.avatar, v = null;
    const res = await LE.dialogo(`
      <form class="pila" method="dialog" id="f-perfil">
        <h2>Editar perfil</h2>
        <label class="campo">Nombre<input name="nombre" value="${esc(p.nombre)}" maxlength="40"></label>
        <label class="campo">Programa al que aspiras<input name="meta" value="${esc(p.meta_programa || "")}" maxlength="60" placeholder="Ej.: Medicina"></label>
        <div class="campo"><span>Avatar</span><div class="avatares">${avatares.map((a) => `<button type="button" aria-pressed="${a === p.avatar}" data-av="${esc(a)}">${esc(a)}</button>`).join("")}</div></div>
        <div class="acciones"><button class="btn sec" type="button" data-valor="">Cancelar</button><button class="btn" value="guardar">Guardar</button></div>
      </form>`, {
      alAbrir: (d) => {
        const f = d.querySelector("#f-perfil");
        f.querySelector(".avatares").addEventListener("click", (e) => {
          const b = e.target.closest("[data-av]"); if (!b) return;
          elegido = b.dataset.av;
          $$("[data-av]", f).forEach((x) => x.setAttribute("aria-pressed", x === b));
        });
        f.addEventListener("submit", () => { v = { nombre: f.nombre.value, meta: f.meta.value }; });
      }
    });
    if (res === "guardar" && v) {
      try { await LE.api.actualizarPerfil(v.nombre, elegido, v.meta); LE.aviso("Perfil guardado"); LE.navegar(); }
      catch (e) { LE.error(e); }
    }
  };

  A.reiniciarDemo = async () => {
    if (!(await LE.confirmar("¿Reiniciar el demo?", "Se borran los datos de prueba guardados en este navegador y se vuelve al estado inicial.", "Reiniciar"))) return;
    await LE.api.reiniciar();
    try { localStorage.removeItem("le-componente"); } catch (e) { }
    location.hash = ""; location.reload();
  };
})(window.LE);

/* =====================================================================
   ENTRELÍNEAS · VISTAS DE LÓGICA
   El segundo componente del examen: Razonamiento Lógico. Los retos, el
   simulacro y el diagnóstico usan las pantallas comunes de
   vistas-estudiante.js. Aquí está lo que es solo de Lógica:
     · la portada (#/logica)
     · la caja de herramientas: una ficha por técnica (#/logica/tecnicas)
     · el cuaderno de errores (#/logica/errores)
   ===================================================================== */
(function (LE) {
  const { esc } = LE;
  const A = LE.acciones;

  const noActiva = () => LE.montar(`<div class="vacio"><h2>Lógica todavía no está activada</h2><p>Tu tutor debe cargar primero el paquete de Razonamiento Lógico.</p><button class="btn sec" data-accion="irInicio">Volver</button></div>`);
  const protegida = (fn) => async (params) => (LE.logicaActiva() ? fn(params) : noActiva());

  // Índice de avance por técnica a partir del cuaderno: {codigo: {intentos, aciertos}}
  const porTema = (cua) => Object.fromEntries((cua?.temas || []).map((t) => [t.tema, t]));
  const ETQ_ESTADO = { nueva: "Sin practicar", proceso: "En proceso", dominada: "Dominada" };

  // ---------- Portada ----------
  LE.ruta("/logica", protegida(() => LE.portada("logica")), { estudiante: true });

  // Panel de la portada: lo que la estudiante hace con sus errores.
  LE.panelAprender = (cua) => {
    const tecnicas = LE.estado.tecnicas || [];
    const avance = porTema(cua);
    const dominadas = tecnicas.filter((t) => LE.estadoTecnica(avance[t.codigo]) === "dominada").length;
    const pend = cua?.pendientes?.length || 0;
    const top = Object.entries(cua?.perfil || {}).sort((a, b) => b[1] - a[1])[0];
    const totalErr = Object.values(cua?.perfil || {}).reduce((a, b) => a + b, 0);
    if (!cua || !cua.respuestas_total) {
      return `<section class="panel pila" style="--pila:.8rem">
        <div class="titulo-seccion" style="margin-bottom:0"><h2>Cómo se aprende aquí</h2></div>
        <ul class="lista-simple">
          <li><b>Si te trabas, pide la pista.</b> Te da el primer movimiento, no la respuesta.</li>
          <li><b>Al responder ves la solución paso a paso</b> y, si fallaste, qué error fue: leer otra cosa, plantear mal, parar a mitad de camino, la cuenta.</li>
          <li><b>Cada pregunta enlaza a la ficha de su técnica</b>, con el procedimiento y la trampa típica.</li>
          <li><b>Lo que falles queda en tu cuaderno de errores</b> y vuelve en retos posteriores hasta que lo domines.</li>
        </ul>
        <div class="fila"><a class="btn sec chico" href="#/logica/tecnicas">Abrir la caja de herramientas</a></div>
      </section>`;
    }
    return `<section class="panel pila" style="--pila:.9rem">
      <div class="titulo-seccion" style="margin-bottom:0"><h2>Aprende de tus errores</h2><span class="sub pequeno">${cua.recuperadas} ${cua.recuperadas === 1 ? "error corregido" : "errores corregidos"}</span></div>
      ${top ? `<p class="sub">Tu error más frecuente: <b style="color:var(--texto)">${esc(LE.tipoError(top[0]).nombre)}</b> (${top[1]} de tus últimos ${totalErr} fallos). ${esc(LE.tipoError(top[0]).consejo)}</p>
        ${LE.perfilErrores(cua.perfil)}` : `<p class="sub">Todavía no hay errores registrados. Cuando falles una, aquí verás qué tipo de error fue.</p>`}
      <div class="stats dos">
        <a class="stat enlace-stat" href="#/logica/errores"><b>${pend}</b><span>${pend === 1 ? "pregunta pendiente" : "preguntas pendientes"} en tu cuaderno de errores ›</span></a>
        <a class="stat enlace-stat" href="#/logica/tecnicas"><b>${dominadas}<small>/${tecnicas.length}</small></b><span>técnicas dominadas en tu caja de herramientas ›</span></a>
      </div>
      ${pend ? `<div class="fila"><button class="btn sec chico" data-accion="reto" data-n="${Math.min(10, pend)}" data-tema="@errores" data-comp="logica">Repasar ${Math.min(10, pend)} de mis errores</button></div>` : ""}
    </section>`;
  };

  // ---------- Caja de herramientas ----------
  LE.ruta("/logica/tecnicas", protegida(async () => {
    LE.cargando();
    const cua = await LE.api.cuaderno("logica");
    const avance = porTema(cua);
    const tecnicas = LE.estado.tecnicas || [];
    const dominadas = tecnicas.filter((t) => LE.estadoTecnica(avance[t.codigo]) === "dominada").length;

              <details><summary class="pequeno sub" style="cursor:pointer">Explicación del banco</summary><p class="sub pequeno" style="margin-top:.4rem">${esc(f.explicacion)}</p></details>
              <div><button class="btn sec chico" data-accion="comentar" data-k="${k}">Comentarle esta pregunta</button></div>
            </article>`).join("") + (falladas.length > 6 ? "</details>" : "") : `<p class="sub">Sin errores registrados todavía.</p>`}
        </section>
      </div>`);
    activarCompositor();
  }, { tutor: true });

  // Lógica: cómo se equivoca y qué técnicas le cuestan (lo mismo que ella ve en su cuaderno).
  function panelErrores(cua, p) {
    const top = Object.entries(cua.perfil || {}).sort((a, b) => b[1] - a[1])[0];
    const flojas = (cua.temas || []).filter((t) => t.intentos >= 2 && t.aciertos < t.intentos && LE.tecnica(t.tema)).map((t) => ({ ...t, pct: Math.round((100 * t.aciertos) / t.intentos) }))
      .sort((a, b) => a.pct - b.pct || b.intentos - a.intentos).slice(0, 6);
    const dominadas = (cua.temas || []).filter((t) => LE.estadoTecnica(t) === "dominada").length;
    return `<div class="rejilla dos">
      <section class="panel pila" style="--pila:.8rem">
        <div class="titulo-seccion" style="margin-bottom:0"><h2>Lógica: cómo se equivoca</h2><span class="sub pequeno">Últimos fallos, por tipo de error</span></div>
        ${top ? `${LE.perfilErrores(cua.perfil)}
          <p class="sub pequeno">Lo que más se repite es <b style="color:var(--texto)">${esc(LE.tipoError(top[0]).nombre.toLowerCase())}</b>. ${esc(LE.tipoError(top[0]).consejo)}</p>` : `<p class="sub">Todavía no hay errores de lógica con diagnóstico.</p>`}
        <p class="tenue pequeno">${(cua.pendientes || []).length} preguntas pendientes en su cuaderno de errores · ${cua.recuperadas} corregidas.</p>
      </section>
      <section class="panel pila" style="--pila:.6rem">
        <div class="titulo-seccion" style="margin-bottom:0"><h2>Lógica: técnicas que más le cuestan</h2><span class="sub pequeno">${dominadas} de ${(LE.estado.tecnicas || []).length} dominadas</span></div>
        ${flojas.length ? flojas.map((t) => `<div class="repaso-fila">
          <span><b>${esc(LE.tecnica(t.tema).nombre)}</b><span class="tenue pequeno"> · ${t.aciertos} de ${t.intentos} (${t.pct}%)</span></span>
          <button class="btn suave chico" data-accion="verTecnica" data-cod="${esc(t.tema)}">Ver ficha</button>
        </div>`).join("") : `<p class="sub">Todavía no hay técnicas con fallos repetidos.</p>`}
      </section>
    </div>`;
  }

  function tablaTendencia(tend = [], comp = "lectura", rotular = false) {
    const cats = LE.COMP[comp].cats;
    tend = (tend || []).filter((t) => cats.includes(t.categoria));
    if (!tend?.length) return "";
    const semanas = [...new Set(tend.map((t) => t.semana))].sort();
    const celda = (sem, c) => {
      const x = tend.find((t) => t.semana === sem && t.categoria === c);
      return x ? `<td class="num"><span class="celda-mapa cr-${c}" style="--p:${Math.round(x.precision * 0.7)}" title="${x.n} respuestas">${x.precision}%</span></td>` : `<td class="num tenue">—</td>`;
    };
    return `<section class="panel">
      <div class="titulo-seccion"><h2>Evolución semanal${rotular ? " · " + LE.COMP[comp].nombre : ""}</h2><span class="sub pequeno">% de aciertos por semana y nivel</span></div>
      <div class="scroll-x"><table class="tabla">
        <thead><tr><th>Semana del</th>${cats.map((c) => `<th class="num">${esc(LE.cat(c).nombre)}</th>`).join("")}</tr></thead>
        <tbody>${semanas.map((s) => `<tr><td>${LE.fecha(s + "T12:00")}</td>${cats.map((c) => celda(s, c)).join("")}</tr>`).join("")}</tbody>
      </table></div>
    </section>`;
  }

  function compositor(p) {
    return `<form class="pila" style="--pila:.8rem" id="f-msg" data-est="${p.id}">
      <div class="segmentos" role="group" aria-label="Tipo">
        <button type="button" aria-pressed="true" data-tipo="mensaje">Mensaje</button>
        <button type="button" aria-pressed="false" data-tipo="mision">Misión</button>
      </div>
      <label class="campo">Título<input name="titulo" required maxlength="80" placeholder="Ej.: ¡Qué buena semana!"></label>
      <label class="campo">Mensaje<textarea name="cuerpo" maxlength="1200" placeholder="Escríbele a ${nombreCorto(p.nombre)}…"></textarea></label>
      <div class="dos-campos" data-solo-mision hidden>
        <label class="campo">Preguntas<select name="n"><option>5</option><option selected>10</option><option>15</option></select></label>
        <label class="campo">${LE.logicaActiva() ? "Componente y nivel" : "Nivel"}<select name="cat">${LE.logicaActiva()
          ? ["lectura", "logica"].map((k) => `<optgroup label="${LE.COMP[k].nombre}"><option value="${k}|">${LE.COMP[k].nombre}: mezcla de todos</option>${LE.COMP[k].cats.map((c) => `<option value="${k}|${c}">${esc(LE.cat(c).nombre)}</option>`).join("")}</optgroup>`).join("")
          : `<option value="lectura|">Mezcla de todos</option>${LE.CATS.map((c) => `<option value="lectura|${c}">${esc(LE.cat(c).nombre)}</option>`).join("")}`}</select></label>
      </div>
      <div class="acciones"><button class="btn">Enviar</button></div>
    </form>`;
  }

  function activarCompositor() {
    const f = $("#f-msg");
    if (!f) return;
    let tipo = "mensaje";
    f.querySelector(".segmentos").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tipo]"); if (!b) return;
      tipo = b.dataset.tipo;
      $$("[data-tipo]", f).forEach((x) => x.setAttribute("aria-pressed", x === b));
      f.querySelector("[data-solo-mision]").hidden = tipo !== "mision";
      f.titulo.placeholder = tipo === "mision" ? "Ej.: Misión: conectores" : "Ej.: ¡Qué buena semana!";
    });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = f.querySelector("button:not([type])");
      btn.disabled = true;
      try {
        await LE.api.enviarMensaje({
          estudiante_id: f.dataset.est, tipo, titulo: f.titulo.value.trim(), cuerpo: f.cuerpo.value.trim(),
          mision: tipo === "mision" ? { n: +f.n.value, categoria: f.cat.value.split("|")[1] || null, componente: f.cat.value.split("|")[0] || "lectura" } : null
        });
        LE.aviso(tipo === "mision" ? "Misión enviada" : "Mensaje enviado");
        LE.navegar();
      } catch (err) { LE.error(err); btn.disabled = false; }
    });
  }

              <tbody>${LE.COMP[comp].cats.map((cat) => `<tr><td><span class="etq cr-${cat}">${esc(LE.cat(cat).nombre)}</span></td>${[1, 2, 3].map((d) => `<td class="num">${m[cat]?.[d] || 0}</td>`).join("")}<td class="num"><b>${total(cat)}</b></td><td class="num tenue">${Math.round((dist[cat] || 0) * 100)}%</td></tr>`).join("")}</tbody>

          <p class="sub">Lectura: ${c.textos} lecturas y ${c.preguntas} preguntas activas.${nLog || LE.logicaActiva() ? ` Lógica: ${nLog} preguntas, ${c.situaciones || 0} situaciones y ${c.tecnicas || 0} fichas de técnica.` : ""}</p>
        </div>

        <section class="panel pila destacado" style="--pila:.8rem">

              : `<p class="sub">${LE.logicaActiva() ? "Lógica está activada pero todavía no hay preguntas: carga <b>logica-001</b> y <b>logica-002</b>." : "Lógica no está activada. Carga primero <b>logica-base</b> (niveles, técnicas e insignias) y después los paquetes de preguntas <b>logica-001</b> y <b>logica-002</b>."}</p>`}

  // =================================================================
  //  EXPLORAR EL BANCO: cada lectura y pregunta como la ve la estudiante,
  //  con la clave a la vista después de responder. No guarda nada.
  // =================================================================
  LE.ruta("/tutor/contenido/banco", async () => {
    LE.cargando("Trayendo el banco de preguntas…");
    LE.estado.banco = await LE.api.banco();
    LE.estado.filtroBanco ||= { comp: "lectura", cat: "", dif: "", paquete: "", q: "", inactivas: false };
    pintarBanco();
  }, { tutor: true });

  function pintarBanco() {
    const { textos, preguntas } = LE.estado.banco;
    const f = LE.estado.filtroBanco;
    const comp = f.comp === "logica" && !preguntas.some((p) => p.componente === "logica") ? "lectura" : f.comp;
    const paquetes = [...new Set(preguntas.filter((p) => p.componente === comp).map((p) => p.paquete))].filter(Boolean).sort();
    const q = f.q.trim().toLowerCase();
    const porTexto = Object.fromEntries(textos.map((t) => [t.id, t]));
    const lista = preguntas.filter((p) => p.componente === comp && (f.inactivas || p.activo) && (!f.cat || p.categoria === f.cat)
      && (!f.dif || p.dificultad === +f.dif) && (!f.paquete || p.paquete === f.paquete)
      && (!q || [p.codigo, p.enunciado, porTexto[p.texto_id]?.titulo, LE.tecnica(p.tema)?.nombre].some((x) => String(x || "").toLowerCase().includes(q))));
    // Bloques: una lectura o situación con sus preguntas; los problemas sueltos, por técnica.
    const bloques = [];
    const idx = {};
    for (const p of lista) {
      const llave = p.texto_id || "tema:" + (p.tema || "otros");
      if (!idx[llave]) {
        const t = p.texto_id ? porTexto[p.texto_id] : null;
        idx[llave] = { llave, t, titulo: t ? t.titulo : "Problemas sueltos · " + (LE.tecnica(p.tema)?.nombre || "sin técnica"), tipo: t ? LE.TIPOS[t.tipologia] || "Lectura" : "Técnica", codigo: t?.codigo || "", paquete: t?.paquete || p.paquete, preguntas: [] };
        bloques.push(idx[llave]);
      }
      idx[llave].preguntas.push(p);
    }
    LE.estado.bloquesBanco = idx;
    const cats = LE.COMP[comp].cats;
    LE.montar(`
      <div class="pila" style="--pila:1.25rem">
        <a href="#/tutor/contenido" class="pequeno">‹ Contenido</a>
        <div class="fila entre">
          <div class="pila" style="--pila:.3rem">
            <h1>Explorar el banco</h1>
            <p class="sub">Así ve cada pregunta la estudiante. Responde para ver la clave y la explicación. Aquí no se guarda nada.</p>
          </div>
          <a class="btn sec chico" href="#/practicar">Practicar como estudiante</a>
        </div>
        <section class="panel filtros" id="filtros-banco">
          ${LE.logicaActiva() || preguntas.some((p) => p.componente === "logica") ? `<div class="segmentos" role="group" aria-label="Componente">
            ${["lectura", "logica"].map((k) => `<button type="button" data-comp="${k}" aria-pressed="${k === comp}">${LE.COMP[k].icono} ${LE.COMP[k].nombre}</button>`).join("")}
          </div>` : ""}
          <div class="filtros-campos">
            <label class="campo">Nivel<select name="cat"><option value="">Todos</option>${cats.map((c) => `<option value="${c}" ${f.cat === c ? "selected" : ""}>${esc(LE.cat(c).nombre)}</option>`).join("")}</select></label>
            <label class="campo">Dificultad<select name="dif"><option value="">Todas</option>${[1, 2, 3].map((d) => `<option value="${d}" ${+f.dif === d ? "selected" : ""}>${["", "Fácil", "Media", "Difícil"][d]}</option>`).join("")}</select></label>
            <label class="campo">Paquete<select name="paquete"><option value="">Todos</option>${paquetes.map((x) => `<option ${f.paquete === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
            <label class="campo">Buscar<input name="q" value="${esc(f.q)}" placeholder="Código, palabra del enunciado o título"></label>
          </div>
          <label class="check"><input type="checkbox" name="inactivas" ${f.inactivas ? "checked" : ""}> Incluir las desactivadas</label>
        </section>
        <p class="sub pequeno">${bloques.length} ${comp === "logica" ? "bloques" : bloques.length === 1 ? "lectura" : "lecturas"} · ${lista.length} ${lista.length === 1 ? "pregunta" : "preguntas"}</p>
        <div class="banco">${bloques.map((b) => `
          <details class="bloque-banco" data-bloque="${esc(b.llave)}">
            <summary>
              <span class="etq cr-${b.t ? (comp === "logica" ? "cian" : "rosa") : "violeta"}">${esc(b.tipo)}</span>
              <b>${esc(b.titulo)}</b>
              <span class="tenue pequeno">${[b.codigo, b.paquete, b.preguntas.length + (b.preguntas.length === 1 ? " pregunta" : " preguntas")].filter(Boolean).map(esc).join(" · ")}</span>
            </summary>
            <div class="cuerpo"></div>
          </details>`).join("") || `<div class="panel vacio"><p>Ninguna pregunta cumple esos filtros.</p></div>`}</div>
      </div>`);
    const caja = $("#filtros-banco");
    caja.addEventListener("click", (e) => { const b = e.target.closest("[data-comp]"); if (!b) return; Object.assign(f, { comp: b.dataset.comp, cat: "", paquete: "" }); pintarBanco(); });
    caja.addEventListener("change", (e) => { const x = e.target; if (!x.name) return; f[x.name] = x.type === "checkbox" ? x.checked : x.value; if (x.name !== "q") pintarBanco(); });
    let espera = null;
    caja.querySelector("[name=q]").addEventListener("input", (e) => { clearTimeout(espera); espera = setTimeout(() => { f.q = e.target.value; pintarBanco(); const i = $("#filtros-banco [name=q]"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); });
    // El contenido de cada bloque se pinta al abrirlo.
    $$(".bloque-banco").forEach((d) => d.addEventListener("toggle", () => {
      const cuerpo = d.querySelector(".cuerpo");
      if (!d.open || cuerpo.dataset.listo) return;
      const b = LE.estado.bloquesBanco[d.dataset.bloque];
      cuerpo.innerHTML = `${b.t ? `<div class="lectura-banco">${LE.lecturaHTML(b.t, false)}</div>` : ""}${b.preguntas.map((p) => preguntaBanco(p)).join("")}`;
      cuerpo.dataset.listo = "1";
    }));
  }

  const buscarPregunta = (id) => LE.estado.banco.preguntas.find((p) => p.id === id);

  function preguntaBanco(p, respuesta = null, pista = false) {
    const logica = p.componente === "logica";
    const r = respuesta;

  //  MODO PRÁCTICA DEL TUTOR
  // =================================================================
  // El tutor usa la app como estudiante, con su propia cuenta. Lo que haga
  // no aparece en el panel, en las alertas ni en los grupos.
  LE.ruta("/practicar", async () => {
    LE.fijarPractica(true);
    LE.cronometro.iniciar();
    await LE.pintarEstructura(LE.COMP[LE.compActual()].ruta);
  }, { tutor: true });
  A.salirPractica = async () => {
