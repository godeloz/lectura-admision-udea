ofrece, el autor agrega otra razón, la de las obras que cambian de lugar. Para presentar la postura contraria usaría «pero» o «sin embargo»; para concluir, «por tanto» o «en suma»."}]}]}, {"paquete": "paquete-003", "textos": [{"codigo": "P003-T01", "titulo": "Lo que los archivos callan", "tipologia": "ensayo", "fuente": "Texto original para práctica.", "contenido": "Se dice que la historia la escriben los vencedores. La sentencia, a fuerza de repetirse, ha adquirido el brillo engañoso de las verdades que ya nadie examina. Más exacto sería decir que la historia la escriben los que escriben: quienes dejaron actas, cartas, inventarios y sentencias, y quienes tuvieron, además, la fortuna de que alguien juzgara esos papeles dignos de guardarse. El historiador no trabaja con el pasado, que es por definición inaccesible, sino con sus residuos; y los residuos, como bien sabe cualquiera que haya vaciado la casa de un muerto, no se conservan según su importancia sino según su suerte.\n\nDe ahí que todo archivo sea, a la vez, un depósito y un filtro. Guarda la voz del notario, del párroco, del funcionario que cobra un impuesto, y solo de manera oblicua —como acusados, como deudores, como cifras en un censo— la de quienes no sabían o no podían escribir. Una campesina del siglo XVIII comparece ante nosotros casi siempre en el momento en que tropieza con el poder: cuando la demandan, cuando la bautizan, cuando la entierran. De sus días corrientes, que fueron casi todos, no queda renglón. Sería un error confundir ese silencio con una ausencia: que alguien no figure en los documentos no significa que no haya existido, sino que nadie con una pluma en la mano tuvo motivos para registrarlo.\n\nEl oficio ha respondido a esta dificultad de dos maneras. La primera, más antigua, consiste en ignorarla: se narra lo que los papeles permiten y se llama a eso «la» historia, con un artículo que promete más de lo que cumple. La segunda, más paciente, aprende a leer los documentos a contrapelo, es decir, a preguntarles lo que no se proponían decir. El expediente de un juicio fue redactado para condenar o absolver; pero, leído con otra intención, deja ver cómo hablaba la gente, qué temía, qué consideraba justo. El escribano no quería contarnos nada de eso, y precisamente por ello su testimonio es valioso: nadie miente sobre aquello en lo que no repara.\n\nNada de esto autoriza, sin embargo, a rellenar los vacíos con la imaginación y presentar el resultado como conocimiento. Entre el historiador que solo oye a los poderosos y el que hace hablar a los mudos diciendo lo que a él le conviene hay menos distancia de la que parece: ambos sustituyen la escucha por el monólogo. La honradez del oficio consiste en algo más modesto y más difícil: señalar con exactitud dónde termina lo que sabemos y admitir que, a partir de ese borde, el silencio también forma parte del documento.", "preguntas": [{"codigo": "P003-T01-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el tercer párrafo, el testimonio del escribano resulta valioso porque:", "opciones": ["Deja ver, sin habérselo propuesto, cosas que no tenía interés en falsear.", "Fue redactado con la intención de condenar o de absolver a un acusado.", "El escribano conocía de cerca la vida cotidiana de quienes eran juzgados.", "Los expedientes judiciales eran los únicos papeles que se conservaban."], "correcta": 0, "explicacion": "La clave está en la última frase del párrafo: «nadie miente sobre aquello en lo que no repara». El escribano quería condenar o absolver; lo demás (cómo hablaba la gente, qué temía) quedó escrito sin intención, y por eso es fiable. Que el expediente se redactó para condenar o absolver es cierto, pero no es la razón de su valor: es el dato correcto puesto en el lugar equivocado."}, {"codigo": "P003-T01-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "En el segundo párrafo, la expresión «de manera oblicua» indica que la voz de quienes no escribían llega al archivo:", "opciones": ["En contadas ocasiones, aunque siempre con sus propias palabras.", "De forma torcida, porque los funcionarios mentían acerca de ellos.", "De modo indirecto, a través de lo que otros anotaron sobre ellos.", "Con claridad, pero únicamente en documentos de poca importancia."], "correcta": 2, "explicacion": "«Oblicuo» es lo que no va de frente. Las rayas que siguen lo aclaran: esas personas aparecen «como acusados, como deudores, como cifras en un censo», es decir, nombradas por otros. «Torcida» puede ser sinónimo de «oblicua» en otros contextos, pero el texto no dice que los funcionarios mintieran."}, {"codigo": "P003-T01-03", "categoria": "inferencial", "dificultad": 3, "enunciado": "En el tercer párrafo, el autor escribe «la» historia, con el artículo entre comillas, para:", "opciones": ["Advertir que se refiere a la historia de una nación determinada.", "Poner en duda que un relato hecho con fuentes parciales sea el único posible.", "Citar el título de una obra que se menciona unas líneas más adelante.", "Subrayar que la historia es una disciplina más exacta que las demás ciencias."], "correcta": 1, "explicacion": "Las comillas marcan distancia: el autor no se hace cargo de ese artículo. Él mismo lo explica al decir que es «un artículo que promete más de lo que cumple»: promete la historia completa y entrega solo la que permiten los papeles. Cuando una palabra aparece entre comillas sin ser una cita, casi siempre hay ironía o reserva."}, {"codigo": "P003-T01-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "Una actitud semejante a la de quien lee los documentos «a contrapelo» es la de:", "opciones": ["Un juez que solo acepta como prueba aquello que consta en un documento firmado.", "Un periodista que transcribe el comunicado oficial sin añadirle una palabra.", "Un novelista que inventa los diálogos de un personaje del que nada se sabe.", "Un médico que, mientras el paciente habla de su trabajo, observa cómo respira."], "correcta": 3, "explicacion": "Leer a contrapelo es preguntarle a una fuente «lo que no se proponían decir». El médico hace eso: obtiene información de algo que el paciente no pretendía comunicar. El juez y el periodista se quedan con lo que el documento quiso decir; el novelista ya no lee: inventa."}, {"codigo": "P003-T01-05", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de las siguientes afirmaciones recoge mejor la posición del autor frente a los silencios del archivo?", "opciones": ["Demuestran que la historia es una ficción y que cualquier versión vale lo que otra.", "Hay que reconocerlos y delimitarlos, sin pasarlos por alto ni llenarlos con invenciones.", "Carecen de interés, porque el historiador solo puede ocuparse de lo que está escrito.", "Hay que llenarlos con imaginación, pues de otro modo los excluidos seguirían sin voz."], "correcta": 1, "explicacion": "El autor descarta dos salidas: ignorar el silencio, que es la primera manera, y rellenarlo con la imaginación. Lo que propone está al final: señalar «dónde termina lo que sabemos». La opción de la imaginación tienta porque suena generosa con los excluidos, pero el texto dice que quien la practica también sustituye «la escucha por el monólogo»."}, {"codigo": "P003-T01-06", "categoria": "critico", "dificultad": 2, "enunciado": "La mención de la campesina del siglo XVIII cumple en el texto la función de:", "opciones": ["Demostrar que las mujeres del campo no tuvieron ninguna participación en la historia de su tiempo.", "Denunciar los abusos que cometía la justicia en los tiempos de la Colonia.", "Presentar una fuente inédita que el autor encontró en sus investigaciones.", "Mostrar que el archivo registra a ciertas personas solo cuando se cruzan con el poder."], "correcta": 3, "explicacion": "Es un ejemplo al servicio de la tesis del párrafo: el archivo es «un depósito y un filtro». La campesina aparece cuando la demandan, la bautizan o la entierran, es decir, cuando una institución tiene motivos para anotarla. Concluir que no participó en la historia es justo el error que el párrafo advierte: confundir el silencio con la ausencia."}, {"codigo": "P003-T01-07", "categoria": "cohesion", "dificultad": 3, "enunciado": "El último párrafo comienza así: «Nada de esto autoriza, sin embargo, a rellenar los vacíos con la imaginación». Con ese comienzo, el autor:", "opciones": ["Retoma lo expuesto y le pone un límite para evitar una conclusión excesiva.", "Resume lo expuesto y lo presenta como algo que ya quedó demostrado.", "Añade un tercer método a los dos que había descrito en el párrafo anterior.", "Rechaza lo expuesto y regresa a la manera más antigua de hacer historia."], "correcta": 0, "explicacion": "«Nada de esto» es una anáfora: recoge todo lo anterior (los silencios, la lectura a contrapelo). «Sin embargo» no lo niega; advierte que de ahí no se sigue cualquier cosa. Es un movimiento frecuente en los ensayos: después de defender una idea, el autor la protege de su versión exagerada."}]}, {"codigo": "P003-T02", "titulo": "El punto exacto de la dificultad", "tipologia": "divulgacion", "fuente": "Texto original de divulgación para práctica.", "contenido": "Quien haya jugado un buen videojuego conoce la experiencia: uno se sienta «un rato» y, cuando levanta la vista, han pasado dos horas. El psicólogo Mihály Csíkszentmihályi estudió ese estado mucho antes de que existieran las consolas modernas, observando a pintores, escaladores y ajedrecistas, y lo llamó *flujo*: una concentración tan completa en la tarea que la persona pierde la noción del tiempo y deja, por un momento, de vigilarse a sí misma.\n\nSegún sus investigaciones, el flujo no aparece al azar. Requiere, en primer lugar, metas claras: saber en cada momento qué se intenta lograr. Requiere, además, una respuesta inmediata, de modo que cada acción muestre enseguida si fue acertada. Y exige, sobre todo, un equilibrio preciso entre la dificultad del reto y la habilidad de quien lo enfrenta. Si el reto supera con mucho a la habilidad, sobreviene la ansiedad; si la habilidad supera con mucho al reto, llega el aburrimiento. El flujo ocupa el estrecho canal que queda entre ambos.\n\nLos diseñadores de videojuegos han convertido esta teoría en un método. Un juego bien construido enseña sus reglas poco a poco, premia cada avance con una señal visible y, lo que es más importante, se vuelve más difícil al mismo ritmo en que el jugador se vuelve más hábil. Algunos títulos van más lejos y ajustan la dificultad sobre la marcha: si el jugador fracasa varias veces en el mismo punto, los enemigos se vuelven un poco más lentos, sin que nadie se lo anuncie.\n\nConviene, sin embargo, no confundir el flujo con el provecho. El estado descrito por Csíkszentmihályi es el mismo en el cirujano que opera y en quien encadena partidas hasta la madrugada: la teoría explica por qué una actividad absorbe, no si vale la pena. De hecho, el propio investigador advertía que casi cualquier tarea puede producirlo —estudiar, tocar un instrumento, resolver un problema— siempre que cumpla las tres condiciones. La pregunta útil, entonces, no es por qué los videojuegos atrapan, sino por qué tantas otras tareas están diseñadas, sin que nadie se lo proponga, para no hacerlo.", "preguntas": [{"codigo": "P003-T02-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según el segundo párrafo, ¿qué producen, respectivamente, un reto muy superior a la habilidad y una habilidad muy superior al reto?", "opciones": ["Ansiedad y flujo.", "Flujo y aburrimiento.", "Ansiedad y aburrimiento.", "Aburrimiento y ansiedad."], "correcta": 2, "explicacion": "El texto lo dice en ese orden: si el reto supera a la habilidad, «sobreviene la ansiedad»; si la habilidad supera al reto, «llega el aburrimiento». La palabra «respectivamente» obliga a respetar el orden de la pregunta: la opción que invierte los términos tiene los datos correctos y aun así es falsa."}, {"codigo": "P003-T02-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "La expresión «el estrecho canal que queda entre ambos», al final del segundo párrafo, sugiere que el flujo:", "opciones": ["Solo se da en un margen reducido, cuando el reto no sobra ni falta.", "Aparece con frecuencia y sin necesidad de condiciones especiales.", "Es un estado poco deseable, porque restringe la libertad de quien juega.", "Es el punto medio entre la meta clara y la respuesta inmediata."], "correcta": 0, "explicacion": "«Ambos» son la ansiedad y el aburrimiento; el «canal» es el espacio que queda entre uno y otro, y «estrecho» indica que ese espacio es pequeño: el equilibrio se pierde con facilidad. La opción del punto medio entre meta y respuesta confunde los referentes: esas son condiciones del flujo, no los extremos entre los que se sitúa."}, {"codigo": "P003-T02-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "Una estudiante resuelve ejercicios que le quedan demasiado fáciles y nota que se distrae. De acuerdo con el texto, lo más indicado para acercarla al flujo sería:", "opciones": ["Aplazar la corrección de los ejercicios hasta el fin de semana.", "Subir la dificultad hasta ponerla a la altura de su habilidad.", "Suprimir las metas para que trabaje sin ninguna presión.", "Bajar la dificultad para que gane confianza en sí misma."], "correcta": 1, "explicacion": "El texto pide equilibrio entre reto y habilidad. Aquí sobra habilidad, así que hay que subir el reto. Las otras opciones van contra alguna de las condiciones: suprimir las metas elimina la primera, y aplazar la corrección elimina la respuesta inmediata."}, {"codigo": "P003-T02-04", "categoria": "critico", "dificultad": 2, "enunciado": "En el último párrafo, el autor pone juntos al cirujano que opera y a quien «encadena partidas hasta la madrugada» para mostrar que:", "opciones": ["El flujo solo es legítimo cuando se da en una actividad profesional.", "Jugar videojuegos exige tanta destreza como practicar una cirugía.", "Los cirujanos suelen entrenarse con videojuegos antes de operar.", "El flujo explica por qué algo absorbe, no si merece la pena."], "correcta": 3, "explicacion": "Los dos casos sirven porque son muy distintos en valor y, sin embargo, producen el mismo estado. De ahí la advertencia de «no confundir el flujo con el provecho». El autor no compara destrezas ni dice que el flujo de uno sea más legítimo que el del otro: dice que la teoría no juzga."}, {"codigo": "P003-T02-05", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de las siguientes conclusiones NO puede apoyarse en el texto?", "opciones": ["El flujo puede presentarse en actividades muy distintas entre sí.", "Los buenos videojuegos aplican de manera deliberada las condiciones del flujo.", "Todo juego que ajusta su dificultad sobre la marcha produce flujo en cualquier jugador.", "Una clase con metas confusas y correcciones que llegan tarde difícilmente producirá flujo."], "correcta": 2, "explicacion": "Las tres conclusiones válidas se apoyan en el texto: las condiciones del flujo, la variedad de actividades que lo producen y el uso deliberado que hacen de ellas los diseñadores. La otra generaliza de más: el ajuste de dificultad atiende una sola de las tres condiciones, y el texto habla de algunos títulos, no de un efecto garantizado en todos los jugadores. Palabras como «todo» y «cualquier» suelen delatar una extrapolación."}, {"codigo": "P003-T02-06", "categoria": "cohesion", "dificultad": 2, "enunciado": "En el segundo párrafo, las expresiones «en primer lugar», «además» y «sobre todo» sirven para:", "opciones": ["Indicar que las condiciones se cumplen una después de otra en el tiempo.", "Ordenar las tres condiciones y destacar la última como la principal.", "Contraponer tres teorías distintas acerca del origen del flujo.", "Ofrecer tres ejemplos diferentes de una misma condición."], "correcta": 1, "explicacion": "Son marcadores que organizan una enumeración: el primero la abre, el segundo suma y el tercero jerarquiza. «Sobre todo» avisa que el equilibrio entre reto y habilidad pesa más que las otras dos condiciones. «En primer lugar» ordena la exposición, no el tiempo: las tres condiciones deben darse a la vez."}]}, {"codigo": "P003-T03", "titulo": "El reloj de Santa Rita", "tipologia": "literario", "fuente": "Relato original para práctica.", "contenido": "El reloj de la torre de Santa Rita atrasaba siete minutos desde que alguien tenía memoria. Nadie en el pueblo lo ignoraba y a nadie le estorbaba, porque los relojes de las casas se ponían en hora con el de la torre: la misa de seis empezaba cuando el reloj daba las seis, el mercado abría cuando daba las ocho, y los novios que se citaban «a las cuatro en la plaza» sabían, sin haberlo acordado nunca, a qué cuatro se referían. El bus de la capital, único forastero puntual, llegaba a las tres menos siete, y los viajeros lo esperaban con la calma de quien conoce las mañas de un pariente.\n\nEl alcalde nuevo había estudiado afuera y traía ideas. La primera fue el reloj. «Un pueblo que vive con siete minutos de atraso —dijo en su discurso— vive siete minutos por detrás del progreso». Mandó traer a un técnico, que subió a la torre con una caja de herramientas, trabajó una mañana entera y bajó asegurando que la máquina quedaba, por fin, exacta como un decreto.\n\nLa primera semana fue un desconcierto. Unos se guiaban por la torre y otros por el reloj de la cocina, que seguía fiel a la hora vieja. Hubo feligreses que llegaron a una misa ya empezada; las vendedoras encontraron el mercado medio vacío o lleno antes de tiempo, según el reloj que siguiera cada cliente; dos noviazgos se rompieron por esperas que nadie se había propuesto causar. Solo el bus siguió llegando como siempre, indiferente a la reforma.\n\nAl mes, los vecinos habían encontrado remedio. Cada cual, por su cuenta y sin comentarlo, volvió a restarle siete minutos a la torre. «Nos vemos a las cuatro», se decían, y acudían cuando el reloj marcaba las cuatro y siete. El pueblo recuperó así su antigua concordia, con una sola diferencia: antes vivía de acuerdo con un reloj equivocado, y ahora, en desacuerdo con uno exacto.\n\nEl alcalde, que no dejaba de mirar la torre desde su despacho, anotó en el informe de fin de año: «Se corrigió el reloj municipal. La ciudadanía ha respondido con entusiasmo».", "preguntas": [{"codigo": "P003-T03-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según el relato, ¿qué hicieron los vecinos un mes después del arreglo?", "opciones": ["Adelantaron siete minutos los relojes de sus casas para igualarlos con la torre.", "Pidieron al alcalde que devolviera el reloj al estado en que estaba.", "Siguieron, sin acordarlo, guiándose por la hora que tenían antes.", "Dejaron de mirar el reloj y empezaron a guiarse por la llegada del bus."], "correcta": 2, "explicacion": "El cuarto párrafo dice que cada cual «volvió a restarle siete minutos a la torre»: es decir, siguieron viviendo con la hora de antes, aunque el reloj marcara otra. Nadie le pidió nada al alcalde ni cambió los relojes de la casa; el arreglo fue silencioso y de cada uno."}, {"codigo": "P003-T03-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "La comparación «con la calma de quien conoce las mañas de un pariente» da a entender que los viajeros:", "opciones": ["Desconfiaban del conductor y de sus malas costumbres.", "Se impacientaban porque el bus nunca llegaba a la hora.", "Tenían familiares que trabajaban en la empresa de buses.", "Estaban tan hechos al desfase que ya no les incomodaba."], "correcta": 3, "explicacion": "A un pariente se le conocen las manías y se le toleran sin sorpresa: así trataban los viajeros la diferencia entre el bus y el reloj. La comparación habla de costumbre y confianza, no de parentescos reales ni de impaciencia."}, {"codigo": "P003-T03-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "¿Cuál de los siguientes dichos se aplica mejor a lo que ocurre en el pueblo durante la primera semana?", "opciones": ["El remedio resultó peor que la enfermedad.", "Al que madruga, Dios le ayuda.", "No dejes para mañana lo que puedes hacer hoy.", "Más vale tarde que nunca."], "correcta": 0, "explicacion": "El atraso del reloj no le causaba problemas a nadie; corregirlo sí los causó. Eso dice el refrán: una solución que hace más daño que el mal que pretendía curar. Los otros tres hablan del tiempo, y por eso tientan, pero ninguno describe una corrección que sale mal."}, {"codigo": "P003-T03-04", "categoria": "inferencial", "dificultad": 2, "enunciado": "Un título que recoge bien el sentido del relato sería:", "opciones": ["Un pueblo sin relojes", "El arreglo que nadie pidió", "El bus de la capital", "Historia de un técnico relojero"], "correcta": 1, "explicacion": "El centro del relato es una reforma que resuelve un problema que el pueblo no tenía. El técnico y el bus son detalles, no el asunto; y el pueblo no carece de relojes: tiene uno en la torre y otro en cada cocina. Un buen título nombra lo que el texto entero dice, no una de sus partes."}, {"codigo": "P003-T03-05", "categoria": "inferencial", "dificultad": 3, "enunciado": "La frase final del informe —«La ciudadanía ha respondido con entusiasmo»— resulta irónica porque:", "opciones": ["Los vecinos celebraron el arreglo del reloj con una fiesta que el relato prefiere no mencionar.", "El alcalde miente a sabiendas con el propósito de conservar su cargo.", "El lector sabe que los vecinos se las arreglaron para seguir con la hora antigua.", "El entusiasmo fue sincero, pero no duró más que la primera semana."], "correcta": 2, "explicacion": "La ironía nace de la distancia entre lo que el personaje afirma y lo que el lector ha visto. El alcalde mira la torre, no a la gente: ve un reloj exacto y concluye que todo salió bien. El relato no dice que mienta; sugiere algo más incómodo, que no se ha enterado."}, {"codigo": "P003-T03-06", "categoria": "critico", "dificultad": 2, "enunciado": "El relato puede leerse como una crítica a:", "opciones": ["Los técnicos que cobran por trabajos que luego no funcionan.", "La impuntualidad, que el autor considera un defecto de la vida rural.", "Los pueblos que se niegan a aceptar cualquier forma de progreso.", "Las reformas que ignoran los acuerdos tácitos de una comunidad."], "correcta": 3, "explicacion": "El técnico hizo bien su trabajo y el reloj quedó exacto; lo que falló fue suponer que la hora es solo un asunto de máquinas. El pueblo tenía un acuerdo que funcionaba, y la reforma lo rompió sin saber que existía. El relato no se burla de los vecinos ni defiende la impuntualidad: su blanco es la reforma decidida desde un despacho."}, {"codigo": "P003-T03-07", "categoria": "cohesion", "dificultad": 2, "enunciado": "En la oración «antes vivía de acuerdo con un reloj equivocado, y ahora, en desacuerdo con uno exacto», la coma que sigue a «ahora» indica que:", "opciones": ["Se omite un verbo ya dicho: «vivía».", "Comienza una enumeración de varios elementos.", "Se introduce una cita textual de los vecinos.", "El narrador duda de lo que acaba de afirmar."], "correcta": 0, "explicacion": "Es una coma de elipsis: ocupa el lugar del verbo para no repetirlo (ahora vivía en desacuerdo con uno exacto). Además, «uno» retoma «reloj». La frase gana fuerza con esa economía, porque deja frente a frente las dos mitades: de acuerdo con uno equivocado, en desacuerdo con uno exacto."}]}, {"codigo": "P003-T04", "titulo": "Lo que el algoritmo te pone a oír: dos posturas", "tipologia": "intertextual", "fuente": "Textos originales para práctica.", "contenido": "### Texto A\n\nNunca fue tan fácil encontrar música nueva. Hace treinta años, el oyente dependía de lo que programara la emisora local y de los discos que llegaran a la tienda de su ciudad; hoy, un sistema de recomendación le propone cada semana decenas de canciones que jamás habría buscado por su cuenta. Se objeta que el algoritmo solo ofrece «más de lo mismo», pero la objeción olvida cómo se formaba antes el gusto: por imitación de los amigos, por la radio que sonaba en casa, por el azar de un casete prestado. Ninguno de esos filtros era más libre; simplemente era invisible. La diferencia es que el filtro de ahora tiene acceso a un catálogo casi infinito y aprende de cada elección. Quien desee salir de su círculo puede hacerlo con un gesto; antes, ni siquiera sabía que el círculo existía.\n\n### Texto B\n\nUn sistema de recomendación no adivina lo que nos gustará: calcula lo que se parece a lo que ya nos gustó. Es una distinción que importa. El gusto musical no se forma solo por afinidad, sino también por tropiezo: la canción que al principio irrita y a la décima escucha se vuelve imprescindible, el disco que nos impuso un hermano mayor. El algoritmo, que mide el éxito en segundos de permanencia, tiene buenas razones para evitarnos esas incomodidades, y así nos devuelve, pulida y multiplicada, nuestra propia imagen. Se dirá que el catálogo es inmenso y que nadie nos impide explorarlo. Es cierto, como es cierto que nadie impide al cliente de un supermercado caminar hasta el último estante; pero quien diseña los pasillos sabe muy bien hasta dónde llega la mayoría. La abundancia, sin alguien que nos lleve la contraria, se parece bastante a la monotonía.", "preguntas": [{"codigo": "P003-T04-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el texto B, el gusto musical se forma, por un lado, ______ y, por el otro, ______.", "opciones": ["por imitación de los amigos / por el azar de un casete que alguien presta", "por la amplitud del catálogo / por el diseño de los pasillos del supermercado", "por afinidad con lo que ya agrada / por los cálculos que hace el sistema", "por afinidad con lo que ya agrada / por el tropiezo con lo que incomoda"], "correcta": 3, "explicacion": "El texto B dice que el gusto no se forma «solo por afinidad, sino también por tropiezo», y da dos ejemplos de tropiezo: la canción que irrita al principio y el disco impuesto por un hermano. La imitación de los amigos y el casete prestado también hablan de cómo se forma el gusto, pero están en el texto A."}, {"codigo": "P003-T04-02", "categoria": "inferencial", "dificultad": 3, "enunciado": "De la frase «La abundancia, sin alguien que nos lleve la contraria, se parece bastante a la monotonía» se deduce que, para el autor del texto B:", "opciones": ["Los oyentes deberían discutir de música con quienes piensan distinto.", "Muchas opciones no amplían el gusto si todas confirman lo ya preferido.", "La música que se produce hoy es más monótona que la de hace treinta años.", "Un catálogo pequeño resulta preferible a uno inmenso para educar el oído."], "correcta": 1, "explicacion": "La frase es una paradoja aparente: lo abundante puede ser monótono si todo se parece. «Llevar la contraria» alude a lo que el texto llamó antes «tropiezo»: lo que no elegimos y nos saca de la costumbre. El autor no pide catálogos pequeños ni juzga la música actual; habla de cómo se elige dentro de la abundancia."}, {"codigo": "P003-T04-03", "categoria": "critico", "dificultad": 2, "enunciado": "¿En qué idea coinciden los dos textos?", "opciones": ["El sistema de recomendación termina ofreciendo al oyente más de lo mismo.", "El oyente de hoy acostumbra recorrer todo el catálogo que tiene a su alcance.", "El gusto siempre se ha formado bajo influencias que el oyente no eligió.", "La radio de antes daba al oyente más libertad que las plataformas actuales."], "correcta": 2, "explicacion": "A menciona a los amigos, la radio de la casa y el casete prestado; B, el disco «que nos impuso un hermano mayor». Los dos admiten que el gusto nunca se formó en libertad completa. Difieren en lo que sacan de ahí: para A, el filtro de hoy no es peor que los de antes; para B, le falta lo que aquellos tenían, la sorpresa incómoda."}, {"codigo": "P003-T04-04", "categoria": "critico", "dificultad": 2, "enunciado": "En el texto B se lee: «Se dirá que el catálogo es inmenso y que nadie nos impide explorarlo. Es cierto». Con este recurso, el autor:", "opciones": ["Admite una objeción previsible y luego muestra que no basta para refutarlo.", "Reproduce con exactitud las palabras de quien lo contradice.", "Introduce un dato nuevo que acaba debilitando su propia tesis.", "Cambia de postura al final y termina por darle la razón al autor del texto A."], "correcta": 0, "explicacion": "Es una concesión: el autor se adelanta a lo que le van a responder, lo acepta y enseguida lo neutraliza con la comparación del supermercado. Conceder no es rendirse. La marca está en el «pero» que viene después: lo que sigue a un «pero» es lo que el autor de verdad sostiene."}, {"codigo": "P003-T04-05", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de los siguientes hallazgos debilitaría más el argumento del texto A?", "opciones": ["Que los catálogos de las plataformas incorporan miles de canciones cada día.", "Que muchos oyentes siguen pidiendo recomendaciones a sus amigos.", "Que casi todo lo recomendado es del género que el usuario ya oía.", "Que hace treinta años las emisoras locales programaban muy pocos géneros."], "correcta": 2, "explicacion": "A sostiene que el sistema propone canciones «que jamás habría buscado por su cuenta» y descarta la objeción de «más de lo mismo». Si se comprobara que casi todo lo recomendado repite lo ya escuchado, esa defensa se cae. Los datos sobre las emisoras de antes y el tamaño del catálogo refuerzan a A en lugar de debilitarlo."}, {"codigo": "P003-T04-06", "categoria": "cohesion", "dificultad": 3, "enunciado": "En el texto A, en la oración «Ninguno de esos filtros era más libre; simplemente era invisible», el punto y coma:", "opciones": ["Introduce una causa: podría reemplazarse por «porque».", "Opone dos ideas: podría reemplazarse por «sino que».", "Abre una enumeración de los filtros mencionados.", "Anuncia una consecuencia: equivale a «por lo tanto»."], "correcta": 1, "explicacion": "La primera parte niega (no eran más libres) y la segunda corrige (lo que pasaba es que no se veían): es la relación de «no… sino…». Leerlo como causa cambia el sentido: el autor no dice que fueran menos libres por ser invisibles, sino que parecían libres porque nadie los notaba."}]}, {"codigo": "P003-T05", "titulo": "Cómo hemos guardado la música", "tipologia": "discontinuo", "fuente": "Línea de tiempo con datos históricos, elaborada para práctica.", "contenido": "### Línea de tiempo: cómo hemos guardado la música\n\n**1877 · Fonógrafo**\nThomas Edison graba y reproduce un sonido por primera vez, en un cilindro cubierto de papel de estaño.\n\n**1948 · Disco de larga duración (LP)**\nUn disco de vinilo que gira más despacio que los anteriores y guarda más de veinte minutos por cada cara. Con él se impone el «álbum»: una obra pensada para oírse entera.\n\n**1963 · Casete**\nUna cinta dentro de una caja de plástico que cabe en un bolsillo. Grabar en casa y armar mezclas propias se vuelve fácil y barato.\n\n**1979 · Reproductor portátil con audífonos**\nLa música sale de la sala y acompaña a quien camina.\n\n**1982 · Disco compacto (CD)**\nEl sonido deja de leerse con una aguja o una cinta y pasa a guardarse como números. Unos 74 minutos por disco.\n\n**1999 · Intercambio de archivos por internet**\nLas canciones circulan sin soporte físico y, casi siempre, sin pago. Las ventas de discos empiezan a caer.\n\n**2001 · Reproductor digital de bolsillo**\n«Mil canciones en el bolsillo», decía la publicidad.\n\n**2008 · Plataformas de streaming**\nYa no se compra la canción: se paga, con dinero o con anuncios, por el acceso a un catálogo.\n\n*Nota: cada fecha corresponde a la presentación del invento, no al momento en que su uso se volvió común.*", "preguntas": [{"codigo": "P003-T05-01", "categoria": "literal", "dificultad": 1, "enunciado": "Según la línea de tiempo, ¿en qué año aparece el disco compacto?", "opciones": ["1982", "1963", "1979", "1999"], "correcta": 0, "explicacion": "La entrada dice «1982 · Disco compacto (CD)». Las otras fechas corresponden al casete, al reproductor portátil y al intercambio de archivos. En un texto de este tipo, la pregunta literal se responde ubicando la fila exacta."}, {"codigo": "P003-T05-02", "categoria": "literal", "dificultad": 2, "enunciado": "Todos los siguientes cambios aparecen en la línea de tiempo, EXCEPTO:", "opciones": ["La facilidad para grabar mezclas propias en casa.", "El paso del sonido a un registro hecho de números.", "El pago por acceso en lugar de la compra de canciones.", "El regreso del vinilo como objeto de colección."], "correcta": 3, "explicacion": "El CD guarda el sonido como números, el casete permite «armar mezclas propias» y las plataformas cobran «por el acceso a un catálogo». Del regreso del vinilo el texto no dice nada, aunque sea un hecho conocido: en las preguntas con «EXCEPTO» se marca lo que no está en el texto, no lo que es falso en el mundo."}, {"codigo": "P003-T05-03", "categoria": "inferencial", "dificultad": 1, "enunciado": "De la secuencia completa se puede deducir que, con el paso del tiempo, la música grabada se volvió:", "opciones": ["Menos escuchada, pues las ventas de discos cayeron.", "Más breve, pues cada soporte guarda menos minutos.", "Más costosa y más difícil de conseguir.", "Más fácil de llevar y menos atada a un objeto."], "correcta": 3, "explicacion": "La línea va del cilindro a la sala, de la sala al bolsillo y del bolsillo a un catálogo sin soporte físico: cada paso hace la música más portátil y menos material. Que cayeran las ventas de discos no significa que se oyera menos música; significa que dejó de comprarse en ese formato."}, {"codigo": "P003-T05-04", "categoria": "critico", "dificultad": 1, "enunciado": "La nota final advierte que las fechas no indican cuándo se volvió común cada invento. Por eso sería un error concluir que:", "opciones": ["El fonógrafo es el invento más antiguo de toda la lista.", "En 1982 casi todo el mundo oía música en CD.", "El casete apareció después del disco de larga duración.", "El disco compacto es anterior al intercambio de archivos."], "correcta": 1, "explicacion": "Las fechas permiten ordenar los inventos, y por eso las otras tres conclusiones son válidas. Lo que no permiten es saber cuánta gente los usaba: un invento puede tardar años en llegar a la mayoría. Leer la letra pequeña de una gráfica o una tabla evita este tipo de error."}, {"codigo": "P003-T05-05", "categoria": "critico", "dificultad": 2, "enunciado": "Alguien afirma: «El streaming acabó con las ventas de discos». Según la línea de tiempo, esa afirmación es:", "opciones": ["Discutible, porque las ventas ya venían cayendo desde 1999.", "Imposible de valorar, porque el texto no habla de ventas.", "Acertada, porque desde 2008 ya nadie compra canciones.", "Acertada, porque el streaming es anterior al intercambio de archivos."], "correcta": 0, "explicacion": "Según la entrada de 1999, las ventas empezaron a caer con el intercambio de archivos, nueve años antes de las plataformas. El streaming pudo acelerar la caída, pero no la inició. Antes de aceptar que una cosa causó otra conviene mirar cuál ocurrió primero."}, {"codigo": "P003-T05-06", "categoria": "cohesion", "dificultad": 1, "enunciado": "En la entrada de 1948, la expresión «Con él» se refiere a:", "opciones": ["El álbum como obra.", "El fonógrafo de Thomas Edison.", "El disco de larga duración.", "El casete de bolsillo."], "correcta": 2, "explicacion": "«Él» retoma el sustantivo masculino del que se viene hablando en esa entrada: el disco de larga duración. El álbum no puede ser, porque es justo lo que «se impone» gracias al disco; y el casete aparece en una entrada posterior."}]}]}, {"paquete": "paquete-004", "textos": [{"codigo": "P004-T01", "titulo": "Las láminas de la Expedición", "tipologia": "ensayo", "fuente": "Texto original para práctica, con datos históricos.", "contenido": "En 1783 comenzó en el Nuevo Reino de Granada una empresa que hoy resulta difícil de clasificar. La Real Expedición Botánica, dirigida por el sacerdote y médico gaditano José Celestino Mutis, se proponía inventariar las plantas del territorio con fines que la Corona no disimulaba: hallar especies útiles para la medicina y el comercio. Era, pues, ciencia al servicio de un imperio. Pero su resultado más perdurable no fue un catálogo de riquezas, sino una colección de imágenes: más de cinco mil láminas en las que cada planta aparece dibujada con una exactitud que todavía asombra a los botánicos y con una gracia que no les debe nada a los mejores pintores de flores de su tiempo.\n\nEsas láminas no las pintó Mutis. Salieron de un taller por el que pasaron, a lo largo de tres décadas, más de cuarenta dibujantes, casi todos americanos: muchachos llegados de Quito, de Popayán, de Santafé, varios de ellos formados en talleres de pintura religiosa y reeducados para una disciplina nueva. Se les exigía mirar de otro modo. Donde el pintor de iglesia buscaba conmover, el de la Expedición debía informar; donde aquel componía una escena, este aislaba un ejemplar sobre el papel en blanco, sin paisaje ni sombra, y lo mostraba a la vez en flor y en fruto, como ninguna planta se deja ver en la naturaleza. La lámina no copiaba un individuo: construía un tipo.\n\nLa mayor parte de esos dibujos carece de firma. El hecho suele atribuirse a una costumbre del taller, y sin duda lo era; pero conviene no despacharlo tan pronto. Una obra colectiva que la posteridad conoce por el nombre de su director —«las láminas de Mutis»— plantea una pregunta que la historia del arte ha tardado en hacerse: a quién pertenece una imagen, si a quien la concibió como parte de un sistema o a quienes, pincel en mano, resolvieron una por una las dificultades de cada hoja.\n\nEl destino de la colección añade una ironía. Mutis murió en 1808 sin publicar su Flora. Pocos años después, restablecido el dominio español tras la primera independencia, los materiales de la Expedición fueron embalados y remitidos a Madrid, donde permanecen. El primer volumen impreso no apareció hasta 1954. Así, el retrato más minucioso que se haya hecho de la naturaleza de este país fue encargado por una monarquía, ejecutado por artistas locales cuyo nombre casi nadie recuerda, y se conserva al otro lado del océano. Tal vez por eso sigue siendo tan elocuente: en cada lámina hay una planta y, detrás de ella, la historia entera de quién manda mirar, quién pinta y quién se queda con lo pintado.", "preguntas": [{"codigo": "P004-T01-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el segundo párrafo, ¿qué se proponían, respectivamente, el pintor de iglesia y el pintor de la Expedición?", "opciones": ["Conmover con un ejemplar aislado / informar con una escena", "Informar con una escena / conmover con un ejemplar aislado", "Conmover con una escena / informar con un ejemplar aislado", "Informar con un ejemplar aislado / conmover con una escena"], "correcta": 2, "explicacion": "El párrafo opone los dos oficios en frases paralelas: «Donde el pintor de iglesia buscaba conmover, el de la Expedición debía informar; donde aquel componía una escena, este aislaba un ejemplar». «Aquel» es el de iglesia y «este», el de la Expedición. Las opciones usan las mismas palabras cambiadas de lugar: hay que comprobar los cuatro datos, no solo el primero."}, {"codigo": "P004-T01-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "En el último párrafo, el autor menciona «la primera independencia» sin explicar a qué se refiere. Con ello:", "opciones": ["Da por sentado que el lector conoce ese periodo de la historia.", "Indica el lugar exacto en el que ocurrieron los hechos narrados.", "Sostiene que la Expedición fue la causa de la independencia.", "Corrige una fecha que suele citarse de manera equivocada."], "correcta": 0, "explicacion": "Un autor no explica lo que cree que su lector ya sabe. Aquí supone que conoce los años que van del primer grito de independencia a la reconquista española. Reconocer qué da por sabido un texto ayuda a entender para quién fue escrito; en la frase no hay ningún lugar, ninguna causa ni ninguna corrección de fechas."}, {"codigo": "P004-T01-03", "categoria": "inferencial", "dificultad": 3, "enunciado": "La frase «La lámina no copiaba un individuo: construía un tipo» significa que la imagen:", "opciones": ["Representaba plantas imaginarias, inventadas por los dibujantes.", "Reunía los rasgos de la especie, no los de una planta concreta.", "Retrataba con toda fidelidad un solo ejemplar recogido en el campo.", "Servía de molde para imprimir después muchas copias idénticas."], "correcta": 1, "explicacion": "La frase resume lo dicho justo antes: la planta aparece «a la vez en flor y en fruto, como ninguna planta se deja ver en la naturaleza». Eso no es inventar: es componer, con rasgos reales, un modelo de la especie. La opción del ejemplar recogido en el campo describe precisamente lo que la frase niega, copiar un individuo."}, {"codigo": "P004-T01-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "En la oración final, «quién manda mirar, quién pinta y quién se queda con lo pintado» alude, en ese orden, a:", "opciones": ["Los botánicos de hoy, José Celestino Mutis y los dibujantes americanos que firmaron cada una de las láminas.", "José Celestino Mutis, la monarquía española y los lectores del primer volumen de la Flora.", "El espectador actual, los pintores de iglesia y el Nuevo Reino de Granada, dueño de la colección.", "La Corona que encargó la obra, los dibujantes americanos y la institución que la guarda en Madrid."], "correcta": 3, "explicacion": "La oración final retoma, en el mismo orden, la enumeración que la precede: el retrato «fue encargado por una monarquía, ejecutado por artistas locales» y «se conserva al otro lado del océano». Cuando un texto cierra con una fórmula breve, casi siempre condensa algo que acaba de decir con más palabras: conviene volver unas líneas atrás."}, {"codigo": "P004-T01-05", "categoria": "critico", "dificultad": 2, "enunciado": "¿Cuál de las siguientes frases resume mejor el planteamiento del texto?", "opciones": ["La ciencia y el arte persiguen fines que no pueden reconciliarse.", "Toda imagen cuenta también la historia de quien la encargó y de quien la hizo.", "Un país que pierde sus archivos pierde con ellos toda la memoria de su pasado.", "El talento de un solo hombre basta para fundar una tradición."], "correcta": 1, "explicacion": "El texto insiste en que las láminas no son solo plantas: cada una lleva consigo las condiciones en que fue hecha. La frase sobre los archivos tienta, porque la colección está en Madrid, pero el autor no dice que el país haya perdido su memoria. Y la del talento de un solo hombre es lo contrario de lo que el texto cuenta sobre el taller."}, {"codigo": "P004-T01-06", "categoria": "critico", "dificultad": 3, "enunciado": "Del conjunto del texto se desprende que el autor ve la Expedición Botánica como:", "opciones": ["Una empresa en la que conviven el interés imperial, el rigor científico y el logro artístico.", "Un fracaso científico, puesto que su director no llegó a publicar la Flora que proyectaba.", "Un episodio de saqueo que no dejó en el territorio nada que merezca aprecio o estudio.", "Una obra de arte desinteresada, ajena a cualquier propósito económico o político de la época en que se hizo."], "correcta": 0, "explicacion": "El autor no elige una sola cara. Dice que era «ciencia al servicio de un imperio», elogia la exactitud y la gracia de las láminas y recuerda que la colección terminó lejos. Cada una de las otras opciones se queda con un aspecto y niega los demás; en los textos matizados, la respuesta correcta suele ser la que conserva la tensión."}, {"codigo": "P004-T01-07", "categoria": "cohesion", "dificultad": 3, "enunciado": "En la oración «El hecho suele atribuirse a una costumbre del taller, y sin duda lo era; pero conviene no despacharlo tan pronto», los dos pronombres «lo» se refieren, respectivamente, a:", "opciones": ["«El hecho» de que falten las firmas, en uno y otro caso.", "«Una costumbre del taller», en uno y otro caso.", "«Una costumbre del taller» y «el hecho» de que falten las firmas.", "«El taller» de la Expedición y «el dibujo» que no lleva firma."], "correcta": 2, "explicacion": "El primer «lo» reemplaza al atributo: el hecho «era» una costumbre del taller. El segundo es el objeto de «despachar»: lo que no conviene despachar es el hecho. Dos pronombres iguales y vecinos pueden tener referentes distintos; para saberlo hay que rehacer la frase con las palabras que cada uno sustituye."}]}, {"codigo": "P004-T02", "titulo": "La red bajo el bosque", "tipologia": "divulgacion", "fuente": "Texto original de divulgación para práctica.", "contenido": "Bajo el suelo de casi cualquier bosque ocurre un comercio antiguo. Las raíces de la mayoría de los árboles viven asociadas a hongos cuyos filamentos, mucho más finos que una raíz, exploran la tierra y recogen agua y minerales que entregan a la planta; a cambio reciben azúcares que el árbol fabrica con la luz. Esa asociación, llamada micorriza, está bien documentada y nadie la discute.\n\nLo que vino después es más delicado. Como un mismo hongo puede unirse a las raíces de varios árboles, se pensó que los filamentos formarían una red capaz de comunicarlos. En 1997, un experimento hecho en un bosque de Canadá mostró que una pequeña cantidad de carbono, marcada para poder seguirle el rastro, pasaba de unos árboles jóvenes a otros de distinta especie. La revista que publicó el hallazgo lo anunció en su portada con un juego de palabras que hizo fortuna: la *wood wide web*, la red del bosque.\n\nA partir de ahí la idea creció más rápido que las pruebas. En libros, documentales y charlas se empezó a decir que los árboles «se hablan», que los más viejos «alimentan» a sus hijos y que el bosque entero se comporta como una comunidad solidaria. La imagen es hermosa y tiene, además, la ventaja de darnos una razón sentimental para cuidar los bosques.\n\nEn 2023, tres investigadores revisaron los estudios de campo disponibles y llegaron a una conclusión incómoda. Que existan hongos compartidos entre árboles vecinos está probado solo en unos pocos tipos de bosque. Que por ellos viaje carbono es posible, pero las cantidades medidas son pequeñas y resulta difícil descartar que hayan pasado simplemente por el suelo. Y que los árboles adultos favorezcan a sus descendientes no ha sido demostrado en ningún bosque real. Encontraron, además, que muchos artículos citaban los primeros experimentos como si hubieran probado más de lo que probaron.\n\nNada de esto significa que la red no exista ni que la hipótesis sea falsa. Significa que no sabemos todavía, y que entre «no sabemos» y «se ha descubierto» hay una distancia que la divulgación tiende a acortar. Las metáforas ayudan a pensar —nadie entendería gran cosa de un bosque sin ellas—, pero tienen un costo: «madre», «hablar», «solidaridad» traen consigo intenciones que ningún experimento ha medido. Un árbol no necesita ser generoso para merecer que lo dejemos en pie.", "preguntas": [{"codigo": "P004-T02-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el texto, ¿qué afirmación está bien documentada y cuál no ha sido demostrada en ningún bosque real, en ese orden?", "opciones": ["El paso de grandes cantidades de carbono por los hongos / la existencia de hongos compartidos", "La ayuda de los árboles adultos a sus descendientes / el intercambio entre hongos y raíces", "La existencia de hongos compartidos en todo bosque / el paso de carbono de un árbol a otro", "El intercambio entre hongos y raíces / la ayuda de los árboles adultos a sus descendientes"], "correcta": 3, "explicacion": "El primer párrafo dice que la micorriza, el intercambio de minerales por azúcares, «está bien documentada y nadie la discute». El cuarto dice que el favor de los adultos a sus descendientes «no ha sido demostrado en ningún bosque real». Entre los dos extremos quedan las afirmaciones probadas a medias, que son las que usan las otras opciones."}, {"codigo": "P004-T02-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "La frase «la idea creció más rápido que las pruebas» significa que:", "opciones": ["Se difundieron afirmaciones que los experimentos no alcanzaban a respaldar.", "Los árboles conectados por hongos crecen más de prisa que los árboles aislados.", "Las pruebas se fueron perdiendo a medida que la idea se hacía más popular.", "Los científicos publicaron sus resultados sin haberlos revisado lo suficiente."], "correcta": 0, "explicacion": "«Crecer» está usado en sentido figurado: lo que creció fue la fama de la idea, no los árboles. El párrafo lo muestra enseguida: libros y documentales hablaban de árboles que alimentan a sus hijos cuando el experimento solo había mostrado el paso de un poco de carbono. El texto no acusa a los científicos de publicar con prisa."}, {"codigo": "P004-T02-03", "categoria": "inferencial", "dificultad": 3, "enunciado": "La última oración —«Un árbol no necesita ser generoso para merecer que lo dejemos en pie»— da a entender que:", "opciones": ["Solo merecen protección aquellos árboles que benefician a sus vecinos.", "Cuidar los bosques no debería depender de atribuirles cualidades humanas.", "La conservación de los bosques carece hoy de una justificación científica.", "Los árboles compiten entre sí y son, en el fondo, organismos egoístas."], "correcta": 1, "explicacion": "La frase responde a la «razón sentimental» de la que se habló antes: si cuidamos los bosques porque los creemos solidarios, ¿qué pasa si no lo son? El autor separa las dos cosas: el bosque merece cuidado aunque la generosidad sea solo una metáfora. Decir que los árboles son egoístas sería cambiar una intención humana por otra, justo lo que el texto pide evitar."}, {"codigo": "P004-T02-04", "categoria": "critico", "dificultad": 2, "enunciado": "¿Qué actitud asume el autor frente a la hipótesis de la red del bosque?", "opciones": ["Se abstiene de opinar y se limita a contar en orden la historia de la idea.", "La defiende, porque ha servido para que más gente se interese por los bosques.", "La considera posible pero no probada, y critica que se la presente como un hecho.", "La rechaza por completo y la tiene por un engaño deliberado de sus defensores."], "correcta": 2, "explicacion": "El último párrafo lo dice sin ambigüedad: nada de lo expuesto significa «que la hipótesis sea falsa»; significa «que no sabemos todavía». La crítica va contra el salto de «no sabemos» a «se ha descubierto». No hay rechazo total ni defensa, y tampoco neutralidad: el autor toma posición sobre cómo se comunica la ciencia."}, {"codigo": "P004-T02-05", "categoria": "critico", "dificultad": 3, "enunciado": "El autor observa que la imagen del bosque solidario tiene «la ventaja de darnos una razón sentimental para cuidar los bosques». En el conjunto del texto, esa observación sirve para:", "opciones": ["Acusar a los defensores de los bosques de falsear los datos a propósito.", "Recomendar que se siga difundiendo, dado que sus efectos sobre el público son benéficos.", "Demostrar que la hipótesis, además de hermosa, es científicamente correcta.", "Sugerir por qué la idea se aceptó con tanta facilidad pese a la falta de pruebas."], "correcta": 3, "explicacion": "La frase aparece cuando el texto cuenta cómo la idea «creció más rápido que las pruebas»: explica su éxito, no su verdad. Una idea que nos gusta y que además nos sirve se examina menos. El autor llama «ventaja» a ese atractivo con cierta ironía, y más adelante le pone precio: las metáforas «tienen un costo»."}, {"codigo": "P004-T02-06", "categoria": "cohesion", "dificultad": 3, "enunciado": "En el último párrafo, las rayas de «—nadie entendería gran cosa de un bosque sin ellas—» encierran:", "opciones": ["Las palabras textuales de uno de los investigadores que hicieron la revisión.", "La conclusión principal a la que quiere llegar todo el párrafo.", "Una concesión que matiza la crítica a las metáforas antes de formularla.", "Un ejemplo de las metáforas que el autor se propone rechazar."], "correcta": 2, "explicacion": "Las rayas abren un inciso: una aclaración que se inserta en la oración sin romperla. Aquí el autor reconoce el valor de las metáforas («ellas») justo antes del «pero» que introduce su costo. Es una concesión: admite lo que tiene de cierto la postura contraria para que su crítica no parezca un rechazo de toda imagen."}]}, {"codigo": "P004-T03", "titulo": "Canción de la vida profunda (fragmento)", "tipologia": "literario", "fuente": "Porfirio Barba Jacob, «Canción de la vida profunda» (hacia 1915). Fragmento. Obra en dominio público.", "contenido": "Hay días en que somos tan móviles, tan móviles,\ncomo las leves briznas al viento y al azar.\nTal vez bajo otro cielo la Gloria nos sonría...\nLa vida es clara, undívaga, y abierta como un mar.\n\nY hay días en que somos tan fértiles, tan fértiles,\ncomo en abril el campo, que tiembla de pasión:\nbajo el influjo próvido de espirituales lluvias,\nel alma está brotando florestas de ilusión.\n\nY hay días en que somos tan sórdidos, tan sórdidos,\ncomo la entraña obscura de obscuro pedernal:\nla noche nos sorprende, con sus profusas lámparas,\nen rútilas monedas tasando el Bien y el Mal.\n\nY hay días en que somos tan plácidos, tan plácidos...\n—¡niñez en el crepúsculo! ¡Lagunas de zafir!—\nque un verso, un trino, un monte, un pájaro que cruza,\ny hasta las propias penas nos hacen sonreír.\n\n[…]\n\nY hay días en que somos tan lúgubres, tan lúgubres,\ncomo en las noches lúgubres el llanto del pinar.\nEl alma gime entonces bajo el dolor del mundo,\ny acaso ni Dios mismo nos pueda consolar.\n\nMas hay también ¡oh Tierra! un día... un día... un día...\nen que levamos anclas para jamás volver;\nun día en que discurren vientos ineluctables...\n¡Un día en que ya nadie nos puede retener!", "preguntas": [{"codigo": "P004-T03-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según el poema, en los días «plácidos»:", "opciones": ["Incluso las penas propias llegan a causar una sonrisa.", "El alma hace brotar verdaderos bosques de ilusión.", "La noche sorprende a quien cuenta sus monedas.", "El alma gime bajo el peso del dolor del mundo."], "correcta": 0, "explicacion": "La cuarta estrofa termina así: «y hasta las propias penas nos hacen sonreír». Las otras opciones dicen cosas que el poema sí dice, pero de otros días: el gemido es de los lúgubres, las monedas son de los sórdidos y las florestas, de los fértiles. Cada estrofa tiene su estado de ánimo y sus imágenes; mezclarlas es el error."}, {"codigo": "P004-T03-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "Al comparar a las personas con «las leves briznas al viento y al azar», el poeta sugiere que en esos días:", "opciones": ["Pierden todo interés por lo que ocurre a su alrededor.", "Cambian de rumbo con facilidad, llevadas por lo que pase.", "Trabajan la tierra desde las primeras horas de la mañana.", "Se sienten fuertes y completamente seguras de su destino."], "correcta": 1, "explicacion": "Una brizna es una hebra de hierba: no pesa, y el viento la lleva adonde quiere. Ser «móviles» como ella es dejarse llevar. La comparación no habla de trabajo ni de fortaleza, y tampoco de desinterés: la estrofa es luminosa, con la vida «abierta como un mar»."}, {"codigo": "P004-T03-03", "categoria": "inferencial", "dificultad": 2, "enunciado": "La expresión «como la entraña obscura de obscuro pedernal» es:", "opciones": ["Una metáfora", "Una metonimia", "Una sinécdoque", "Un símil"], "correcta": 3, "explicacion": "Hay símil cuando la comparación se hace explícita con un nexo, aquí «como»: somos sórdidos como el interior de una piedra. Si el poeta hubiera dicho «somos entraña de pedernal», sin nexo, sería metáfora. La metonimia y la sinécdoque nombran una cosa con otra que le está próxima o que es parte de ella, y no comparan."}, {"codigo": "P004-T03-04", "categoria": "inferencial", "dificultad": 2, "enunciado": "En la última estrofa, el día «en que levamos anclas para jamás volver» alude a:", "opciones": ["Un viaje por mar.", "El fin de la juventud.", "La muerte.", "El abandono de la poesía."], "correcta": 2, "explicacion": "Levar anclas es zarpar, pero un viaje del que no se vuelve «jamás», empujado por vientos «ineluctables» (inevitables) y en el que «ya nadie nos puede retener», es la muerte. El poema recorre los días cambiantes de la vida y cierra con el único día que no se parece a los demás."}, {"codigo": "P004-T03-05", "categoria": "inferencial", "dificultad": 3, "enunciado": "El poeta dice que la vida es «clara, undívaga, y abierta como un mar». Por la forma de la palabra y por el contexto, «undívaga» significa:", "opciones": ["Que es única y no admite comparación alguna.", "Que yace hundida en lo más hondo del mar.", "Que resulta vaga, imprecisa y difícil de entender.", "Que ondula y se mueve libremente, como las olas."], "correcta": 3, "explicacion": "La palabra junta dos raíces: «unda», ola (la misma de «ondular» e «inundar»), y «vagar», andar sin rumbo fijo. El contexto lo confirma: la estrofa habla de días «móviles» y de una vida «abierta como un mar». Las otras opciones se apoyan en parecidos de sonido: «único», «hundida», «vaga»."}, {"codigo": "P004-T03-06", "categoria": "cohesion", "dificultad": 2, "enunciado": "En el primer verso de la última estrofa, la palabra «Mas» (sin tilde) equivale a:", "opciones": ["Pero", "Además", "Aunque", "Por eso"], "correcta": 0, "explicacion": "«Mas» sin tilde es una conjunción adversativa: significa «pero». No hay que confundirla con «más», con tilde, que indica cantidad. Aquí marca el giro del poema: todas las estrofas anteriores enumeran días que van y vuelven; esta opone a ellos un día distinto, el definitivo."}]}, {"codigo": "P004-T04", "titulo": "¿Doblaje o subtítulos?: dos posturas", "tipologia": "intertextual", "fuente": "Textos originales para práctica.", "contenido": "### Texto A\n\nUna actuación no está hecha solo de gestos. La mitad del trabajo de un actor es su voz: el temblor, la pausa, la sílaba que se quiebra. El doblaje conserva la imagen y reemplaza todo eso por la interpretación de otra persona, grabada meses después en una cabina, sin compañeros de escena y con la obligación de calzar cada frase en una boca ajena. El resultado puede ser impecable y, sin embargo, ya no es la película que se filmó. Se objeta que leer subtítulos distrae. Distrae al principio, como distrae cualquier hábito nuevo; a los pocos minutos el ojo aprende a leer sin dejar de mirar. Y hay una ganancia que rara vez se menciona: quien ve cine subtitulado oye otras lenguas, y termina por reconocerles la música aunque no las entienda.\n\n### Texto B\n\nEl cine se inventó para ser mirado. Quien lee subtítulos pasa buena parte de la proyección con los ojos en el borde inferior de la pantalla, justamente donde no ocurre nada, y se pierde el encuadre que el director compuso con tanto cuidado. Además, el subtítulo tampoco es el original: resume, recorta, deja por fuera lo que no cabe en dos líneas. Entre dos traducciones, prefiero la que no me obliga a apartar la vista. Pero el argumento decisivo es otro. Los subtítulos suponen un espectador que lee rápido y ve bien; dejan por fuera a los niños pequeños, a muchos ancianos, a quienes aprendieron a leer tarde. Defender la versión original como la única digna es, en el fondo, defender un cine para pocos. El doblaje será una traición, pero es una traición que abre la puerta.", "preguntas": [{"codigo": "P004-T04-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según el texto B, ¿a quiénes dejan por fuera los subtítulos?", "opciones": ["A los actores de doblaje, que se quedan sin trabajo.", "A quienes no leen con rapidez o no ven bien.", "A quienes desconocen la lengua original de la película.", "A los directores, cuyo encuadre queda tapado por las letras."], "correcta": 1, "explicacion": "El texto B dice que los subtítulos «suponen un espectador que lee rápido y ve bien» y da tres ejemplos de quienes no lo son: niños pequeños, muchos ancianos y quienes aprendieron a leer tarde. Quien desconoce la lengua original es, al contrario, el espectador al que los subtítulos ayudan."}, {"codigo": "P004-T04-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "Cuando el texto A dice que el espectador termina por reconocerles «la música» a otras lenguas, se refiere a:", "opciones": ["El ritmo con que van apareciendo los subtítulos.", "Las canciones que suenan en las películas extranjeras.", "La banda sonora compuesta para acompañar cada escena.", "El sonido y la entonación propios de cada idioma."], "correcta": 3, "explicacion": "«Música» es aquí una metáfora de cómo suena una lengua: su ritmo, su melodía, su acento. Por eso el texto añade «aunque no las entienda»: se puede reconocer el sonido de un idioma sin comprender las palabras. Las canciones y la banda sonora son música en sentido literal, y se oyen igual en una versión doblada."}, {"codigo": "P004-T04-03", "categoria": "critico", "dificultad": 1, "enunciado": "El autor del texto A menciona una objeción contra su propia postura y la responde. ¿Cuál es?", "opciones": ["Que los actores de doblaje interpretan mal.", "Que el público prefiere el cine de su país.", "Que leer subtítulos distrae al espectador.", "Que el doblaje resulta más costoso."], "correcta": 2, "explicacion": "La objeción aparece anunciada con «Se objeta que leer subtítulos distrae», y la respuesta viene enseguida: distrae solo al principio. Un texto argumentativo sólido no ignora lo que se le puede replicar. El autor no dice que los actores de doblaje interpreten mal; admite incluso que el resultado «puede ser impecable»."}, {"codigo": "P004-T04-04", "categoria": "critico", "dificultad": 2, "enunciado": "¿En qué punto están de acuerdo los dos textos?", "opciones": ["En que los subtítulos distraen sin remedio.", "En que el doblaje altera la obra original.", "En que el cine solo debe verse en su lengua original.", "En que los niños deberían acostumbrarse a los subtítulos."], "correcta": 1, "explicacion": "Para A, la película doblada «ya no es la película que se filmó»; B lo concede con otra palabra: «El doblaje será una traición». Coinciden en el hecho y difieren en cuánto pesa: para A es una pérdida inaceptable; para B, el precio de que más gente pueda entrar."}, {"codigo": "P004-T04-05", "categoria": "critico", "dificultad": 3, "enunciado": "¿Cuál de los argumentos del texto B responde de manera más directa a la idea del texto A de que la película doblada «ya no es la película que se filmó»?", "opciones": ["Que el subtítulo tampoco es el original: resume y recorta.", "Que el director compuso el encuadre de cada plano con mucho cuidado.", "Que los subtítulos excluyen a quienes leen despacio.", "Que el cine se inventó, ante todo, para ser mirado."], "correcta": 0, "explicacion": "A reprocha al doblaje su infidelidad. La respuesta directa es mostrar que la alternativa tampoco es fiel: «el subtítulo tampoco es el original». Los otros argumentos de B son válidos, pero contestan a otra cosa: a la comodidad de mirar o a quién puede ver la película. Para saber qué responde a qué, hay que fijarse en el tema exacto de cada razón."}]}, {"codigo": "P004-T05", "titulo": "Cineclub La Linterna: ciclo de octubre", "tipologia": "discontinuo", "fuente": "Programación ficticia, elaborada para práctica.", "contenido": "### Ciclo «Ciudades filmadas»\nBiblioteca del barrio, sala 2\n\n**Funciones**\n- Jueves 1: *Tranvía a ninguna parte* (1958, 92 min). Blanco y negro. Subtitulada.\n- Jueves 8: *Los tejados* (1974, 110 min). Subtitulada.\n- Jueves 15: *Mapa de un barrio* (2019, 78 min). Documental. Hablada en español.\n- Jueves 22: *La última estación* (1986, 131 min). Doblada.\n- Jueves 29: *Noche de maquetas* (2021, 64 min). Animación. Para mayores de 12 años.\n\n**Horario**\nTodas las funciones empiezan a las 6:30 p. m. La sala abre a las 6:00 p. m. Después de cada película hay una conversación de 30 minutos; quedarse es opcional.\n\n**Entrada**\n- Gratuita, hasta completar las 60 sillas.\n- No se reservan puestos. Las boletas se entregan en la puerta desde las 6:00 p. m., una por persona.\n- Quien llegue después de empezada la función podrá entrar solo si quedan sillas.\n\n**Para tener en cuenta**\n- La biblioteca cierra a las 9:00 p. m.\n- El jueves 22 la conversación terminará después del cierre; la salida será por la puerta lateral.", "preguntas": [{"codigo": "P004-T05-01", "categoria": "literal", "dificultad": 1, "enunciado": "¿Cuál de las películas del ciclo es un documental?", "opciones": ["La última estación", "Mapa de un barrio", "Los tejados", "Noche de maquetas"], "correcta": 1, "explicacion": "La función del jueves 15 lo indica: «Mapa de un barrio (2019, 78 min). Documental». En un texto de este tipo, cada dato tiene su fila; la pregunta literal se responde ubicando la correcta."}, {"codigo": "P004-T05-02", "categoria": "literal", "dificultad": 2, "enunciado": "¿Cuál es la película más larga del ciclo y en qué versión se presenta?", "opciones": ["La última estación, doblada.", "La última estación, subtitulada.", "Los tejados, subtitulada.", "Tranvía a ninguna parte, doblada."], "correcta": 0, "explicacion": "Hay que comparar las cinco duraciones (92, 110, 78, 131 y 64 minutos) y después leer la versión en la misma fila: «La última estación», de 131 minutos, va doblada. La opción que acierta en la película y falla en la versión castiga a quien se queda con el primer dato y no termina de leer la línea."}, {"codigo": "P004-T05-03", "categoria": "inferencial", "dificultad": 1, "enunciado": "Una persona quiere asegurarse de tener silla. Según las reglas, lo más conveniente es:", "opciones": ["Reservar su puesto por teléfono desde el día anterior.", "Llegar a las 6:30 p. m., justo cuando empieza la película.", "Pedirle a un amigo que recoja varias boletas en la puerta de la sala.", "Llegar a las 6:00 p. m., cuando empiezan a entregar las boletas."], "correcta": 3, "explicacion": "El texto no da el consejo, pero se deduce de tres reglas: hay solo 60 sillas, no se reservan puestos y las boletas se entregan desde las 6:00, una por persona. Llegar a la hora de la función es arriesgarse a que ya no queden sillas."}, {"codigo": "P004-T05-04", "categoria": "critico", "dificultad": 1, "enunciado": "Un vecino comenta: «Ese cineclub es para gente que lee rápido, porque todo lo pasan con subtítulos». Según la programación, su afirmación es:", "opciones": ["Imposible de valorar: el texto no dice nada sobre los idiomas.", "Correcta: para entrar hay que leer primero un reglamento muy largo.", "Inexacta: solo dos de las cinco funciones se anuncian como subtituladas.", "Correcta: las cinco películas del ciclo son habladas en otro idioma."], "correcta": 2, "explicacion": "Basta contar: se anuncian como subtituladas las funciones del jueves 1 y del jueves 8. Hay además una hablada en español y una doblada. El vecino generaliza a partir de una parte; antes de aceptar un «todo» conviene revisar el conjunto."}, {"codigo": "P004-T05-05", "categoria": "critico", "dificultad": 2, "enunciado": "¿Cuál de las siguientes conclusiones NO se puede sacar de la programación?", "opciones": ["La película de animación está pensada para niños pequeños.", "La película de 1986 terminará después de las 8:30 p. m.", "Solo una de las conversaciones se alarga más allá del cierre.", "A cada función pueden entrar, como máximo, sesenta personas."], "correcta": 0, "explicacion": "La función de animación es «Para mayores de 12 años»: suponer que la animación es para niños pequeños es un prejuicio que el texto contradice. Las otras tres conclusiones exigen una cuenta, pero salen de los datos: 6:30 más 131 minutos da las 8:41; las sillas son 60; y solo el jueves 22 película y conversación pasan de las 9:00."}, {"codigo": "P004-T05-06", "categoria": "cohesion", "dificultad": 1, "enunciado": "En la sección «Horario», la frase «quedarse es opcional» significa que se puede elegir entre:", "opciones": ["Recibir la boleta en la puerta o reservarla antes.", "Ver la película completa o salir antes de que termine.", "Entrar a la sala a las 6:00 o esperar hasta las 6:30.", "Asistir o no a la conversación que sigue a la película."], "correcta": 3, "explicacion": "«Quedarse» no dice a qué; hay que buscarlo en lo que viene justo antes del punto y coma: «hay una conversación de 30 minutos». La frase depende de la anterior para completar su sentido. Las otras opciones la conectan con partes del texto que no tienen relación con ella."}]}]}, {"paquete": "paquete-005", "textos": [{"codigo": "P005-T01", "titulo": "La lengua, esa obra sin terminar", "tipologia": "ensayo", "fuente": "Texto original para práctica.", "contenido": "Cada generación está convencida de que la siguiente habla peor. La queja es tan constante que podría pasar por una ley de la naturaleza: los jóvenes abrevian, mezclan idiomas, ignoran el subjuntivo, y con ellos la lengua —se dice— va camino de la ruina. Lo curioso es que esa ruina lleva anunciándose más de dos mil años sin que acabe de llegar.\n\nSe conserva una lista de la Antigüedad tardía, conocida como *Appendix Probi*, en la que un maestro anónimo corrige los errores que oía a su alrededor. «*Auris*, no *oricla*», advierte; «*oculus*, no *oclus*»; «*vetulus*, no *veclus*». El maestro perdió la batalla de manera tan completa que su lista se ha vuelto, sin que él lo quisiera, un acta de nacimiento: de *oricla* viene «oreja»; de *oclus*, «ojo»; de *veclus*, «viejo». Lo que para él era latín mal hablado es, para nosotros, el castellano. Toda lengua que hoy se defiende como patrimonio fue alguna vez la corrupción de otra.\n\nDe ahí no se sigue, como pretenden algunos entusiastas, que todo valga. Que el cambio sea inevitable no significa que cada cambio sea una ganancia, ni que dé lo mismo escribir con cuidado que sin él. Una lengua no es solo un organismo que evoluciona; es también un acuerdo, y los acuerdos se sostienen porque alguien los enseña. Quien no domina la variedad que se usa en los tribunales, en los contratos y en los exámenes queda a merced de quienes sí la dominan. Por eso resulta engañoso el argumento de que corregir es siempre una forma de desprecio: a veces es la única manera de entregar una llave.\n\nEl error del purista no está, entonces, en enseñar la norma, sino en confundirla con la naturaleza. Cree que defiende la lengua cuando defiende, en realidad, la lengua de su infancia: el estado en que la encontró y que toma, por costumbre, por el único posible. Su nostalgia tiene fecha, aunque él no la vea. Es probable que el maestro del *Appendix* añorara un latín que a los escritores de varios siglos antes ya les habría parecido descuidado.\n\nQuizá la actitud más sensata sea la del jardinero, que no confunde podar con detener el crecimiento. Sabe que el árbol no terminará de hacerse nunca y, sin embargo, cada temporada decide qué rama conviene guiar y cuál dejar. No se pregunta si el árbol está «bien» o «mal», sino para qué sirve hoy su sombra y a quién le toca.", "preguntas": [{"codigo": "P005-T01-01", "categoria": "literal", "dificultad": 3, "enunciado": "Según el segundo párrafo, la lista del maestro anónimo terminó siendo «un acta de nacimiento» porque:", "opciones": ["Las formas que censuraba dieron origen a palabras del castellano.", "Es el primer documento que se escribió en lengua castellana.", "Sirvió para que los jóvenes de su tiempo corrigieran su manera de hablar.", "Registra con exactitud la fecha en que el latín dejó de hablarse."], "correcta": 0, "explicacion": "El texto lo explica enseguida con tres ejemplos: las formas que el maestro censuraba son las que dieron «oreja», «ojo» y «viejo». La lista quería enterrarlas y terminó dejando constancia de cómo nacían. No es un documento en castellano: está en latín y corrige latín. Y no sirvió para corregir a nadie: el maestro «perdió la batalla»."}, {"codigo": "P005-T01-02", "categoria": "inferencial", "dificultad": 2, "enunciado": "En el tercer párrafo, «entregar una llave» significa:", "opciones": ["Guardar la lengua bajo custodia para que no cambie.", "Permitir que cada persona hable como mejor le parezca en cada momento.", "Premiar a quien logra escribir sin cometer errores.", "Dar a alguien una forma de hablar que le abre puertas."], "correcta": 3, "explicacion": "La llave es la variedad de la lengua que se usa en tribunales, contratos y exámenes: quien la domina puede entrar donde se decide; quien no, queda a merced de otros. Corregir, entonces, puede ser una manera de dar acceso. La imagen no habla de encerrar la lengua, que es lo que haría un purista."}, {"codigo": "P005-T01-03", "categoria": "inferencial", "dificultad": 3, "enunciado": "La frase «Su nostalgia tiene fecha, aunque él no la vea» da a entender que el purista:", "opciones": ["Sabe que la lengua cambia, pero prefiere ocultárselo a los demás.", "Toma por eterna una forma de la lengua que pertenece solo a su época.", "Añora una lengua perfecta que en realidad nunca llegó a existir.", "Recuerda con precisión el día en que aprendió las reglas de la gramática."], "correcta": 1, "explicacion": "Tener fecha es pertenecer a un momento: lo que el purista defiende es «la lengua de su infancia», el estado en que la encontró. No lo sabe («aunque él no la vea»), y por eso no puede estar ocultándolo. La opción de la lengua que nunca existió va demasiado lejos: esa lengua existió, solo que fue una etapa entre muchas."}, {"codigo": "P005-T01-04", "categoria": "inferencial", "dificultad": 3, "enunciado": "La actitud del jardinero que propone el último párrafo se parece más a la de un profesor que:", "opciones": ["Deja que cada estudiante escriba a su manera, pues todo cambio es natural.", "Corrige toda desviación para que la lengua se conserve tal como la recibió.", "Enseña la norma como una herramienta útil y acepta que con el tiempo cambiará.", "Evita pronunciarse sobre el lenguaje para no incomodar a ninguno de sus alumnos."], "correcta": 2, "explicacion": "El jardinero «no confunde podar con detener el crecimiento»: interviene, pero no pretende que el árbol deje de cambiar. El profesor que deja hacer no poda; el que corrige todo quiere detener el crecimiento. La analogía pide las dos cosas a la vez: cuidar la norma y saber que es provisional."}, {"codigo": "P005-T01-05", "categoria": "critico", "dificultad": 2, "enunciado": "¿Contra quiénes argumenta el autor a lo largo del texto?", "opciones": ["Contra los maestros que enseñan la norma culta en las escuelas.", "Únicamente contra los puristas que se oponen a cualquier cambio en el idioma.", "Contra los puristas y también contra quienes creen que todo vale.", "Contra los jóvenes que abrevian las palabras y mezclan idiomas."], "correcta": 2, "explicacion": "El texto tiene dos frentes. Casi todo discute con el purista; el tercer párrafo, con los «entusiastas» que del cambio inevitable concluyen que cualquier cosa da igual. Ver solo el primer frente es leer la mitad. El autor no ataca a los maestros: dice que el error del purista no está «en enseñar la norma»."}, {"codigo": "P005-T01-06", "categoria": "critico", "dificultad": 3, "enunciado": "El autor afirma que «Toda lengua que hoy se defiende como patrimonio fue alguna vez la corrupción de otra» y se apoya en el caso de la lista latina. Desde una lectura crítica, ese apoyo:", "opciones": ["Ilustra la idea, pero un solo caso no basta para probar que valga para toda lengua.", "La demuestra por completo, pues el latín es el origen de todos los idiomas.", "La contradice, porque el maestro consiguió que sus correcciones se respetaran.", "No guarda relación con ella, pues se ocupa del latín antiguo y no de las lenguas que se hablan hoy."], "correcta": 0, "explicacion": "Un ejemplo bien elegido persuade, pero no prueba una afirmación universal: «toda lengua» exigiría muchos casos más. Detectar el salto de un caso a una ley es una de las tareas de la lectura crítica, incluso cuando la conclusión parece razonable. Tampoco es cierto que el latín sea el origen de todos los idiomas: lo es solo de las lenguas romances."}, {"codigo": "P005-T01-07", "categoria": "cohesion", "dificultad": 2, "enunciado": "El tercer párrafo comienza con «De ahí no se sigue». Esa expresión sirve para:", "opciones": ["Presentar la consecuencia lógica de lo dicho en el párrafo anterior.", "Cambiar de tema y dejar atrás el ejemplo de la lista en latín.", "Repetir con otras palabras la tesis planteada al comienzo.", "Impedir que de lo anterior se saque una conclusión equivocada."], "correcta": 3, "explicacion": "«De ahí» recoge lo anterior, y «no se sigue» niega una consecuencia posible: que si la lengua siempre cambia, entonces cualquier cosa es aceptable. Sin el «no», la expresión introduciría una consecuencia; con él, la bloquea. Leer el conector completo, con su negación, evita el error."}]}, {"codigo": "P005-T02", "titulo": "Una biblioteca de barrio presta instrumentos", "tipologia": "periodistico", "fuente": "Noticia ficticia, elaborada para práctica.", "contenido": "La Biblioteca Comunitaria La Ceiba presta, desde el lunes pasado, algo más que libros. Con el carné de lector, cualquier vecino mayor de doce años puede llevarse a su casa durante quince días una guitarra, un ukelele, un teclado o un juego de tamboras, del mismo modo que se lleva una novela.\n\nEl programa, llamado «Suena en casa», arrancó con 34 instrumentos donados por familias del sector y por dos tiendas de música. En tres días ya no quedaba ninguno en los estantes y había una lista de espera de 23 personas, casi todas para guitarra.\n\n«Calculábamos que tardaríamos un mes en prestar la mitad», dijo Rosalba Henao, coordinadora de la biblioteca. Según Henao, la idea surgió al comprobar que muchos jóvenes asistían a los talleres gratuitos de música y no podían practicar entre clase y clase porque no tenían instrumento.\n\nNo todos comparten el entusiasmo. Hernán Ossa, que durante años reparó instrumentos en el barrio, cree que el programa «durará lo que duren las cuerdas»: sin dinero para mantenimiento, dice, en seis meses la mitad de los instrumentos estará fuera de servicio. La biblioteca reconoce que no tiene un rubro para reparaciones y que, por ahora, depende de voluntarios.\n\nQuien pide un instrumento firma un compromiso de cuidado y recibe una cartilla con ejercicios básicos. Si lo devuelve en buen estado, puede renovar el préstamo una vez, siempre que nadie esté esperando ese mismo instrumento. Los menores de edad necesitan la firma de un adulto.\n\nLa Ceiba es la primera biblioteca del municipio que ensaya un programa de este tipo. La Secretaría de Cultura anunció que evaluará los resultados en diciembre antes de decidir si lo extiende a otras sedes.", "preguntas": [{"codigo": "P005-T02-01", "categoria": "literal", "dificultad": 2, "enunciado": "Según la noticia, ¿en qué caso puede renovarse el préstamo de un instrumento?", "opciones": ["Si el lector es mayor de edad y lleva un año inscrito.", "Si se devuelve en buen estado y nadie lo espera.", "Si el lector asiste a los talleres gratuitos de música.", "Si un adulto firma un nuevo compromiso de cuidado."], "correcta": 1, "explicacion": "El quinto párrafo pone dos condiciones juntas: devolverlo «en buen estado» y que «nadie esté esperando ese mismo instrumento». La firma de un adulto también aparece en el texto, pero es un requisito para que los menores pidan el préstamo, no para renovarlo."}, {"codigo": "P005-T02-02", "categoria": "inferencial", "dificultad": 1, "enunciado": "De las palabras de Rosalba Henao se deduce que la acogida del programa fue:", "opciones": ["Menor de lo previsto, salvo en el caso de las guitarras.", "Parecida a la que la biblioteca había calculado.", "Mucho mayor de lo que la biblioteca esperaba.", "Imposible de medir durante los primeros días."], "correcta": 2, "explicacion": "La biblioteca calculaba un mes para prestar la mita
